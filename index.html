function renderRepartidor(){
  const u=S.user;
  const recOpts=S.recorridos.length?S.recorridos:["SUR","CENTRO","NORTE"];
  const VISIBLES=["Aprobada","Programada","Lista para retirar","En tránsito","En fábrica"];
  const ACCION_COLOR={"Aprobada":"var(--green)","Programada":"var(--purple)","En tránsito":"var(--amber)","En fábrica":"var(--teal)","Entregada":"#1fa86a","Entregada (sin confirmar)":"#c98a1f"};

  let list=S.requests.filter(r=>{
    if(S.tabRep==="activas") return VISIBLES.includes(r.estado);
    return ["Entregada","Entregada (sin confirmar)"].includes(r.estado);
  });
  if(S.fRepRecorrido) list=list.filter(r=>r.recorrido===S.fRepRecorrido);
  if(S.fRepSucursal) list=list.filter(r=>r.sucursal===S.fRepSucursal);
  const sucursalesRepOpts=[...new Set(S.requests.map(r=>r.sucursal).filter(Boolean))].sort();

  const activas=S.requests.filter(r=>["Aprobada","Programada","Lista para retirar","En tránsito","En fábrica"].includes(r.estado));
  const entregadas=S.requests.filter(r=>["Entregada","Entregada (sin confirmar)"].includes(r.estado));

  return `
  <div style="animation:fadeUp .3s ease">
    <div style="margin-bottom:20px">
      <h2 style="font-size:20px;font-weight:700;margin-bottom:2px">Panel de Reparto</h2>
      <p style="color:var(--muted);font-size:13px">Hola <strong style="color:var(--text)">${escH(u.nombre)}</strong>
        ${u.recorrido?`· Recorrido: ${badge(u.recorrido,"var(--teal)")}`:""}</p>
    </div>
    <div class="stats-grid">
      ${statCard("✅","PARA LEVANTAR",activas.filter(r=>r.estado==="Aprobada"||r.estado==="Programada").length,"var(--green)")}
      ${statCard("🚚","EN CAMINO",activas.filter(r=>r.estado==="En tránsito").length,"var(--amber)")}
      ${statCard("🏭","EN FÁBRICA",activas.filter(r=>r.estado==="En fábrica").length,"var(--teal)")}
      ${statCard("📦","ENTREGADAS HOY",entregadas.filter(r=>r.deliveredAt&&r.deliveredAt.startsWith(new Date().toISOString().slice(0,10))).length,"#1fa86a")}
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      <div class="tabs" style="margin-bottom:0">
        <button class="tab ${S.tabRep==="activas"?"active":""}" onclick="S.tabRep='activas';render()">Activas (${activas.length})</button>
        <button class="tab ${S.tabRep==="entregadas"?"active":""}" onclick="S.tabRep='entregadas';render()">Entregadas (${entregadas.length})</button>
      </div>
      <div class="field" style="margin-bottom:0;min-width:160px">
        <select onchange="S.fRepRecorrido=this.value;render()">
          <option value="">Todos los recorridos</option>
          ${recOpts.map(r=>`<option ${S.fRepRecorrido===r?"selected":""}>${escH(r)}</option>`).join("")}
        </select>
      </div>
      <div class="field" style="margin-bottom:0;min-width:160px">
        <select onchange="S.fRepSucursal=this.value;render()">
          <option value="">Todas las sucursales</option>
          ${sucursalesRepOpts.map(s=>`<option ${S.fRepSucursal===s?"selected":""}>${escH(s)}</option>`).join("")}
        </select>
      </div>
      ${S.tabRep==="activas"?`
      <button class="btn ${S.modoSeleccionRep?"btn-primary":"btn-ghost"} btn-sm" style="margin-left:auto" onclick="S.modoSeleccionRep=!S.modoSeleccionRep; if(!S.modoSeleccionRep) S.repSeleccion=new Set(); render()">
        ${S.modoSeleccionRep?"✕ Cancelar selección":"◯ Seleccionar"}
      </button>`:""}
    </div>
    ${S.modoSeleccionRep && S.repSeleccion.size>0?`
    <div class="card" style="margin-bottom:14px;padding:12px 16px;border-left:3px solid var(--blue);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <strong>${S.repSeleccion.size} seleccionada${S.repSeleccion.size!==1?"s":""}</strong>
      ${(()=>{
        const sel=[...S.repSeleccion].map(id=>S.requests.find(r=>r.id===id)).filter(Boolean);
        const nTomar = sel.filter(r=>["Lista para retirar","En fábrica"].includes(r.estado) || ((esOtraDireccion(r.destino)||esOrigenFabrica(r)) && ["Aprobada","Programada"].includes(r.estado))).length;
        const nBolsin = sel.filter(r=>r.tipoPedido==="bolsin" && r.estado==="En tránsito").length;
        return `
        ${nTomar>0?`<button class="btn btn-warn btn-sm" onclick="openTomarVarias()">🤲 Tomar (${nTomar})</button>`:""}
        ${nBolsin>0?`<button class="btn btn-teal btn-sm" onclick="openDejarBolsinesVarios()">📦 Dejar bolsines (${nBolsin})</button>`:""}`;
      })()}
      <button class="btn btn-ghost btn-sm" onclick="S.repSeleccion=new Set();render()">✕ Deseleccionar todo</button>
    </div>`:""}
    <div class="del-grid">
      ${list.length===0?`<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--muted)">${S.tabRep==="activas"?"No hay transferencias activas":"Sin entregas registradas"}</div>`:""}
      ${list.map(r=>{
        const ac = ACCION_COLOR[r.estado]||"var(--muted)";
        const pasaPorFabrica = r.pasaPorFabrica===true||r.pasaPorFabrica==="true"||r.pasaPorFabrica==="si";
        const estaEnTransito = r.estado === "En tránsito";
        // yaEsSegundaEtapa: pasó por fábrica (fabricaAt) y ahora está en tránsito de nuevo
        const yaEsSegundaEtapa = pasaPorFabrica && !!r.fabricaAt;
        // Para Otra dirección o cuando el origen es fábrica/depósito: puede tomar directo
        const esOtraDir      = esOtraDireccion(r.destino);
        const origenEsFab    = esOrigenFabrica(r);
        const puedeTomar     = ["Lista para retirar","En fábrica"].includes(r.estado) ||
                               ((esOtraDir||origenEsFab) && ["Aprobada","Programada"].includes(r.estado));
        // Dejar en fábrica solo si: en tránsito + pasa por fábrica + AÚN no llegó a fábrica
        const puedDejarFab   = estaEnTransito && pasaPorFabrica && !r.fabricaAt;
        // Entregar: tránsito directo O segunda etapa (ya salió de fábrica)
        const puedeEntregar  = estaEnTransito && (!pasaPorFabrica || yaEsSegundaEtapa);
        // Bolsines listos para entregar: van sin palabra clave, así que se
        // pueden dejar todos juntos con un solo DNI.
        const puedeDejarBolsin = r.tipoPedido==="bolsin" && puedeEntregar;
        const puedeSeleccionar = puedeTomar || puedeDejarBolsin;
        const puedeTomarFab  = r.estado === "En fábrica";
        const tomadaPor      = r.nombreQuienLevanto && estaEnTransito && !yaEsSegundaEtapa ? r.nombreQuienLevanto : "";
        const llevadoPor     = r.nombreQuienEntrego && yaEsSegundaEtapa ? r.nombreQuienEntrego : "";
        return `
        <div class="del-card">
          <div class="del-stripe" style="background:${ac}"></div>
          <div class="del-body" onclick="openDetalle('${escH(r.id)}')" style="cursor:pointer">

            <!-- Header -->
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
              <div style="display:flex;align-items:flex-start;gap:8px">
                ${S.modoSeleccionRep && puedeSeleccionar?`<input type="checkbox" class="chk-round" style="margin-top:4px" ${S.repSeleccion.has(r.id)?"checked":""} onclick="event.stopPropagation()" onchange="toggleRepSeleccion('${escH(r.id)}',this.checked)"/>`:""}
                <div>
                  <div class="id-cell" style="margin-bottom:3px">${escH(r.id)}</div>
                  <div style="font-weight:600">${escH(origenLabel(r))}</div>
                </div>
              </div>
              ${estadoBadges(r)}
            </div>

            <!-- Ruta -->
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px">
              <span style="color:var(--muted)">${escH(origenLabel(r))}</span>
              <span style="color:var(--faint)">→</span>
              <span style="font-weight:500">${escH(r.destino)}</span>
            </div>

            <!-- Descripción -->
            <div style="font-size:14px;color:var(--muted);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escH(r.descripcion)}</div>

            <!-- Info chips -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:10px">
              <div style="background:var(--s2);border-radius:6px;padding:7px 10px">
                <div style="color:var(--faint);margin-bottom:2px">Cantidad</div>
                <div style="font-weight:600;font-family:var(--mono)">${escH(String(r.cantidad))} ${escH(r.unidad)}</div>
              </div>
              <div style="background:var(--s2);border-radius:6px;padding:7px 10px">
                <div style="color:var(--faint);margin-bottom:2px">Recorrido</div>
                <div style="font-weight:600;color:var(--teal)">${escH(r.recorrido||"—")}</div>
              </div>
              ${r.scheduledAt?`
              <div style="background:var(--s2);border-radius:6px;padding:7px 10px;grid-column:1/-1">
                <div style="color:var(--faint);margin-bottom:2px">📅 Fecha programada</div>
                <div style="font-weight:600">${fd(r.scheduledAt)}</div>
              </div>`:""}
            </div>

            <!-- Comentario logística -->
            ${r.comentario?`
            <div style="margin-bottom:10px;padding:7px 10px;background:var(--s2);border-radius:6px;font-size:12px;border-left:3px solid var(--blue)">
              <span style="color:var(--muted)">Logística: </span>${escH(r.comentario)}
            </div>`:""}
            ${r.aclaracionListo?`
            <div style="margin-bottom:10px;padding:7px 10px;background:#34d39912;border-radius:6px;font-size:12px;border-left:3px solid #34d399">
              <span style="color:var(--muted)">Sucursal: </span>${escH(r.aclaracionListo)}
            </div>`:""}

            <!-- Quién la tiene (si está en tránsito) -->
            ${tomadaPor?`
            <div style="margin-bottom:10px;padding:7px 10px;background:#f5a62312;border-radius:6px;font-size:12px;border-left:3px solid var(--amber)">
              🚚 En camino a fábrica — <strong>${escH(tomadaPor)}</strong>
            </div>`:""}
            ${llevadoPor?`
            <div style="margin-bottom:10px;padding:7px 10px;background:#f5a62312;border-radius:6px;font-size:12px;border-left:3px solid var(--amber)">
              🚚 Llevando al destino — <strong>${escH(llevadoPor)}</strong>
            </div>`:""}
            ${r.estado==="En fábrica"?`
            <div style="margin-bottom:10px;padding:7px 10px;background:#2de0c412;border-radius:6px;font-size:12px;border-left:3px solid var(--teal)">
              🏭 En fábrica — esperando recorrido de salida${r.recorridoSalida?" ("+escH(r.recorridoSalida)+")":""}
            </div>`:""}

            <!-- Acciones -->
            <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap" onclick="event.stopPropagation()">
              <button class="btn btn-ghost btn-sm" style="flex:1;min-width:60px" onclick="openDetalle('${escH(r.id)}')">Ver</button>
              ${puedeTomar && r.estado==="Lista para retirar"?`
              <button class="btn btn-warn btn-sm" style="flex:2" onclick="openTomarTransferencia('${escH(r.id)}')">
                🤲 Tomar
              </button>
              <button class="btn btn-danger btn-sm" style="flex:1" onclick="openNoLevanta('${escH(r.id)}')">
                ✕ No levanté
              </button>`:""}
              ${puedeTomar && r.estado==="En fábrica"?`
              <button class="btn btn-success btn-sm" style="flex:2" onclick="openTomarTransferencia('${escH(r.id)}')">
                🤲 Llevar a destino
              </button>`:""}
              ${(()=>{
                // Solo se saltea la espera de "Lista" cuando el ORIGEN es
                // "Otra dirección" — ahí no hay ninguna cuenta (sucursal,
                // área o recepcionista) que pueda confirmarla desde la app.
                // Si el origen es fábrica/depósito SÍ hace falta esperar:
                // la confirma el área que la pidió o el recepcionista de
                // fábrica/depósito, igual que cualquier sucursal.
                const origenSinApp = esOtraDireccion(r.sucursal||r.area);
                if(["Aprobada","Programada"].includes(r.estado) && !origenSinApp) return `
              <div style="flex:2;background:var(--s2);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--muted);text-align:center;border:1px solid var(--border)">
                ⏳ Esperando que la sucursal confirme que está lista
              </div>`;
                if(["Aprobada","Programada"].includes(r.estado) && origenSinApp) return `
              <button class="btn btn-warn btn-sm" style="flex:2" onclick="openTomarTransferencia('${escH(r.id)}')">
                🤲 Tomar
              </button>`;
                return "";
              })()}
              ${puedDejarFab?`
              <button class="btn btn-primary btn-sm" style="flex:2" onclick="openDejarEnFabrica('${escH(r.id)}')">
                🏭 Dejar en fábrica
              </button>`:""}
              ${puedeEntregar?`
              <button class="btn btn-teal btn-sm" style="flex:1" onclick="openConfirmarEntrega('${escH(r.id)}')">
                📦 Entregar
              </button>
              <button class="btn btn-danger btn-sm" style="flex:1" onclick="openNoEntrega('${escH(r.id)}')">
                ✕ No entregué
              </button>`:""}
            </div>

          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function renderModals(){

    <div class="modal-bg" id="modal-bg" onclick="handleBg(event)">

        <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div class="modal-body">${body}</div>

  if(S.modal==="nuevaSol")  return wrapModal("m","Nueva Solicitud de Transferencia",renderFormNueva(),620);
  if(S.modal==="detalle")   return wrapModal("m",`Detalle — ${escH(S.selId)}`,renderDetalle());
  if(S.modal==="gestionar") return wrapModal("m",`Gestionar — ${escH(S.selId)}`,renderGestionar());

  if(S.modal==="fabrica")   return wrapModal("m","Dejar en fábrica",renderFabricaModal(),420);
  if(S.modal==="entrega")   return wrapModal("m","Confirmar entrega",renderEntregaModal(),420);
  if(S.modal==="codigo")    return wrapModal("m","Confirmar recepción — Sucursal",renderCodigoModal(),420);
  if(S.modal==="palabra")    return wrapModal("m","Ingresar palabra de entrega",renderPalabraModal(),420);

  if(S.modal==="envioMasivoRRHH") return wrapModal("m","Enviar a varias sucursales",renderEnvioMasivoModal(),620);

  if(S.modal==="quiebreStock") return wrapModal("m","🚨 Quiebre de stock",renderQuiebreStockModal(),480);
  if(S.modal==="planificarCantidad") return wrapModal("m","📋 Planificar cantidad",renderPlanificarCantidadModal(),480);
  if(S.modal==="editarDevolucion") return wrapModal("m","✏️ Editar devolución",renderEditarDevolucionModal(),480);

// IMPORTANTE: los campos tienen IDs únicos y NO usan oninput/onchange

  return `
  ${divider("DATOS DEL PEDIDO")}
  ${eligeOrigen ? `
  <div class="field">

      <span style="color:var(--faint);font-size:11px;margin-left:4px">— sucursal o área que hace el pedido</span>
    </label>
    <select id="f-origen" onchange="checkOtraDireccion()">

    <label>${u.rol==="area"?"Área solicitante":"Sucursal solicitante"}</label>

  </div>`}
  <div class="alert-info" style="margin-bottom:14px;font-size:13px">
    🔒 Al enviar se pedirá tu <strong>DNI</strong>. Tu nombre se registra automáticamente.<br/>
    <span style="color:var(--faint);font-size:12px">Si el pedido es urgente, aclaralo en la descripción.</span>
  </div>
  ${divider("DETALLE DEL PEDIDO")}
  <div class="field">
    <label>Destino <span class="req">*</span></label>
    <select id="f-dest" class="${e.dest?"err":""}" onchange="checkOtraDireccion()">
      <option value="">— Seleccioná —</option>
      ${allDests.map(d=>`<option>${escH(d)}</option>`).join("")}
    </select>
    ${e.dest?`<span class="err-msg">${e.dest}</span>`:""}
  </div>
  <div class="field">
    <label>Descripción del pedido <span class="req">*</span></label>
    <textarea id="f-desc" class="${e.desc?"err":""}" rows="3"
      placeholder="Describí qué necesitás..."></textarea>
    ${e.desc?`<span class="err-msg">${e.desc}</span>`:""}

  <div class="g3">
    <div class="field">
      <label>Cantidad <span class="req">*</span></label>
      <input id="f-cant" type="number" min="1" class="inp ${e.cant?"err":""}" placeholder="0"/>
      ${e.cant?`<span class="err-msg">${e.cant}</span>`:""}
    </div>
    <div class="field">
      <label>Unidad</label>
      <select id="f-unit">
        ${UNIDADES.map(u=>`<option>${u}</option>`).join("")}
      </select>
    </div>
    <div class="field">
      <label>Fecha requerida</label>
      <input id="f-fecha" type="date" class="inp" value="${new Date().toISOString().slice(0,10)}"/>
    </div>
  </div>
  <!-- Aviso Otra dirección — se muestra dinámicamente -->
  <div id="otra-dir-aviso" style="display:none;background:#f5a62318;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;border-left:3px solid var(--amber)">

  <div class="field">

    <textarea id="f-obs" class="${e.obs?"err":""}" rows="2" placeholder="Horarios, contacto, dirección exacta si es 'Otra dirección'..."></textarea>

  ${Object.keys(e).length?`<div class="alert-err">⚠️ Completá los campos marcados en rojo.</div>`:""}

// ── Detalle / Trazabilidad ────────────────────────────────
function renderDetalle(){
  const r=S.requests.find(x=>x.id===S.selId);
  if(!r) return "<p>No encontrado</p>";

  // Logística ve horas internas; el DNI de nadie se muestra en ningún lado
  // — el DNI solo sirve para firmar la acción, nunca para exhibirlo.
  const esLogistica   = S.user?.rol === "logistica";
  // Admin y Tesorería: ven la hora exacta de cuándo se TOMA y se ENTREGA
  // algo (les sirve para el seguimiento operativo), pero NO la hora en que
  // Logística aprobó — eso queda solo para Logística (ver paso 2 abajo).
  const verHoraTomaEntrega = esLogistica || ["admin","tesoreria"].includes(S.user?.rol);
  // Sucursal destino ve la hora de entrega (les corresponde saberla)
  const esDestinoView = !esLogistica && S.user?.area &&
    (r.destino||"").trim().toLowerCase() === (S.user.area||"").trim().toLowerCase();

  // Construir trazabilidad según el perfil
  const steps=[];

  // Paso 1: Creación
  const metaCreacion = esLogistica
    ? `${fdt(r.createdAt)} · ${solicitanteLabel(r)}`
    : `${fd(r.createdAt)} · ${solicitanteLabel(r)}`;
  steps.push({dot:S_COLOR["Pendiente"], title:"Solicitud creada", meta:metaCreacion});

  // Paso 2: Acción de Logística (aprobación, rechazo, o marcado pasa por fábrica)
  // ── PASO 2: Acción de Logística ─────────────────────────
  if(r.dniLogistica || r.approvedAt || r.estado==="Rechazada"){
    const esRechazada    = r.estado==="Rechazada";
    const esFabricaFlow2 = r.pasaPorFabrica===true||r.pasaPorFabrica==="true"||r.pasaPorFabrica==="si";
    const tituloLog = esRechazada ? "Rechazada por Logística"
                    : esFabricaFlow2 ? "Aprobada — pasa por fábrica"
                    : "Aprobada por Logística";
    const nombreLog = r.nombreLogistica || "Logística";
    const metaLog = esLogistica
      // Logística: hora + quién aprobó + comentario (nunca DNI)
      ? `${fdt(r.approvedAt||r.updatedAt)} · ${nombreLog}${r.comentario?" · "+r.comentario:""}`
      // Repartidor: SOLO la instrucción específica para ellos, nada más
      : S.user?.rol==="repartidor"
        ? r.comentarioRepartidor || ""
        // Sucursal/Planificación: solo el comentario de logística para ellos
        : r.comentario || "";
    steps.push({dot:esRechazada?S_COLOR["Rechazada"]:S_COLOR["Aprobada"], title:tituloLog, meta:metaLog});
  }

  // ── PASO 3: Recorridos (ingreso / egreso separados) ─────
  const esFabFlow = r.pasaPorFabrica===true||r.pasaPorFabrica==="true"||r.pasaPorFabrica==="si";
  if(r.recorrido && r.estado!=="Rechazada"){
    const titleRec = esFabFlow ? `Recorrido de ingreso: ${r.recorrido}` : `Asignada a recorrido ${r.recorrido}`;
    steps.push({dot:S_COLOR["Programada"], title:titleRec,
      meta:r.scheduledAt?`Programado para ${fd(r.scheduledAt)}`:""});
  }
  // Recorrido de EGRESO — se guarda cuando logística asigna el recorrido de salida desde fábrica
  if(esFabFlow && r.recorridoEgreso && r.estado!=="Rechazada"){
    steps.push({dot:S_COLOR["Programada"], title:`Recorrido de egreso: ${r.recorridoEgreso}`,
      meta:"Recorrido asignado para llevar al destino final"});
  }

  // ── PASO 3a: Recepción Fresco marcó preparado ───────────
  if(r.preparadoAt || r.nombrePreparoPor){
    const metaPrep = verHoraTomaEntrega
      ? `${r.preparadoAt?fdt(r.preparadoAt)+" · ":""}${r.nombrePreparoPor||"—"}`
      : r.nombrePreparoPor ? `Por ${r.nombrePreparoPor}` : "";
    steps.push({dot:"var(--amber)", title:"📝 Preparado", meta:metaPrep});
  }

  // ── PASO 3b: Sucursal origen confirmó que está lista ────
  if(r.listoAt || r.nombreListoPor || r.estado==="Lista para retirar"){
    const quienListo = r.nombreListoPor || "";
    const aclaracion = r.aclaracionListo ? ` · "${r.aclaracionListo}"` : "";
    const metaListo = esLogistica
      ? `${r.listoAt?fdt(r.listoAt)+" · ":""}${quienListo||"—"}${aclaracion}`
      // Repartidor ve el nombre para poder llamar
      : quienListo ? `${quienListo}${aclaracion}`
      : `Confirmada lista${aclaracion}`;
    steps.push({dot:"#34d399", title:"✅ Lista para retirar", meta:metaListo});
  }

  // ── PASO 4a: Primer levantamiento ───────────────────────
  // NO mostrar si no se levantó nunca (estado No levantada sin nombreQuienLevanto)
  const estadosActivos = ["En tránsito","En fábrica","Entregada","No entregada"];
  if(r.nombreQuienLevanto || estadosActivos.includes(r.estado)){
    const quien    = r.nombreQuienLevanto || "";
    const tsLev    = r.levantadoAt || "";
    const titleLev = esFabFlow ? "🚚 Levantado — viene a fábrica" : "🚚 Levantado — va al destino";
    const metaLev  = verHoraTomaEntrega
      ? `${tsLev?fdt(tsLev)+" · ":""}${quien||"—"}`
      : quien ? `Por ${quien}` : "En camino";
    steps.push({dot:S_COLOR["En tránsito"], title:titleLev, meta:metaLev});
  }

  // ── PASO 4b: Llegó a fábrica ────────────────────────────
  if(esFabFlow && (r.fabricaAt || r.estado==="En fábrica")){
    const ts      = r.fabricaAt || r.updatedAt;
    const quien   = r.nombreQuienLevanto || "";
    const metaFab = verHoraTomaEntrega
      ? `${fdt(ts)} · ${quien||"—"}`
      : quien || "";
    steps.push({dot:S_COLOR["En fábrica"], title:"🏭 Llegó a fábrica", meta:metaFab});
  }

  // ── PASO 4c: Salió de fábrica hacia destino ─────────────
  if(esFabFlow && r.nombreQuienEntrego){
    const tsSal   = r.salidaFabricaAt || "";
    const metaSal = verHoraTomaEntrega
      ? `${tsSal?fdt(tsSal)+" · ":""}${r.nombreQuienEntrego}`
      : `Por ${r.nombreQuienEntrego}`;
    steps.push({dot:S_COLOR["En tránsito"], title:"🚚 Salió de fábrica → destino final", meta:metaSal});
  }

  // ── PASO 5a: No levantada ───────────────────────────────
  if(r.estado==="No levantada"){
    const meta = esLogistica
      ? `${fdt(r.updatedAt)} · ${r.comentario||""}`
      : r.comentario || "El repartidor no pudo levantar la transferencia";
    steps.push({dot:"#ff6b35", title:"⚠️ No pudo levantarse", meta});
  }

  // ── PASO 5b: No entregada ───────────────────────────────
  if(r.estado==="No entregada"){
    const meta = esLogistica
      ? `${fdt(r.updatedAt)} · ${r.comentario||""}`
      : r.comentario || "No se pudo entregar";
    steps.push({dot:S_COLOR["No entregada"], title:"⚠️ No pudo entregarse", meta});
  }

  // ── PASO 5c: Dejada con sucursal cerrada (pendiente de confirmar) ──
  if(r.estado==="Entregada (sin confirmar)"){
    const quienDejo = r.nombreQuienEntrego || r.nombreQuienLevanto || "";
    const metaDejo = verHoraTomaEntrega
      ? `${fdt(r.deliveredAt)} · ${quienDejo||"—"}${r.aclaracionCerrado?" · "+r.aclaracionCerrado:""}`
      : `${quienDejo?"Por "+quienDejo:""}${r.aclaracionCerrado?" · "+r.aclaracionCerrado:""}`;
    steps.push({dot:S_COLOR["Entregada (sin confirmar)"], title:"🔒 Dejada — sucursal cerrada", meta:metaDejo});
  }

  // ── PASO 5d: Entregada ──────────────────────────────────
  if(r.estado==="Entregada"){
    const quienEntrego = r.nombreQuienEntrego || r.nombreQuienLevanto || "";
    // Si vino del flujo "sucursal cerrada", separamos en dos pasos: cuándo
    // la dejó el repartidor y cuándo la sucursal confirmó que la recibió.
    if(r.confirmadaSucursalAt){
      const metaDejo = verHoraTomaEntrega
        ? `${fdt(r.deliveredAt)} · ${quienEntrego||"—"}${r.aclaracionCerrado?" · "+r.aclaracionCerrado:""}`
        : `${quienEntrego?"Por "+quienEntrego:""}${r.aclaracionCerrado?" · "+r.aclaracionCerrado:""}`;
      steps.push({dot:"#c98a1f", title:"🔒 Dejada — sucursal cerrada", meta:metaDejo});
      const metaConf = verHoraTomaEntrega
        ? `${fdt(r.confirmadaSucursalAt)} · ${r.nombreQuienRecibio||"—"}`
        : `Confirmada${r.nombreQuienRecibio?" por "+r.nombreQuienRecibio:""}`;
      steps.push({dot:"#34d399", title:"✅ Confirmada por la sucursal", meta:metaConf});
    } else {
      const metaEntr = verHoraTomaEntrega
        ? `${fdt(r.deliveredAt)} · ${quienEntrego||"—"}`
        : `Entregada${quienEntrego?" por "+quienEntrego:""}`;
      steps.push({dot:S_COLOR["Entregada"], title:"✅ Entregada en destino", meta:metaEntr});
      // Quién recibió (sucursal destino) — solo nombre
      if(r.nombreQuienRecibio){
        const metaRec = verHoraTomaEntrega
          ? r.nombreQuienRecibio
          : `Recibido por ${r.nombreQuienRecibio}`;
        steps.push({dot:"#a371f7", title:"🔑 Confirmado por la sucursal destino", meta:metaRec});
      }
      if(r.codigoEntrega && esLogistica){
        steps.push({dot:"#a371f7", title:"Código de recepción", meta:`Palabra: ${r.codigoEntrega}`});
      }
    }
  }

  // El botón "Confirmar entrega" aparece en el detalle para repartidores
  // cuando la solicitud está Aprobada o Programada (no solo En tránsito)
  const pasaFab2         = r.pasaPorFabrica===true||r.pasaPorFabrica==="true"||r.pasaPorFabrica==="si";
  const yaSegundaEtapa2  = pasaFab2 && !!r.fabricaAt;
  const puedeTomar2      = S.user?.rol==="repartidor" && ["Lista para retirar","En fábrica"].includes(r.estado);
  const puedeDejarFab2   = S.user?.rol==="repartidor" && r.estado==="En tránsito" && pasaFab2 && !r.fabricaAt;
  const puedeConfirmar   = S.user?.rol==="repartidor" && r.estado==="En tránsito" && (!pasaFab2 || yaSegundaEtapa2);
  // Dejar en sucursal cerrada: solo tiene sentido si el destino es una sucursal
  // real (con su propia app) que después va a poder entrar a confirmar.
  // Si el destino es "Otra dirección" no aplica (nadie va a entrar a confirmar).
  const puedeDejarCerrado = puedeConfirmar && !esOtraDireccion(r.destino);
  const yaReprogramada = S.requests.some(x=>x.reprogramadaDeId===r.id);
  const puedeReprogramar = esLogistica && r.estado==="No entregada" && !yaReprogramada;

  return `
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    ${estadoBadges(r)} ${badge(r.prioridad,P_COLOR[r.prioridad])} ${badge(r.id,"var(--blue)")}
    ${r.recorrido?badge(r.recorrido,"var(--teal)"):""}
  </div>
  ${esLogistica && !["Entregada","Rechazada"].includes(r.estado)?`
  <button class="btn btn-primary btn-md btn-full" style="margin-bottom:16px" onclick="openGestionar('${escH(r.id)}')">
    ✏️ Gestionar esta solicitud
  </button>`:""}
  ${drow("Origen",origenLabel(r))}
  ${drow("Solicitante",solicitanteLabel(r))}
  ${drow("Destino",r.destino)}
  ${(r.pasaPorFabrica===true||r.pasaPorFabrica==="true")?`
  <div style="background:#2de0c412;border-radius:6px;padding:8px 12px;margin:6px 0;font-size:13px;border-left:3px solid var(--teal)">
    🏭 Esta transferencia pasa por fábrica antes de llegar al destino.
    ${r.estado==="En fábrica"?" Actualmente en fábrica — esperando salida.":""}
  </div>`:""}
  ${drow("Descripción",r.descripcion)}
  ${drow("Cantidad",r.cantidad+" "+r.unidad,true)}
  ${drow("Fecha requerida",fd(r.fechaRequerida),true)}
  ${r.observaciones?drow("Observaciones",r.observaciones):""}
  ${r.adjuntoUrl?`<div class="field"><label>Adjunto</label><a href="${escH(r.adjuntoUrl)}" target="_blank" rel="noopener">
    <img src="${escH(r.adjuntoUrl)}" style="max-width:220px;border-radius:8px;margin-top:4px;display:block;cursor:zoom-in" onclick="event.preventDefault();verImagenAmpliada('${escH(r.adjuntoUrl)}')" onerror="this.style.display='none';this.nextSibling.style.display='inline'"/>
    <span style="display:none;color:var(--blue)">📎 Ver archivo adjunto</span>
  </a></div>`:""}
  ${r.comentario&&!esLogistica?`<div class="alert-info" style="margin-top:8px"><strong>💬 Logística:</strong> ${escH(r.comentario)}</div>`:""}
  ${divider("TRAZABILIDAD")}
  ${steps.map((s,i)=>`
    <div class="trace-step">
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="trace-dot" style="background:${s.dot}"></div>
        ${i<steps.length-1?`<div class="trace-line" style="height:30px"></div>`:""}
      </div>
      <div class="trace-body">
        <div class="trace-title">${escH(s.title)}</div>
        <div class="trace-meta">${escH(s.meta)}</div>
      </div>
    </div>`).join("")}
  ${puedeReprogramar?`
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn btn-warn btn-md btn-full" onclick="closeModal();openReprogramarCopia('${escH(r.id)}')">
        🔁 Crear copia reprogramada
      </button>
    </div>`:""}
  ${yaReprogramada?`
    <div class="alert-info" style="margin-top:16px">🔁 Ya se creó una copia reprogramada de esta solicitud.</div>`:""}
  ${puedeTomar2?`
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn btn-warn btn-md btn-full" onclick="closeModal();openTomarTransferencia('${escH(r.id)}')">
        🤲 ${r.estado==="En fábrica"?"Llevar a destino final":"Tomar transferencia"}
      </button>
    </div>`:""}
  ${puedeDejarFab2?`
    <div style="margin-top:8px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn btn-primary btn-md btn-full" onclick="closeModal();openDejarEnFabrica('${escH(r.id)}')">
        🏭 Dejar en fábrica
      </button>
    </div>`:""}
  ${puedeConfirmar?`
    <div style="margin-top:8px;padding-top:16px;border-top:1px solid var(--border)">
      <div style="display:flex;gap:8px">
        <button class="btn btn-teal btn-md" style="flex:2" onclick="closeModal();openConfirmarEntrega('${escH(r.id)}')">
          📦 Confirmar entrega
        </button>
        <button class="btn btn-danger btn-md" style="flex:1" onclick="closeModal();openNoEntrega('${escH(r.id)}')">
          ✕ No entregué
        </button>
      </div>
      ${puedeDejarCerrado?`
      <button class="btn btn-ghost btn-md btn-full" style="margin-top:8px" onclick="closeModal();openDejarCerrado('${escH(r.id)}')">
        🔒 Sucursal cerrada — dejar igual
      </button>`:""}
    </div>`:""}`;
}

// ── Gestionar (Logística) ────────────────────────────────
function renderGestionar(){
  const r=S.requests.find(x=>x.id===S.selId);
  if(!r) return "";
  const a=S.action;
  const recOpts=S.recorridos.length?S.recorridos:["SUR","CENTRO","NORTE"];
  const showDate=a.estado==="Programada"||a.estado==="Reprogramada";

  return `
  <div style="background:var(--s2);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      ${estadoBadges(r)} ${badge(r.prioridad,P_COLOR[r.prioridad])}
    </div>
    <div style="line-height:1.8;color:var(--muted)">
      <strong style="color:var(--text)">${escH(origenLabel(r))}</strong> → ${escH(r.destino)}<br/>
      ${escH(r.descripcion)} · <span class="mono">${escH(String(r.cantidad))} ${escH(r.unidad)}</span><br/>
      ${escH(solicitanteLabel(r))}${r.fechaRequerida?` · F.req: <strong style="color:var(--amber)">${fd(r.fechaRequerida)}</strong>`:""}
    </div>
  </div>
  ${divider("ACCIONES RÁPIDAS")}
  <div class="action-row">
    ${[
    ["Aprobada",          "✓ Aprobar",         "btn-success"],
    ["Rechazada",         "✕ Rechazar",        "btn-danger"],
    ["Programada",        "📅 Programar",       "btn-purple"],
    ["Lista para retirar","🟢 Lista",           "btn-teal"],
    ["En tránsito",       "🚚 En tránsito",    "btn-warn"],
    ["Entregada",         "📦 Entregada",       "btn-teal"],
  ].map(([v,l,cls])=>`
      <button class="btn ${cls} btn-sm" style="opacity:${a.estado===v?1:.5}" onclick="S.action.estado='${v}';render()">${l}</button>`).join("")}
    <button class="btn btn-warn btn-sm" style="opacity:${a.reprogramando?1:.5}" onclick="S.action.reprogramando=!S.action.reprogramando;render()">🔁 Reprogramar</button>
  </div>
  ${a.reprogramando?`
  <div style="background:#f5a62318;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;border-left:3px solid var(--amber)">
    🔁 Esto NO cambia el estado — se mantiene <strong>${escH(a.estado||r.estado)}</strong>, solo se actualiza la fecha pedida y queda marcada como "Reprogramada" para que se sepa que no es la fecha original.
  </div>
  <div class="field">
    <label>Nueva fecha requerida <span class="req">*</span></label>
    <input type="date" class="inp" value="${escH(a.nuevaFechaRequerida)}" onchange="S.action.nuevaFechaRequerida=this.value"/>
  </div>`:""}
  <div class="field">
    <label>Estado manual</label>
    <select onchange="S.action.estado=this.value;render()">
      <option value="">— Sin cambio —</option>
      ${ESTADOS.map(s=>`<option ${a.estado===s?"selected":""}>${escH(s)}</option>`).join("")}
    </select>
  </div>
  <!-- Checkbox pasa por fábrica -->
  <div style="background:var(--s2);border-radius:8px;padding:12px 14px;margin-bottom:14px">
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px">
      <input type="checkbox" id="chk-fabrica"
        ${(a.pasaPorFabrica||r.pasaPorFabrica)?"checked":""}
        onchange="S.action.pasaPorFabrica=this.checked;render()"
        style="width:16px;height:16px;accent-color:var(--teal);cursor:pointer"/>
      <span>🏭 <strong>Pasa por fábrica</strong> — el repartidor la trae a fábrica antes de ir al destino</span>
    </label>
    ${(a.pasaPorFabrica||r.pasaPorFabrica)?`
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">
      ${r.estado==="En fábrica"
        ? "✅ Ya está en fábrica — asigná el recorrido de salida abajo"
        : r.fabricaAt
          ? "🏭 Llegó a fábrica: "+fdt(r.fabricaAt)+" — asigná el recorrido de salida"
          : "El repartidor verá el botón 'Dejar en fábrica' al llegar."}
    </div>`:""}
  </div>

  <!-- Recorrido: si pasa por fábrica y ya llegó, es el recorrido de salida -->
  <div class="field">
    <label>Prioridad</label>
    <select onchange="S.action.prioridad=this.value">
      ${PRIORIDADES.map(p=>`<option ${(S.action.prioridad||r.prioridad)===p?"selected":""}>${escH(p)}</option>`).join("")}
    </select>
  </div>

  <div class="field">
    <label>${(a.pasaPorFabrica||r.pasaPorFabrica)&&r.fabricaAt
      ? "Recorrido de salida (segunda etapa)"
      : "Asignar recorrido"}</label>
    <select onchange="S.action.recorrido=this.value">
      <option value="${escH(r.recorrido||"")}">— ${escH(r.recorrido||"Sin recorrido")} —</option>
      ${recOpts.filter(x=>x!==r.recorrido).map(x=>`<option value="${escH(x)}">${escH(x)}</option>`).join("")}
    </select>
  </div>
  ${showDate?`<div class="field"><label>Fecha programada</label><input type="date" class="inp" value="${escH(a.scheduledAt)}" onchange="S.action.scheduledAt=this.value"/></div>`:""}
  <div class="field">
    <label>Comentario para la sucursal</label>
    <textarea placeholder="Ej: Aprobado, sale el martes. / Rechazado por falta de stock." oninput="S.action.comentario=this.value">${escH(a.comentario)}</textarea>
  </div>
  <div class="field">
    <label>Instrucción para el repartidor <span style="color:var(--faint);font-size:12px">(opcional)</span></label>
    <textarea id="g-coment-rep" rows="2"
      placeholder="Ej: Llamar antes de llegar, entregar en portería..."
      oninput="S.action.comentarioRepartidor=this.value">${escH(a.comentarioRepartidor||"")}</textarea>
  </div>
  <div style="background:var(--s2);border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;border-left:3px solid var(--amber)">
    🔒 Al guardar se te pedirá tu <strong>DNI</strong> para registrar la aprobación.
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button class="btn btn-ghost btn-md" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-success btn-md" onclick="submitGestionar()" ${S.saving?"disabled":""}>
      ${S.saving?`<span class="spinner"></span> Guardando...`:"Guardar y firmar →"}
    </button>
  </div>`;
}

    <div class="alert-ok" style="text-align:center;font-size:15px;padding:14px">

// ── Modal: la sucursal confirma una transferencia que quedó "sin confirmar" ──
function renderConfirmarCerradoModal(){
  const d = S.confirmarCerradoModal;

function openEditar(id){
  const r = S.requests.find(x=>x.id===id);
  if(!r) return;
  S.editarModal = {id, descripcion:r.descripcion||"", cantidad:r.cantidad||"", observaciones:r.observaciones||"", err:"", loading:false};
  S.modal = "editar";
  render();
}

async function submitEditar(){
  const d = S.editarModal;
  if(d.loading) return;
  const desc    = ($("ed-desc")?.value||"").trim();
  const cant    = ($("ed-cant")?.value||"").trim();
  const fecha   = ($("ed-fecha")?.value||"").trim();
  const obs     = ($("ed-obs")?.value||"").trim();
  if(!desc){ S.editarModal.err="La descripción es obligatoria."; render(); return; }
  if(!cant||isNaN(+cant)||+cant<=0){ S.editarModal.err="Cantidad inválida."; render(); return; }
  S.editarModal.loading = true; renderNow();
  const changes = { descripcion:desc, cantidad:+cant, fechaRequerida:fecha||null, observaciones:obs, updatedAt:now() };
  S.requests = S.requests.map(x=>x.id===d.id?{...x,...changes}:x);
  S.modal = null;
  toast("Solicitud actualizada");
  sheetsUpdate(d.id, changes);
}

async function cancelarSolicitud(id){
  if(!confirm("¿Cancelar esta solicitud? No se puede deshacer.")) return;
  const changes = { estado:"Rechazada", comentario:"Cancelada por el solicitante", updatedAt:now() };
  S.requests = S.requests.map(x=>x.id===id?{...x,...changes}:x);
  S.modal = null;
  toast("Solicitud cancelada");
  sheetsUpdate(id, changes);
}

async function submitDejarBolsinesVarios(){

  const check = validarDNI(dni);
  if(!check.ok){ S.dejarBolsinesModal.err=check.msg; render(); return; }

  d.loading = true; renderNow();

  const nowTs = now();
  const changes = {estado:"Entregada", nombreQuienEntrego:check.nombre, dniEntrega:dni, deliveredAt:nowTs, updatedAt:nowTs};
  try{
    const resultados = await Promise.all(
      d.ids.map(id => sb.from("solicitudes").update(toSnakeRow(changes)).eq("id",id))
    );
    const fallidas = resultados.filter(r=>r.error);
    if(fallidas.length===0){
      const idsSet = new Set(d.ids);
      S.requests = S.requests.map(x=>idsSet.has(x.id) ? {...x,...changes} : x);
      S.repSeleccion = new Set();
      S.modoSeleccionRep = false;
      S.modal = null;

      S.dejarBolsinesModal.loading=false;

  } catch(e){
    S.dejarBolsinesModal.loading=false;
    S.dejarBolsinesModal.err = "No se pudo conectar — probá de nuevo.";

  render();
}

async function submitTomarVarias(){
  const d = S.tomarVariasModal;
  if(d.loading) return;
  const dni = String(d.dni||"").replace(/\D/g,"");
  if(!dni){ S.tomarVariasModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.tomarVariasModal.err=check.msg; render(); return; }

  d.loading = true; renderNow();

  try{
    // Postgres actualiza cada fila de forma segura aunque se disparen todas
    // juntas — a diferencia de Sheets, acá no hace falta un lock manual en
    // un backend intermedio. Cada solicitud puede estar en una etapa
    // distinta (recién sale de origen, o sale de fábrica en la segunda
    // etapa), así que se arma el cambio correcto para cada una.
    const nowTs = now();
    const cambios = d.ids.map(id=>{
      const x = S.requests.find(r=>r.id===id);
      const esSegundaEtapa = x && x.estado==="En fábrica";
      const changes = esSegundaEtapa
        ? {estado:"En tránsito", nombreQuienEntrego:check.nombre, dniEntrega:dni, salidaFabricaAt:nowTs, updatedAt:nowTs}
        : {estado:"En tránsito", nombreQuienLevanto:check.nombre, dniRepartidor:dni, levantadoAt:nowTs, updatedAt:nowTs};
      return {id, changes};
    });
    const resultados = await Promise.all(
      cambios.map(c => sb.from("solicitudes").update(toSnakeRow(c.changes)).eq("id",c.id))
    );
    const fallidas = resultados.filter(r=>r.error);
    if(fallidas.length===0){
      const idsSet = new Set(d.ids);
      S.requests = S.requests.map(x=>{
        const c = cambios.find(c=>c.id===x.id);
        return c ? {...x, ...c.changes} : x;
      });
      S.repSeleccion = new Set();
      S.modoSeleccionRep = false;
      S.modal = null;
      toast(`🚚 ${check.nombre} tomó ${cambios.length} transferencias`);
    } else {
      S.tomarVariasModal.loading=false;
      S.tomarVariasModal.err = `No se pudieron tomar ${fallidas.length} de ${cambios.length}. Probá de nuevo.`;
    }
  } catch(e){
    S.tomarVariasModal.loading=false;
    S.tomarVariasModal.err = "No se pudo conectar — probá de nuevo.";
  }
  render();
}

async function submitReprogramarCopia(){
  const d = S.reprogramarCopiaModal;
  if(d.loading) return;
  const r = S.requests.find(x=>x.id===d.id);
  if(!r) return;
  const dni = String(d.dni||"").replace(/\D/g,"");
  if(!dni){ S.reprogramarCopiaModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.reprogramarCopiaModal.err=check.msg; render(); return; }
  if(!d.fecha){ S.reprogramarCopiaModal.err="Elegí la nueva fecha."; render(); return; }

  d.loading = true; renderNow();

  const nowTs = now();
  const copia = {
    id:"tmp-"+Date.now(),
    sucursal: r.sucursal, area: r.area,
    solicitante: r.solicitante, dniSolicitante: r.dniSolicitante,
    destino: r.destino, descripcion: r.descripcion,
    cantidad: r.cantidad, unidad: r.unidad, prioridad: r.prioridad,
    fechaRequerida: d.fecha,
    observaciones: r.observaciones,
    estado: "Aprobada", // ya estaba aprobada antes, no hace falta repetir el paso
    comentario: `Reprogramada por ${check.nombre} a partir de ${r.id} (no se entregó el ${fd(r.fechaRequerida)})`,
    reprogramadaDeId: r.id,
    recorrido:"", createdAt: nowTs, approvedAt: nowTs, updatedAt: nowTs,
  };
  try{
    const creada = await sheetsAdd(copia);
    S.requests = [creada||copia, ...S.requests];
    // Dejar rastro en la original también
    const changesOriginal = {comentario: (r.comentario?r.comentario+" · ":"")+`Reprogramada como ${(creada||copia).id}`};
    S.requests = S.requests.map(x=>x.id===r.id?{...x,...changesOriginal}:x);
    sheetsUpdate(r.id, changesOriginal);
    S.modal = null;
    toast(`🔁 Copia ${(creada||copia).id} creada para el ${fd(d.fecha)}`);
  } catch(e){
    S.reprogramarCopiaModal.loading=false;
    S.reprogramarCopiaModal.err = "No se pudo crear la copia — probá de nuevo.";
  }
  render();
}

async function submitCambioEstadoMasivo(){
  const d = S.cambioEstadoMasivoModal;
  if(d.loading) return;
  const esLogistica = S.user?.rol==="logistica";
  let dni, nombre;
  if(esLogistica){
    dni = S.user.dni||""; nombre = S.user.nombre||"Logística";
  } else {
    dni = String(d.dni||"").replace(/\D/g,"");
    if(!dni){ S.cambioEstadoMasivoModal.err="Ingresá tu DNI."; render(); return; }
    const check = validarDNI(dni);
    if(!check.ok){ S.cambioEstadoMasivoModal.err=check.msg; render(); return; }
    nombre = check.nombre;
  }

  d.loading = true; renderNow();

  try{
    // Igual que con tomarVarias: cada fila puede tener un comentario previo
    // distinto, así que se actualiza una por una (Postgres lo hace seguro
    // aunque vayan todas juntas) para no perder el historial de cada una.
    const nowTs = now();
    const esAprobar = d.estado==="Aprobada";
    const cambios = d.ids.map(id=>{
      const x = S.requests.find(r=>r.id===id);
      const nota = esAprobar ? `Aprobada por ${nombre}` : `Cambio a "${d.estado}" por ${nombre}`;
      const comentario = x && x.comentario ? x.comentario+" · "+nota : nota;
      const changes = {estado:d.estado, comentario, updatedAt:nowTs, dniLogistica:dni, nombreLogistica:nombre};
      if(d.recorrido) changes.recorrido = d.recorrido;
      if(esAprobar && x && !x.approvedAt) changes.approvedAt = nowTs;
      if(esAprobar && x) crearNotificacion(x.sucursal||x.area||"", `✅ Tu solicitud ${id} fue aprobada — prepará y marcá "Lista para retirar"`, id);
      if(esAprobar && x && esPedidoPlanificacionFresco(x)) crearNotificacion("RECEPCION FRESCO", `🥬 Nuevo pedido para preparar: ${id} — ${x.descripcion||""}`, id);
      return {id, changes};
    });
    const resultados = await Promise.all(
      cambios.map(c => sb.from("solicitudes").update(toSnakeRow(c.changes)).eq("id",c.id))
    );
    const fallidas = resultados.filter(r=>r.error);
    if(fallidas.length===0){
      S.requests = S.requests.map(x=>{
        const c = cambios.find(c=>c.id===x.id);
        return c ? {...x, ...c.changes} : x;
      });
      S.logSeleccion = new Set();
      S.modoSeleccion = false;
      S.modal = null;
      toast(esAprobar ? `✅ ${cambios.length} solicitudes aprobadas` : `✅ ${cambios.length} solicitudes cambiadas a "${d.estado}"`);
    } else {
      S.cambioEstadoMasivoModal.loading=false;
      S.cambioEstadoMasivoModal.err = `No se pudieron cambiar ${fallidas.length} de ${cambios.length}. Probá de nuevo.`;
    }
  } catch(e){
    S.cambioEstadoMasivoModal.loading=false;
    S.cambioEstadoMasivoModal.err = "No se pudo conectar — probá de nuevo.";
  }
  render();
}

async function submitEnvioMasivoRRHH(){
  const d = S.envioMasivoModal;
  if(d.loading) return;
  const descripcion = ($("em-desc")?.value||d.descripcion||"").trim();
  const cantidad    = $("em-cant")?.value||d.cantidad||"";
  const unidad      = $("em-unit")?.value||d.unidad||"Unidades";
  const fechaRequerida = $("em-fecha")?.value||d.fechaRequerida||"";
  const observaciones  = ($("em-obs")?.value||d.observaciones||"").trim();

  const err={};
  if(!descripcion) err.desc="Describí qué se envía";
  if(!cantidad||isNaN(+cantidad)||+cantidad<=0) err.cant="Cantidad inválida";
  if(d.destinos.length===0) err.destinos="Marcá al menos una sucursal";
  if(Object.keys(err).length){ S.envioMasivoModal.err=err; render(); return; }

  // Se pide el DNI UNA sola vez (login compartido de RRHH) y con eso se
  // firman todas las solicitudes que se crean en el lote.
  S.dniModal = {
    title:`Ingresá tu DNI para registrar estas ${d.destinos.length} solicitudes`,
    field:"solicitante", val:"", err:"", loading:false, nombreOk:"",
    cb: async (dniVal, usuarioEncontrado)=>{
      const nombreSolicitante = usuarioEncontrado?.nombre || S.user.nombre || "RRHH";
      S.envioMasivoModal.loading = true; S.modal=null; renderNow();
      try{
        const creadas = [];
        for(const destino of d.destinos){
          const nueva = {
            id:"tmp-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
            sucursal:"", area:S.user.area||"RRHH",
            solicitante:nombreSolicitante, dniSolicitante:dniVal,
            destino, descripcion, cantidad:+cantidad, unidad,
            prioridad:"Media", fechaRequerida: fechaRequerida||null,
            observaciones, estado:"Pendiente", comentario:"", recorrido:"",
            dniLogistica:"", dniRepartidor:"", nombreQuienLevanto:"", dniEntrega:"", nombreQuienEntrego:"", codigoEntrega:"", listoAt:"", dniListoPor:"", nombreListoPor:"",
            createdAt:now(), approvedAt:null, scheduledAt:null, deliveredAt:null, updatedAt:now(),
          };
          const creada = await sheetsAdd(nueva);
          creadas.push(creada||nueva);
        }
        S.requests = [...creadas, ...S.requests];
        toast(`📨 ${creadas.length} solicitudes creadas — una por sucursal`);
        creadas.forEach(c=>notificarNuevaSolicitud(c));
      }catch(e){
        toast("⚠️ Algo falló creando las solicitudes — revisá y volvé a intentar","warn");
      }
      S.envioMasivoModal.loading = false;
      render();
    }
  };
  S.modal = "dniConfirm"; render();
}

async function submitPedidoTesoreria(){
  const d = S.pedidoTesoreriaModal;
  if(d.loading) return;
  const dni = String(d.dni||"").replace(/\D/g,"");
  if(!dni){ S.pedidoTesoreriaModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.pedidoTesoreriaModal.err=check.msg; render(); return; }
  const esAprobar = d.accion==="aprobar";
  const motivo = ($("pt-motivo")?.value||d.motivo||"").trim();
  if(!esAprobar && !motivo){ S.pedidoTesoreriaModal.err="Ingresá el motivo del rechazo."; render(); return; }
  let cantidadFinal = null;
  if(esAprobar){
    cantidadFinal = +(($("pt-cant")?.value||"").trim());
    if(!cantidadFinal || cantidadFinal<=0){ S.pedidoTesoreriaModal.err="Ingresá una cantidad válida."; render(); return; }
  }

  d.loading = true; renderNow();
  await new Promise(r=>setTimeout(r,400));

  const original = S.requests.find(x=>x.id===d.id);
  const cambioCant = esAprobar && original && +original.cantidad!==cantidadFinal;
  const changes = esAprobar
    ? {estado:"Pendiente", cantidad:cantidadFinal,
       comentario:`Aprobado por Tesorería (${check.nombre})${cambioCant?` — cantidad ajustada de ${original.cantidad} a ${cantidadFinal}`:""}`,
       updatedAt:now()}
    : {estado:"Rechazada", comentario:`Rechazado por Tesorería (${check.nombre}): ${motivo}`, updatedAt:now()};
  S.requests = S.requests.map(x=>x.id===d.id ? {...x,...changes} : x);
  S.modal = null;
  toast(esAprobar?`✅ Pedido ${d.id} aprobado — pasa a logística`:`✕ Pedido ${d.id} rechazado`);
  sheetsUpdate(d.id, changes);
}

async function submitNuevoLote(){
  if(S.saving) return;
  const d = S.nuevoLoteModal;
  const sucursales = getSucursales();
  // Leer las cantidades directo del DOM (por si no pasaron por oninput)
  const items = [];
  sucursales.forEach((s,i)=>{
    const v = ($(`lote-cant-${i}`)?.value ?? d.cantidades[s] ?? "").toString().trim();
    if(v && +v > 0) items.push({destino:s, cantidad:+v});
  });
  if(!items.length){ S.nuevoLoteModal.err = "Cargá al menos una cantidad."; render(); return; }

  const u = S.user;
  S.dniModal = {
    title:"Ingresá tu DNI para crear el lote",
    field:"tesoreria",
    val:"", err:"", loading:false, nombreOk:"",
    cb: async (dniVal, usuarioEncontrado)=>{
      if(S.saving) return;
      const nombre = usuarioEncontrado?.nombre || u.nombre || "Sin nombre";
      S.saving = true; S.modal = null; renderNow();
      // Un solo INSERT con todas las filas — Postgres lo trata como una
      // transacción: o entran todas, o si algo falla no queda ninguna a
      // medio camino (mismo espíritu que el lock que usábamos en Sheets,
      // pero acá es una garantía nativa de la base, no algo que armamos a mano).
      try{
        const hoy = new Date();
        const loteId = "LOTE-" + fechaCorta() + "-" + String(hoy.getHours()).padStart(2,"0") + String(hoy.getMinutes()).padStart(2,"0");
        const nowIso = now();
        const filas = items.map(it => toSnakeRow({
          sucursal: "Fábrica",
          area: "Tesorería",
          solicitante: nombre,
          dniSolicitante: dniVal,
          destino: it.destino,
          descripcion: "Bolsines",
          cantidad: it.cantidad,
          unidad: "Bolsines",
          prioridad: "Media",
          fechaRequerida: fechaISO(),
          estado: "Aprobada",
          comentario: `Lote diario — creado por Tesorería (${nombre})`,
          createdAt: nowIso,
          approvedAt: nowIso,
          updatedAt: nowIso,
          tipoPedido: "bolsin",
          loteId,
        }));
        const { data, error } = await sb.from("solicitudes").insert(filas).select();
        if(error) throw error;
        toast(`📦 Lote ${loteId} creado — ${data.length} sucursales`);
        S.requests = [...toCamelRows(data), ...S.requests];
      } catch(e){
        console.warn(e);
        toast("⚠️ No se pudo crear el lote — revisá la conexión", "warn");
      }
      S.saving = false;
      render();
    }
  };
  S.modal = "dniConfirm"; render();
}

async function submitLoteListo(){
  const d = S.loteListoModal;
  if(d.loading) return;
  const dni = String(d.dni||"").replace(/\D/g,"");
  if(!dni){ S.loteListoModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.loteListoModal.err=check.msg; render(); return; }

  d.loading = true; renderNow();

  // Una sola sentencia UPDATE en Postgres, filtrando por lote + estado —
  // atómica de por sí, no hace falta ningún lock manual ni backend
  // intermedio (antes esto era el punto que se "bugueaba" con Sheets).
  try{
    const nowTs = now();
    const { data, error } = await sb.from("solicitudes")
      .update(toSnakeRow({estado:"Lista para retirar", listoAt:nowTs, dniListoPor:dni, nombreListoPor:check.nombre, updatedAt:nowTs}))
      .eq("lote_id", d.loteId)
      .eq("estado","Aprobada")
      .select();
    if(error) throw error;
    S.requests = S.requests.map(x => (x.loteId===d.loteId && x.estado==="Aprobada")
      ? {...x, estado:"Lista para retirar", listoAt:nowTs, dniListoPor:dni, nombreListoPor:check.nombre, updatedAt:nowTs}
      : x);
    S.modal = null;
    toast(`✅ ${check.nombre} marcó ${data.length} solicitudes del lote ${d.loteId} como Listas`);
  } catch(e){
    S.loteListoModal.loading=false;
    S.loteListoModal.err = "No se pudo actualizar el lote — probá de nuevo.";
  }
  render();
}

    </button>
  </div>`;
}

async function submitLoteRecorrido(){
  const d = S.loteRecorridoModal;
  if(d.loading) return;
  const filas = S.requests.filter(r=>r.loteId===d.loteId);
  const updates = filas.map(r=>({
    id: r.id,
    recorrido: ($(`lr-${r.id}`)?.value ?? d.asignaciones[r.id] ?? "").trim(),
  })).filter(u=>u.recorrido);
  if(!updates.length){ S.loteRecorridoModal.err="Asigná al menos un recorrido."; render(); return; }

  d.loading = true; renderNow();

  try{
    // Cada sucursal puede llevar un recorrido distinto, así que va una
    // actualización por fila — Postgres las procesa de forma segura aunque
    // salgan todas juntas (no hace falta backend intermedio con lock).
    const nowTs = now();
    const resultados = await Promise.all(
      updates.map(u => sb.from("solicitudes").update(toSnakeRow({recorrido:u.recorrido, updatedAt:nowTs})).eq("id",u.id))
    );
    const fallidas = resultados.filter(r=>r.error);
    if(fallidas.length===0){
      S.requests = S.requests.map(x=>{
        const u = updates.find(u=>u.id===x.id);
        return u ? {...x, recorrido:u.recorrido, updatedAt:nowTs} : x;
      });
      S.modal = null;
      toast(`🚚 Recorridos asignados a ${updates.length} solicitudes del lote ${d.loteId}`);
    } else {
      S.loteRecorridoModal.loading=false;
      S.loteRecorridoModal.err = `No se pudieron asignar ${fallidas.length} de ${updates.length}. Probá de nuevo.`;
    }
  } catch(e){
    S.loteRecorridoModal.loading=false;
    S.loteRecorridoModal.err = "No se pudo conectar — probá de nuevo.";
  }
  render();
}

// Repartidor envía la palabra — se valida contra la almacenada en la solicitud
async function submitPalabra(){
  const d = S.palabraModal;
  if(d.loading) return;

  // Leer del input directamente (más confiable que el estado)
  const ingresada = ($("inp-palabra")?.value||d.palabraIngresada||"").trim().toUpperCase();
  if(!ingresada){ S.palabraModal.err="Ingresá la palabra de entrega."; render(); return; }

  S.palabraModal.loading = true;
  renderNow();

  // Siempre buscar el código directo de la base para no depender de la memoria
  // local (el repartidor está en otro dispositivo que el de la sucursal)
  let esperada = "";
  if(USE_SHEETS){
    try{
      const { data, error } = await sb.from("solicitudes").select("codigo_entrega").eq("id",d.id).single();
      if(error) throw error;
      esperada = (data?.codigo_entrega||"").trim().toUpperCase();
    }catch(e){
      // fallback a memoria local si falla la conexión
      const rLocal = S.requests.find(x=>x.id===d.id);
      esperada = (rLocal?.codigoEntrega||"").trim().toUpperCase();
    }
  } else {
    // Modo demo: leer de memoria local
    const rLocal = S.requests.find(x=>x.id===d.id);
    esperada = (rLocal?.codigoEntrega||"").trim().toUpperCase();
  }

  if(!esperada){
    S.palabraModal.loading = false;
    S.palabraModal.err = "La sucursal destino todavía no generó el código. Pedile que abra la app.";
    render(); return;
  }
  if(ingresada !== esperada){
    S.palabraModal.loading = false;
    S.palabraModal.err = "Código incorrecto. Verificá con la sucursal.";
    render(); return;
  }

  // Código correcto — registrar entrega
  const r = S.requests.find(x=>x.id===d.id);
  const quienEntrego = r?.nombreQuienLevanto || S.user.nombre || "";
  const changes = {
    estado:             "Entregada",
    deliveredAt:        now(),
    nombreQuienEntrego: quienEntrego,
    dniEntrega:         r?.dniRepartidor || "",
    codigoEntrega:      ingresada,
    updatedAt:          now(),
  };
  S.requests = S.requests.map(x=>x.id===d.id?{...x,...changes}:x);
  S.modal = null;
  toast(`✅ Entrega confirmada — ${r?.destino||""}`);
  sheetsUpdate(d.id, changes);
}

// ── LOGIN ──────────────────────────────────────────────────
async function doLogin(){
  S.loginErr = "";
  // Leemos siempre del DOM, nunca del estado — así no depende de oninput
  const usuario = ($("l-user")?.value||S.loginUser||"").trim();
  const pass    = ($("l-pass")?.value||"").trim();
  S.loginUser   = usuario; // guardamos para si hay error y se re-renderiza

  if(!usuario){ S.loginErr="Ingresá tu usuario o sucursal."; render(); return; }

  // FASE 1: cargar solo usuarios (rápido)
  S.loginLoading = true; renderNow();
  if(USE_SHEETS) await sheetsLoadUsuarios();
  S.loginLoading = false;

  const resultado = buscarUsuario(usuario, pass);
  if(!resultado.ok){ S.loginErr = resultado.msg; render(); return; }

  const tipo = resultado.tipo;

  // Determinar usuario según tipo
  if(tipo === "SUCURSAL"){
    S.user = {rol:"sucursal", area:resultado.area, nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "LOGISTICA"){
    S.user = {rol:"logistica", area:"Logística", nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "REPARTIDOR"){
    S.user = {rol:"repartidor", area:"Reparto", nombre:resultado.nombre, dni:resultado.dni||"", recorrido:resultado.recorrido||""};
  } else if(tipo === "AREA"){
    S.user = {rol:"area", area:resultado.area||usuario, nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(["PLANIFICACION","ADMINISTRACION","RRHH","PRECIOS","COMPRAS","DEPOSITO"].includes(tipo)){
    // Estos son logins COMPARTIDOS por toda un área (ej: usuario "COMPRAS" lo
    // usan varias personas distintas, cada una se identifica por DNI al crear
    // la solicitud). Por eso el área que se guarda y se usa para filtrar tiene
    // que ser SIEMPRE el login (columna "usuario" de Sheets, ej. "COMPRAS"),
    // no el nombre de la persona ni la columna "area" — así todas las
    // solicitudes creadas desde ese login quedan agrupadas bajo la misma área,
    // sin importar quién la haya creado.
    const areaReal = resultado.usuario || resultado.area || tipo;
    S.user = {rol:"planificacion", area:areaReal, nombre:resultado.nombre, dni:resultado.dni||"", tipoReal:tipo};
  } else if(tipo === "RECEPCIONISTA"){
    S.user = {rol:"recepcionista", area:resultado.area||"Fábrica", nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "TESORERIA"){
    S.user = {rol:"tesoreria", area:"Tesorería", nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "ADMIN"){
    S.user = {rol:"admin", area:"Administrador", nombre:resultado.nombre, dni:resultado.dni||""};
  } else {
    S.loginErr = "Tipo de acceso no reconocido. Consultá con logística.";
    render(); return;
  }

  // Entrar inmediatamente — FASE 2 carga datos en background
  S.view = "app";
  S.lastRefresh = Date.now();
  render(); // mostrar app ya

  // Cargar solicitudes, recorridos y destinos en background sin bloquear
  sheetsLoadDatos().then(()=>{ render(); });
  startAutoRefresh(); // iniciar auto-refresh en background
}

// Tiempo real: en vez de "preguntar cada 90 segundos si pasó algo nuevo",
// la app se suscribe a la tabla y Supabase le avisa apenas algo cambia —
// se termina el parpadeo del refresco periódico.
let _rtChannel = null;
function startAutoRefresh(){
  if(!USE_SHEETS) return;
  if(_rtChannel) return; // ya suscripto
  _rtChannel = sb.channel("solicitudes-rt")
    .on("postgres_changes", {event:"*", schema:"public", table:"solicitudes"}, (payload)=>{
      if(S.view!=="app") return;
      if(payload.eventType==="DELETE"){
        S.requests = S.requests.filter(r=>r.id!==payload.old.id);
      } else {
        const fila = toCamelRow(payload.new);
        const existe = S.requests.some(r=>r.id===fila.id);
        S.requests = existe
          ? S.requests.map(r=>r.id===fila.id?fila:r)
          : [fila, ...S.requests];
      }
      if(!S.modal) render(); // si hay un modal abierto, no interrumpir — se actualiza solo al cerrarlo
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"quejas"}, (payload)=>{
      if(S.view!=="app" || !S.quejasLoaded) return;
      if(payload.eventType==="DELETE"){
        S.quejas = S.quejas.filter(q=>q.id!==payload.old.id);
      } else {
        const fila = toCamelRow(payload.new);
        const existe = S.quejas.some(q=>q.id===fila.id);
        S.quejas = existe ? S.quejas.map(q=>q.id===fila.id?fila:q) : [fila, ...S.quejas];
      }
      if(!S.modal) render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"devoluciones"}, (payload)=>{
      if(S.view!=="app" || !S.devolucionesLoaded) return;
      if(payload.eventType==="DELETE"){
        S.devoluciones = S.devoluciones.filter(d=>d.id!==payload.old.id);
      } else {
        const fila = toCamelRow(payload.new);
        const existe = S.devoluciones.some(d=>d.id===fila.id);
        S.devoluciones = existe ? S.devoluciones.map(d=>d.id===fila.id?fila:d) : [fila, ...S.devoluciones];
      }
      if(!S.modal) render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"notificaciones"}, (payload)=>{
      if(S.view!=="app") return;
      if(payload.eventType==="DELETE"){
        S.notificaciones = S.notificaciones.filter(n=>n.id!==payload.old.id);
      } else {
        const fila = toCamelRow(payload.new);
        if(fila.leida){
          S.notificaciones = S.notificaciones.filter(n=>n.id!==fila.id);
        } else {
          const existe = S.notificaciones.some(n=>n.id===fila.id);
          S.notificaciones = existe ? S.notificaciones.map(n=>n.id===fila.id?fila:n) : [fila, ...S.notificaciones];
          if(!existe && notifEsMia(fila)) toast(fila.mensaje);
        }
      }
      if(!S.modal) render();
    })
    .subscribe();
}
function stopAutoRefresh(){
  if(_rtChannel){ sb.removeChannel(_rtChannel); _rtChannel=null; }
}

// ── ACTUALIZAR DATOS (sin cerrar sesión) ─────────────────
async function doRefresh(){
  if(S.refreshing) return; // evitar doble click
  S.refreshing = true;
  renderNow();
  if(USE_SHEETS){
    await Promise.all([sheetsLoadUsuarios(), sheetsLoadDatos()]);
  }
  S.lastRefresh = Date.now();
  S.refreshing  = false;
  toast("Datos actualizados ✓");
}

function doLogout(){ stopAutoRefresh(); S.view="login"; S.user=null; S.loginErr=""; S.loginUser=""; S.loginLoading=false; render(); }

// ── NUEVA SOLICITUD ────────────────────────────────────────
async function submitNueva(){
  // Guard: evitar doble submit
  if(S.saving) return;

  // Leer valores del DOM directamente — no del estado S.form
  // Así evitamos que oninput cause re-renders mientras se escribe
  const destino     = ($("f-dest")?.value||"").trim();
  const descripcion = ($("f-desc")?.value||"").trim();
  const cantidad    = ($("f-cant")?.value||"").trim();
  const unidad      = $("f-unit")?.value || "Unidades";
  const prioridad   = "Media"; // eliminada del formulario
  const fechaReq    = $("f-fecha")?.value || "";
  const observ      = ($("f-obs")?.value||"").trim();

  // Validar
  const e={};
  if(!destino)                                         e.dest="Seleccioná un destino";
  if(!descripcion)                                     e.desc="Campo requerido";
  if(!cantidad||isNaN(+cantidad)||+cantidad<=0)        e.cant="Cantidad inválida";
  // Si el origen o el destino es "Otra dirección", la dirección exacta
  // (en Observaciones) pasa a ser obligatoria — si no, nadie sabe adónde ir.
  const origenPrevio = ($("f-origen")?.value||"").trim();
  if((origenPrevio==="Otra dirección" || destino==="Otra dirección") && !observ){
    e.obs = "Ingresá la dirección exacta — es obligatorio para 'Otra dirección'";
  }
  if(Object.keys(e).length){ S.formErr=e; render(); return; }

  // Capturar el origen y el archivo AHORA — el DOM se destruye cuando se abre el modal DNI
  const origenElegido = ($("f-origen")?.value||"").trim();
  const archivoElegido = $("f-adjunto")?.files?.[0] || null;
  const esPlanSubmit  = S.user.rol==="planificacion";

  // Abrir modal DNI — el nombre del solicitante viene de Sheets
  S.dniModal={
    title:"Ingresá tu DNI para registrar la solicitud",
    field:"solicitante",
    val:"", err:"", loading:false, nombreOk:"",
    cb: async (dniVal, usuarioEncontrado)=>{
      if(S.saving) return; // guard doble ejecución del callback
      const nombreSolicitante = usuarioEncontrado?.nombre || S.user.nombre || "Sin nombre";
      S.saving=true; S.modal=null; renderNow();
      const adjuntoUrl = await subirArchivo(archivoElegido, "solicitudes");
      const nueva={
        id:"tmp-"+Date.now(),
        sucursal: S.user.rol==="sucursal"       ? S.user.area
                : S.user.rol==="logistica"       ? origenElegido
                : esPlanSubmit                   ? origenElegido : "",
        area:     S.user.rol==="area"            ? S.user.area
                : S.user.rol==="logistica"       ? "Logística"
                : esPlanSubmit                   ? S.user.area : "",
        solicitante:  nombreSolicitante,
        dniSolicitante: dniVal,
        destino, descripcion, cantidad:+cantidad,
        unidad, prioridad,
        fechaRequerida: fechaReq||null,
        observaciones:  observ,
        adjuntoUrl,
        estado:"Pendiente", comentario:"", recorrido:"",
        dniLogistica:"", dniRepartidor:"", nombreQuienLevanto:"", dniEntrega:"", nombreQuienEntrego:"", codigoEntrega:"", listoAt:"", dniListoPor:"", nombreListoPor:"",
        createdAt:now(), approvedAt:null, scheduledAt:null, deliveredAt:null, updatedAt:now(),
      };
      const creada = await sheetsAdd(nueva);
      S.requests = [creada||nueva, ...S.requests];
      S.form     = emptyForm();
      S.saving   = false;
      toast(`Solicitud ${(creada||nueva).id} creada — ${nombreSolicitante}`);
      render();
      notificarNuevaSolicitud(creada||nueva); // aviso a logística, en background
    }
  };
  S.modal="dniConfirm"; render();
}

// ── GESTIONAR (LOGÍSTICA) ──────────────────────────────────
async function submitGestionar(){
  if(!S.action.estado){ toast("Seleccioná un estado","warn"); return; }

  // El login "logística" lo usa una sola persona — pedirle DNI en cada
  // acción es fricción sin sentido (a diferencia de repartidores/sucursales,
  // que sí son logins compartidos entre varias personas distintas).
  if(S.user?.rol==="logistica"){
    await aplicarGestionar(S.user.dni||"", {nombre:S.user.nombre});
    return;
  }

  S.dniModal={
    title:"Confirmá tu DNI para registrar esta acción",
    field:"logistica",
    val:"", err:"", loading:false,
    cb: async (dniVal, usuario)=> aplicarGestionar(dniVal, usuario)
  };
  S.modal="dniConfirm"; render();
}

async function aplicarGestionar(dniVal, usuario){
      // Obtener nombre del que firma — viene del objeto usuario encontrado por validarDNI
      const nombreFirmante = usuario?.nombre || S.user?.nombre || "Logística";
      S.saving=true; S.modal=null; renderNow();
      const a=S.action; const r=S.requests.find(x=>x.id===S.selId);
      const savedId = S.selId;
      // Leer comentario del repartidor del DOM (puede haber sido editado)
      const comentRepDom = ($("g-coment-rep")?.value ?? a.comentarioRepartidor ?? "").trim();
      const changes={
        estado:          a.estado,
        comentario:      a.comentario || "",
        comentarioRepartidor: comentRepDom,
        updatedAt:       now(),
        dniLogistica:    dniVal,
        nombreLogistica: nombreFirmante,
      };
      if(a.scheduledAt)   changes.scheduledAt   = a.scheduledAt;
      if(a.prioridad)     changes.prioridad     = a.prioridad;
      changes.pasaPorFabrica = a.pasaPorFabrica ? true : false;
      // Recorrido: si ya llegó a fábrica → es recorrido de egreso; si no → ingreso
      if(a.recorrido){
        if(r.fabricaAt || r.estado==="En fábrica"){
          changes.recorridoEgreso = a.recorrido;
        } else {
          changes.recorrido = a.recorrido;
        }
      }
      if(a.estado==="Aprobada"&&!r.approvedAt) changes.approvedAt=now();
      if(a.estado==="Entregada") changes.deliveredAt=now();
      if(r.estado==="En fábrica"&&a.estado!=="En fábrica"){
        changes.nombreQuienLevanto="";
        changes.dniRepartidor="";
      }
      // Reprogramar: NO toca el estado — solo actualiza la fecha pedida y
      // deja marcado que se reprogramó, para que convivan "Aprobada" +
      // "Reprogramada" en vez de perder el estado real de la solicitud.
      if(a.reprogramando && a.nuevaFechaRequerida){
        changes.fechaRequerida = a.nuevaFechaRequerida;
        changes.reprogramada = true;
      }
      S.requests = S.requests.map(x=>x.id===savedId?{...x,...changes}:x);
      S.saving=false; S.selId=null;
      toast(`Solicitud actualizada → ${a.estado}`);
      sheetsUpdate(savedId, changes);
      // Avisar por mail a quien la pidió, si logística la acaba de aprobar
      if(a.estado==="Aprobada" && r){
        const origenNombre = r.sucursal||r.area||"";
        crearNotificacion(origenNombre, `✅ Tu solicitud ${savedId} fue aprobada — prepará y marcá "Lista para retirar"`, savedId);
        if(esPedidoPlanificacionFresco(r)){
          crearNotificacion("RECEPCION FRESCO", `🥬 Nuevo pedido para preparar: ${savedId} — ${r.descripcion||""}`, savedId);
        }
        const email = buscarEmailOrigen(origenNombre);
        if(email){
          enviarMail(email,
            `✅ Transferencia ${savedId} aprobada — preparala y marcala "Lista para retirar"`,
            [
              `Logística aprobó tu solicitud de transferencia.`,"",
              `N° Solicitud : ${savedId}`,
              `Origen       : ${r.sucursal||r.area||"—"}`,
              `Destino      : ${r.destino||"—"}`,"",
              `Preparala y, cuando esté embalada, ingresá al sistema y marcala como "Lista para retirar".`,
            ].join("\n"));
        }
      }
}

// ── CONFIRMAR ENTREGA (REPARTIDOR) ─────────────────────────
// ── TOMAR TRANSFERENCIA (repartidor levanta) ───────────────
async function submitTomar(){
  const d   = S.tomarModal;
  const dni = String(d.dni||"").replace(/\D/g,"");

  if(!dni){ S.tomarModal.err="Ingresá tu DNI."; render(); return; }

  const check = validarDNI(dni);
  if(!check.ok){ S.tomarModal.err=check.msg; render(); return; }

  // Mostrar nombre verificado brevemente
  S.tomarModal.loading  = true;
  S.tomarModal.nombreOk = check.nombre;
  renderNow();
  await new Promise(r=>setTimeout(r,500));

  const r = S.requests.find(x=>x.id===d.id);
  const esSegundaEtapa = r?.estado === "En fábrica";
  const tsAhora = now();
  const changes = {
    estado:     "En tránsito",
    updatedAt:  tsAhora,
  };
  if(esSegundaEtapa){
    // Segunda etapa: sale de fábrica → destino final
    changes.nombreQuienEntrego = check.nombre;
    changes.dniEntrega         = dni;
    changes.salidaFabricaAt    = tsAhora;  // timestamp salida de fábrica
    changes.pasaPorFabrica     = true;
  } else {
    // Primera etapa: levanta de sucursal
    changes.nombreQuienLevanto = check.nombre;
    changes.dniRepartidor      = dni;
    changes.levantadoAt        = tsAhora;  // timestamp levantamiento
  }
  // OPTIMISTIC UPDATE
  S.requests = S.requests.map(x => x.id===d.id ? {...x,...changes} : x);
  S.modal    = null;
  const msg  = esSegundaEtapa
    ? `🚚 ${check.nombre} lleva la ${d.id} al destino final`
    : `🚚 ${check.nombre} tomó la ${d.id}`;
  toast(msg);
  sheetsUpdate(d.id, changes);
}

async function submitEntrega(){
  const d      = S.delivModal;
  const dni    = String(d.dni||"").replace(/\D/g,"");

  if(!dni){ S.delivModal.err="Ingresá tu DNI."; render(); return; }

  const check = validarDNI(dni);
  if(!check.ok){ S.delivModal.err=check.msg; render(); return; }

  S.delivModal.loading = true; renderNow();
  const changes = {
    estado:              "Entregada",
    deliveredAt:         now(),
    dniEntrega:          dni,             // DNI de quien entregó (distinto de quien levantó)
    nombreQuienEntrego:  check.nombre,    // nombre de quien entregó
    updatedAt:           now(),
  };
  // OPTIMISTIC UPDATE: mostrar cambio inmediatamente, Sheets en background
  S.requests = S.requests.map(x=>x.id===d.id?{...x,...changes}:x);
  S.modal    = null;
  toast(`Entrega confirmada — ${check.nombre} ✓`);
  sheetsUpdate(d.id, changes); // sin await
}

// ── VALIDAR DNI en modal ───────────────────────────────────
// Busca el DNI, muestra el nombre encontrado para que el usuario
// confirme que es correcto antes de ejecutar la acción.
async function submitDni(){
  const d = S.dniModal;
  // Guard: evitar doble ejecución
  if(d.loading) return;

  const val = String(d.val||"").replace(/\D/g,"");
  if(!val){ S.dniModal.err="Ingresá tu DNI."; render(); return; }

  const check = validarDNI(val);
  if(!check.ok){ S.dniModal.err=check.msg; render(); return; }

  // Guardar callback antes de que el render lo pueda pisar
  const cb = d.cb;

  // Mostrar nombre brevemente
  S.dniModal.loading  = true;
  S.dniModal.nombreOk = check.nombre;
  S.dniModal.cb       = null; // limpiar para evitar doble disparo
  render();

  await new Promise(r=>setTimeout(r,450));
  await cb(val, check.usuario);
  S.modal = null;
  render();
}

  ESTRUCTURA GOOGLE SHEETS — 4 HOJAS

  HOJA 1: "Solicitudes"

  id | createdAt | sucursal | area | solicitante | dniSolicitante |

  estado | comentario | recorrido | dniLogistica | dniRepartidor | nombreRepartidor |

  Roles posibles:

  Campo "activo": escribí "si" o "no" para habilitar/deshabilitar sin borrar

  HOJA 3: "Recorridos"
  Encabezados:

  Ejemplo de filas:
  SUR   | Zona sur de la ciudad
  NORTE | Zona norte
  CENTRO| Centro y microcentro
  
  Para agregar un recorrido nuevo: agregás una fila y se actualiza

  ══════════════════════════════════════════════════════ -->
