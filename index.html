      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px">
        <span style="font-size:15.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escH(f.label)}</span>
        <span style="flex-shrink:0;font-size:16px;font-weight:700;color:var(--text)">${fmtNum(f.valor)}${f.extra?` <span style="font-size:13px;font-weight:500;color:#a9b8d0">· ${f.extra}</span>`:""}${total?` <span style="font-size:13px;font-weight:700;color:${c}">${pctTxt(f.valor,total)}</span>`:""}</span>
      </div>
      <div style="height:16px;background:var(--s3);border-radius:8px;overflow:hidden">
        <div class="hbar-fill" style="height:100%;width:${w}%;background:${c};border-radius:8px"></div>
      </div>
    </div>`;
  }).join("")}</div>`;
}

// Línea de evolución con área, grilla y valores sobre cada punto.
// Interactiva: pasar el mouse por una columna marca ese día (línea
// vertical, punto resaltado y un cartel con la fecha y el valor); tocar
// dispara onClickFn(key) para bajar al detalle de ese día.
const _evReg = {};
const _evAncho = {};
// Mide el ancho real de cada gráfico de línea y, si cambió (primer dibujo,
// cambio de ventana, rotación del celular), lo vuelve a dibujar a la medida.
function ajustarAnchoGraficos(){
  let cambio=false;
  document.querySelectorAll("[data-evwrap]").forEach(w=>{
    const id=w.dataset.evwrap, ancho=Math.floor(w.clientWidth);
    if(ancho>200 && Math.abs((_evAncho[id]||0)-ancho)>8){ _evAncho[id]=ancho; cambio=true; }
  });
  if(cambio) render();
}
let _tResizeEv=null;
window.addEventListener("resize",()=>{ clearTimeout(_tResizeEv); _tResizeEv=setTimeout(ajustarAnchoGraficos,200); });
function diaLargo(key){
  const d=new Date(String(key)+"T12:00:00");
  if(isNaN(d)) return String(key);
  const dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  return `${dias[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
}
function graficoEvolucion(puntos, color, id, opts){
  opts=opts||{};
  if(!puntos.length) return `<p style="color:#a9b8d0;font-size:14px;text-align:center;padding:30px">Sin datos en este rango.</p>`;
  // El ancho se toma del contenedor real (se mide después de cada dibujo
  // y se ajusta solo): así el gráfico se estira hasta los bordes en
  // cualquier pantalla y el texto no se agranda ni se achica. Si hay
  // tantos puntos que no entran, se desplaza hacia el costado.
  const base = _evAncho[id] || Math.max(320, Math.min(window.innerWidth,1800)-98);
  const n=puntos.length, W=Math.max(base,n*52), H=Math.round(Math.min(Math.max(300,base*0.26),440)), pL=54, pR=28, pT=34, pB=50;
  const maxV=Math.max(...puntos.map(p=>p.valor),0.0001);
  const crudo=maxV/4, pot=Math.pow(10,Math.floor(Math.log10(crudo))), f=crudo/pot;
  const paso=(f<=1?1:f<=2?2:f<=5?5:10)*pot;
  const top=Math.ceil(maxV/paso)*paso||1;
  const X=i=> n===1 ? W/2 : pL+i*(W-pL-pR)/(n-1);
  const Y=v=> pT+(H-pT-pB)*(1-v/top);
  const Xs=puntos.map((_,i)=>X(i)), Ys=puntos.map(p=>Y(p.valor));
  _evReg[id]={puntos, X:Xs, Y:Ys, W, color, unidadTxt:opts.unidadTxt||"", onClickFn:opts.onClickFn||""};
  const selI = opts.sel ? puntos.findIndex(p=>p.key===opts.sel) : -1;
  let grid="";
  for(let t=0;t<=top+paso/2;t+=paso){
    grid += `<line x1="${pL}" x2="${W-pR}" y1="${Y(t)}" y2="${Y(t)}" stroke="#263348" stroke-width="1"/>
      <text x="${pL-10}" y="${Y(t)+5}" text-anchor="end" style="font-size:13px;fill:#a9b8d0">${fmtNum(Math.round(t*100)/100)}</text>`;
  }
  const linea=puntos.map((p,i)=>`${i?"L":"M"}${Xs[i]},${Ys[i]}`).join(" ");
  const area=`${linea} L${Xs[n-1]},${Y(0)} L${Xs[0]},${Y(0)} Z`;
  const pasoX=Math.ceil(n/12);
  const ejeX=puntos.map((p,i)=> i%pasoX===0 ? `<text x="${Xs[i]}" y="${H-18}" text-anchor="middle" style="font-size:13px;fill:#a9b8d0">${escH(p.label)}</text>`:"").join("");
  const dots=puntos.map((p,i)=>`<circle class="ev-dot" style="animation-delay:${Math.min(i*28,900)+250}ms" cx="${Xs[i]}" cy="${Ys[i]}" r="${i===selI?7:5}" fill="${color}" stroke="#111827" stroke-width="2"/>
    ${n<=18?`<text x="${Xs[i]}" y="${Ys[i]-(i===selI?15:12)}" text-anchor="middle" style="font-size:${i===selI?15:13.5}px;font-weight:700;fill:#e2e8f4">${fmtNum(Math.round(p.valor*10)/10)}</text>`:""}`).join("");
  const selMarca = selI>=0 ? `
    <line x1="${Xs[selI]}" x2="${Xs[selI]}" y1="${pT-8}" y2="${Y(0)}" stroke="${color}" stroke-width="2" stroke-dasharray="5 4" opacity=".9"/>
    <circle cx="${Xs[selI]}" cy="${Ys[selI]}" r="12" fill="none" stroke="${color}" stroke-width="2.5"/>` : "";
  const ancho = n===1 ? W-pL-pR : (W-pL-pR)/(n-1);
  const bandas=puntos.map((p,i)=>`<rect x="${Xs[i]-ancho/2}" y="${pT-10}" width="${ancho}" height="${H-pT-pB+10}" fill="transparent" style="cursor:pointer"
    onmouseenter="evResaltar('${id}',${i})" onmouseleave="evRestaurar('${id}')" onclick="evClick('${id}',${i})"/>`).join("");
  return `<div data-evwrap="${id}" style="overflow-x:auto"><svg id="ev-${id}" viewBox="0 0 ${W} ${H}" style="width:100%;${W>base?`min-width:${W}px;`:""}height:auto;display:block">
    <defs><linearGradient id="grad-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".38"/><stop offset="100%" stop-color="${color}" stop-opacity=".02"/></linearGradient></defs>
    ${grid}
    <path class="ev-area" d="${area}" fill="url(#grad-${id})"/>
    <path class="ev-line" pathLength="1" d="${linea}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${selMarca}${dots}${ejeX}
    <line class="ev-vl" x1="0" x2="0" y1="${pT-8}" y2="${Y(0)}" stroke="#e2e8f4" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55" style="visibility:hidden;pointer-events:none"/>
    <circle class="ev-ring" cx="0" cy="0" r="11" fill="none" stroke="#e2e8f4" stroke-width="2.5" style="visibility:hidden;pointer-events:none"/>
    <g class="ev-tip" style="visibility:hidden;pointer-events:none">
      <rect class="ev-tr" rx="9" ry="9" fill="#0b1120" stroke="${color}" stroke-width="1.5"/>
      <text class="ev-t1" style="font-size:14px;font-weight:700;fill:#e2e8f4"></text>
      <text class="ev-t2" style="font-size:16px;font-weight:800;fill:${color}"></text>
      <text class="ev-t3" style="font-size:12px;fill:#a9b8d0"></text>
    </g>
    ${bandas}
  </svg></div>`;
}
function evResaltar(id,i){
  const svg=document.getElementById("ev-"+id), reg=_evReg[id]; if(!svg||!reg) return;
  const p=reg.puntos[i], x=reg.X[i], y=reg.Y[i];
  const vl=svg.querySelector(".ev-vl"); vl.setAttribute("x1",x); vl.setAttribute("x2",x); vl.style.visibility="visible";
  const ring=svg.querySelector(".ev-ring"); ring.setAttribute("cx",x); ring.setAttribute("cy",y); ring.style.visibility="visible";
  const g=svg.querySelector(".ev-tip"), r=g.querySelector(".ev-tr");
  const t1=g.querySelector(".ev-t1"), t2=g.querySelector(".ev-t2"), t3=g.querySelector(".ev-t3");
  t1.textContent=diaLargo(p.key||p.label);
  t2.textContent=`${fmtNum(Math.round(p.valor*10)/10)} ${reg.unidadTxt}`.trim();
  t3.textContent=reg.onClickFn?"Tocá para ver el detalle":"";
  g.style.visibility="visible";
  const w=Math.max(t1.getComputedTextLength(),t2.getComputedTextLength(),t3.getComputedTextLength())+28, h=reg.onClickFn?70:52;
  let tx=x+16; if(tx+w>reg.W-4) tx=x-16-w; if(tx<4) tx=4;
  let ty=y-h-12; if(ty<4) ty=y+16;
  r.setAttribute("x",tx); r.setAttribute("y",ty); r.setAttribute("width",w); r.setAttribute("height",h);
  t1.setAttribute("x",tx+14); t1.setAttribute("y",ty+22);
  t2.setAttribute("x",tx+14); t2.setAttribute("y",ty+44);
  t3.setAttribute("x",tx+14); t3.setAttribute("y",ty+62);
}
function evRestaurar(id){
  const svg=document.getElementById("ev-"+id); if(!svg) return;
  svg.querySelector(".ev-vl").style.visibility="hidden";
  svg.querySelector(".ev-ring").style.visibility="hidden";
  svg.querySelector(".ev-tip").style.visibility="hidden";
}
function evClick(id,i){
  const reg=_evReg[id]; if(!reg||!reg.onClickFn) return;
  const fn=window[reg.onClickFn]; if(fn) fn(reg.puntos[i].key);
}

function renderMetricasCalidad(){ return renderMetricasDevoluciones(); }
function renderMetricasDevoluciones(){
  const desde=S.calidadDesde||"", hasta=S.calidadHasta||"";
  const q=(S.calidadProducto||"").trim();
  const metrica=S.calidadMetrica||"devs";
  // Calidad tiene una categoría fija (Fresco); el resto elige: todas o una.
  const catFija=categoriaDevolucionFija();
  const cat=catFija || S.devMetCategoria || "";
  const enCategoria=d=>!cat || (d.tipoDevolucion||"Fresco")===cat;
  let devs=S.devoluciones.filter(enCategoria);
  if(desde) devs=devs.filter(d=>d.createdAt && d.createdAt.slice(0,10)>=desde);
  if(hasta) devs=devs.filter(d=>d.createdAt && d.createdAt.slice(0,10)<=hasta);
  // Sucursales para el filtro: todas las que alguna vez devolvieron Fresco
  // (no solo las del rango, para que la lista no cambie al mover fechas)
  const sucursalesOpts=[...new Set(S.devoluciones.filter(enCategoria).map(d=>d.sucursal).filter(Boolean))].sort();
  const sucSel=S.calidadSucursal||"";
  if(sucSel) devs=devs.filter(d=>normNotif(d.sucursal)===normNotif(sucSel));

  let items=[];
  devs.forEach(d=>{
    productosDeDevolucion(d).forEach(p=>{
      items.push({...p, devId:d.id, sucursal:d.sucursal||"—", fecha:d.createdAt?d.createdAt.slice(0,10):"?"});
    });
  });
  const esKg=u=>normNotif(u||"")==="kg";

  // Productos que realmente se devolvieron (para el desplegable) —
  // con cuántas veces y cuántos kg, antes de aplicar el filtro de producto.
  const catalogo={};
  items.forEach(p=>{
    const k=p.descripcion; if(!k) return;
    const o=catalogo[k]=catalogo[k]||{veces:0,kg:0};
    o.veces++; if(esKg(p.unidad)) o.kg+=(+p.cantidad||0);
  });

  if(q){
    const nq=normNotif(q);
    items=items.filter(p=>normNotif(p.descripcion||"").includes(nq)||normNotif(p.codigoInterno||"").includes(nq));
    const ids=new Set(items.map(p=>p.devId));
    devs=devs.filter(d=>ids.has(d.id));
  }

  const totalKg=items.filter(p=>esKg(p.unidad)).reduce((a,p)=>a+(+p.cantidad||0),0);
  const totalUnid=items.filter(p=>!esKg(p.unidad)).reduce((a,p)=>a+(+p.cantidad||0),0);
  const motivoBase=p=>(p.motivo||"Sin motivo").split(" — ")[0]||"Sin motivo";

  const porDia={};
  if(metrica==="devs"){ devs.forEach(d=>{ const f=d.createdAt?d.createdAt.slice(0,10):null; if(f) porDia[f]=(porDia[f]||0)+1; }); }
  else items.forEach(p=>{
    if(p.fecha==="?") return;
    const suma = metrica==="kg" ? (esKg(p.unidad)?(+p.cantidad||0):0) : (!esKg(p.unidad)?(+p.cantidad||0):0);
    porDia[p.fecha]=(porDia[p.fecha]||0)+suma;
  });
  const dias=Object.keys(porDia).sort().slice(-45);
  const puntos=dias.map(f=>({key:f, label:`${f.slice(8,10)}/${f.slice(5,7)}`, valor:porDia[f]}));
  const colorMetrica = metrica==="devs"?"#2de0c4":metrica==="kg"?"#f5a623":"#4f9eff";
  const unidadMetrica = metrica==="devs"?"devoluciones por día":metrica==="kg"?"kg devueltos por día":"unidades devueltas por día";

  const porMotivo={};
  items.forEach(p=>{ const m=motivoBase(p); (porMotivo[m]=porMotivo[m]||{veces:0,kg:0}).veces++; if(esKg(p.unidad)) porMotivo[m].kg+=(+p.cantidad||0); });
  const datosMotivo=Object.entries(porMotivo).sort((a,b)=>b[1].veces-a[1].veces)
    .map(([m,v],i)=>({label:m, valor:v.veces, color:colorMotivoCalidad(m,i), extra:v.kg?`${fmtNum(v.kg)} kg`:""}));
  const motSel = S.calidadMotivoSel ? datosMotivo.find(d=>d.label===S.calidadMotivoSel) : null;

  const porSuc={};
  devs.forEach(d=>{ const s=d.sucursal||"—"; (porSuc[s]=porSuc[s]||{n:0,kg:0}).n++; });
  items.forEach(p=>{ if(esKg(p.unidad) && porSuc[p.sucursal]) porSuc[p.sucursal].kg+=(+p.cantidad||0); });
  const filasSuc=Object.entries(porSuc).sort((a,b)=>b[1].n-a[1].n).slice(0,15)
    .map(([s,v])=>({label:s, valor:v.n, extra:v.kg?`${fmtNum(v.kg)} kg`:""}));

  const attrFiltrar=nombre=>`onclick='calidadFiltrarProducto(${JSON.stringify(nombre).replace(/'/g,"&apos;")})'`;
  const porProd={};
  items.forEach(p=>{
    const k=p.descripcion||"Sin descripción";
    const o=porProd[k]=porProd[k]||{veces:0,kg:0,motivos:{}};
    o.veces++; if(esKg(p.unidad)) o.kg+=(+p.cantidad||0);
    const m=motivoBase(p); o.motivos[m]=(o.motivos[m]||0)+1;
  });
  const rankingProd=Object.entries(porProd).sort((a,b)=>b[1].veces-a[1].veces||b[1].kg-a[1].kg);
  const filasProd=rankingProd.slice(0,10).map(([nombre,v],i)=>{
    const motPrinc=Object.entries(v.motivos).sort((a,b)=>b[1]-a[1])[0];
    return {label:nombre, valor:v.veces, color:PALETA_CALIDAD[i%PALETA_CALIDAD.length],
      extra:`${v.kg?fmtNum(v.kg)+" kg · ":""}${motPrinc?escH(motPrinc[0]):""}`, onclickAttr:attrFiltrar(nombre)};
  });

  const detalle={};
  items.forEach(p=>{
    const m=motivoBase(p), k=p.sucursal+"|"+p.descripcion+"|"+m;
    if(!detalle[k]) detalle[k]={sucursal:p.sucursal,producto:p.descripcion,motivo:m,cantidad:0,unidad:p.unidad||"",veces:0};
    detalle[k].cantidad+=(+p.cantidad||0); detalle[k].veces++;
  });
  const detalleOrd=Object.values(detalle).sort((a,b)=>b.cantidad-a.cantidad);

  // ── Desplegable de productos (solo los que se devolvieron) ──
  const nq=normNotif(q);
  const sugerencias=Object.entries(catalogo)
    .filter(([k])=>!nq || normNotif(k).includes(nq))
    .sort((a,b)=>b[1].veces-a[1].veces).slice(0,10);
  const desplegable = (S.calidadProdAbierto && sugerencias.length) ? `
    <div class="card" style="position:absolute;left:0;right:0;top:74px;z-index:60;max-height:340px;overflow-y:auto;padding:6px;box-shadow:0 12px 32px #000a">
      <div style="padding:6px 10px 8px;font-size:12px;color:#a9b8d0;text-transform:uppercase;letter-spacing:.08em">${nq?"Coincidencias":"Más devueltos"}</div>
      ${sugerencias.map(([k,v])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer"
          onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background=''"
          onmousedown='calidadElegirProducto(${JSON.stringify(k).replace(/'/g,"&apos;")})'>
          <span style="font-size:15px;font-weight:600;color:var(--text)">${escH(k)}</span>
          <span style="font-size:13px;color:#a9b8d0;flex-shrink:0">${v.veces} ${v.veces===1?"vez":"veces"}${v.kg?` · ${fmtNum(v.kg)} kg`:""}</span>
        </div>`).join("")}
    </div>`:"";

  const hayFiltros = !!(desde||hasta||q||sucSel||(!catFija&&cat));
  const chip=(txt,extra="")=>`<span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#4f9eff22;border:1px solid #4f9eff66;font-size:14px;font-weight:600;color:var(--text)">${txt}${extra}</span>`;
  const barraSticky = `
  <div id="cal-sticky" style="${hayFiltros?"":"display:none;"}position:sticky;top:var(--nav-h,56px);z-index:45;margin:-4px 0 18px;padding:10px 14px;border-radius:12px;background:#111827f5;border:1px solid #4f9eff55;box-shadow:0 8px 22px #000b;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-size:13px;color:#a9b8d0">Analizando:</span>
    ${q?chip(`🔎 ${escH(q)}`,`<button style="background:none;border:0;color:var(--text);cursor:pointer;font-size:15px;line-height:1" onclick="S.calidadProducto='';render()">✕</button>`):chip("Todos los productos")}
    ${(desde||hasta)?chip(`📅 ${desde?fechaCortaISO(desde):"…"} → ${hasta?fechaCortaISO(hasta):"hoy"}`):""}
    ${(!catFija&&cat)?chip(`🏷️ ${cat}`,`<button style="background:none;border:0;color:var(--text);cursor:pointer;font-size:15px;line-height:1" onclick="S.devMetCategoria='';S.calidadMotivoSel='';render()">✕</button>`):""}
    ${sucSel?chip(`🏪 ${escH(sucSel)}`,`<button style="background:none;border:0;color:var(--text);cursor:pointer;font-size:15px;line-height:1" onclick="S.calidadSucursal='';render()">✕</button>`):""}
    <span style="margin-left:auto;font-size:13px;color:#a9b8d0">${devs.length} devolución${devs.length!==1?"es":""} · ${items.length} línea${items.length!==1?"s":""}</span>
    <button class="btn btn-ghost btn-sm" onclick="S.calidadDesde='';S.calidadHasta='';S.calidadProducto='';S.calidadSucursal='';S.devMetCategoria='';S.calidadMotivoSel='';S.calidadDiaSel='';render()">✕ Limpiar</button>
  </div>`;

  const topProd=rankingProd[0], topMotivo=datosMotivo[0];
  const cardStyle="padding:24px;margin-bottom:20px";
  const pill=(val,txt)=>`<button class="btn ${metrica===val?"btn-primary":"btn-ghost"} btn-sm" onclick="S.calidadMetrica='${val}';render()">${txt}</button>`;

  // ── Detalle del día elegido en el gráfico de evolución ──
  const diaSel = (S.calidadDiaSel && dias.includes(S.calidadDiaSel)) ? S.calidadDiaSel : "";
  let detalleDia="";
  if(diaSel){
    const itsD=items.filter(p=>p.fecha===diaSel);
    const devsD=devs.filter(d=>d.createdAt && d.createdAt.slice(0,10)===diaSel);
    const kgD=itsD.filter(p=>esKg(p.unidad)).reduce((a,p)=>a+(+p.cantidad||0),0);
    const unD=itsD.filter(p=>!esKg(p.unidad)).reduce((a,p)=>a+(+p.cantidad||0),0);
    const agr=fn=>{ const m={}; itsD.forEach(p=>{ const k=fn(p)||"—"; const o=m[k]=m[k]||{n:0,kg:0}; o.n++; if(esKg(p.unidad)) o.kg+=(+p.cantidad||0); }); return Object.entries(m).sort((a,b)=>b[1].n-a[1].n||b[1].kg-a[1].kg); };
    const fMot=agr(motivoBase).map(([k,v],i)=>({label:k,valor:v.n,color:colorMotivoCalidad(k,i),extra:v.kg?`${fmtNum(v.kg)} kg`:""}));
    const fProd=agr(p=>p.descripcion).slice(0,10).map(([k,v])=>({label:k,valor:v.n,extra:v.kg?`${fmtNum(v.kg)} kg`:"",onclickAttr:attrFiltrar(k)}));
    const fSuc=agr(p=>p.sucursal).slice(0,10).map(([k,v])=>({label:k,valor:v.n,extra:v.kg?`${fmtNum(v.kg)} kg`:""}));
    detalleDia=`
    <div id="calidad-detalle-dia" class="card" style="${cardStyle};border-left:5px solid ${colorMetrica};scroll-margin-top:130px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        ${tituloGrafico(escH(diaLargo(diaSel)), `${devsD.length} devolución${devsD.length!==1?"es":""} · ${itsD.length} producto${itsD.length!==1?"s":""}${kgD?` · ${fmtNum(Math.round(kgD*10)/10)} kg`:""}${unD?` · ${fmtNum(Math.round(unD))} unidades`:""}${q?` · solo "${escH(q)}"`:""}`)}
        <button class="btn btn-ghost btn-sm" onclick="calidadSeleccionarDia('${diaSel}')">✕ Cerrar</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;margin-bottom:24px">
        <div><div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px">Motivos</div>${barrasHorizontales(fMot,null,itsD.length)}</div>
        <div><div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px">Productos</div>${barrasHorizontales(fProd,colorMetrica,itsD.length)}</div>
        <div><div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px">Sucursales</div>${barrasHorizontales(fSuc,"#4f9eff",itsD.length)}</div>
      </div>
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:10px">Todo lo devuelto ese día</div>
      <div class="table-wrap"><table style="font-size:15px">
        <thead><tr><th style="font-size:13px;color:#a9b8d0">Sucursal</th><th style="font-size:13px;color:#a9b8d0">Producto</th><th style="font-size:13px;color:#a9b8d0">Cantidad</th><th style="font-size:13px;color:#a9b8d0">Motivo</th></tr></thead>
        <tbody>${itsD.slice(0,60).map(p=>`<tr>
          <td style="font-weight:600">${escH(p.sucursal)}</td><td>${escH(p.descripcion||"")}</td>
          <td class="mono" style="font-weight:700">${fmtNum(+p.cantidad||0)} ${escH(p.unidad||"")}</td>
          <td><span style="color:${colorMotivoCalidad(motivoBase(p),0)};font-weight:700">${escH(motivoBase(p))}</span></td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  }

  // ── Detalle de la porción elegida en la dona ──
  let detalleMotivo="";
  if(motSel){
    const its=items.filter(p=>motivoBase(p)===motSel.label);
    const pp={}, ss={};
    its.forEach(p=>{
      const k=p.descripcion||"Sin descripción"; const o=pp[k]=pp[k]||{n:0,kg:0}; o.n++; if(esKg(p.unidad)) o.kg+=(+p.cantidad||0);
      const s=p.sucursal; const o2=ss[s]=ss[s]||{n:0,kg:0}; o2.n++; if(esKg(p.unidad)) o2.kg+=(+p.cantidad||0);
    });
    const filasP=Object.entries(pp).sort((a,b)=>b[1].n-a[1].n||b[1].kg-a[1].kg).slice(0,10)
      .map(([k,v])=>({label:k,valor:v.n,extra:v.kg?`${fmtNum(v.kg)} kg`:"",onclickAttr:attrFiltrar(k)}));
    const filasS=Object.entries(ss).sort((a,b)=>b[1].n-a[1].n).slice(0,10)
      .map(([k,v])=>({label:k,valor:v.n,extra:v.kg?`${fmtNum(v.kg)} kg`:""}));
    detalleMotivo=`
    <div id="calidad-detalle-motivo" class="card" style="${cardStyle};border-left:5px solid ${motSel.color};scroll-margin-top:130px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        ${tituloGrafico(`${pctTxt(motSel.valor,items.length)} de "${escH(motSel.label)}"`, `${motSel.valor} producto${motSel.valor!==1?"s":""} devuelto${motSel.valor!==1?"s":""} por este motivo${q?` · solo "${escH(q)}"`:""}`)}
        <button class="btn btn-ghost btn-sm" onclick="calidadSeleccionarMotivo('${escH(motSel.label).replace(/'/g,"&#39;")}')">✕ Cerrar</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px">
        <div>
          <div style="font-size:15px;font-weight:700;color:${motSel.color};margin-bottom:12px">Productos</div>
          ${barrasHorizontales(filasP,motSel.color,its.length)}
        </div>
        <div>
          <div style="font-size:15px;font-weight:700;color:${motSel.color};margin-bottom:12px">Sucursales</div>
          ${barrasHorizontales(filasS,motSel.color,its.length)}
        </div>
      </div>
    </div>`;
  }

  const COLOR_CAT={Fresco:"var(--teal)",Secos:"var(--amber)",Congelado:"var(--blue)"};
  return `
  <div id="cal-filtros" class="card" style="${cardStyle};margin-bottom:16px">
    ${!catFija?`
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
      <span style="font-size:13px;font-weight:700;color:#a9b8d0;text-transform:uppercase;letter-spacing:.07em;margin-right:6px">Categoría</span>
      ${["","Fresco","Secos","Congelado"].map(k=>`<button class="btn ${cat===k?"btn-primary":"btn-ghost"} btn-sm" ${cat===k&&k?`style="border-color:${COLOR_CAT[k]}"`:""} onclick="S.devMetCategoria='${k}';S.calidadMotivoSel='';S.calidadProducto='';S.calidadSucursal='';S.calidadDiaSel='';render()">${k||"Todas"}</button>`).join("")}
    </div>`:""}
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div class="field" style="margin-bottom:0">
        <label>Desde</label>
        <input type="date" class="inp" value="${escH(desde)}" onchange="S.calidadDesde=this.value;render()"/>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Hasta</label>
        <input type="date" class="inp" value="${escH(hasta)}" onchange="S.calidadHasta=this.value;render()"/>
      </div>
      <div class="field" style="margin-bottom:0;min-width:170px">
        <label>Sucursal</label>
        <select onchange="S.calidadSucursal=this.value;render()">
          <option value="">Todas</option>
          ${sucursalesOpts.map(s=>`<option ${sucSel===s?"selected":""}>${escH(s)}</option>`).join("")}
        </select>
      </div>
      <div class="field" style="margin-bottom:0;flex:1;min-width:240px;position:relative">
        <label>Producto</label>
        <input id="calidad-prod-input" class="inp" type="text" autocomplete="off" placeholder="🔎 Buscá un producto devuelto o su código..." value="${escH(S.calidadProducto||"")}"
          oninput="S.calidadProducto=this.value;S.calidadProdAbierto=true;render()"
          onfocus="if(!S.calidadProdAbierto){S.calidadProdAbierto=true;render()}"
          onblur="setTimeout(()=>{ if(S.calidadProdAbierto){S.calidadProdAbierto=false;render()} },180)"/>
        ${desplegable}
      </div>
    </div>
  </div>

  ${barraSticky}

  <div id="cal-dest-slot">${(topProd||topMotivo)?`
  <div id="cal-dest" class="card" style="padding:12px 18px;margin-bottom:16px;border-left:4px solid var(--amber);display:flex;align-items:baseline;gap:10px 16px;flex-wrap:wrap">
    <span style="font-size:13px;font-weight:700;color:#a9b8d0;text-transform:uppercase;letter-spacing:.07em">🔎 Destacado</span>
    <span style="font-size:16px;line-height:1.45;color:var(--text)">
      ${topProd&&!q?`Lo que más se devuelve: <strong style="color:var(--amber)">${escH(topProd[0])}</strong> (${topProd[1].veces} ${topProd[1].veces===1?"vez":"veces"}${topProd[1].kg?`, ${fmtNum(topProd[1].kg)} kg`:""}). `:""}
      ${topMotivo?`Motivo principal: <strong style="color:${topMotivo.color}">${escH(topMotivo.label)}</strong> (${pctTxt(topMotivo.valor,items.length)}).`:""}
    </span>
  </div>`:""}</div>

  <div id="cal-evo" class="card" style="${cardStyle}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      ${tituloGrafico("Evolución en el tiempo", unidadMetrica)}
      <div style="display:flex;gap:6px;flex-wrap:wrap">${pill("devs","Devoluciones")}${pill("kg","Kg")}${pill("unid","Unidades")}</div>
    </div>
    ${graficoEvolucion(puntos,colorMetrica,"calidad",{sel:diaSel,onClickFn:"calidadSeleccionarDia",unidadTxt:metrica==="devs"?"devoluciones":metrica==="kg"?"kg":"unidades"})}
    ${!diaSel?`<p style="font-size:13px;color:#a9b8d0;margin-top:10px">Pasá el mouse por un día para ver su valor, y tocalo para ver qué se devolvió ese día.</p>`:""}
  </div>

  <div id="cal-slot-dia">${detalleDia}</div>

  <div id="cal-motivo" class="card" style="${cardStyle}">
    ${tituloGrafico("¿Por qué se devuelve?", q?`Motivos de "${escH(q)}" · tocá una porción para ver de dónde sale`:"Reparto por motivo · tocá una porción para ver qué productos y sucursales lo explican")}
    ${datosMotivo.length?`
    <div style="display:flex;gap:32px;align-items:center;flex-wrap:wrap;justify-content:center">
      ${donutPorcentajes("motivo",datosMotivo,280,"productos devueltos",motSel?motSel.label:"","calidadSeleccionarMotivo")}
      ${leyendaPorcentajes("motivo",datosMotivo,motSel?motSel.label:"")}
    </div>`:`<p style="color:#a9b8d0;font-size:14px;text-align:center;padding:20px">Sin datos.</p>`}
  </div>

  <div id="cal-slot-motivo">${detalleMotivo}</div>

  <div id="cal-prod" class="card" style="${cardStyle}">
    ${tituloGrafico("Productos más devueltos", "Tocá un producto para ver solo ese: sus motivos y las sucursales que lo devuelven")}
    ${barrasHorizontales(filasProd,null,items.length)}
  </div>

  <div id="cal-suc" class="card" style="${cardStyle}">
    ${tituloGrafico("Devoluciones por sucursal", q?`Sucursales que devuelven "${escH(q)}"`:"Cantidad de devoluciones y kg por sucursal")}
    ${barrasHorizontales(filasSuc,"#4f9eff",devs.length)}
  </div>

  <div id="cal-detalle" class="card" style="${cardStyle}">
    ${tituloGrafico("Detalle: sucursal · producto · motivo", "Para detectar desviaciones puntuales — ordenado por cantidad devuelta")}
    ${!detalleOrd.length?`<p style="color:#a9b8d0;font-size:14px;text-align:center;padding:20px">Sin datos en este rango.</p>`:`
    <div class="table-wrap"><table style="font-size:15px">
      <thead><tr><th style="font-size:13px;color:#a9b8d0">Sucursal</th><th style="font-size:13px;color:#a9b8d0">Producto</th><th style="font-size:13px;color:#a9b8d0">Motivo</th><th style="font-size:13px;color:#a9b8d0">Cantidad</th><th style="font-size:13px;color:#a9b8d0">Veces</th></tr></thead>
      <tbody>
        ${detalleOrd.slice(0,100).map(r=>`<tr>
          <td style="font-weight:600">${escH(r.sucursal)}</td>
          <td>${escH(r.producto)}</td>
          <td><span style="color:${colorMotivoCalidad(r.motivo,0)};font-weight:700">${escH(r.motivo)}</span></td>
          <td class="mono" style="font-weight:700">${fmtNum(Math.round(r.cantidad*10)/10)} ${escH(r.unidad)}</td>
          <td class="mono">${r.veces}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
    ${detalleOrd.length>100?`<p style="font-size:13px;color:#a9b8d0;margin-top:10px">Mostrando los 100 cruces más relevantes de ${detalleOrd.length}.</p>`:""}`}
  </div>

  <div id="cal-kpis" class="stats-grid" style="margin-bottom:20px">
    ${statCard("📦","DEVOLUCIONES", devs.length, "var(--teal)")}
    ${statCard("⚖️","TOTAL KG", fmtNum(Math.round(totalKg*10)/10), "var(--amber)")}
    ${statCard("🔢","TOTAL UNIDADES", fmtNum(Math.round(totalUnid)), "var(--blue)")}
    ${statCard("🏪","SUCURSALES", Object.keys(porSuc).length, "var(--purple)")}
  </div>`;
}

function renderTesoreria(){
  const u = S.user;
  if(!bolsinesActivo()){
    return `
    <div style="animation:fadeUp .3s ease;text-align:center;padding:60px 20px">
      <h2 style="font-size:20px;font-weight:700;margin-bottom:8px">🎒 Bolsines</h2>
      <p style="color:var(--muted);font-size:14px">El módulo de Bolsines está desactivado por Administración por el momento.</p>
    </div>`;
  }
  const pedidosBolsin = S.requests.filter(r=>r.tipoPedido==="bolsin" && !r.loteId && r.destino!=="Tesorería");
  const pendientes    = pedidosBolsin.filter(r=>r.estado==="Pendiente Tesorería");
  const aprobadosParaListo = pedidosBolsin.filter(r=>r.estado==="Aprobada");
  const historialPedidos = pedidosBolsin.filter(r=>!["Pendiente Tesorería","Aprobada"].includes(r.estado))
    .sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  // Bolsines que las sucursales mandan HACIA Tesorería (con plata)
  let bolsinesEnviados = S.requests.filter(r=>r.tipoPedido==="bolsin" && r.destino==="Tesorería")
    .sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const sucursalesTesUnicas = [...new Set(bolsinesEnviados.map(r=>r.sucursal).filter(Boolean))].sort();
  if(S.fTesFecha)    bolsinesEnviados = bolsinesEnviados.filter(r=>r.createdAt && r.createdAt.slice(0,10)===S.fTesFecha);
  if(S.fTesSucursal) bolsinesEnviados = bolsinesEnviados.filter(r=>(r.sucursal||"").toLowerCase().includes(S.fTesSucursal.trim().toLowerCase()));
  if(S.fTesTexto){
    const q = S.fTesTexto.trim().toLowerCase();
    bolsinesEnviados = bolsinesEnviados.filter(r=>[r.id,r.sucursal,r.descripcion,r.observaciones].map(v=>(v||"").toString().toLowerCase()).some(v=>v.includes(q)));
  }

  // Agrupar por loteId (solo lo que tiene tipoPedido="bolsin" y loteId)
  const lotesMap = {};
  S.requests.forEach(r=>{
    if(r.tipoPedido!=="bolsin" || !r.loteId) return;
    if(!lotesMap[r.loteId]) lotesMap[r.loteId] = [];
    lotesMap[r.loteId].push(r);
  });
  const lotes = Object.entries(lotesMap)
    .map(([loteId,filas])=>({
      loteId, filas,
      total: filas.length,
      entregadas: filas.filter(f=>f.estado==="Entregada"||f.estado==="Entregada (sin confirmar)").length,
      pendientesListo: filas.filter(f=>f.estado==="Aprobada").length,
    }))
    .sort((a,b)=> b.loteId.localeCompare(a.loteId));

  return `
  <div style="animation:fadeUp .3s ease">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <div class="page-title">Tesorería</div>
        <div class="page-sub">Bolsines a sucursales</div>
      </div>
      <div class="actions-bar">
        <button class="btn btn-success btn-md" onclick="openNuevoLote()">📦 Nuevo lote de bolsines</button>
        ${accesosRapidosHtml()}
      </div>
    </div>

    ${S.miIdentidadTesoreria?`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:12px;color:var(--muted)">
      👤 Confirmás recepciones como <strong style="color:var(--text)">${escH(S.miIdentidadTesoreria.nombre)}</strong>
      <button class="btn btn-ghost btn-sm" onclick="cambiarIdentidadTesoreria()">Cambiar</button>
    </div>`:`
    <div class="card" style="margin-bottom:16px;padding:12px 16px;border-left:3px solid var(--amber);font-size:13px">
      👤 Todavía no te identificaste en este dispositivo — la primera vez que confirmes una recepción te va a pedir el DNI, y no te lo vuelve a pedir después (salvo para crear un lote nuevo).
    </div>`}

    <div class="stats-grid">
      ${statCard("🎒","PEDIDOS PENDIENTES",pendientes.length,"var(--amber)")}
      ${statCard("✅","PARA MARCAR LISTOS",aprobadosParaListo.length,"var(--teal)")}
      ${statCard("📦","LOTES ACTIVOS",lotes.filter(l=>l.entregadas<l.total).length,"var(--blue)")}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">🎒 Pedidos de sucursales para aprobar</h3>
      ${pendientes.length===0?`<p style="color:var(--muted);font-size:13px">No hay pedidos pendientes.</p>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal</th><th>Cant.</th><th>Motivo</th><th>Pedido por</th><th></th></tr></thead>
          <tbody>
            ${pendientes.map(r=>`
            <tr>
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.destino)}</td>
              <td>${escH(String(r.cantidad))}</td>
              <td class="trunc">${escH(r.observaciones||"—")}</td>
              <td class="muted-cell">${escH(r.solicitante||"—")}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-success btn-sm" onclick="openPedidoTesoreria('${escH(r.id)}','aprobar')">✅ Aprobar</button>
                <button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="openPedidoTesoreria('${escH(r.id)}','rechazar')">✕ Rechazar</button>
              </td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">✅ Aprobados por logística — marcar como listos</h3>
      ${aprobadosParaListo.length===0?`<p style="color:var(--muted);font-size:13px">No hay pedidos esperando que los prepares.</p>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal</th><th>Cant.</th><th></th></tr></thead>
          <tbody>
            ${aprobadosParaListo.map(r=>`
            <tr>
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.destino)}</td>
              <td>${escH(String(r.cantidad))}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-success btn-sm" onclick="openListo('${escH(r.id)}')">✅ Lista</button>
              </td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">📥 Bolsines recibidos de sucursales</h3>
      ${(()=>{
        const enBuzon = S.requests.filter(r=>r.tipoPedido==="bolsin" && r.destino==="Tesorería" && r.estado==="En el buzón");
        const totalEnBuzon = enBuzon.reduce((s,r)=>s+(+r.cantidad||0),0);
        if(!enBuzon.length) return "";
        return `<div style="display:flex;align-items:center;gap:10px;background:#f5a62318;border-left:3px solid var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px">
          📫 <strong>${totalEnBuzon} bolsines</strong> esperando en el buzón (${enBuzon.length} solicitud${enBuzon.length!==1?"es":""}) — tocá "✅ Confirmar retiro" en cada una cuando los retires.
        </div>`;
      })()}
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <input type="date" class="inp" style="width:160px" value="${escH(S.fTesFecha)}" onchange="S.fTesFecha=this.value;render()"/>
        <input type="text" list="tes-sucursales" class="inp" style="width:200px" placeholder="Sucursal..." value="${escH(S.fTesSucursal)}" oninput="S.fTesSucursal=this.value;render()"/>
        <datalist id="tes-sucursales">${sucursalesTesUnicas.map(s=>`<option value="${escH(s)}">`).join("")}</datalist>
        <input type="text" class="inp" style="width:220px" placeholder="🔎 Buscar N°, descripción..." value="${escH(S.fTesTexto)}" oninput="S.fTesTexto=this.value;render()"/>
        ${(S.fTesFecha||S.fTesSucursal||S.fTesTexto)?`<button class="btn btn-ghost btn-sm" onclick="S.fTesFecha='';S.fTesSucursal='';S.fTesTexto='';render()">✕ Limpiar</button>`:""}
      </div>
      ${bolsinesEnviados.length===0?`<p style="color:var(--muted);font-size:13px">${(S.fTesFecha||S.fTesSucursal||S.fTesTexto)?"No hay bolsines con ese filtro.":"Todavía no llegó ningún bolsín."}</p>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal</th><th>Detalle</th><th>Enviado</th><th>Recibido en Tesorería</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            ${bolsinesEnviados.map(r=>`
            <tr onclick="openDetalle('${escH(r.id)}')" style="cursor:pointer">
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.sucursal)}</td>
              <td><div class="trunc">${escH(r.descripcion)}</div></td>
              <td class="muted-cell">${fdt(r.createdAt)}</td>
              <td class="muted-cell">${r.deliveredAt?fdt(r.deliveredAt):"—"}</td>
              <td>${estadoBadges(r)}</td>
              <td onclick="event.stopPropagation()">
                <button class="btn btn-ghost btn-sm" onclick="openDetalle('${escH(r.id)}')">Ver</button>
                ${["Entregada (sin confirmar)","En el buzón"].includes(r.estado)?`<button class="btn btn-success btn-sm" style="margin-left:4px" onclick="openConfirmarCerrado('${escH(r.id)}')">✅ Confirmar retiro</button>`:""}
              </td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">📦 Lotes de bolsines</h3>
      ${lotes.length===0?`<p style="color:var(--muted);font-size:13px">Todavía no creaste ningún lote.</p>`:`
      <div style="display:flex;flex-direction:column;gap:10px">
        ${lotes.map(l=>`
          <div style="background:var(--s2);border-radius:8px;padding:12px 14px">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
              <div style="cursor:pointer" onclick="toggleLoteExpandido('${escH(l.loteId)}')">
                <strong>${S.loteExpandido===l.loteId?"▾":"▸"} ${escH(l.loteId)}</strong>
                <span style="color:var(--muted);font-size:13px"> · ${l.total} sucursales · ${l.entregadas}/${l.total} entregadas</span>
              </div>
              ${l.pendientesListo>0?`
              <button class="btn btn-success btn-sm" onclick="openLoteListo('${escH(l.loteId)}')">
                ✅ Marcar ${l.pendientesListo} como Listas
              </button>`:`<span style="font-size:12px;color:var(--muted)">Ya están todas listas o en camino</span>`}
            </div>
            ${S.loteExpandido===l.loteId?`
            <div class="table-wrap" style="margin-top:10px">
              <table>
                <thead><tr><th>Sucursal</th><th>Cant.</th><th>Estado</th><th>Recorrido</th><th>Quién lo levantó</th><th>Quién lo entregó / recibió</th><th></th></tr></thead>
                <tbody>
                  ${l.filas.sort((a,b)=>(a.destino||"").localeCompare(b.destino||"")).map(f=>`
                  <tr onclick="openDetalle('${escH(f.id)}')" style="cursor:pointer">
                    <td>${escH(f.destino)}</td>
                    <td>${escH(String(f.cantidad))}</td>
                    <td>${badge(f.estado,S_COLOR[f.estado]||"var(--muted)")}</td>
                    <td class="muted-cell">${escH(f.recorrido||"—")}</td>
                    <td class="muted-cell">${escH(f.nombreQuienLevanto||"—")}</td>
                    <td class="muted-cell">${escH(f.nombreQuienRecibio||f.nombreQuienEntrego||"—")}</td>
                    <td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" onclick="openDetalle('${escH(f.id)}')">Ver</button></td>
                  </tr>`).join("")}
                </tbody>
              </table>
            </div>`:""}
          </div>`).join("")}
      </div>`}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">🗂️ Historial de pedidos de excepción</h3>
      ${historialPedidos.length===0?`<p style="color:var(--muted);font-size:13px">Todavía no hay pedidos resueltos.</p>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal</th><th>Cant.</th><th>Estado</th><th>Pedido por</th><th></th></tr></thead>
          <tbody>
            ${historialPedidos.slice(0,30).map(r=>`
            <tr onclick="openDetalle('${escH(r.id)}')" style="cursor:pointer">
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.destino)}</td>
              <td>${escH(String(r.cantidad))}</td>
              <td>${badge(r.estado,S_COLOR[r.estado]||"var(--muted)")}</td>
              <td class="muted-cell">${escH(r.solicitante||"—")}</td>
              <td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" onclick="openDetalle('${escH(r.id)}')">Ver</button></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>
  </div>`;
}

function renderAdminConfig(){
  const activo = bolsinesActivo();
  return `

// Llama a /api/crear-usuario-auth y devuelve {ok, error}. Si la respuesta
// no es JSON válido (por ejemplo, si Vercel devolvió su propia página de
// error en vez de la respuesta de la función), no revienta con un
// mensaje críptico — informa qué pasó realmente.
async function llamarCrearUsuarioAuth(payload){
  let resp;
  try{
    resp = await fetch("/api/crear-usuario-auth", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload),
    });
  }catch(e){
    return {ok:false, error:"No se pudo conectar con el servidor ("+e.message+")"};
  }
  const texto = await resp.text();
  let j;
  try{ j = JSON.parse(texto); }
  catch(e){ return {ok:false, error: resp.ok ? "Respuesta inesperada del servidor" : `Error del servidor (status ${resp.status})`}; }
  if(!resp.ok || j.error) return {ok:false, error: j.error||"error desconocido"};
  return {ok:true};
}

async function guardarUsuario(){
  const f = S.usuarioForm;
  const usuario = ($("uf-usuario")?.value||f.usuario||"").trim();
  const tipo = ($("uf-tipo")?.value||f.tipo||"").trim();
  const dni = ($("uf-dni")?.value||f.dni||"").trim();
  if(!usuario){ S.usuarioForm.err="El usuario (login) es obligatorio."; render(); return; }
  if(!tipo){ S.usuarioForm.err="Elegí un tipo."; render(); return; }
  if(!dni){ S.usuarioForm.err="El DNI es obligatorio — es lo que identifica a cada persona (varias pueden compartir el mismo login)."; render(); return; }
  // El DNI es la clave real — si es alta nueva, que no choque con otra persona
  if(!f.dniOriginal && S.usuarios.some(u=>u.dni===dni)){
    S.usuarioForm.err="Ya existe una persona cargada con ese DNI."; render(); return;
  }

  const datos = {
    usuario,
    password: $("uf-password")?.value||f.password||"",
    tipo,
    nombre: $("uf-nombre")?.value||f.nombre||"",
    area: $("uf-area")?.value||f.area||"",
    recorrido: $("uf-recorrido")?.value||f.recorrido||"",
    dni: $("uf-dni")?.value||f.dni||"",
    email: $("uf-email")?.value||f.email||"",
    activo: $("uf-activo")?.value||f.activo||"si",
  };

  S.usuarioForm.loading = true; renderNow();
  try{
    if(f.dniOriginal){
      const { error } = await sb.from("usuarios").update(datos).eq("dni", f.dniOriginal);
      if(error) throw error;
      S.usuarios = S.usuarios.map(u=>u.dni===f.dniOriginal?datos:u);
      toast(`✅ Usuario ${usuario} actualizado`);
      // Si se escribió una contraseña nueva, sincronizarla también en
      // Auth — si no, la tabla queda con la nueva pero Auth sigue
      // aceptando la vieja, y la persona se queda afuera.
      if(datos.password && datos.password.trim()){
        const r = await llamarCrearUsuarioAuth({usuario, tipo, dni: datos.dni, password: datos.password});
        if(r.ok) toast(`✅ Contraseña de ${usuario} actualizada — ya puede entrar con la nueva`);
        else toast(`⚠️ Se guardó pero la contraseña no se sincronizó sola (${r.error}). Avisá al administrador técnico.`, "warn");
      }
    } else {
      const { error } = await sb.from("usuarios").insert(datos);
      if(error) throw error;
      S.usuarios = [datos, ...S.usuarios];
      toast(`✅ Usuario ${usuario} creado — activando su acceso...`);
      // Crear la cuenta de Auth automáticamente, sin que Admin tenga
      // que correr ningún script a mano.
      const r = await llamarCrearUsuarioAuth({usuario, tipo, dni: datos.dni, password: datos.password});
      if(r.ok) toast(`✅ ${usuario} ya puede entrar a la app`);
      else toast(`⚠️ El usuario se creó pero su acceso no se activó solo (${r.error}). Avisá al administrador técnico.`, "warn");
    }
    S.modal = null;
  }catch(e){
    S.usuarioForm.loading = false;
    S.usuarioForm.err = "No se pudo guardar — probá de nuevo.";
  }
  render();
}

// Quejas y Devoluciones viven junto a los demás botones de acción de cada
// pantalla (misma forma, misma fila) en vez de en la barra de arriba.
function accesosRapidosHtml(){
  const u=S.user; if(!u) return "";
  if(u.rol==="repartidor") return ""; // el repartidor no maneja quejas ni devoluciones desde acá
  const ag=areaGestionadaPorUsuario();
  const nq=ag?S.quejas.filter(q=>q.estado==="Pendiente"&&q.areaDestino===ag).length:0;
  // Pendientes + lo que está esperando una decisión mía (evaluar sobrestock / controlar Secos en fábrica)
  const nd=esGestorDevolucion()?S.devoluciones.filter(d=>d.estado==="Pendiente"
      || (d.estado==="En evaluación" && puedeEvaluarSecos())
      || (["En camino","En fábrica"].includes(d.estado) && d.tipoDevolucion==="Secos" && puedeControlarSecos())
      || esSecosParaClasificar(d)).length:0;
  // En Logística, Quejas va en la barra de arriba, junto a las notificaciones
  const botonQuejas = u.rol==="logistica" ? "" :
    `<button class="btn ${S.vista==="quejas"?"btn-primary":"btn-purple"} btn-md" onclick="abrirQuejas()">💬 Quejas${nq>0?`<span class="nbadge">${nq}</span>`:""}</button>`;
  return botonQuejas
    + (puedeVerDevoluciones() && u.rol!=="repartidor"
        ? `<button class="btn ${S.vista==="devoluciones"?"btn-primary":"btn-purple"} btn-md" onclick="abrirDevoluciones()">📦 Devoluciones${nd>0?`<span class="nbadge">${nd}</span>`:""}</button>`
        : "");
}

// Indicador deslizante de las pestañas: una "píldora" que viaja de una
// pestaña a otra. Se mide después de cada render y se anima con CSS.
function actualizarIndicadoresTabs(){
  document.querySelectorAll(".tabs").forEach(t=>{
    const a=t.querySelector(".tab.active");
    if(!a){ t.removeAttribute("data-ind"); return; }
    const primera = !t.hasAttribute("data-ind");
    if(primera) t.style.setProperty("--ind-dur","0s");
    t.style.setProperty("--ind-x",a.offsetLeft+"px");
    t.style.setProperty("--ind-y",a.offsetTop+"px");
    t.style.setProperty("--ind-w",a.offsetWidth+"px");
    t.style.setProperty("--ind-h",a.offsetHeight+"px");
    if(primera){ t.setAttribute("data-ind","1"); void t.offsetWidth; t.style.removeProperty("--ind-dur"); }
  });
}
window.addEventListener("resize", ()=>actualizarIndicadoresTabs());
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>actualizarIndicadoresTabs());

function renderSucursalArea(opts){
  opts=opts||{};
  const u=S.user;
  // Incluir solicitudes donde la sucursal es ORIGEN o DESTINO
  // La sucursal que recibe también puede ver el estado de lo que le viene
  // normNotif ignora mayúsculas Y tildes — así "DEPOSITO" (como quedó
  // el usuario/login) matchea con "Depósito" (como está guardado en las
  // solicitudes). Antes se comparaba solo en minúsculas, sin sacar
  // tildes, y por eso a los usuarios sin tilde en su login se les
  // escapaban las solicitudes de destinos con tilde.
  const norm  = s => normNotif(s);
  const areaU = norm(u.area);

  // Construir lista de todos los nombres posibles de esta área/sucursal
  // (el nombre puede estar escrito de formas ligeramente distintas)
  const todosLosMios = new Set([areaU]);
  // Agregar variantes desde la lista maestra de sucursales
  getSucursales().forEach(s=>{ if(norm(s)===areaU) todosLosMios.add(norm(s)); });
  getDestinos().forEach(d=>{ if(norm(d)===areaU) todosLosMios.add(norm(d)); });

  const matchArea = s => { const n=norm(s); return !!n && todosLosMios.has(n); };

  const mine = S.requests.filter(r=>{
    const esOrigen  = matchArea(r.sucursal) || matchArea(r.area);
    const esDestino = matchArea(r.destino);
    return esOrigen || esDestino;
  });

  const miosPedidos    = mine.filter(r => matchArea(r.sucursal)||matchArea(r.area));
  const miDestinoQ     = mine.filter(r => matchArea(r.destino) && !matchArea(r.sucursal) && !matchArea(r.area));
  const lleganActivas  = miDestinoQ.filter(r=>!estaCerradaParaSucursal(r));
  const lleganHistorial= miDestinoQ.filter(r=>estaCerradaParaSucursal(r));
  // Cada solicitud figura en UN solo lugar (y los números de las pestañas coinciden con lo que se ve)
  const open = miosPedidos.filter(r=>!cerradaParaOrigen(r));
  const hist = [...miosPedidos.filter(cerradaParaOrigen), ...lleganHistorial];
  const list = S.tabSuc==="abiertas" ? open
             : S.tabSuc==="destino"  ? lleganActivas
             : hist;
  const listF = S.fSucFecha ? list.filter(r=>r.createdAt && r.createdAt.startsWith(S.fSucFecha)) : list;

  const acciones = `
        <button class="btn btn-success btn-md" onclick="openModal('nuevaSol')">+ Nueva solicitud</button>
        ${u.rol==="sucursal"?`<button class="btn btn-danger btn-md" onclick="openQuiebreStock()">🚨 Quiebre de stock</button>`:""}
        ${bolsinesActivo() && u.rol!=="calidad" && !esDeposito(u)?`<button class="btn btn-teal btn-md" onclick="openEnviarBolsin()">📤 Enviar bolsín</button>`:""}
        ${opts.embedded?"":accesosRapidosHtml()}`;
  const cardSuc = r=>{
    const esOrigen = matchArea(r.sucursal)||matchArea(r.area);
    const ruta = esOrigen ? `<small>Para</small> ${escH(r.destino)}` : `<small>De</small> ${escH(origenLabel(r))}`;
    const botones = `
      ${esOrigen && ["Aprobada","Programada"].includes(r.estado)?`<button class="btn btn-success btn-sm" onclick="openListo('${escH(r.id)}')">✅ Marcar lista</button>`:""}
      ${!esOrigen && r.estado==="En tránsito" && !esOtraDireccion(r.destino)?`<button class="btn btn-teal btn-sm" onclick="openCodigoEntrega('${escH(r.id)}')">🔑 Recibir</button>`:""}
      ${!esOrigen && r.estado==="Entregada (sin confirmar)" && !(r.tipoPedido==="bolsin" && esDestinoBuzon(r.destino))?`<button class="btn btn-success btn-sm" onclick="openConfirmarCerrado('${escH(r.id)}')">✅ Confirmar transferencia</button>`:""}`.trim();
    return solicitudCard(r, ruta, botones);
  };
  return `
  <div style="animation:fadeUp .3s ease">
    <div id="flota-slot">${renderWidgetFlotaHoy()}</div>
    ${opts.embedded ? "" : pageHead("Mis solicitudes","",acciones)}
    <div class="toolbar">
      <div class="tabs">
        <button class="tab ${S.tabSuc==="abiertas"?"active":""}" onclick="S.tabSuc='abiertas';render()">Abiertas<span class="tab-n">${open.length}</span></button>
        <button class="tab ${S.tabSuc==="destino"?"active":""}" onclick="S.tabSuc='destino';render()">📥 Me llegan<span class="tab-n">${lleganActivas.length}</span></button>
        <button class="tab ${S.tabSuc==="historial"?"active":""}" onclick="S.tabSuc='historial';render()">Historial<span class="tab-n">${hist.length}</span></button>
      </div>
      <div class="actions-bar">${datePill(S.fSucFecha,"fSucFecha")}${opts.embedded?acciones:""}</div>
    </div>
    ${solicitudesLista(listF,"suc-"+(S.tabSuc||"abiertas"),cardSuc,
        S.fSucFecha?"No hay solicitudes en esa fecha":S.tabSuc==="abiertas"?"No tenés solicitudes abiertas":S.tabSuc==="destino"?"No hay transferencias entrantes":"Sin historial aún")}
  </div>`;
}

function renderLogTabla(){
  const f=S;
  const filtered=S.requests.filter(r=>{
    if(f.fSoloActivas && !["Aprobada","Programada","Lista para retirar","En tránsito","En fábrica"].includes(r.estado)) return false;
    if(f.fEstado    && r.estado    !==f.fEstado)    return false;
    if(f.fSucursal  && r.sucursal!==f.fSucursal && r.area!==f.fSucursal && origenLabel(r)!==f.fSucursal) return false;
    if(f.fDestino   && r.destino   !==f.fDestino)   return false;
    if(f.fPrioridad && r.prioridad !==f.fPrioridad) return false;
    if(f.fFecha     && !r.createdAt.startsWith(f.fFecha)) return false;
    if(f.fFechaRequerida && !(r.fechaRequerida||"").startsWith(f.fFechaRequerida)) return false;
    if(f.fRecorrido && r.recorrido !==f.fRecorrido) return false;
    if(f.fSolicitante && !(solicitanteLabel(r)||"").toLowerCase().includes(f.fSolicitante.trim().toLowerCase())) return false;
    if(f.fTexto){
      const q = f.fTexto.trim().toLowerCase();
      const campos = [r.id,r.descripcion,r.sucursal,r.area,r.destino,solicitanteLabel(r),r.observaciones,r.comentario,r.recorrido,r.unidad]
        .map(v=>(v||"").toString().toLowerCase());
      if(!campos.some(v=>v.includes(q))) return false;
    }
    return true;
  });
  const hasF=f.fEstado||f.fSucursal||f.fDestino||f.fPrioridad||f.fFecha||f.fFechaRequerida||f.fRecorrido||f.fSolicitante||f.fTexto||f.fSoloActivas;
  const reqs=S.requests;
  const recOpts=S.recorridos.length?S.recorridos:["SUR","CENTRO","NORTE"];

  // Lotes de bolsines que ya están "Lista para retirar" pero todavía tienen
  // filas sin recorrido asignado — acá logística asigna todo junto.
  const lotesMap = {};
  S.requests.forEach(r=>{
    if(r.tipoPedido!=="bolsin" || !r.loteId) return;
    if(!["Lista para retirar","Aprobada"].includes(r.estado)) return;
    if(!lotesMap[r.loteId]) lotesMap[r.loteId]=[];
    lotesMap[r.loteId].push(r);
  });
  const lotesPendRecorrido = Object.entries(lotesMap)
    .map(([loteId,filas])=>({loteId, filas, sinRecorrido: filas.filter(f=>!f.recorrido).length}))
    .filter(l=>l.sinRecorrido>0);

  return `
  ${lotesPendRecorrido.length?`
  <div class="card" style="margin-bottom:20px;padding:14px 16px;border-left:3px solid var(--blue)">
    <h3 style="font-size:14px;font-weight:700;margin-bottom:10px">🚚 Lotes de bolsines esperando recorrido</h3>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${lotesPendRecorrido.map(l=>`
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <span style="font-size:13px"><strong>${escH(l.loteId)}</strong> · ${l.sinRecorrido} de ${l.filas.length} sin recorrido</span>
          <button class="btn btn-teal btn-sm" onclick="openLoteRecorrido('${escH(l.loteId)}')">🚚 Asignar recorridos</button>
        </div>`).join("")}
    </div>
  </div>`:""}
  <div class="card" style="margin-bottom:20px;padding:14px 16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn ${S.fSoloActivas?"btn-primary":"btn-ghost"} btn-sm" onclick="S.fSoloActivas=!S.fSoloActivas;render()">
        🚚 Solo activas ${S.fSoloActivas?"✓":""}
      </button>
    </div>
    <div class="filter-grid">
      <div class="field" style="margin-bottom:0"><label>Estado</label>
        <select onchange="S.fEstado=this.value;render()">
          <option value="">Todos</option>${ESTADOS.map(s=>`<option ${f.fEstado===s?"selected":""}>${escH(s)}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Origen</label>
        <select onchange="S.fSucursal=this.value;render()">
          <option value="">Todos los orígenes</option>
          ${[...getSucursales(),...(S.destinos.length?S.destinos:["Compras","RRHH","Logística"])].filter((v,i,a)=>a.indexOf(v)===i).map(s=>`<option ${f.fSucursal===s?"selected":""}>${escH(s)}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Destino</label>
        <select onchange="S.fDestino=this.value;render()">
          <option value="">Todos los destinos</option>
          ${getDestinos().map(s=>`<option ${f.fDestino===s?"selected":""}>${escH(s)}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Prioridad</label>
        <select onchange="S.fPrioridad=this.value;render()">
          <option value="">Todas</option>${PRIORIDADES.map(p=>`<option ${f.fPrioridad===p?"selected":""}>${p}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Recorrido</label>
        <select onchange="S.fRecorrido=this.value;render()">
          <option value="">Todos</option>${recOpts.map(r=>`<option ${f.fRecorrido===r?"selected":""}>${escH(r)}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Fecha (creación)</label>
        <input type="date" class="inp" value="${f.fFecha}" onchange="S.fFecha=this.value;render()"/>
      </div>
      <div class="field" style="margin-bottom:0"><label>Fecha requerida</label>
        <input type="date" class="inp" value="${f.fFechaRequerida}" onchange="S.fFechaRequerida=this.value;render()"/>
      </div>
      <div class="field" style="margin-bottom:0"><label>Solicitante</label>
        <input type="text" id="f-solicitante" class="inp" placeholder="Buscar por nombre... (Enter)" value="${escH(f.fSolicitante)}"
          onkeydown="if(event.key==='Enter'){S.fSolicitante=this.value;render();}"
          onblur="S.fSolicitante=this.value;render();"/>
      </div>
      <div class="field" style="margin-bottom:0;grid-column:1/-1"><label>🔎 Buscar en todo (N°, descripción, origen, destino, comentario...)</label>
        <input type="text" id="f-texto" class="inp" placeholder="Escribí y aparece todo lo que coincida..." value="${escH(f.fTexto)}"
          oninput="S.fTexto=this.value;render()"/>
      </div>
    </div>
    ${hasF?`<div class="filter-bar"><span>${filtered.length} resultado${filtered.length!==1?"s":""}</span><button class="btn btn-ghost btn-sm" onclick="clearFilters()">✕ Limpiar</button></div>`:""}
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button class="btn ${S.modoSeleccion?"btn-primary":"btn-ghost"} btn-sm" onclick="S.modoSeleccion=!S.modoSeleccion; if(!S.modoSeleccion) S.logSeleccion=new Set(); render()">
      ${S.modoSeleccion?"✕ Cancelar selección":"◯ Seleccionar"}

// Convierte un timestamp completo a su fecha LOCAL (Argentina) en formato
// YYYY-MM-DD — para comparar contra fechaRequerida (que es solo fecha,
// sin hora) sin caer en el mismo bug de zona horaria que ya corregimos
// en otros lados (nunca usar toISOString() sola para esto).
function fechaLocalDeTimestamp(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}

  const editando = S.armarRecorridoForm.editandoDireccion;

  const direccion = ($("ar-nueva-direccion-calle")?.value||"").trim();

// Genera todas las permutaciones de un array (para listas chicas —
// hasta 8 paradas, 40320 combinaciones, se calcula al instante).
function _permutaciones(arr){
  if(arr.length<=1) return [arr];
  const out = [];
  for(let i=0;i<arr.length;i++){
    const resto = [...arr.slice(0,i), ...arr.slice(i+1)];
    for(const p of _permutaciones(resto)) out.push([arr[i], ...p]);
  }
  return out;
}
function _cumpleRestricciones(orden, restricciones){
  return restricciones.every(([antes,despues])=>{
    const iA = orden.indexOf(antes), iD = orden.indexOf(despues);
    return iA===-1 || iD===-1 || iA<iD;
  });
}
// A qué zona base (SUR/CENTRO/NORTE) pertenece una parada, según los
// recorridos fijos ya cargados — para que el orden sugerido no
// zigzaguee entre zonas (arrancar por una punta e ir "bajando", no
// saltar de zona en zona porque una parada suelta está más cerca).
function _zonaDeParada(parada){
  const zonasBase = ["SUR","CENTRO","NORTE"];
  for(const zona of zonasBase){
    const stops = (S.flotaTiemposViaje||[])
      .filter(t=>normNotif(t.recorrido)===normNotif(zona))
      .map(t=>normNotif(t.sucursal));
    if(stops.includes(normNotif(parada))) return zona;
  }
  return null; // no pertenece a ninguna zona conocida — no penaliza cambios hacia/desde ella
}
// Cuenta cuántas veces el orden "cambia de zona" innecesariamente —
// una parada sin zona conocida no cuenta como cambio.
function _cambiosDeZona(orden){
  let cambios=0, zonaAnterior=null;
  for(const p of orden){
    const zona = _zonaDeParada(p);
    if(zona && zonaAnterior && zona!==zonaAnterior) cambios++;
    if(zona) zonaAnterior = zona;
  }
  return cambios;
}
function _tiempoTotalOrden(orden){
  let total=0, anterior="FABRICA", nulos=0;
  for(const p of orden){
    const t = minutosEntre(anterior,p);
    if(t===null) nulos++; else total+=t;
    anterior = p;
  }
  const vuelta = minutosEntre(anterior,"FABRICA");
  if(vuelta===null) nulos++; else total+=vuelta;
  return {total, nulos};
}
function sugerirOrdenOptimo(){
  const paradas = S.armarRecorridoForm.paradas;
  if(paradas.length<2){ toast("Agregá al menos 2 paradas para poder sugerir un orden","warn"); return; }

  // Restricciones: para cada transferencia pendiente donde el origen Y
  // el destino ya están en la lista, hay que visitar el origen antes.
  const restricciones = transferenciasPendientesEntreSucursales()
    .filter(r=>paradas.includes(r.sucursal) && paradas.includes(r.destino))
    .map(r=>[r.sucursal, r.destino]);

  let candidatos;
  if(paradas.length<=8){
    candidatos = _permutaciones(paradas).filter(o=>_cumpleRestricciones(o,restricciones));
    if(!candidatos.length) candidatos = _permutaciones(paradas); // si ninguna cumple todo, elegir por tiempo igual
  } else {
    // Con más de 8 paradas no se prueban todas las combinaciones —
    // se arma con un heurístico simple (vecino más cercano) respetando
    // las restricciones lo mejor posible.
    candidatos = [_ordenVecinoMasCercano(paradas, restricciones)];
  }

  let mejor = null, mejorScore = null;
  for(const orden of candidatos){
    const {total,nulos} = _tiempoTotalOrden(orden);
    const cambiosZona = _cambiosDeZona(orden);
    // Prioridad: 1) no dejar tramos sin dato, 2) no zigzaguear entre
    // zonas (arrancar por una punta e ir bajando, no saltar), 3) el
    // tiempo total más corto como desempate.
    const score = nulos*1e8 + cambiosZona*1e5 + total;
    if(mejorScore===null || score<mejorScore){ mejorScore=score; mejor=orden; }
  }

  S.armarRecorridoForm.paradas = mejor;
  const {total,nulos} = _tiempoTotalOrden(mejor);
  toast(nulos>0
    ? `🧭 Orden sugerido (con ${nulos} tramo${nulos!==1?"s":""} sin dato en la matriz)`
    : `🧭 Orden sugerido — ${Math.round(total)} min totales, respetando ${restricciones.length} transferencia${restricciones.length!==1?"s":""} pendiente${restricciones.length!==1?"s":""}`);
  render();
}
function _ordenVecinoMasCercano(paradas, restricciones){
  const restantes = new Set(paradas);
  const orden = [];
  let actual = "FABRICA";
  let zonaActual = null;
  while(restantes.size){
    // Solo candidatas que no violen una restricción de "debe ir después de otra que todavía no se visitó"
    const candidatas = [...restantes].filter(p=>{
      return !restricciones.some(([antes,despues])=>despues===p && restantes.has(antes));
    });
    const pool = candidatas.length ? candidatas : [...restantes];
    let mejorP=null, mejorScore=Infinity;
    for(const p of pool){
      const t = minutosEntre(actual,p);
      const tt = t===null ? 999999 : t;
      const zonaP = _zonaDeParada(p);
      const penalizacionZona = (zonaActual && zonaP && zonaP!==zonaActual) ? 100000 : 0;
      const score = penalizacionZona + tt;
      if(score<mejorScore){ mejorScore=score; mejorP=p; }
    }
    orden.push(mejorP);
    restantes.delete(mejorP);
    actual = mejorP;
    const zonaMejor = _zonaDeParada(mejorP);
    if(zonaMejor) zonaActual = zonaMejor;
  }
  return orden;
}

function cambiarCamionRecorrido(clave, nuevoCamionId){
  if(!S.camionOverride) S.camionOverride = {};
  S.camionOverride[clave] = nuevoCamionId;
  render();
}
async function guardarCamionRecorrido(clave, recorrido, escenario){
  const nuevoCamionId = S.camionOverride[clave];
  const hoy = hoyLocalISO();
  try{
    const { error } = await sb.from("flota_carga_planificada")
      .update({camion_id: nuevoCamionId})
      .eq("fecha", hoy).eq("recorrido", recorrido).eq("escenario", escenario);
    if(error) throw error;
    S.flotaDash.cargaPlanificada = S.flotaDash.cargaPlanificada.map(r=>
      (r.recorrido===recorrido && r.escenario===escenario) ? {...r, camion_id:nuevoCamionId} : r
    );
    delete S.camionOverride[clave];
    toast(`✅ Camión asignado a ${recorrido}`);
  }catch(e){
    toast("⚠️ No se pudo guardar: "+e.message, "warn");
  }
  render();
}

async function cargarDashboardFlota(){
  S.flotaDashLoading = true; render();
  const hoy = hoyLocalISO();
  const fetchTabla = async (nombre, query)=>{
    try{
      let q = sb.from(nombre).select("*");
      if(query) q = query(q);
      const { data, error } = await q;
      if(error) throw error;
      return data||[];
    }catch(e){ console.warn("Flota dashboard, no se pudo leer "+nombre+":", e.message); return []; }
  };
  const [cargaPlanificada, camiones, viajes, registrosQR, vizVerd, tiemposEstimados] = await Promise.all([
    fetchTabla("flota_carga_planificada", q=>q.eq("fecha",hoy)),
    fetchTabla("flota_camiones"),
    fetchTabla("flota_viajes", q=>q.eq("fecha",hoy)),
    fetchTabla("flota_registros_qr", q=>q.gte("ts", hoy+"T00:00:00")),
    fetchTabla("flota_viz_verd", q=>q.eq("fecha",hoy)),
    fetchTabla("flota_tiempos_estimados"),
  ]);
  S.flotaDash = { cargaPlanificada, camiones, viajes, registrosQR, vizVerd, tiemposEstimados, ts: new Date() };
  S.flotaDashLoading = false;
  render();
}

function planPrincYVerdParaEscenario(datos, escActivo){
  const esEspecial = (escActivo==="h"||escActivo==="c"||escActivo==="r"||escActivo==="s");
  if(esEspecial){
    const keyMap = {h:"HUEVOS",c:"CONGELADOS",r:"REFUERZO",s:"SECOS"};
    const keyRec = keyMap[escActivo];
    const princ = datos.cargaPlanificada.filter(r=>String(r.escenario||"").toUpperCase().includes(keyRec));
    return { princ, verd:[] };
  }
  const filtro = escActivo==="3" ? "3_RECORRIDOS" : "2_RECORRIDOS";
  const princ = datos.cargaPlanificada.filter(r=>r.escenario===filtro);
  const verd  = datos.cargaPlanificada.filter(r=>{
    const e=(r.escenario||"").toUpperCase();
    return e.includes("VERDULERIA") || e.includes("VERDULERÍA");
  });
  return { princ, verd };
}
function computeVizRowsDash(datos){
  return (datos.viajes||[]).map(v=>{
    const plan = datos.cargaPlanificada.find(c=>normNotif(c.recorrido)===normNotif(v.recorrido));
    const ocupKg = plan && plan.ocup_kg_teorico>0 ? Math.round(plan.ocup_kg_teorico*100) : 0;
    const estado = v.estado==="FINALIZADO" ? "✅ Finalizado" : "🚛 En ruta";
    return {
      recorrido: v.recorrido,
      repartidor: [v.nombre_rep1, v.nombre_rep2].filter(Boolean).join(" / "),
      camion: plan ? plan.camion_id : "",
      realKg: plan ? plan.real_kg : 0,
      ocupPct: ocupKg,
      horaSalida: v.hora_salida,
      horaLlegReal: v.estado==="FINALIZADO" ? v.hora_llegada : null,
      estado,
    };
  });
}
function computeParadasDash(datos){
  const porViajeSucursal = {};
  datos.registrosQR.forEach(r=>{
    if(r.sucursal==="FABRICA") return;
    const clave = r.id_viaje+"|"+r.sucursal;
    if(!porViajeSucursal[clave]) porViajeSucursal[clave] = {recorrido:r.recorrido, sucursal:r.sucursal, llegada:null, salida:null};
    if(String(r.evento||"").toUpperCase()==="LLEGADA") porViajeSucursal[clave].llegada = r.ts;
    if(String(r.evento||"").toUpperCase()==="SALIDA")  porViajeSucursal[clave].salida  = r.ts;
  });
  return Object.values(porViajeSucursal).map(p=>{
    const tEstSeg = Math.round(tiempoDescarga(p.recorrido, p.sucursal)*60);
    let tRealSeg = 0;
    if(p.llegada && p.salida) tRealSeg = Math.round((new Date(p.salida) - new Date(p.llegada))/1000);
    const diff = (tEstSeg>0 && tRealSeg>0) ? Math.round((tRealSeg-tEstSeg)/60) : null;
    return { recorrido:p.recorrido, sucursal:p.sucursal, tEstSeg, tRealSeg, diff,
      estado: p.llegada && !p.salida ? "Descargando" : (!p.llegada ? "Sin escanear" : "Listo") };
  });
}
function segsToMmSs(s){ if(!s||s<=0) return "—"; const m=Math.floor(s/60), ss=Math.floor(s%60); return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss; }
