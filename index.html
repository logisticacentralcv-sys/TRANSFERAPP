<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TransferLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1120;--s1:#111827;--s2:#1a2338;--s3:#1f2d44;
  --border:#263348;--border2:#2f4060;
  --text:#e2e8f4;--muted:#7a90b0;--faint:#3d5070;
  --blue:#4f9eff;--green:#2ecc7a;--amber:#f5a623;
  --red:#f05252;--purple:#9b8ff7;--teal:#2de0c4;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--rsm:6px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:16px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* LAYOUT */
.navbar{background:var(--s1);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:200}
.navbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.ntag{padding:2px 9px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.8px;border:1px solid}
.ntag-log{background:#2ecc7a18;color:var(--green);border-color:#2ecc7a30}
.ntag-suc{background:#4f9eff18;color:var(--blue);border-color:#4f9eff30}
.ntag-rep{background:#f5a62318;color:var(--amber);border-color:#f5a62330}
.ntag-adm{background:#9b8ff718;color:var(--purple);border-color:#9b8ff730}
main{flex:1;padding:24px 24px;max-width:1800px;width:100%;margin:0 auto}
footer{border-top:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-family:var(--mono)}
#app{min-height:100vh;display:flex;flex-direction:column}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-flush{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}

/* FORMS */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.req{color:var(--red);margin-left:2px}
.inp,select,textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 13px;color:var(--text);font-size:15px;font-family:var(--font);outline:none;transition:border-color .15s}
.inp:focus,select:focus,textarea:focus{border-color:var(--blue)}
.inp.err{border-color:var(--red)!important;background:#f0525210}
textarea{resize:vertical;min-height:76px}
select{cursor:pointer}
select option{background:#1a2338}
.err-msg{font-size:11px;color:var(--red);margin-top:3px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:var(--rsm);font-weight:600;cursor:pointer;font-family:var(--font);transition:filter .15s;white-space:nowrap;border:1px solid}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-md{padding:10px 22px;font-size:14px}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-full{width:100%;justify-content:center}
.btn-primary{background:#4f9eff1a;border-color:#4f9eff50;color:var(--blue)}
.btn-success{background:#2ecc7a1a;border-color:#2ecc7a50;color:var(--green)}
.btn-danger{background:#f0525218;border-color:#f0525250;color:var(--red)}
.btn-purple{background:#9b8ff71a;border-color:#9b8ff750;color:var(--purple)}
.btn-warn{background:#f5a6231a;border-color:#f5a62350;color:var(--amber)}
.btn-teal{background:#2de0c41a;border-color:#2de0c450;color:var(--teal)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.chk-round{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:var(--s2);cursor:pointer;display:inline-block;vertical-align:middle;position:relative;transition:.15s}
.chk-round:checked{background:var(--blue);border-color:var(--blue)}
.chk-round:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.spinner{width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}

/* BADGES */
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.3px;font-family:var(--mono);white-space:nowrap;border:1px solid}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--s2);border-radius:8px;padding:4px;width:fit-content;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-family:var(--font);font-weight:600;font-size:13px;transition:all .2s;background:transparent;color:var(--muted)}
.tab.active{background:var(--s3);color:var(--text)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start}
.stat-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;margin-bottom:6px}
.stat-val{font-size:30px;font-weight:700;font-family:var(--mono);line-height:1}
.stat-icon{font-size:22px;opacity:.6}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:11px 14px;text-align:left;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.5px;white-space:nowrap;background:var(--s2)}
td{padding:11px 14px;border-top:1px solid var(--border)}
tr:nth-child(even) td{background:rgba(255,255,255,.015)}
tr:hover td{background:var(--s2)}
.id-cell{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted-cell{color:var(--muted)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.mono{font-family:var(--mono)}
.empty-row td{text-align:center;padding:48px;color:var(--muted)}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;animation:fadeUp .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--s1);z-index:1}
.modal-head h3{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px}
.modal-body{padding:20px}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:440px}
.login-brand{text-align:center;margin-bottom:28px}
.login-brand .ico{font-size:42px;margin-bottom:8px}
.login-brand h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.login-brand p{color:var(--muted);font-size:14px;margin-top:4px}
/* role-grid removed — login unificado */
.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
.hint-box{background:var(--s2);border-radius:8px;padding:12px 15px;font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.hint-box strong{color:var(--text)}
.alert-err{background:#f0525210;border:1px solid #f0525230;border-radius:var(--rsm);padding:11px 15px;font-size:14px;color:var(--red);margin-bottom:12px}
.alert-ok{background:#2ecc7a10;border:1px solid #2ecc7a30;border-radius:var(--rsm);padding:11px 15px;font-size:14px;color:var(--green);margin-bottom:12px}
.alert-info{background:var(--s2);border-radius:8px;padding:13px 15px;margin-bottom:16px;font-size:14px;border-left:3px solid var(--blue)}

/* DIVIDER */
.div-label{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.div-label span{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--faint);white-space:nowrap}
.div-line{flex:1;height:1px;background:var(--border)}

/* ACTION BUTTONS ROW */
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* DETAIL ROWS */
.drow{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
.drow-label{font-size:13px;color:var(--muted);min-width:140px}
.drow-val{font-size:14px;font-weight:500;text-align:right;max-width:300px}

/* METRIC BARS */
.bar-wrap{margin-bottom:10px}
.bar-head{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px}
.bar-track{background:var(--s2);border-radius:3px;height:5px}
.bar-fill{height:5px;border-radius:3px;transition:width .5s ease}

/* TRAZABILIDAD */
.trace-step{display:flex;gap:12px;margin-bottom:16px}
.trace-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.trace-line{width:2px;background:var(--border);margin:14px auto 0;flex-shrink:0}
.trace-body{flex:1}
.trace-title{font-size:14px;font-weight:600;margin-bottom:3px}
.trace-meta{font-size:13px;color:var(--muted)}

/* DELIVERY CARDS */
.del-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.del-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .2s}
.del-card:hover{border-color:var(--border2)}
.del-stripe{height:4px}
.del-body{padding:16px 18px}

/* DNI MODAL */
.dni-modal{max-width:400px}
.dni-big{font-size:32px;text-align:center;margin:8px 0 4px;font-family:var(--mono);color:var(--blue)}

/* FILTERS */
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 16px;align-items:end}
.filter-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--s2);border-radius:var(--r);padding:12px 18px;min-width:260px;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:fadeUp .25s ease;display:flex;align-items:center;gap:10px;font-size:13px}

/* LOADING */
.loading-center{display:flex;align-items:center;justify-content:center;padding:80px;flex-direction:column;gap:14px;color:var(--muted)}
.spin-circle{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.kpi-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi-mini{text-align:center;padding:10px 0;background:var(--s2);border-radius:8px}
.kpi-mini-val{font-size:24px;font-weight:700;font-family:var(--mono);line-height:1}
.kpi-mini-lbl{font-size:11px;color:var(--muted);margin-top:3px}

@media(max-width:640px){
  .g2,.g3{grid-template-columns:1fr}
  .filter-grid{grid-template-columns:1fr 1fr}
  main{padding:16px 12px}
  .stat-val{font-size:24px}
  th{padding:9px 10px;font-size:12px}
  td{padding:10px 10px;font-size:14px}
  .role-grid{grid-template-columns:1fr 1fr}
  .inp,select,textarea{font-size:16px} /* evita zoom en iOS */
  .btn-md{font-size:15px;padding:12px 20px}
  .btn-sm{font-size:13px;padding:9px 14px}
}
@media(max-width:380px){
  .filter-grid,.role-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="app-modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════
//  ★  CONFIGURACIÓN — SUPABASE  ★
// ══════════════════════════════════════════════════════════
const SUPABASE_URL = "https://lrwwpulunfcavmvmwotd.supabase.co";
const SUPABASE_KEY = "sb_publishable_SrUcYrDVBIOvZgF-DSPcyg_qV0LXEDQ";
const VAPID_PUBLIC_KEY = "BFqxEOootxcEIHMXModP4iZIpclbqsVnEHGjcwcaPbiikWu9VPkEl-iPoHKG-P1oo6ssoH4x0CTFVvIc652_9hE";
const USE_SHEETS   = SUPABASE_URL !== "";  // se mantiene el nombre por compatibilidad con el resto del código
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ⚠️⚠️⚠️ PENDIENTE — FALTA COMPLETAR ESTO ⚠️⚠️⚠️
// Supabase no puede mandar mails por sí solo — se deja el Apps Script
// conectado ÚNICAMENTE para eso (ya no toca ninguna hoja ni solicitud).
// Poné acá la MISMA URL que ya tenías funcionando (termina en /exec).
// SIN ESTO, LOS MAILS NO SE VAN A ENVIAR — el resto de la app funciona
// igual, esto es solo para los avisos por mail.
const MAIL_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx5CV49bSA1UnH-j1YSgiGRuO0Vg7KUiuucvbDnE3c87EFTGLvoznoVxpOaVr4SbF7r/exec";

if(!MAIL_WEBHOOK_URL){
  console.warn("⚠️ MAIL_WEBHOOK_URL está vacía — los mails de aviso NO se van a enviar hasta que la completes.");
}

async function enviarMail(to, subject, body){
  if(!MAIL_WEBHOOK_URL || !to) return;
  try{
    const payload = {action:"enviarMail", to, subject, body};
    await fetch(MAIL_WEBHOOK_URL, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"payload="+encodeURIComponent(JSON.stringify(payload))});
  }catch(e){ console.warn("Mail:",e); }
}
async function notificarNuevaSolicitud(d){
  if(MAIL_WEBHOOK_URL){
    try{
      const payload = {action:"notificarNueva", data:d};
      await fetch(MAIL_WEBHOOK_URL, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"payload="+encodeURIComponent(JSON.stringify(payload))});
    }catch(e){ console.warn("Mail:",e); }
  }
  // Alerta interna — no depende de que el mail llegue o no.
  crearNotificacion("LOGISTICA", `📋 Nueva solicitud ${d.id} — ${escH(d.sucursal||d.area||"—")} pide ${escH(d.descripcion||"")}`, d.id);
}

// ══════════════════════════════════════════════════════════
//  NOTIFICACIONES INTERNAS — alerta dentro de la app, no mail.
//  destinatario puede ser "LOGISTICA" (todo el rol) o el área/sucursal
//  exacta (para que le llegue solo a quien corresponde).
// ══════════════════════════════════════════════════════════
function normNotif(s){ return (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function notifEsMia(n){
  const u = S.user;
  if(!u || !n) return false;
  const dest = normNotif(n.destinatario);
  if(dest==="logistica") return u.rol==="logistica";
  if(dest==="admin") return u.rol==="admin";
  if(dest==="recepcion fresco" || dest==="recepcionfresco") return u.rol==="recepcionista" && normNotif(u.area).includes("fresco");
  return dest === normNotif(u.area);
}
async function crearNotificacion(destinatario, mensaje, solicitudId){
  if(!USE_SHEETS) return;
  try{
    await sb.from("notificaciones").insert(toSnakeRow({destinatario, mensaje, solicitudId: solicitudId||null, leida:false}));
  }catch(e){ console.warn("No se pudo crear notificación (¿corriste el SQL de la tabla 'notificaciones'?):", e); }
  // Push real (llega aunque tengan la página cerrada) — no bloquea nada si falla
  try{
    fetch("/api/send-push", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({destinatario, mensaje, solicitudId})});
  }catch(e){}
}

// ══════════════════════════════════════════════════════════
//  ALERTAS PUSH — llegan aunque el navegador esté cerrado.
//  Cada dispositivo/navegador que activa esto queda anotado con el
//  "grupo" al que pertenece según quién esté logueado en ese momento.
// ══════════════════════════════════════════════════════════
function grupoNotifActual(){
  const u = S.user;
  if(!u) return "";
  if(u.rol==="logistica") return "LOGISTICA";
  if(u.rol==="admin") return "ADMIN";
  if(esRecepcionFresco()) return "RECEPCION FRESCO";
  return u.area || "";
}
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,"+").replace(/_/g,"/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}
async function pushEstaActivo(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  const reg = await navigator.serviceWorker.getRegistration();
  if(!reg) return false;
  const sub = await reg.pushManager.getSubscription();
  return !!sub;
}
async function activarAlertasPush(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)){
    toast("Este navegador no soporta notificaciones push","warn");
    return;
  }
  const grupo = grupoNotifActual();
  if(!grupo){ toast("No pudimos identificar tu perfil — probá recargar la página","warn"); return; }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso!=="granted"){ toast("No diste permiso — no vamos a poder mandarte alertas","warn"); render(); return; }
    const reg = await navigator.serviceWorker.register("/sw.js");
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    const subJson = sub.toJSON();
    await sb.from("push_subscriptions").upsert({
      endpoint: subJson.endpoint, keys: subJson.keys, grupo, user_agent: navigator.userAgent,
    }, {onConflict:"endpoint"});
    toast("🔔 Alertas activadas en este dispositivo");
  }catch(e){
    console.error(e);
    toast("No se pudo activar — probá de nuevo","warn");
  }
  render();
}
async function desactivarAlertasPush(){
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){
      await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
      await sub.unsubscribe();
    }
    toast("🔕 Alertas desactivadas en este dispositivo");
  }catch(e){}
  render();
}
async function cargarNotificaciones(){
  if(!USE_SHEETS) return;
  try{
    const { data, error } = await sb.from("notificaciones").select("*").eq("leida",false).order("created_at",{ascending:false}).limit(200);
    if(error) throw error;
    S.notificaciones = toCamelRows(data);
  }catch(e){ /* la tabla puede no existir todavía — no rompe el resto de la app */ }
}
function misNotificaciones(){ return S.notificaciones.filter(notifEsMia); }
async function marcarNotificacionLeida(id){
  S.notificaciones = S.notificaciones.filter(n=>n.id!==id);
  render();
  try{ await sb.from("notificaciones").update({leida:true}).eq("id",id); }catch(e){}
}
async function marcarTodasNotifLeidas(){
  const ids = misNotificaciones().map(n=>n.id);
  if(!ids.length) return;
  S.notificaciones = S.notificaciones.filter(n=>!ids.includes(n.id));
  render();
  try{ await sb.from("notificaciones").update({leida:true}).in("id",ids); }catch(e){}
}
function abrirNotificaciones(){
  S.modal="notificaciones"; render();
  pushEstaActivo().then(v=>{ S.pushActivo=v; render(); });
}
function renderNotificacionesModal(){
  const mias = misNotificaciones();
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;padding:10px 12px;background:var(--s2);border-radius:8px;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--muted)">${S.pushActivo?"🔔 Alertas activadas en este dispositivo":"Activá las alertas para recibirlas aunque tengas la página cerrada"}</span>
    ${S.pushActivo
      ? `<button class="btn btn-ghost btn-sm" onclick="desactivarAlertasPush()">Desactivar</button>`
      : `<button class="btn btn-teal btn-sm" onclick="activarAlertasPush()">🔔 Activar en este dispositivo</button>`}
  </div>

// ID formato: TRF-ddmmyyyyN
// Ej: TRF-100720261 (primer pedido del 10/07/2026)
//     TRF-100720262 (segundo pedido del mismo día)
// El contador diario se guarda en sessionStorage para no reiniciar si se recarga.
function fechaCorta(){
  const hoy = new Date();
  const dd   = String(hoy.getDate()).padStart(2,"0");
  const mm   = String(hoy.getMonth()+1).padStart(2,"0");
  const yyyy = hoy.getFullYear();
  return dd+mm+yyyy;
}

function fechaISO(){ return new Date().toISOString().slice(0,10); }

function genId(){
  const hoy = new Date();
  const dd   = String(hoy.getDate()).padStart(2,"0");
  const mm   = String(hoy.getMonth()+1).padStart(2,"0");
  const yyyy = hoy.getFullYear();
  const fecha = dd+mm+yyyy;

  // Leer el último contador del día desde sessionStorage
  const storageKey = "trf_counter_" + fecha;
  let n = 1;
  try{
    const stored = sessionStorage.getItem(storageKey);
    if(stored) n = parseInt(stored) + 1;
    // También chequeamos el máximo existente en S.requests para no duplicar
    const existingToday = S.requests.filter(r=>r.id&&r.id.includes(fecha));
    if(existingToday.length >= n) n = existingToday.length + 1;
    sessionStorage.setItem(storageKey, String(n));
  }catch(e){}
  return "TRF-" + fecha + n;
}

// Convierte entre camelCase (como piensa toda la app) y snake_case
// (como se llaman las columnas en Postgres). Es genérico — no hace
// falta mantener una lista de campos a mano.
function camelToSnake(s){ return s.replace(/[A-Z]/g, m => "_"+m.toLowerCase()); }
function snakeToCamel(s){ return s.replace(/_([a-z0-9])/g, (_,c) => c.toUpperCase()); }
// Columnas de fecha/hora (timestamptz o date) — Postgres acepta NULL ahí,
// pero rechaza "" (string vacío) con un error. Varias partes del código
// arman objetos con valores tipo "" por comodidad (mismo patrón que se
// usaba con Sheets, donde "" no rompía nada) — acá se corrige siempre,
// en un solo lugar, para no tener que cazarlo campo por campo.
const COLUMNAS_FECHA = new Set([
  "created_at","updated_at","approved_at","scheduled_at","delivered_at",
  "fabrica_at","listo_at","levantado_at","salida_fabrica_at",
  "confirmada_sucursal_at","fecha_requerida","preparado_at","planificado_at",
]);
function toSnakeRow(obj){
  const out={};
  Object.keys(obj||{}).forEach(k=>{
    if(obj[k]===undefined) return;
    const col = camelToSnake(k);
    let val = obj[k];
    if(val==="" && COLUMNAS_FECHA.has(col)) val = null;
    out[col]=val;
  });
  return out;
}
function toCamelRow(row){
  if(!row) return row;
  const out={};
  Object.keys(row).forEach(k=>{ out[snakeToCamel(k)]=row[k]; });
  return out;
}
function toCamelRows(rows){ return (rows||[]).map(toCamelRow); }

// FASE 1: solo lo necesario para validar el login (tablas chicas y rápidas)
async function sheetsLoadUsuarios(){
  if(!USE_SHEETS) return;
  try{
    const [us,sucs,cfg]=await Promise.all([
      sb.from("usuarios").select("*"),
      sb.from("sucursales").select("*"),
      sb.from("config").select("*"),
    ]);
    if(us.error) throw us.error;
    if(sucs.error) throw sucs.error;
    S.usuarios = toCamelRows(us.data).filter(u=>u.activo!=="no");
    if(!cfg.error && cfg.data){
      const c = {};
      cfg.data.forEach(row=>{ c[row.clave] = row.valor; });
      S.config = c;
    }
    const sucRows = toCamelRows(sucs.data);
    S.sucursales = sucRows.filter(r=>r.nombre&&r.activo!=="no").map(r=>r.nombre);
    const info = {};
    sucRows.forEach(r=>{
      if(!r.nombre) return;
      info[(r.nombre||"").trim().toLowerCase()] = {
        email: r.email||"",
        recorridoDefault: r.recorridoDefault||r.recorrido||"",
      };
    });
    S.sucursalesInfo = info;
  }catch(e){console.warn("Supabase load usuarios:",e);}
}

async function sheetsLoadDatos(){
  if(!USE_SHEETS) return;
  try{
    const [rs,recs,dests]=await Promise.all([
      sb.from("solicitudes").select("*").order("created_at",{ascending:false}),
      sb.from("recorridos").select("*"),
      sb.from("destinos").select("*"),
    ]);
    if(rs.error) throw rs.error;
    if(recs.error) throw recs.error;
    if(dests.error) throw dests.error;
    S.requests   = toCamelRows(rs.data).filter(r=>r.id);
    S.recorridos = toCamelRows(recs.data).filter(r=>r.nombre).map(r=>r.nombre);
    S.destinos   = toCamelRows(dests.data).filter(r=>r.nombre&&r.activo!=="no").map(r=>r.nombre);
  }catch(e){console.warn("Supabase load datos:",e);}
  cargarNotificaciones(); // no bloquea — si falla (tabla no creada aún), no rompe nada
}

// Sube un archivo al bucket "adjuntos" (carpeta según de dónde venga) y
// Comprime una imagen antes de subirla (redimensiona a máx. 1200px de
// ancho y la pasa a JPG calidad 70%) — así el 1GB gratis de Supabase
// Storage rinde muchísimo más (una foto de celular sin comprimir pesa
// 2-4MB; comprimida queda en 150-300KB). Si no es una imagen (ej. PDF)
// o algo falla, sube el archivo original tal cual.
function comprimirImagen(file, maxAncho=1200, calidad=0.7){
  return new Promise((resolve)=>{
    if(!file || !file.type || !file.type.startsWith("image/")){ resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxAncho){ h = Math.round(h*maxAncho/w); w = maxAncho; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob((blob)=>{
          if(!blob){ resolve(file); return; }
          const nombre = file.name.replace(/\.[^.]+$/,"") + ".jpg";
          resolve(new File([blob], nombre, {type:"image/jpeg"}));
        }, "image/jpeg", calidad);
      };
      img.onerror = ()=>resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = ()=>resolve(file);
    reader.readAsDataURL(file);
  });
}

// Sube un archivo al bucket "adjuntos" (carpeta según de dónde venga) y
// devuelve su URL pública (o null si falla). Genérica: la usan las
// quejas, devoluciones y los adjuntos de una solicitud nueva.
async function subirArchivo(file, carpeta){
  if(!file) return null;
  try{
    const comprimido = await comprimirImagen(file);
    const path = `${carpeta}/${Date.now()}_${comprimido.name.replace(/[^a-zA-Z0-9.]/g,"_")}`;
    const { error } = await sb.storage.from("adjuntos").upload(path, comprimido);
    if(error) throw error;
    const { data } = sb.storage.from("adjuntos").getPublicUrl(path);
    return data?.publicUrl || null;
  }catch(e){ console.warn("Subir archivo:",e); return null; }
}
async function subirFotoQueja(file){ return subirArchivo(file, "quejas"); }

async function submitQueja(){
  const areaDestino = ($("queja-area")?.value||S.quejaForm.area||"").trim();
  if(!areaDestino){ S.quejaForm.err="Elegí a qué área va dirigida."; render(); return; }
  const motivo = ($("queja-motivo")?.value||S.quejaForm.motivo||"").trim();
  if(!motivo){ S.quejaForm.err="Elegí un motivo."; render(); return; }
  const detalle = ($("queja-texto")?.value||S.quejaForm.texto||"").trim();
  if((motivo==="Otra"||motivo==="Otro") && !detalle){ S.quejaForm.err="Contá el detalle — elegiste 'Otra/Otro'."; render(); return; }
  // Leer el archivo ANTES de redibujar — el spinner de "loading" redibuja
  // la pantalla y eso resetea el <input type="file">, perdiendo la foto.
  const fotoFile = $("queja-foto")?.files?.[0] || null;

  S.quejaForm.loading = true; S.quejaForm.err=""; renderNow();

  const texto = detalle ? `${motivo} — ${detalle}` : motivo;
  const fotoUrl = await subirFotoQueja(fotoFile);

  const u = S.user;
  const payload = toSnakeRow({
    sucursal: u.rol==="sucursal" ? u.area : "",
    area:     u.rol!=="sucursal" ? u.area : "",
    texto, fotoUrl, areaDestino,
    estado: "Pendiente",
    creadoPor: u.nombre||u.area||"",
  });
  try{
    const { data, error } = await sb.from("quejas").insert(payload).select().single();
    if(error) throw error;
    S.quejas = [toCamelRow(data), ...S.quejas];
    S.quejaForm = {texto:"", area:"", motivo:"", loading:false, err:""};
    toast("💬 Queja enviada");
  }catch(e){
    S.quejaForm.loading = false;
    S.quejaForm.err = "No se pudo enviar — probá de nuevo.";
  }
  render();
}

function normSinTildes(s){
  return (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
// Gestiona devoluciones: Logística, Planificación, Producción o Calidad.
function esGestorDevolucion(){
  const u = S.user;
  if(!u || u.rol==="recepcionista") return false;
  if(u.rol==="admin") return true;
  if(u.rol==="logistica") return true;
  const area = normSinTildes(u.area);
  return ["planificacion","produccion","calidad"].includes(area);
}
function puedeVerDevoluciones(){
  const u = S.user;
  if(!u) return false;
  return u.rol==="sucursal" || u.rol==="repartidor" || esGestorDevolucion();
}

async function confirmarAccionDevolucion(){
  const id = S.devolucionAccionId;
  const esConfirmar = S.devolucionAccionTipo==="confirmar";
  const texto = ($("devol-accion-texto")?.value||S.devolucionAccionTexto||"").trim();
  if(!esConfirmar && !texto){ toast("Contá qué faltó para poder cerrarla","warn"); return; }

  const nowTs = now();
  const changes = {
    estado: esConfirmar?"Confirmada":"No confirmada",
    respuesta: texto || (esConfirmar?"Confirmada, todo en orden.":""),
    respondidoPor: S.user.nombre||S.user.area||"",
    updatedAt: nowTs,
  };
  try{
    const { error } = await sb.from("devoluciones").update(toSnakeRow(changes)).eq("id",id);
    if(error) throw error;
    S.devoluciones = S.devoluciones.map(d=>d.id===id?{...d,...changes}:d);
    S.devolucionAccionId = ""; S.devolucionAccionTipo = "";
    toast(esConfirmar?"✅ Devolución confirmada":"⚠️ Devolución cerrada como no confirmada");
  }catch(e){ toast("⚠️ No se pudo actualizar","warn"); }
  render();
}

  const d = S.devoluciones.find(x=>x.id===id);
  if(!d) return;
  S.editarDevolucionModal = {id, sucursal:d.sucursal||"", motivo:d.motivo||"", estado:d.estado||"Pendiente", err:"", loading:false};
  S.modal = "editarDevolucion";
  render();
}
function renderEditarDevolucionModal(){
  const d = S.editarDevolucionModal;

  return `

      </button>
    </div>
  </div>`;

async function submitEditarDevolucion(){
  const d = S.editarDevolucionModal;
  if(d.loading) return;
  const sucursal = $("ed-dev-sucursal")?.value || d.sucursal;
  const motivo   = ($("ed-dev-motivo")?.value ?? d.motivo ?? "").trim();
  const estado   = $("ed-dev-estado")?.value || d.estado;
  if(!motivo){ S.editarDevolucionModal.err="El motivo no puede quedar vacío."; render(); return; }

  d.loading = true; renderNow();
  const changes = {sucursal, motivo, estado, updatedAt:now()};
  try{
    const { error } = await sb.from("devoluciones").update(toSnakeRow(changes)).eq("id", d.id);
    if(error) throw error;
    S.devoluciones = S.devoluciones.map(x=>x.id===d.id?{...x,...changes}:x);
    S.modal = null;
    toast("Devolución actualizada");
  }catch(e){
    S.editarDevolucionModal.loading = false;
    S.editarDevolucionModal.err = "No se pudo guardar — probá de nuevo.";
  }
  render();
}
async function eliminarDevolucion(id){
  if(!confirm("¿Eliminar esta devolución? No se puede deshacer.")) return;
  try{
    const { error } = await sb.from("devoluciones").delete().eq("id", id);
    if(error) throw error;
    S.devoluciones = S.devoluciones.filter(x=>x.id!==id);
    S.modal = null;
    toast("Devolución eliminada");
  }catch(e){
    toast("⚠️ No se pudo eliminar — probá de nuevo","warn");
  }
  render();
}

function toggleDevolSeleccion(id, checked){
  if(checked) S.devolSeleccion.add(id); else S.devolSeleccion.delete(id);
  render();
}
function toggleDevolSeleccionTomar(id, checked){
  if(checked) S.devolSeleccionTomar.add(id); else S.devolSeleccionTomar.delete(id);
  render();
}

// ── PASO 1: repartidor TOMA (levanta) la devolución de la sucursal ──
function openTomarDevoluciones(){
  if(S.devolSeleccionTomar.size===0) return;
  const ids = [...S.devolSeleccionTomar].filter(id=>{
    const d = S.devoluciones.find(x=>x.id===id);
    return d && d.estado==="Pendiente";
  });
  if(!ids.length) return;
  S.tomarDevolucionesModal = {ids, dni:"", err:"", loading:false};
  S.modal = "tomarDevoluciones";
  render();
}
function renderTomarDevolucionesModal(){
  const d = S.tomarDevolucionesModal;
  return `
  <div style="background:#2de0c418;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;border-left:3px solid var(--teal)">
    🤲 Vas a tomar <strong>${d.ids.length} devolucion${d.ids.length!==1?"es":""}</strong> de la sucursal, para llevarlas a fábrica.
  </div>
  <div class="field">
    <label>Tu DNI (sin puntos) <span class="req">*</span></label>
    <input id="td-dni" class="inp ${d.err?"err":""}" type="number" placeholder="Ej: 30123456"
      value="${escH(d.dni)}"
      oninput="S.tomarDevolucionesModal.dni=this.value;S.tomarDevolucionesModal.err=''"
      onkeydown="if(event.key==='Enter')submitTomarDevoluciones()"/>
    ${d.err?`<span class="err-msg">${escH(d.err)}</span>`:""}
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
    <button class="btn btn-ghost btn-md" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-teal btn-md" onclick="submitTomarDevoluciones()" ${d.loading?"disabled":""}>
      ${d.loading?`<span class="spinner"></span> Registrando...`:`🤲 Tomar ${d.ids.length}`}
    </button>
  </div>`;
}
async function submitTomarDevoluciones(){
  const d = S.tomarDevolucionesModal;
  if(d.loading) return;
  const dni = String(d.dni||"").replace(/\D/g,"");
  if(!dni){ S.tomarDevolucionesModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.tomarDevolucionesModal.err=check.msg; render(); return; }

  d.loading = true; renderNow();

  const nowTs = now();
  const changes = {estado:"En camino", nombreQuienLevanto:check.nombre, dniQuienLevanto:dni, levantadoAt:nowTs, updatedAt:nowTs};
  try{
    const resultados = await Promise.all(
      d.ids.map(id => sb.from("devoluciones").update(toSnakeRow(changes)).eq("id",id))
    );
    const fallidas = resultados.filter(r=>r.error);
    if(fallidas.length===0){
      const idsSet = new Set(d.ids);
      S.devoluciones = S.devoluciones.map(x=>idsSet.has(x.id) ? {...x,...changes} : x);
      S.devolSeleccionTomar = new Set();
      S.modal = null;
      toast(`🤲 ${check.nombre} tomó ${d.ids.length} devolución${d.ids.length!==1?"es":""} — camino a fábrica`);
    } else {
      S.tomarDevolucionesModal.loading=false;
      S.tomarDevolucionesModal.err = `No se pudieron tomar ${fallidas.length} de ${d.ids.length}. Probá de nuevo.`;
    }
  } catch(e){
    S.tomarDevolucionesModal.loading=false;
    S.tomarDevolucionesModal.err = "No se pudo conectar — probá de nuevo.";
  }
  render();
}

function renderDevoluciones(){
  const u = S.user;
  const esGestor = esGestorDevolucion();
  const esRepartidor = u.rol==="repartidor";
  let lista = S.devoluciones;
  if(esRepartidor){
    // Ve todas las pendientes/en curso — pero una vez que producción/logística
    // ya la confirmó (o la cerró como no confirmada), deja de ser relevante
    // para el repartidor y se saca de su vista para no ensuciarla.
    lista = S.devoluciones.filter(d => !["Confirmada","No confirmada"].includes(d.estado));
    if(S.devolucionFiltroSucursal) lista = lista.filter(d=>d.sucursal===S.devolucionFiltroSucursal);
    if(S.devolucionFiltroFecha)    lista = lista.filter(d=>d.createdAt && d.createdAt.slice(0,10)===S.devolucionFiltroFecha);
  } else if(!esGestor){
    const norm = s=>(s||"").trim().toLowerCase();
    lista = lista.filter(d => norm(d.sucursal)===norm(u.area));
  } else {
    if(S.devolucionFiltroSucursal) lista = lista.filter(d=>d.sucursal===S.devolucionFiltroSucursal);
    if(S.devolucionFiltroEstado)   lista = lista.filter(d=>d.estado===S.devolucionFiltroEstado);
    if(S.devolucionFiltroFecha)    lista = lista.filter(d=>d.createdAt && d.createdAt.slice(0,10)===S.devolucionFiltroFecha);
  }

  const colorEstado = e => e==="Confirmada" ? "#1fa86a" : e==="No confirmada" ? "var(--red)" : e==="En fábrica" ? "var(--teal)" : e==="En camino" ? "var(--blue)" : "var(--amber)";

// Para SUCURSAL: solo necesita el nombre de la sucursal como usuario, sin pass
function buscarUsuario(usuario, password){
  const lista = USE_SHEETS ? S.usuarios : DEMO_USUARIOS;
  // normNotif ya quita tildes/mayúsculas — así "guemes" o "Güemes" entran igual
  const u = normNotif(usuario);
  const p = (password||"").trim();

  // ¿Es una sucursal conocida? (login sin contraseña)
  const esSucursal = getSucursales().find(s => normNotif(s) === u);
  if(esSucursal){
    // Buscar si existe en lista con tipo SUCURSAL, o aceptar directamente
    const found = lista.find(x => normNotif(x.usuario) === u && x.tipo === "SUCURSAL" && x.activo !== "no");
    if(USE_SHEETS && !found) return {ok:false, msg:"Esta sucursal no está habilitada. Consultá con logística."};
    return {ok:true, tipo:"SUCURSAL", nombre:esSucursal, area:esSucursal, recorrido:"", dni:found?.dni||""};
  }

  // Buscar usuario por nombre
  const foundUser = lista.find(x => normNotif(x.usuario) === u && x.activo !== "no");

  if(!foundUser){
    return {ok:false, msg:"Usuario no encontrado."};
  }

  // Si el usuario no tiene contraseña configurada → entra directo
  const tienePass = foundUser.password && String(foundUser.password).trim() !== "";
  if(tienePass && foundUser.password !== p){
    return {ok:false, msg:"Contraseña incorrecta."};
  }
  if(tienePass && !p){
    return {ok:false, msg:"Ingresá tu contraseña."};
  }

  return {ok:true, tipo:foundUser.tipo, usuario:foundUser.usuario||"", nombre:foundUser.nombre||foundUser.usuario, area:foundUser.area||"", recorrido:foundUser.recorrido||"", dni:foundUser.dni||""};
}

// Crea una solicitud. A diferencia de Sheets, ACÁ ESPERAMOS la respuesta
// antes de mostrarla — Postgres genera el id solo (sin locks manuales) y
// la respuesta es rápida, así que no hace falta el truco de "mostrar
// optimista y corregir después" que usábamos con Apps Script.
async function sheetsAdd(row){
  if(!USE_SHEETS) return null;
  try{
    const payload = toSnakeRow(row);
    delete payload.id; // que lo genere Postgres, nunca lo mandamos nosotros
    const { data, error } = await sb.from("solicitudes").insert(payload).select().single();
    if(error) throw error;
    return toCamelRow(data);
  }catch(e){
    console.warn("Supabase add:",e);
    toast("⚠️ No se pudo guardar: "+(e?.message||e?.details||JSON.stringify(e)),"warn");
    return null;
  }
}

async function sheetsUpdate(id,data){
  if(!USE_SHEETS) return;
  try{
    const { error } = await sb.from("solicitudes").update(toSnakeRow(data)).eq("id",id);
    if(error) throw error;
  }
  catch(e){console.warn("Supabase update:",e);}
}

// ──────────────────────────────────────────────────────────
//  VALIDAR DNI
//  Busca el DNI en la hoja Usuarios de Sheets.
//  No filtra por tipo — cualquier persona registrada puede validar.
//  Devuelve el nombre para mostrarlo en pantalla.
//  En modo demo (sin Sheets) acepta cualquier DNI de 7-8 dígitos.
// ──────────────────────────────────────────────────────────
function validarDNI(dni){
  // Normalizar: solo dígitos, sin puntos ni espacios
  const dniLimpio = String(dni).replace(/\D/g,"");

  if(!dniLimpio || dniLimpio.length < 7 || dniLimpio.length > 8){
    return {ok:false, msg:"DNI inválido. Debe tener 7 u 8 dígitos (sin puntos)."};
  }

  // Modo demo: acepta cualquier DNI válido y devuelve nombre genérico
  if(!USE_SHEETS){
    return {ok:true, nombre:"Usuario demo", dni:dniLimpio};
  }

  // Buscar en la lista completa de usuarios (incluye sucursales, logística, etc.)
  const lista = S.usuarios;
  const found = lista.find(u => {
    const dniUsuario = String(u.dni||"").replace(/\D/g,"");
    return dniUsuario === dniLimpio;
  });

  if(!found){
    return {ok:false, msg:"DNI no encontrado. Pedile a logística que te registre en el sistema."};
  }

  if(found.activo === "no"){
    return {ok:false, msg:"Este DNI está deshabilitado. Consultá con logística."};
  }

  return {ok:true, nombre:found.nombre||"Sin nombre", dni:dniLimpio, usuario:found};
}

// ══════════════════════════════════════════════════════════
//  RENDER PRINCIPAL
// ══════════════════════════════════════════════════════════
// Render con debounce para evitar reconstrucciones múltiples
// en la misma tarea del event loop
let _renderPending  = false;
let _operacionEnCurso = false; // previene doble submit global
let _ultimoHTML = "";      // último fondo (tabla/pantalla) pintado
let _ultimoHTMLModal = ""; // último modal+lightbox pintado

// Redibuja el DOM parchando SOLO lo que cambió (con morphdom) en vez de
// tirar y reconstruir todo el HTML de una — esto es lo que de verdad
// resuelve el titileo cuando SÍ hay un cambio real (ej. pasar una
// solicitud de Aprobada a Entregada): antes, aunque solo cambiara una
// fila de una tabla larga, se reemplazaba TODA la tabla entera, lo que
// se sentía como que "se borraba todo". Con morphdom, solo se tocan los
// nodos que realmente cambiaron — el resto de la pantalla ni se entera.
// Fondo y modal siguen en contenedores separados (ver fix anterior),
// así que un cambio en uno nunca repinta el otro.
function morphSeguro(el, html){
  // Nunca tocar el elemento donde el usuario está escribiendo ahora mismo
  // (evita perder foco/cursor si un cambio de fondo llega mientras tipea).
  morphdom(el, html, {
    onBeforeElUpdated: (fromEl, toEl) => {
      if(fromEl === document.activeElement &&
         (fromEl.tagName==="INPUT" || fromEl.tagName==="TEXTAREA" || fromEl.tagName==="SELECT")){
        return false;
      }
      return true;
    }
  });
}

function aplicarRenderDOM(){
  const elBg = $("app");
  const elModal = $("app-modal");
  if(!elBg || !elModal) return;

  const htmlBg = S.view==="login" ? renderLogin() : renderApp();
  if(htmlBg !== _ultimoHTML){
    _ultimoHTML = htmlBg;
    morphSeguro(elBg, `<div id="app">${htmlBg}</div>`);
  }

  const htmlModal = S.view==="login" ? "" : (renderModals() + renderLightbox());
  if(htmlModal !== _ultimoHTMLModal){
    _ultimoHTMLModal = htmlModal;
    morphSeguro(elModal, `<div id="app-modal">${htmlModal}</div>`);
  }
}

function render(){
  if(_renderPending) return;
  _renderPending = true;
  requestAnimationFrame(()=>{
    _renderPending = false;
    aplicarRenderDOM();
  });
}

// render inmediato — para casos donde necesitamos ver el cambio YA
// (ej: loading spinner antes de una operación async)
function renderNow(){
  _renderPending = false;
  aplicarRenderDOM();
}

// Se llama al salir del campo usuario (blur) o al presionar Ingresar
// Oculta el campo contraseña si es sucursal O si el usuario no tiene pass configurada
function checkIfSucursal(){
  const val     = ($("l-user")?.value||"").trim().toLowerCase();
  const esSuc   = getSucursales().find(s=>s.toLowerCase()===val);
  const passField = $("pass-field");
  const sucHint   = $("suc-hint");
  if(!passField||!sucHint) return;

  // Verificar si el usuario existe sin contraseña en la lista cargada
  const lista     = USE_SHEETS ? S.usuarios : DEMO_USUARIOS;
  const userMatch = lista.find(x=>x.usuario?.toLowerCase()===val&&x.activo!=="no");
  const sinPass   = userMatch && (!userMatch.password || String(userMatch.password).trim()==="");

  if(esSuc){
    passField.style.display = "none";
    sucHint.style.display   = "block";
    sucHint.innerHTML = `🏪 Entrás como <strong>${escH(esSuc)}</strong> — sin contraseña.<br/>Al crear una solicitud se te pedirá tu DNI.`;
  } else if(sinPass){
    passField.style.display = "none";
    sucHint.style.display   = "block";
    sucHint.innerHTML = `✅ Usuario <strong>${escH(userMatch.nombre||val)}</strong> — sin contraseña requerida.`;
  } else {
    passField.style.display = "block";
    sucHint.style.display   = "none";
  }
}

function renderPlanificacion(){
  const u     = S.user;
  // Ignora mayúsculas/minúsculas y tildes al comparar áreas (ej. "Compras" == "COMPRAS")
  const norm2 = s=>(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const areaN = norm2(u.area);

  // Filtrar: r.area coincide con el área del usuario (normalizado).
  // OJO: NO comparar por "tipo" (u.tipoReal) — el tipo es el permiso
  // compartido por todo el grupo (Compras, RRHH, Administración, etc.),
  // no identifica un área en particular. Si se usa como fallback, todas
  // las áreas del grupo terminan viendo las mismas solicitudes.
  // Solo el área real (usuario/área de Sheets) identifica a cada una.
  const mine = S.requests.filter(r=>{
    const rArea = norm2(r.area);
    if(!rArea || !areaN) return false;
    return rArea===areaN;
  });
  const open  = mine.filter(r=>!["Entregada","Rechazada","No entregada","No levantada"].includes(r.estado));

// ── TESORERÍA VIEW ────────────────────────────────────────
function renderTesoreria(){
  const u = S.user;
  if(!bolsinesActivo()){
    return `
    <div style="animation:fadeUp .3s ease;text-align:center;padding:60px 20px">
      <h2 style="font-size:20px;font-weight:700;margin-bottom:8px">🎒 Bolsines</h2>
      <p style="color:var(--muted);font-size:14px">El módulo de Bolsines está desactivado por Administración por el momento.</p>
    </div>`;
  }
  const pedidosBolsin = S.requests.filter(r=>r.tipoPedido==="bolsin" && !r.loteId && r.destino!=="Tesorería");
  const pendientes    = pedidosBolsin.filter(r=>r.estado==="Pendiente Tesorería");
  const aprobadosParaListo = pedidosBolsin.filter(r=>r.estado==="Aprobada");
  const historialPedidos = pedidosBolsin.filter(r=>!["Pendiente Tesorería","Aprobada"].includes(r.estado))
    .sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  // Bolsines que las sucursales mandan HACIA Tesorería (con plata)
  let bolsinesEnviados = S.requests.filter(r=>r.tipoPedido==="bolsin" && r.destino==="Tesorería")
    .sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const sucursalesTesUnicas = [...new Set(bolsinesEnviados.map(r=>r.sucursal).filter(Boolean))].sort();
  if(S.fTesFecha)    bolsinesEnviados = bolsinesEnviados.filter(r=>r.createdAt && r.createdAt.slice(0,10)===S.fTesFecha);
  if(S.fTesSucursal) bolsinesEnviados = bolsinesEnviados.filter(r=>(r.sucursal||"").toLowerCase().includes(S.fTesSucursal.trim().toLowerCase()));
  if(S.fTesTexto){
    const q = S.fTesTexto.trim().toLowerCase();
    bolsinesEnviados = bolsinesEnviados.filter(r=>[r.id,r.sucursal,r.descripcion,r.observaciones].map(v=>(v||"").toString().toLowerCase()).some(v=>v.includes(q)));
  }

  // Agrupar por loteId (solo lo que tiene tipoPedido="bolsin" y loteId)
  const lotesMap = {};
  S.requests.forEach(r=>{
    if(r.tipoPedido!=="bolsin" || !r.loteId) return;
    if(!lotesMap[r.loteId]) lotesMap[r.loteId] = [];
    lotesMap[r.loteId].push(r);
  });
  const lotes = Object.entries(lotesMap)
    .map(([loteId,filas])=>({
      loteId, filas,
      total: filas.length,
      entregadas: filas.filter(f=>f.estado==="Entregada"||f.estado==="Entregada (sin confirmar)").length,
      pendientesListo: filas.filter(f=>f.estado==="Aprobada").length,
    }))
    .sort((a,b)=> b.loteId.localeCompare(a.loteId));

  return `
  <div style="animation:fadeUp .3s ease">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin-bottom:2px">Tesorería</h2>
        <p style="color:var(--muted);font-size:13px">Bolsines a sucursales</p>
      </div>
      <button class="btn btn-success btn-md" onclick="openNuevoLote()">📦 Nuevo lote de bolsines</button>
    </div>

    <div class="stats-grid">
      ${statCard("🎒","PEDIDOS PENDIENTES",pendientes.length,"var(--amber)")}
      ${statCard("✅","PARA MARCAR LISTOS",aprobadosParaListo.length,"var(--teal)")}
      ${statCard("📦","LOTES ACTIVOS",lotes.filter(l=>l.entregadas<l.total).length,"var(--blue)")}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">🎒 Pedidos de sucursales para aprobar</h3>
      ${pendientes.length===0?`<p style="color:var(--muted);font-size:13px">No hay pedidos pendientes.</p>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal</th><th>Cant.</th><th>Motivo</th><th>Pedido por</th><th></th></tr></thead>
          <tbody>
            ${pendientes.map(r=>`
            <tr>
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.destino)}</td>
              <td>${escH(String(r.cantidad))}</td>
              <td class="trunc">${escH(r.observaciones||"—")}</td>
              <td class="muted-cell">${escH(r.solicitante||"—")}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-success btn-sm" onclick="openPedidoTesoreria('${escH(r.id)}','aprobar')">✅ Aprobar</button>
                <button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="openPedidoTesoreria('${escH(r.id)}','rechazar')">✕ Rechazar</button>
              </td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">✅ Aprobados por logística — marcar como listos</h3>
      ${aprobadosParaListo.length===0?`<p style="color:var(--muted);font-size:13px">No hay pedidos esperando que los prepares.</p>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal</th><th>Cant.</th><th></th></tr></thead>
          <tbody>
            ${aprobadosParaListo.map(r=>`
            <tr>
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.destino)}</td>
              <td>${escH(String(r.cantidad))}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-success btn-sm" onclick="openListo('${escH(r.id)}')">✅ Lista</button>
              </td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">📥 Bolsines recibidos de sucursales</h3>
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <input type="date" class="inp" style="width:160px" value="${escH(S.fTesFecha)}" onchange="S.fTesFecha=this.value;render()"/>
        <input type="text" list="tes-sucursales" class="inp" style="width:200px" placeholder="Sucursal..." value="${escH(S.fTesSucursal)}" oninput="S.fTesSucursal=this.value;render()"/>
        <datalist id="tes-sucursales">${sucursalesTesUnicas.map(s=>`<option value="${escH(s)}">`).join("")}</datalist>
        <input type="text" class="inp" style="width:220px" placeholder="🔎 Buscar N°, descripción..." value="${escH(S.fTesTexto)}" oninput="S.fTesTexto=this.value;render()"/>
        ${(S.fTesFecha||S.fTesSucursal||S.fTesTexto)?`<button class="btn btn-ghost btn-sm" onclick="S.fTesFecha='';S.fTesSucursal='';S.fTesTexto='';render()">✕ Limpiar</button>`:""}
      </div>
      ${bolsinesEnviados.length===0?`<p style="color:var(--muted);font-size:13px">${(S.fTesFecha||S.fTesSucursal||S.fTesTexto)?"No hay bolsines con ese filtro.":"Todavía no llegó ningún bolsín."}</p>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal</th><th>Detalle</th><th>Enviado</th><th>Recibido en Tesorería</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            ${bolsinesEnviados.map(r=>`
            <tr onclick="openDetalle('${escH(r.id)}')" style="cursor:pointer">
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.sucursal)}</td>
              <td><div class="trunc">${escH(r.descripcion)}</div></td>
              <td class="muted-cell">${fdt(r.createdAt)}</td>
              <td class="muted-cell">${r.deliveredAt?fdt(r.deliveredAt):"—"}</td>
              <td>${estadoBadges(r)}</td>
              <td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" onclick="openDetalle('${escH(r.id)}')">Ver</button></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">📦 Lotes de bolsines</h3>
      ${lotes.length===0?`<p style="color:var(--muted);font-size:13px">Todavía no creaste ningún lote.</p>`:`
      <div style="display:flex;flex-direction:column;gap:10px">
        ${lotes.map(l=>`
          <div style="background:var(--s2);border-radius:8px;padding:12px 14px">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
              <div style="cursor:pointer" onclick="toggleLoteExpandido('${escH(l.loteId)}')">
                <strong>${S.loteExpandido===l.loteId?"▾":"▸"} ${escH(l.loteId)}</strong>
                <span style="color:var(--muted);font-size:13px"> · ${l.total} sucursales · ${l.entregadas}/${l.total} entregadas</span>
              </div>
              ${l.pendientesListo>0?`
              <button class="btn btn-success btn-sm" onclick="openLoteListo('${escH(l.loteId)}')">
                ✅ Marcar ${l.pendientesListo} como Listas
              </button>`:`<span style="font-size:12px;color:var(--muted)">Ya están todas listas o en camino</span>`}
            </div>
            ${S.loteExpandido===l.loteId?`
            <div class="table-wrap" style="margin-top:10px">
              <table>
                <thead><tr><th>Sucursal</th><th>Cant.</th><th>Estado</th><th>Recorrido</th><th>Quién lo levantó</th><th>Quién lo entregó / recibió</th><th></th></tr></thead>
                <tbody>
                  ${l.filas.sort((a,b)=>(a.destino||"").localeCompare(b.destino||"")).map(f=>`
                  <tr onclick="openDetalle('${escH(f.id)}')" style="cursor:pointer">
                    <td>${escH(f.destino)}</td>
                    <td>${escH(String(f.cantidad))}</td>
                    <td>${badge(f.estado,S_COLOR[f.estado]||"var(--muted)")}</td>
                    <td class="muted-cell">${escH(f.recorrido||"—")}</td>
                    <td class="muted-cell">${escH(f.nombreQuienLevanto||"—")}</td>
                    <td class="muted-cell">${escH(f.nombreQuienRecibio||f.nombreQuienEntrego||"—")}</td>
                    <td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" onclick="openDetalle('${escH(f.id)}')">Ver</button></td>
                  </tr>`).join("")}
                </tbody>
              </table>
            </div>`:""}
          </div>`).join("")}
      </div>`}
    </div>

    <div class="card" style="margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:12px">🗂️ Historial de pedidos de excepción</h3>
      ${historialPedidos.length===0?`<p style="color:var(--muted);font-size:13px">Todavía no hay pedidos resueltos.</p>`:`
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal</th><th>Cant.</th><th>Estado</th><th>Pedido por</th><th></th></tr></thead>
          <tbody>
            ${historialPedidos.slice(0,30).map(r=>`
            <tr onclick="openDetalle('${escH(r.id)}')" style="cursor:pointer">
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.destino)}</td>
              <td>${escH(String(r.cantidad))}</td>
              <td>${badge(r.estado,S_COLOR[r.estado]||"var(--muted)")}</td>
              <td class="muted-cell">${escH(r.solicitante||"—")}</td>
              <td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" onclick="openDetalle('${escH(r.id)}')">Ver</button></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>
  </div>`;
}

async function confirmarBorrarSolicitud(id){
  if(!confirm(`¿Seguro que querés borrar la solicitud ${id}? Esto no se puede deshacer.`)) return;
  try{
    const { error } = await sb.from("solicitudes").delete().eq("id",id);
    if(error) throw error;
    S.requests = S.requests.filter(r=>r.id!==id);
    toast(`🗑️ Solicitud ${id} borrada`);
  }catch(e){ toast("⚠️ No se pudo borrar","warn"); }
  render();
}

function abrirEditarUsuario(dniId){
  const us = S.usuarios.find(x=>x.dni===dniId);
  if(!us) return;

async function guardarUsuario(){
  const f = S.usuarioForm;
  const usuario = ($("uf-usuario")?.value||f.usuario||"").trim();
  const tipo = ($("uf-tipo")?.value||f.tipo||"").trim();
  const dni = ($("uf-dni")?.value||f.dni||"").trim();
  if(!usuario){ S.usuarioForm.err="El usuario (login) es obligatorio."; render(); return; }
  if(!tipo){ S.usuarioForm.err="Elegí un tipo."; render(); return; }
  if(!dni){ S.usuarioForm.err="El DNI es obligatorio — es lo que identifica a cada persona (varias pueden compartir el mismo login)."; render(); return; }
  // El DNI es la clave real — si es alta nueva, que no choque con otra persona
  if(!f.dniOriginal && S.usuarios.some(u=>u.dni===dni)){
    S.usuarioForm.err="Ya existe una persona cargada con ese DNI."; render(); return;
  }

  const datos = {
    usuario,
    password: $("uf-password")?.value||f.password||"",
    tipo,
    nombre: $("uf-nombre")?.value||f.nombre||"",
    area: $("uf-area")?.value||f.area||"",
    recorrido: $("uf-recorrido")?.value||f.recorrido||"",
    dni: $("uf-dni")?.value||f.dni||"",
    email: $("uf-email")?.value||f.email||"",
    activo: $("uf-activo")?.value||f.activo||"si",
  };

  S.usuarioForm.loading = true; renderNow();
  try{
    if(f.dniOriginal){
      const { error } = await sb.from("usuarios").update(datos).eq("dni", f.dniOriginal);
      if(error) throw error;
      S.usuarios = S.usuarios.map(u=>u.dni===f.dniOriginal?datos:u);
      toast(`✅ Usuario ${usuario} actualizado`);
    } else {
      const { error } = await sb.from("usuarios").insert(datos);
      if(error) throw error;
      S.usuarios = [datos, ...S.usuarios];
      toast(`✅ Usuario ${usuario} creado`);
    }
    S.modal = null;
  }catch(e){
    S.usuarioForm.loading = false;
    S.usuarioForm.err = "No se pudo guardar — probá de nuevo.";
  }
  render();
}

async function confirmarBorrarUsuario(usuarioId){
  if(!confirm(`¿Seguro que querés borrar el usuario "${usuarioId}"? Esto no se puede deshacer.`)) return;
  try{
    const { error } = await sb.from("usuarios").delete().eq("usuario", usuarioId);
    if(error) throw error;
    S.usuarios = S.usuarios.filter(u=>u.usuario!==usuarioId);
    toast(`🗑️ Usuario ${usuarioId} borrado`);
  }catch(e){ toast("⚠️ No se pudo borrar","warn"); }
  render();
}

function renderSucursalArea(){
  const u=S.user;
  // Incluir solicitudes donde la sucursal es ORIGEN o DESTINO
  // La sucursal que recibe también puede ver el estado de lo que le viene
  const norm  = s => (s||"").trim().toLowerCase();
  const areaU = norm(u.area);

  // Construir lista de todos los nombres posibles de esta área/sucursal
  // (el nombre puede estar escrito de formas ligeramente distintas)
  const todosLosMios = new Set([areaU]);
  // Agregar variantes desde la lista maestra de sucursales
  getSucursales().forEach(s=>{ if(norm(s)===areaU) todosLosMios.add(norm(s)); });
  getDestinos().forEach(d=>{ if(norm(d)===areaU) todosLosMios.add(norm(d)); });

  const matchArea = s => { const n=norm(s); return !!n && todosLosMios.has(n); };

  const mine = S.requests.filter(r=>{
    const esOrigen  = matchArea(r.sucursal) || matchArea(r.area);
    const esDestino = matchArea(r.destino);
    return esOrigen || esDestino;
  });

  const miosPedidos    = mine.filter(r => matchArea(r.sucursal)||matchArea(r.area));
  const miDestinoQ     = mine.filter(r => matchArea(r.destino) && !matchArea(r.sucursal) && !matchArea(r.area));
  const lleganActivas  = miDestinoQ.filter(r=>!["Entregada","Rechazada","No entregada","No levantada"].includes(r.estado));
  const lleganHistorial= miDestinoQ.filter(r=>["Entregada","Rechazada","No entregada","No levantada"].includes(r.estado));

             : S.tabSuc==="destino"  ? lleganActivas
             : [...hist, ...lleganHistorial];
  const listF = S.fSucFecha ? list.filter(r=>r.createdAt && r.createdAt.startsWith(S.fSucFecha)) : list;

  return `
  <div style="animation:fadeUp .3s ease">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin-bottom:2px">Mis Solicitudes</h2>

      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-success btn-md" onclick="openModal('nuevaSol')">+ Nueva solicitud</button>
        ${u.rol==="sucursal"?`<button class="btn btn-danger btn-md" onclick="openQuiebreStock()">🚨 Quiebre de stock</button>`:""}
        ${bolsinesActivo()?`
        <button class="btn btn-warn btn-md" onclick="openPedirBolsin()">🎒 Pedir bolsín</button>
        <button class="btn btn-teal btn-md" onclick="openEnviarBolsin()">📤 Enviar bolsín</button>`:""}
      </div>
    </div>
    <div class="stats-grid">
      ${statCard("📤","MIS PEDIDOS",miosPedidos.length,"var(--blue)")}
      ${statCard("📥","ME LLEGAN",miDestinoQ.length,"var(--teal)")}
      ${statCard("✅","APROBADAS",mine.filter(r=>r.estado==="Aprobada").length,"var(--green)")}
      ${statCard("📦","ENTREGADAS",mine.filter(r=>r.estado==="Entregada").length,"#1fa86a")}
    </div>
    <div class="tabs">
      <button class="tab ${S.tabSuc==="abiertas"?"active":""}" onclick="S.tabSuc='abiertas';render()">Abiertas (${open.length})</button>

            </tr>`;}).join("")}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function renderLogistica(){
  return `
  <div style="animation:fadeUp .3s ease">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">

    </div>
    ${S.tabLog==="solicitudes"?renderLogTabla():renderMetricas()}
  </div>`;

function renderLogTabla(){
  const f=S;
  const filtered=S.requests.filter(r=>{
    if(f.fEstado    && r.estado    !==f.fEstado)    return false;
    if(f.fSucursal  && r.sucursal!==f.fSucursal && r.area!==f.fSucursal && origenLabel(r)!==f.fSucursal) return false;
    if(f.fDestino   && r.destino   !==f.fDestino)   return false;
    if(f.fPrioridad && r.prioridad !==f.fPrioridad) return false;
    if(f.fFecha     && !r.createdAt.startsWith(f.fFecha)) return false;
    if(f.fFechaRequerida && !(r.fechaRequerida||"").startsWith(f.fFechaRequerida)) return false;
    if(f.fRecorrido && r.recorrido !==f.fRecorrido) return false;
    if(f.fSolicitante && !(solicitanteLabel(r)||"").toLowerCase().includes(f.fSolicitante.trim().toLowerCase())) return false;
    if(f.fTexto){
      const q = f.fTexto.trim().toLowerCase();
      const campos = [r.id,r.descripcion,r.sucursal,r.area,r.destino,solicitanteLabel(r),r.observaciones,r.comentario,r.recorrido,r.unidad]
        .map(v=>(v||"").toString().toLowerCase());
      if(!campos.some(v=>v.includes(q))) return false;
    }
    return true;
  });
  const hasF=f.fEstado||f.fSucursal||f.fDestino||f.fPrioridad||f.fFecha||f.fFechaRequerida||f.fRecorrido||f.fSolicitante||f.fTexto;
  const reqs=S.requests;
  const recOpts=S.recorridos.length?S.recorridos:["SUR","CENTRO","NORTE"];

  // Lotes de bolsines que ya están "Lista para retirar" pero todavía tienen
  // filas sin recorrido asignado — acá logística asigna todo junto.
  const lotesMap = {};
  S.requests.forEach(r=>{
    if(r.tipoPedido!=="bolsin" || !r.loteId) return;
    if(!["Lista para retirar","Aprobada"].includes(r.estado)) return;
    if(!lotesMap[r.loteId]) lotesMap[r.loteId]=[];
    lotesMap[r.loteId].push(r);
  });
  const lotesPendRecorrido = Object.entries(lotesMap)
    .map(([loteId,filas])=>({loteId, filas, sinRecorrido: filas.filter(f=>!f.recorrido).length}))
    .filter(l=>l.sinRecorrido>0);

  return `
  ${lotesPendRecorrido.length?`
  <div class="card" style="margin-bottom:20px;padding:14px 16px;border-left:3px solid var(--blue)">
    <h3 style="font-size:14px;font-weight:700;margin-bottom:10px">🚚 Lotes de bolsines esperando recorrido</h3>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${lotesPendRecorrido.map(l=>`
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <span style="font-size:13px"><strong>${escH(l.loteId)}</strong> · ${l.sinRecorrido} de ${l.filas.length} sin recorrido</span>
          <button class="btn btn-teal btn-sm" onclick="openLoteRecorrido('${escH(l.loteId)}')">🚚 Asignar recorridos</button>
        </div>`).join("")}
    </div>
  </div>`:""}
  <div class="stats-grid">
    ${statCard("📋","PENDIENTES",reqs.filter(r=>r.estado==="Pendiente").length,"var(--muted)")}
    ${statCard("✅","APROBADAS",reqs.filter(r=>r.estado==="Aprobada").length,"var(--green)")}
    ${statCard("📅","PROGRAMADAS",reqs.filter(r=>r.estado==="Programada").length,"var(--purple)")}
    ${statCard("📦","ENTREGADAS",reqs.filter(r=>r.estado==="Entregada").length,"var(--teal)")}
  </div>
  <div class="card" style="margin-bottom:20px;padding:14px 16px">
    <div class="filter-grid">
      <div class="field" style="margin-bottom:0"><label>Estado</label>
        <select onchange="S.fEstado=this.value;render()">
          <option value="">Todos</option>${ESTADOS.map(s=>`<option ${f.fEstado===s?"selected":""}>${escH(s)}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Origen</label>
        <select onchange="S.fSucursal=this.value;render()">
          <option value="">Todos los orígenes</option>
          ${[...getSucursales(),...(S.destinos.length?S.destinos:["Compras","RRHH","Logística"])].filter((v,i,a)=>a.indexOf(v)===i).map(s=>`<option ${f.fSucursal===s?"selected":""}>${escH(s)}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Destino</label>
        <select onchange="S.fDestino=this.value;render()">
          <option value="">Todos los destinos</option>
          ${getDestinos().map(s=>`<option ${f.fDestino===s?"selected":""}>${escH(s)}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Prioridad</label>
        <select onchange="S.fPrioridad=this.value;render()">
          <option value="">Todas</option>${PRIORIDADES.map(p=>`<option ${f.fPrioridad===p?"selected":""}>${p}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Recorrido</label>
        <select onchange="S.fRecorrido=this.value;render()">
          <option value="">Todos</option>${recOpts.map(r=>`<option ${f.fRecorrido===r?"selected":""}>${escH(r)}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:0"><label>Fecha (creación)</label>
        <input type="date" class="inp" value="${f.fFecha}" onchange="S.fFecha=this.value;render()"/>
      </div>
      <div class="field" style="margin-bottom:0"><label>Fecha requerida</label>
        <input type="date" class="inp" value="${f.fFechaRequerida}" onchange="S.fFechaRequerida=this.value;render()"/>
      </div>
      <div class="field" style="margin-bottom:0"><label>Solicitante</label>
        <input type="text" id="f-solicitante" class="inp" placeholder="Buscar por nombre... (Enter)" value="${escH(f.fSolicitante)}"
          onkeydown="if(event.key==='Enter'){S.fSolicitante=this.value;render();}"
          onblur="S.fSolicitante=this.value;render();"/>
      </div>
      <div class="field" style="margin-bottom:0;grid-column:1/-1"><label>🔎 Buscar en todo (N°, descripción, origen, destino, comentario...)</label>
        <input type="text" id="f-texto" class="inp" placeholder="Escribí y aparece todo lo que coincida..." value="${escH(f.fTexto)}"
          oninput="S.fTexto=this.value;render()"/>
      </div>
    </div>
    ${hasF?`<div class="filter-bar"><span>${filtered.length} resultado${filtered.length!==1?"s":""}</span><button class="btn btn-ghost btn-sm" onclick="clearFilters()">✕ Limpiar</button></div>`:""}
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button class="btn ${S.modoSeleccion?"btn-primary":"btn-ghost"} btn-sm" onclick="S.modoSeleccion=!S.modoSeleccion; if(!S.modoSeleccion) S.logSeleccion=new Set(); render()">
      ${S.modoSeleccion?"✕ Cancelar selección":"◯ Seleccionar"}
    </button>
  </div>
  ${S.modoSeleccion && S.logSeleccion.size>0?`
  <div class="card" style="margin-bottom:14px;padding:12px 16px;border-left:3px solid var(--blue);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <strong>${S.logSeleccion.size} seleccionada${S.logSeleccion.size!==1?"s":""}</strong>
    <select id="log-estado-masivo" class="inp" style="width:200px">
      ${ESTADOS.map(s=>`<option ${s==="Entregada"?"selected":""}>${escH(s)}</option>`).join("")}
    </select>
    <button class="btn btn-success btn-sm" onclick="openCambioEstadoMasivo()">Aplicar a seleccionadas</button>
    <button class="btn btn-ghost btn-sm" onclick="S.logSeleccion=new Set();render()">✕ Deseleccionar todo</button>
  </div>`:""}
  <div class="card-flush">
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${S.modoSeleccion?`<th><input type="checkbox" class="chk-round" ${filtered.length&&filtered.every(r=>S.logSeleccion.has(r.id))?"checked":""} onchange="toggleLogSeleccionTodos(this.checked)"/></th>`:""}
          <th>N°</th><th>Fecha</th><th>Origen</th><th>Solicitante</th>
          <th>Destino</th><th>Descripción</th><th>Cant.</th><th>F.Req.</th>
          <th>Prioridad</th><th>Estado</th><th>Recorrido</th><th>Acción</th>
        </tr></thead>
        <tbody>
          ${filtered.length===0?`<tr class="empty-row"><td colspan="${S.modoSeleccion?13:12}">Sin resultados</td></tr>`:""}
          ${filtered.map(r=>`<tr onclick="openDetalle('${escH(r.id)}')" style="cursor:pointer">
            ${S.modoSeleccion?`<td onclick="event.stopPropagation()"><input type="checkbox" class="chk-round" ${S.logSeleccion.has(r.id)?"checked":""} onchange="toggleLogSeleccion('${escH(r.id)}',this.checked)"/></td>`:""}
            <td class="id-cell">${escH(r.id)}</td>
            <td class="muted-cell">${fd(r.createdAt)}</td>
            <td style="font-weight:500">${escH(origenLabel(r))}</td>
            <td class="muted-cell">${escH(solicitanteLabel(r))}</td>
            <td class="muted-cell">${escH(r.destino)}</td>
            <td><div class="trunc">${escH(r.descripcion)}</div></td>
            <td class="mono">${escH(String(r.cantidad))} ${escH(r.unidad)}</td>
            <td class="muted-cell">${fd(r.fechaRequerida)}</td>
            <td>${badge(r.prioridad,P_COLOR[r.prioridad])}</td>
            <td>${estadoBadges(r)}</td>
            <td class="muted-cell">${r.recorrido?badge(r.recorrido,"var(--teal)"):"—"}</td>
            <td style="white-space:nowrap" onclick="event.stopPropagation()">
              <button class="btn btn-ghost btn-sm" onclick="openDetalle('${escH(r.id)}')">Ver</button>
              ${r.estado!=="Entregada"&&r.estado!=="Rechazada"?`<button class="btn btn-primary btn-sm" style="margin-left:4px" onclick="openGestionar('${escH(r.id)}')">Gestionar</button>`:""}
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderMetricas(){
  const reqs=S.requests; const total=reqs.length||1;
  const byS={},byE={};
  getDestinos().forEach(s=>{byS[s]=reqs.filter(r=>(r.sucursal||r.area)===s).length;});
  ESTADOS.forEach(e=>{byE[e]=reqs.filter(r=>r.estado===e).length;});
  const wa=reqs.filter(r=>r.approvedAt&&r.createdAt);
  const avgR=wa.length?Math.round(wa.reduce((a,r)=>a+(dh(r.createdAt,r.approvedAt)||0),0)/wa.length):null;
  const wd=reqs.filter(r=>r.deliveredAt&&r.scheduledAt);
  const avgD=wd.length?Math.round(wd.reduce((a,r)=>a+(dh(r.scheduledAt,r.deliveredAt)||0),0)/wd.length):null;
  const noEntregadas = reqs.filter(r=>r.estado==="No entregada");
  const noEntregadasReprog = noEntregadas.filter(r=>reqs.some(x=>x.reprogramadaDeId===r.id)).length;
  return `
  <div class="metrics-grid">
    <div class="card">
      <p style="font-size:10px;font-weight:700;color:var(--faint);letter-spacing:1.5px;margin-bottom:14px">KPIs</p>
      <div class="kpi-mini-grid">
        <div class="kpi-mini"><div class="kpi-mini-val" style="color:var(--blue)">${reqs.length}</div><div class="kpi-mini-lbl">Total</div></div>
        <div class="kpi-mini"><div class="kpi-mini-val" style="color:var(--red)">${reqs.filter(r=>r.prioridad==="Urgente").length}</div><div class="kpi-mini-lbl">Urgentes</div></div>
        <div class="kpi-mini"><div class="kpi-mini-val" style="color:var(--amber)">${reqs.filter(r=>r.estado==="Rechazada").length}</div><div class="kpi-mini-lbl">Rechazadas</div></div>
        <div class="kpi-mini"><div class="kpi-mini-val" style="color:var(--teal)">${reqs.filter(r=>r.estado==="Entregada").length}</div><div class="kpi-mini-lbl">Entregadas</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--muted)">⚡ T. prom. respuesta</span><span class="mono" style="color:var(--blue)">${avgR!=null?avgR+"h":"—"}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--muted)">🚚 T. prom. entrega</span><span class="mono" style="color:var(--green)">${avgD!=null?avgD+"h":"—"}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--muted)">⚠️ No entregadas</span><span class="mono" style="color:var(--red)">${noEntregadas.length} <span style="color:var(--faint);font-weight:400">(${noEntregadasReprog} reprogramadas)</span></span></div>
      </div>
    </div>
    <div class="card">
      <p style="font-size:10px;font-weight:700;color:var(--faint);letter-spacing:1.5px;margin-bottom:14px">POR ESTADO</p>
      ${ESTADOS.map(e=>bar(e,byE[e]||0,total,S_COLOR[e])).join("")}
    </div>
    <div class="card" style="grid-column:1/-1">
      <p style="font-size:10px;font-weight:700;color:var(--faint);letter-spacing:1.5px;margin-bottom:14px">POR SUCURSAL / ÁREA</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 32px">
        ${Object.entries(byS).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).map(([s,v])=>bar(s,v,total,"var(--blue)")).join("")}
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════
