            <div style="font-size:11px;color:var(--faint)">Inicio: ${horaSolo(f.hora_inicio)}</div>
            <div style="font-size:11px;color:var(--faint)">Fin: ${horaSolo(f.hora_fin)}</div>
            <div style="margin-top:6px;font-size:11px;font-weight:600;color:${ok?"#1fa86a":"var(--amber)"}">${escH(f.estado||"⏳ Pendiente")}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`:""}
  </div>`;
}

// El origen está "cubierto" si es Fábrica (todo recorrido arranca ahí,
// siempre se levanta antes de salir) o si esa sucursal ya está en la
// lista de paradas armada.
function origenCubierto(r, paradas){
  return esOrigenFabrica(r) || paradas.includes(r.sucursal);
}
// Si sale de Fábrica, además del origen (siempre cubierto) hace falta
// que el DESTINO esté en la lista — si no, no tiene sentido levantarla
// para volver a traerla a Fábrica sin entregarla en ningún lado. Si es
// entre sucursales, alcanza con el origen (la vuelta a Fábrica ya
// resuelve el resto, por si no se agrega el destino).
function esAsignable(r, paradas){
  return esOrigenFabrica(r) ? paradas.includes(r.destino) : paradas.includes(r.sucursal);
}
function transferenciasPendientesEntreSucursales(){
  const permitidos = ["Pendiente","En revisión","Aprobada","Lista para retirar","En fábrica"];
  return (S.requests||[]).filter(r=>{
    if(!permitidos.includes(r.estado)) return false;
    if(esDestinoBuzon(r.destino)) return false; // Tesorería queda en Fábrica — es la vuelta, no una parada real
    if(!r.destino) return false;
    return true;
  }).sort((a,b)=>(a.fechaRequerida||"").localeCompare(b.fechaRequerida||""));
}

function renderArmarRecorrido(){
  const f = S.armarRecorridoForm;
  const puntos = puntosDisponiblesRecorrido();
  const nombresSugeridos = [...new Set([...(S.recorridos||[]), ...nombresRecorridosConHoja()])];

  if(S.flotaEstadoHoyLoading){
    return `<div style="text-align:center;padding:60px;color:var(--muted)"><span class="spinner"></span> Cargando datos de Flota...</div>`;
  }
  if(!S.flotaMatrizTiempos || !S.flotaMatrizTiempos.length){
    return `<div class="card" style="padding:20px;text-align:center;color:var(--muted)">
      Todavía no hay ninguna matriz de tiempos cargada (flota_matriz_tiempos) — sin eso no se puede calcular el tiempo entre paradas.
      <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="cargarEstadoFlotaHoy()">↻ Reintentar</button></div>
    </div>`;
  }

  let acumulado = 0, anterior = "FABRICA", faltaDato = false;

  // Transferencias asignadas a este recorrido que salen de FÁBRICA —
  // no aparecen bajo ninguna parada (su origen literal es "Fábrica",
  // no una sucursal de la lista), así que van en su propia sección
  // arriba de todo, antes de la primera parada.
  const asignadasDesdeFabrica = f.nombre.trim()
    ? (S.requests||[]).filter(r=>
        normNotif(r.recorrido)===normNotif(f.nombre) &&
        esOrigenFabrica(r) &&
        ["Pendiente","En revisión","Aprobada","Lista para retirar","En fábrica"].includes(r.estado) &&
        !esDestinoBuzon(r.destino)
      )
    : [];
  const filaSalidaFabrica = asignadasDesdeFabrica.length ? `
    <div style="margin:0 0 10px 0;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em">🏭 Se levantan al salir de Fábrica</div>
      ${asignadasDesdeFabrica.map(r=>`
        <div onclick="openDetalle('${escH(r.id)}')" style="border-left:3px solid ${S_COLOR[r.estado]||"var(--border)"};background:var(--surface);border-radius:6px;padding:9px 12px;cursor:pointer">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="font-size:13px;font-weight:700">→ ${escH(r.destino)}</div>
            <div style="display:flex;gap:3px;flex-shrink:0" onclick="event.stopPropagation()">
              ${badge(r.prioridad,P_COLOR[r.prioridad])}
              <button class="btn btn-ghost btn-sm" style="padding:1px 6px" onclick="desasignarTransferenciaDeRecorrido('${escH(r.id)}')" title="Quitar del recorrido">✕</button>
            </div>
          </div>
          <div style="font-size:12px;color:var(--faint)">${escH(r.descripcion||"")} · ${escH(String(r.cantidad||""))} ${escH(r.unidad||"")}</div>
        </div>`).join("")}
    </div>`:"";

  const filasParadas = f.paradas.map((p,i)=>{
    const tramo = minutosEntre(anterior, p);
    let legTxt;
    if(tramo===null){ faltaDato = true; legTxt = `<span style="color:var(--red)">sin dato entre "${escH(anterior==="FABRICA"?"Fábrica":anterior)}" y "${escH(p)}"</span>`; }
    else { acumulado += tramo; legTxt = `+${tramo} min viaje desde ${escH(anterior==="FABRICA"?"Fábrica":anterior)}`; }
    anterior = p;

    // Tiempo de descarga de esta parada — si el recorrido no tiene
    // nombre todavía, no hay con qué buscarlo en flota_tiempos_estimados.
    const estDescarga = f.nombre.trim() ? (S.flotaTiemposEstimados||[]).find(t=>normNotif(t.recorrido)===normNotif(f.nombre) && normNotif(t.sucursal)===normNotif(p)) : null;
    const bultosHoy = f.nombre.trim() ? bultosRealesHoy(f.nombre, p) : 0;
    const bultosMostrar = bultosHoy>0 ? bultosHoy : (estDescarga ? Number(estDescarga.bultos_ref)||0 : 0);
    const minDescarga = f.nombre.trim() ? Math.round(tiempoDescarga(f.nombre, p)) : 0;
    let descargaTxt = "";
    if(f.nombre.trim() && minDescarga>0){
      acumulado += minDescarga;
      descargaTxt = ` · 📦 ${minDescarga} min descarga${bultosMostrar>0?` (${bultosMostrar} bultos)`:""}`;
    }

    // Transferencias ya asignadas a este recorrido que salen justo de
    // esta parada — se muestran acá para verlas en el punto exacto del
    // recorrido donde se recogen. Mismo criterio que el panel de
    // arriba (no bolsines al buzón, solo estados relevantes).
    const asignadasDesdeAca = f.nombre.trim()
      ? (S.requests||[]).filter(r=>
          normNotif(r.recorrido)===normNotif(f.nombre) &&
          normNotif(r.sucursal)===normNotif(p) &&
          ["Pendiente","En revisión","Aprobada","Lista para retirar","En fábrica"].includes(r.estado) &&
          !esDestinoBuzon(r.destino)
        )
      : [];

    return `
    <div class="card" draggable="true" ondragstart="_dragParadaStart(event,${i})" ondragover="event.preventDefault()" ondragenter="_dragParadaEnter(event,${i})" ondrop="_dragParadaDrop(event,${i})" ondragend="_dragParadaEnd(event)"
      style="padding:11px 14px;background:var(--s2);display:flex;align-items:center;gap:12px;margin-bottom:4px;transition:opacity .15s" id="ar-parada-${i}">
      <div style="cursor:grab;color:var(--faint);font-size:16px;flex-shrink:0;touch-action:none" title="Arrastrá para reordenar">⠿</div>
      <div style="width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--amber);flex-shrink:0">${i+1}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14px">${escH(p)}</div>
        <div style="font-size:12px;color:var(--muted)">${legTxt}${descargaTxt} · acum: ${faltaDato?"—":Math.round(acumulado)+" min"}</div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0">
        <button class="btn btn-ghost btn-sm" onclick="subirParadaRecorrido(${i})" ${i===0?"disabled":""}>↑</button>
        <button class="btn btn-ghost btn-sm" onclick="bajarParadaRecorrido(${i})" ${i===f.paradas.length-1?"disabled":""}>↓</button>
        <button class="btn btn-ghost btn-sm" onclick="quitarParadaRecorrido(${i})">✕</button>
      </div>
    </div>
    <div ondragover="event.preventDefault()" ondrop="_dropTransferenciaEnParada(event,'${escH(p)}')" id="ar-conector-${i}"
      style="min-height:10px;margin:0 0 8px 38px;padding:${asignadasDesdeAca.length?"6px":"2px"};border-radius:6px;border:1px dashed var(--border);display:flex;flex-direction:column;gap:6px;transition:background .15s">
      ${asignadasDesdeAca.map(r=>`
        <div onclick="openDetalle('${escH(r.id)}')" style="border-left:3px solid ${S_COLOR[r.estado]||"var(--border)"};background:var(--surface);border-radius:6px;padding:7px 10px;cursor:pointer">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="font-size:12px;font-weight:700">→ ${escH(r.destino)}</div>
            <div style="display:flex;gap:3px;flex-shrink:0" onclick="event.stopPropagation()">
              ${badge(r.prioridad,P_COLOR[r.prioridad])}
              <button class="btn btn-ghost btn-sm" style="padding:1px 6px" onclick="desasignarTransferenciaDeRecorrido('${escH(r.id)}')" title="Quitar del recorrido">✕</button>
            </div>
          </div>
          <div style="font-size:11px;color:var(--faint)">${escH(r.descripcion||"")} · ${escH(String(r.cantidad||""))} ${escH(r.unidad||"")}</div>
        </div>`).join("")}
    </div>`;
  }).join("");

  // Vuelta a Fábrica — siempre el cierre del recorrido, se suma acá
  // para que el total mostrado sea el del recorrido completo (antes
  // solo se veía en el toast de "Sugerir orden óptimo", no acá).
  let filaVuelta = "";
  if(f.paradas.length>0){
    const tramoVuelta = minutosEntre(anterior, "FABRICA");
    if(tramoVuelta===null){ faltaDato = true; }
    else { acumulado += tramoVuelta; }
    filaVuelta = `
    <div class="card" style="padding:11px 14px;background:var(--s2);display:flex;align-items:center;gap:12px;margin-bottom:8px;opacity:.75">
      <div style="width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0">🏠</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14px">Fábrica (vuelta)</div>
        <div style="font-size:12px;color:var(--muted)">${tramoVuelta===null?`<span style="color:var(--red)">sin dato desde "${escH(anterior)}"</span>`:`+${tramoVuelta} min desde ${escH(anterior)}`} · acum: ${faltaDato?"—":Math.round(acumulado)+" min"}</div>
      </div>
    </div>`;
  }

  // Transferencias PENDIENTES entre sucursales (no las que salen de
  // Fábrica — esas ya están en "Carga planificada" — sino las que van
  // de una sucursal a otra, que son las que definen si conviene armar
  // el recorrido en un sentido o en el otro).
  const transferenciasEntreSucursales = transferenciasPendientesEntreSucursales();
  const cubiertasSinAsignar = transferenciasEntreSucursales.filter(r=>
    esAsignable(r, f.paradas) &&
    !(f.nombre.trim() && normNotif(r.recorrido)===normNotif(f.nombre))
  );

  const panelTransferencias = `
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <label style="margin-bottom:0">🔄 Transferencias pendientes entre sucursales (${transferenciasEntreSucursales.length})</label>
        ${cubiertasSinAsignar.length && f.nombre.trim()?`<button class="btn btn-success btn-sm" onclick="asignarTodasLasCubiertas()">✅ Asignar las ${cubiertasSinAsignar.length} cubiertas</button>`:""}
      </div>
      <p style="font-size:12px;color:var(--faint);margin-bottom:10px">Tocá una para gestionarla. Con que el recorrido pase por el origen ya se puede asignar — si no agregás también el destino, vuelve a Fábrica con el resto.</p>
      ${!transferenciasEntreSucursales.length?`<p style="color:var(--muted);font-size:13px;text-align:center;padding:12px">No hay transferencias pendientes entre sucursales ahora mismo.</p>`:`
      <div style="display:flex;flex-direction:column;gap:6px;max-height:480px;overflow-y:auto">
        ${transferenciasEntreSucursales.map(r=>{
          const origenEnLista = origenCubierto(r, f.paradas);
          const destinoEnLista = f.paradas.includes(r.destino);
          // Si sale de Fábrica, no alcanza con "pasar por el origen"
          // (ya arranca ahí siempre) — hace falta que el destino
          // también esté en la lista, porque si no, no tiene sentido
          // levantarla para volver a traerla a Fábrica sin entregarla.
          const asignable = esOrigenFabrica(r) ? destinoEnLista : origenEnLista;
          const yaAsignada = f.nombre.trim() && normNotif(r.recorrido)===normNotif(f.nombre);
          // Última hora de la trazabilidad (lo que haya pasado más
          // reciente: se generó, se aprobó, o quedó lista para retirar).
          const ultimaHora = [r.createdAt, r.approvedAt, r.listoAt, r.updatedAt].filter(Boolean).sort().pop();
          return `
          <div draggable="true" ondragstart="_dragTransferenciaStart(event,'${escH(r.id)}')" ondragend="_dragTransferenciaEnd(event)" onclick="openDetalle('${escH(r.id)}')"
            style="border-left:4px solid ${S_COLOR[r.estado]||"var(--border)"};background:var(--s2);border-radius:6px;padding:8px 12px;cursor:grab;${destinoEnLista?"box-shadow:0 0 0 1px #1fa86a50":origenEnLista?"box-shadow:0 0 0 1px #e8a02050":""}">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <div style="font-size:15px;font-weight:700;flex:1;min-width:140px">${escH(r.sucursal)} → ${escH(r.destino)}</div>
              ${ultimaHora?`<span style="font-size:11px;color:var(--faint);flex-shrink:0">${fdt(ultimaHora)}</span>`:""}
              <div style="display:flex;gap:5px;flex-shrink:0">${badge(r.prioridad,P_COLOR[r.prioridad])}${badge(r.estado,S_COLOR[r.estado])}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px">
              <div style="font-size:12px;color:var(--muted);flex:1;min-width:120px">${escH(r.descripcion||"")} · ${escH(String(r.cantidad||""))} ${escH(r.unidad||"")}${yaAsignada?` · <span style="color:#4ade80;font-weight:600">✓ asignada</span>`:""}${(yaAsignada && origenEnLista && !destinoEnLista)?` · <span style="color:var(--amber);font-weight:600">🏠 vuelve a Fábrica</span>`:""}</div>
              <div style="display:flex;gap:6px;flex-shrink:0" onclick="event.stopPropagation()">
                ${!origenEnLista?`<button class="btn btn-ghost btn-sm" onclick="agregarParadaDirecta('${escH(r.sucursal)}')" title="Agregar ${escH(r.sucursal)}">+${escH(r.sucursal.slice(0,3))}</button>`:""}
                ${!destinoEnLista?`<button class="btn btn-ghost btn-sm" onclick="agregarParadaDirecta('${escH(r.destino)}')" title="Agregar ${escH(r.destino)}">+${escH(r.destino.slice(0,3))}</button>`:""}
                ${asignable && f.nombre.trim() && !yaAsignada?`<button class="btn btn-success btn-sm" onclick="asignarTransferenciaARecorrido('${escH(r.id)}','${escH(f.nombre)}')">📍 Asignar</button>`:""}
              </div>
            </div>
          </div>`;
        }).join("")}
      </div>`}
    </div>`;

  return `
  <div>
    <div class="card" style="margin-bottom:16px">
      <div class="field">
        <label>Nombre del recorrido</label>
        <div style="display:flex;gap:10px">
          <input id="ar-nombre" class="inp" list="ar-dl-recorridos" placeholder="Ej: SUR, CENTRO, NORTE..." value="${escH(f.nombre)}"
            oninput="onCambiaNombreRecorrido(this.value)"/>
          <datalist id="ar-dl-recorridos">${nombresSugeridos.map(n=>`<option value="${escH(n)}">`).join("")}</datalist>
        </div>
      </div>
    </div>

    ${panelTransferencias}

    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="S.armarRecorridoForm.mostrarAgregarDireccion=!S.armarRecorridoForm.mostrarAgregarDireccion;render()">
        <label style="margin-bottom:0;cursor:pointer">➕ Direcciones agregadas a mano</label>
        <span style="color:var(--faint)">${S.armarRecorridoForm.mostrarAgregarDireccion?"▲":"▼"}</span>
      </div>
      ${S.armarRecorridoForm.mostrarAgregarDireccion?(()=>{
        const manuales = (S.flotaDirecciones||[]).filter(d=>!d.es_original);
        const editando = S.armarRecorridoForm.editandoDireccion;
        return `
        <div style="margin-top:12px">
          ${manuales.length?`
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
            ${manuales.map(d=>`
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s2);border-radius:8px;padding:8px 12px">
                <div style="min-width:0">
                  <div style="font-size:13px;font-weight:600">${escH(d.nombre)}</div>
                  <div style="font-size:11px;color:var(--faint)">${escH(d.direccion)}</div>
                </div>
                <div style="display:flex;gap:4px;flex-shrink:0">
                  <button class="btn btn-ghost btn-sm" onclick="editarDireccionManual('${escH(d.nombre)}','${escH(d.direccion)}')">✏️</button>
                  <button class="btn btn-ghost btn-sm" onclick="borrarDireccionManual('${escH(d.nombre)}')">🗑️</button>
                </div>
              </div>`).join("")}
          </div>`:`<p style="font-size:12px;color:var(--muted);margin-bottom:12px">Todavía no agregaste ninguna dirección a mano — las sucursales fijas no aparecen acá.</p>`}

          <p style="font-size:12px;color:var(--faint);margin-bottom:10px;padding-top:10px;border-top:1px dashed var(--border)">
            ${editando?`✏️ Editando "${escH(editando)}"`:"Calcula el tiempo hacia y desde todos los puntos que ya existen — tarda unos segundos."}
          </p>
          <div class="field">
            <label>Nombre (como querés que aparezca)</label>
            <input id="ar-nueva-direccion-nombre" class="inp" placeholder="Ej: Marconi" value="${escH(editando||"")}" ${editando?"disabled":""}/>
          </div>
          <div class="field" style="margin-top:10px">
            <label>Dirección completa</label>
            <input id="ar-nueva-direccion-calle" class="inp" placeholder="Ej: Marconi 1234, Mar del Plata" value="${escH(S.armarRecorridoForm.editandoDireccionValor||"")}"/>
          </div>
          <div id="ar-nueva-direccion-msg"></div>
          <div style="display:flex;gap:8px;margin-top:10px">
            ${editando?`<button class="btn btn-ghost btn-md" onclick="cancelarEdicionDireccion()">Cancelar</button>`:""}
            <button class="btn btn-teal btn-md" onclick="agregarDireccionNueva()" id="ar-btn-agregar-direccion">
              📍 ${editando?"Recalcular y guardar":"Calcular y agregar"}
            </button>
          </div>
        </div>`;
      })():""}
    </div>

    <div class="card">
      <label style="display:block;margin-bottom:8px">Agregar parada</label>
      <div style="display:flex;gap:10px;margin-bottom:16px">
        <select id="ar-sel-parada" class="inp" style="flex:1">
          ${puntos.map(p=>`<option>${escH(p)}</option>`).join("")}
        </select>
        <button class="btn btn-teal btn-md" onclick="agregarParadaRecorrido()">+ Agregar</button>
      </div>

      ${f.paradas.length>1?`<button class="btn btn-primary btn-sm" style="margin-bottom:14px" onclick="sugerirOrdenOptimo()">🧭 Sugerir orden óptimo</button>`:""}

      ${filaSalidaFabrica}
      ${f.paradas.length===0?`<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Todavía no agregaste ninguna parada — arranca siempre desde Fábrica.</p>`:filasParadas+filaVuelta}

      ${f.paradas.length>0?`
      <div style="margin-top:6px;padding:12px 16px;background:#e8a02018;border:1px solid #e8a02040;border-radius:8px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px">🕐 Tiempo total del recorrido completo (viaje + descarga, ida y vuelta)</span>
        <strong style="color:var(--amber)">${faltaDato?"Faltan datos":Math.round(acumulado)+" min"}</strong>
      </div>`:""}

      <p style="font-size:12px;color:var(--faint);margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)">📦 El tiempo de descarga de cada parada ya está sumado en el total — se calcula con los bultos reales que van hoy a esa sucursal (si no encuentra carga cargada para hoy, usa el tiempo de referencia de Sheets).</p>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
        <button class="btn btn-danger btn-md" onclick="borrarArmarRecorrido()" ${!f.nombre.trim()?"disabled":""}>🗑️ Borrar este recorrido</button>
        <button class="btn btn-success btn-md" onclick="guardarArmarRecorrido()" ${(!f.nombre.trim()||f.loading)?"disabled":""}>
          ${f.loading?`<span class="spinner"></span> Guardando...`:"💾 Guardar recorrido"}
        </button>
      </div>
    </div>
  </div>`;
}

function renderMetricas(){
  let reqs = S.requests;

  // ── Filtros ──────────────────────────────────────────────
  if(S.metDesde) reqs = reqs.filter(r=>r.createdAt && r.createdAt.slice(0,10) >= S.metDesde);
  if(S.metHasta) reqs = reqs.filter(r=>r.createdAt && r.createdAt.slice(0,10) <= S.metHasta);
  if(S.metSucursal) reqs = reqs.filter(r=>(r.sucursal||r.area)===S.metSucursal || r.destino===S.metSucursal);
  if(S.metRecorrido) reqs = reqs.filter(r=>r.recorrido===S.metRecorrido);

  const total=reqs.length||1;
  const byS={},byE={};
  getDestinos().forEach(s=>{byS[s]=reqs.filter(r=>(r.sucursal||r.area)===s).length;});
  ESTADOS.forEach(e=>{byE[e]=reqs.filter(r=>r.estado===e).length;});
  const wa=reqs.filter(r=>r.approvedAt&&r.createdAt);
  const avgR=wa.length?Math.round(wa.reduce((a,r)=>a+(dh(r.createdAt,r.approvedAt)||0),0)/wa.length):null;
  const wd=reqs.filter(r=>r.deliveredAt&&r.scheduledAt);
  const avgD=wd.length?Math.round(wd.reduce((a,r)=>a+(dh(r.scheduledAt,r.deliveredAt)||0),0)/wd.length):null;
  const noEntregadas = reqs.filter(r=>r.estado==="No entregada");
  const noEntregadasReprog = noEntregadas.filter(r=>reqs.some(x=>x.reprogramadaDeId===r.id)).length;

  // Entregadas fuera de la fecha requerida: se entregó un día calendario
  // posterior al que se pidió. Compara fechas LOCALES, no el timestamp
  // crudo (para no marcar como "tarde" algo que llegó bien pero tarde
  // en el día, y para no arrastrar el bug de UTC que ya corregimos).
  const entregadasConFecha = reqs.filter(r=>r.estado==="Entregada" && r.fechaRequerida && r.deliveredAt);
  const fueraDeFecha = entregadasConFecha.filter(r=>fechaLocalDeTimestamp(r.deliveredAt) > r.fechaRequerida);
  const pctFuera = entregadasConFecha.length ? Math.round(fueraDeFecha.length/entregadasConFecha.length*100) : 0;

  const sucursalesOpts = [...new Set(S.requests.flatMap(r=>[r.sucursal,r.area,r.destino].filter(Boolean)))].sort();
  const recorridosOpts = [...new Set(S.requests.map(r=>r.recorrido).filter(Boolean))].sort();

  // ── Evolución por día (creadas o entregadas) ──
  const serie = S.metSerie||"creadas";
  const porDiaL = {};
  if(serie==="creadas") reqs.forEach(r=>{ const f=r.createdAt?r.createdAt.slice(0,10):null; if(f) porDiaL[f]=(porDiaL[f]||0)+1; });
  else reqs.filter(r=>r.estado==="Entregada"&&r.deliveredAt).forEach(r=>{ const f=fechaLocalDeTimestamp(r.deliveredAt); if(f) porDiaL[f]=(porDiaL[f]||0)+1; });
  const diasL = Object.keys(porDiaL).sort().slice(-45);
  const puntosL = diasL.map(f=>({key:f, label:`${f.slice(8,10)}/${f.slice(5,7)}`, valor:porDiaL[f]}));
  const pillL = (val,txt)=>`<button class="btn ${serie===val?"btn-primary":"btn-ghost"} btn-sm" onclick="S.metSerie='${val}';render()">${txt}</button>`;

  const cardL = "padding:24px;grid-column:1/-1";
  // ── Detalle del día elegido en la línea de evolución ──
  const diaSelL = (S.metDiaSel && diasL.includes(S.metDiaSel)) ? S.metDiaSel : "";
  let detalleDiaL = "";
  if(diaSelL){

    const itsL = serie==="creadas"
      ? reqs.filter(r=>r.createdAt && r.createdAt.slice(0,10)===diaSelL)
      : reqs.filter(r=>r.estado==="Entregada" && r.deliveredAt && fechaLocalDeTimestamp(r.deliveredAt)===diaSelL);
    const grpL = (fn,colorFn)=>{ const m={}; itsL.forEach(r=>{ const k=fn(r)||"—"; m[k]=(m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>({label:k,valor:v,color:colorFn?colorFn(k):undefined})); };

        <div><div style="font-size:15px;font-weight:700;color:${col};margin-bottom:12px">Recorrido</div>${barrasHorizontales(grp(r=>r.recorrido||"Sin recorrido"),col,its.length)}</div>
      </div>

      <div class="table-wrap"><table style="font-size:14px">
        <thead><tr><th>N°</th><th>Origen</th><th>Destino</th><th>Descripción</th><th>Fecha</th></tr></thead>
        <tbody>${its.slice(0,15).map(r=>`
          <tr onclick="openDetalle('${escH(r.id)}')" style="cursor:pointer">

  const filasSucL = Object.entries(byS).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).slice(0,15).map(([s,v])=>({label:s,valor:v}));

  return `

  </div>
  <div class="metrics-grid">

      ${tituloGrafico("Resumen")}
      <div class="kpi-mini-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">

        <div class="kpi-mini"><div class="kpi-mini-val" style="color:var(--red)">${reqs.filter(r=>r.prioridad==="Urgente").length}</div><div class="kpi-mini-lbl">Urgentes</div></div>
        <div class="kpi-mini"><div class="kpi-mini-val" style="color:var(--amber)">${reqs.filter(r=>r.estado==="Rechazada").length}</div><div class="kpi-mini-lbl">Rechazadas</div></div>
        <div class="kpi-mini"><div class="kpi-mini-val" style="color:var(--muted)">${reqs.filter(r=>r.estado==="Cancelada").length}</div><div class="kpi-mini-lbl">Canceladas</div></div>
        <div class="kpi-mini"><div class="kpi-mini-val" style="color:var(--teal)">${reqs.filter(r=>r.estado==="Entregada").length}</div><div class="kpi-mini-lbl">Entregadas</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a9b8d0">⚡ T. prom. respuesta</span><span class="mono" style="color:var(--blue)">${avgR!=null?avgR+"h":"—"}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a9b8d0">🚚 T. prom. entrega</span><span class="mono" style="color:var(--green)">${avgD!=null?avgD+"h":"—"}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a9b8d0">⚠️ No entregadas</span><span class="mono" style="color:var(--red)">${noEntregadas.length} <span style="color:var(--faint);font-weight:400">(${noEntregadasReprog} reprogramadas)</span></span></div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#a9b8d0">📅 Entregadas fuera de fecha</span><span class="mono" style="color:${fueraDeFecha.length?"var(--red)":"var(--green)"}">${fueraDeFecha.length} <span style="color:var(--faint);font-weight:400">(${pctFuera}% de las entregadas con fecha)</span></span></div>
      </div>
    </div>
    <div id="met-evo" class="card" style="${cardL}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        ${tituloGrafico("Evolución en el tiempo", serie==="creadas"?"solicitudes creadas por día":"solicitudes entregadas por día")}
        <div style="display:flex;gap:6px;flex-wrap:wrap">${pillL("creadas","Creadas")}${pillL("entregadas","Entregadas")}</div>
      </div>
      ${graficoEvolucion(puntosL, serie==="creadas"?"#4f9eff":"#2de0c4", "logistica", {sel:diaSelL, onClickFn:"metSeleccionarDia", unidadTxt:serie==="creadas"?"solicitudes creadas":"solicitudes entregadas"})}
      ${!diaSelL?`<p style="font-size:13px;color:#a9b8d0;margin-top:10px">Pasá el mouse por un día para ver su valor, y tocalo para ver qué solicitudes fueron.</p>`:""}
    </div>

    <div id="met-slot-dia" style="display:contents">${detalleDiaL}</div>

    <div id="met-estado" class="card" style="${cardL}">
      ${tituloGrafico("Estado de las solicitudes","Tocá una porción para ver de dónde sale ese porcentaje")}
      ${datosEstado.length?`
      <div style="display:flex;gap:32px;align-items:center;flex-wrap:wrap;justify-content:center">
        ${donutPorcentajes("estado",datosEstado,280,"solicitudes",estSel?estSel.label:"","metSeleccionarEstado")}
        ${leyendaPorcentajes("estado",datosEstado,estSel?estSel.label:"")}
      </div>`:`<p style="color:#a9b8d0;font-size:14px;text-align:center;padding:20px">Sin datos.</p>`}
    </div>

    <div id="met-slot-estado" style="display:contents">${detalleEstado}</div>

    <div id="met-suc" class="card" style="${cardL}">
      ${tituloGrafico("Por sucursal / área","Solicitudes creadas por cada una")}
      ${barrasHorizontales(filasSucL,"#4f9eff",reqs.length)}
    </div>
    ${fueraDeFecha.length?`
    <div class="card" style="${cardL}">
      ${tituloGrafico(`Entregadas fuera de fecha (${fueraDeFecha.length})`,"Se entregaron un día posterior al pedido")}
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Sucursal/Área</th><th>Destino</th><th>Fecha requerida</th><th>Entregada</th></tr></thead>
          <tbody>
            ${fueraDeFecha.sort((a,b)=>(b.deliveredAt||"").localeCompare(a.deliveredAt||"")).map(r=>`
            <tr onclick="openDetalle('${escH(r.id)}')" style="cursor:pointer">
              <td class="id-cell">${escH(r.id)}</td>
              <td>${escH(r.sucursal||r.area)}</td>
              <td>${escH(r.destino)}</td>
              <td class="muted-cell">${fd(r.fechaRequerida)}</td>
              <td style="color:var(--red);font-weight:600">${fdt(r.deliveredAt)}</td>

// ══════════════════════════════════════════════════════════
//  VISTA REPARTIDOR
// ══════════════════════════════════════════════════════════
// ¿El repartidor puede tomarla YA? (no alcanza con que esté "Aprobada" si
// todavía nadie la confirmó como lista — solo se salta esa espera cuando
// el origen es "Otra dirección", porque ahí no hay ninguna cuenta que
// pueda confirmarla desde la app)
function puedeTomarAhora(r){
  const origenSinApp = esOtraDireccion(r.sucursal||r.area);
  return ["Lista para retirar","En fábrica"].includes(r.estado) ||
         (origenSinApp && ["Aprobada","Programada"].includes(r.estado));
}

// ═══════════════════════════════════════════════════════════════════
//  "ESTÁS EN…" — el repartidor escanea el QR de una sucursal y la app le
//  muestra, de un vistazo, lo que tiene que retirar y lo que tiene que dejar
//  AHÍ, con los mismos botones de siempre (Tomar, Entregar, Sucursal cerrada…).
//  El QR ya registra la llegada (con su DNI y el viaje) en Flota; esto le suma
//  la parte de transferencias y devoluciones.
// ═══════════════════════════════════════════════════════════════════
function aplicarQRPendiente(){
  let q=null; try{ q=JSON.parse(sessionStorage.getItem("tl_qr")||"null"); }catch(e){}
  try{ sessionStorage.removeItem("tl_qr"); }catch(e){}
  if(!q || !q.s || Date.now()-q.at>8*3600*1000) return;
  if(S.user?.rol!=="repartidor") return;
  const esFab=/^f[aá]brica$/i.test(q.s);
  const oficial=esFab ? "Fábrica"
    : ([...getSucursales(),...getDestinos()].find(x=>normNotif(x)===normNotif(q.s)) || q.s);
  S.estoyEn={sucursal:oficial, fabrica:esFab, viaje:q.v||"", at:Date.now()};
  S.vista="main"; S.modoSeleccionRep=false;
  if(S.devolucionesLoaded) cargarDevoluciones().then(()=>render()).catch(()=>{});
}
function salirEstoyEn(){ S.estoyEn=null; render(); }
const _pasaPorFab=r=>r.pasaPorFabrica===true||r.pasaPorFabrica==="true"||r.pasaPorFabrica==="si";
// Lo que este repartidor puede ver y hacer (sin los filtros de pantalla)
function repVisibles(){
  let base=S.requests.filter(r=>r.estado==="En tránsito"||puedeTomarAhora(r));
  if(S.miIdentidadRep){
    const mi=normNotif(S.miIdentidadRep.nombre);
    base=base.filter(r=>{
      if(r.estado==="En fábrica") return true;
      const q=r.nombreQuienEntrego||r.nombreQuienLevanto;
      return !q || normNotif(q)===mi;
    });
  }
  return base;
}
function estoyEnLista(){
  const e=S.estoyEn; if(!e) return {retirar:[],dejar:[],devTomar:[],devFabrica:[]};
  const n=normNotif(e.sucursal), vis=repVisibles();
  const mi=S.miIdentidadRep?normNotif(S.miIdentidadRep.nombre):"";
  const retirar=vis.filter(r=>{
    if(r.estado==="En tránsito") return false;
    if(e.fabrica && r.estado==="En fábrica") return true;           // lo que espera en fábrica para su 2º tramo
    return normNotif(origenLabel(r))===n;
  });
  const dejar=vis.filter(r=>{
    if(r.estado!=="En tránsito") return false;
    if(_pasaPorFab(r) && !r.fabricaAt) return e.fabrica;             // pasa por fábrica y todavía no llegó
    return normNotif(r.destino)===n;
  });
  const mias=d=>!d.nombreQuienLevanto || normNotif(d.nombreQuienLevanto)===mi;
  const devTomar=S.devoluciones.filter(d=>d.estado==="Pendiente" && normNotif(d.sucursal)===n && mias(d));
  const devFabrica=e.fabrica ? S.devoluciones.filter(d=>d.estado==="En camino" && mias(d) && d.nombreQuienLevanto) : [];
  return {retirar,dejar,devTomar,devFabrica};
}

  return `
  <div class="del-card">
    <div class="del-stripe" style="background:${col}"></div>
    <div class="del-body">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">
        <div style="font-size:19px;font-weight:700">${escH(d.sucursal)}</div>

}
function renderEstoyEn(){
  const e=S.estoyEn, L=estoyEnLista();
  const total=L.retirar.length+L.dejar.length+L.devTomar.length+L.devFabrica.length;
  const hora=new Date(e.at).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  const seccion=(titulo,items,html)=> items.length ? `
    <div class="estoy-sec">
      <div class="estoy-tit"><span>${titulo}</span><span class="tab-n" style="margin:0">${items.length}</span></div>
      <div id="estoy-${titulo.replace(/\W+/g,"")}" class="del-grid">${html}</div>
    </div>` : "";
  return `
  <div style="animation:fadeUp .3s ease" class="estoy-page">

// ── Trazabilidad por recorrido: quién hizo el viaje ese día (lo registra el QR de Flota con DNI) ──
const _diaDe=s=>{ s=String(s||""); return s.length===10 ? s : (s ? (fechaLocalDeTimestamp(s)||"") : ""); };
function claveViajeSol(r){
  const dia=_diaDe(r.levantadoAt||r.scheduledAt||r.approvedAt||r.createdAt);
  return (r.recorrido && dia) ? `${normNotif(r.recorrido)}|${dia}` : "";
}
async function cargarViajeSolicitud(r){
  const k=claveViajeSol(r); if(!k) return;
  S.viajesCache=S.viajesCache||{};
  if(k in S.viajesCache) return;
  S.viajesCache[k]="cargando";
  try{
    const dia=k.split("|")[1];
    const { data, error } = await sb.from("flota_viajes").select("id,fecha,recorrido,nombre_rep1,nombre_rep2,hora_salida,hora_llegada,estado")
      .ilike("recorrido",r.recorrido).eq("fecha",dia).order("hora_salida");
    if(error) throw error;
    S.viajesCache[k]=data||[];
  }catch(e){ console.warn("Viajes:",e); S.viajesCache[k]=[]; }
  if(S.modal==="detalle") render();
}
function viajeResponsablesTxt(r){
  const k=claveViajeSol(r); if(!k) return "";
  const v=(S.viajesCache||{})[k];
  if(v===undefined){ setTimeout(()=>cargarViajeSolicitud(r),0); return ""; }
  if(v==="cargando") return "👤 buscando responsable…";
  if(!v.length) return "👤 Sin viaje registrado por QR ese día";
  return v.map(x=>`👤 Viaje ${x.id}: ${[x.nombre_rep1,x.nombre_rep2].filter(Boolean).join(" y ")||"—"}`).join(" · ");
}

function renderRepartidor(){
  if(S.estoyEn) return renderEstoyEn();
  const u=S.user;
  const recOpts=S.recorridos.length?S.recorridos:["SUR","CENTRO","NORTE"];
  const ACCION_COLOR={"Aprobada":"var(--green)","Programada":"var(--purple)","En tránsito":"var(--amber)","En fábrica":"var(--teal)","Entregada":"#1fa86a","Entregada (sin confirmar)":"#c98a1f"};

  // Base: todo lo que está activo (ni entregado ni devuelto), separado
  // entre bolsines (van a su propia pestaña) y el resto.
  let baseActivos = S.requests.filter(r=>r.estado==="En tránsito" || puedeTomarAhora(r));
  if(S.fRepRecorrido) baseActivos = baseActivos.filter(r=>r.recorrido===S.fRepRecorrido);
  if(S.fRepSucursal)  baseActivos = baseActivos.filter(r=>r.sucursal===S.fRepSucursal);
  if(S.fRepNombre)    baseActivos = baseActivos.filter(r=>r.nombreQuienLevanto===S.fRepNombre);
  if(S.miIdentidadRep){
    const miNombre = normNotif(S.miIdentidadRep.nombre);
    baseActivos = baseActivos.filter(r=>{
      if(r.estado==="En fábrica") return true; // libre para cualquiera (necesita un segundo tramo)
      const quienLoTiene = r.nombreQuienEntrego || r.nombreQuienLevanto;
      if(!quienLoTiene) return true; // todavía nadie lo tomó
      return normNotif(quienLoTiene)===miNombre;
    });
  }
  const noBolsin = baseActivos.filter(r=>r.tipoPedido!=="bolsin");
  const bolsinesActivos = baseActivos.filter(r=>r.tipoPedido==="bolsin");
  const paraTomarGeneral = noBolsin.filter(r=>r.estado!=="En tránsito");
  const tomadasGeneral   = noBolsin.filter(r=>r.estado==="En tránsito");

  let entregadas=S.requests.filter(r=>["Entregada","Entregada (sin confirmar)"].includes(r.estado));
  if(S.fRepRecorrido) entregadas = entregadas.filter(r=>r.recorrido===S.fRepRecorrido);
  if(S.fRepSucursal)  entregadas = entregadas.filter(r=>r.sucursal===S.fRepSucursal);
  if(S.fRepNombre)    entregadas = entregadas.filter(r=>r.nombreQuienLevanto===S.fRepNombre);

  // Qué lista de solicitudes corresponde a la pestaña activa
  const list = S.tabRep==="tomadas" ? tomadasGeneral

            <div onclick="event.stopPropagation()">
              ${d.estado==="Pendiente"?`<button class="btn btn-warn btn-md" style="width:100%" onclick="openTomarDevoluciones(['${escH(d.id)}'])">🤲 Tomar</button>`:""}
              ${d.estado==="En camino"?`<button class="btn btn-teal btn-md" style="width:100%" onclick="openDejarDevolucionesFabrica(['${escH(d.id)}'])">📫 Dejar en fábrica</button>`:""}
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>
    `:`
    <div id="rep-grid" class="del-grid vt-content">
      ${S.tabRep==="bolsines"?(()=>{
        const alBuzonN    = list.filter(r=>esDestinoBuzon(r.destino)).length;
        const desdeBuzonN = list.filter(r=>!esDestinoBuzon(r.destino)).length;
        return `
      <div class="tabs" style="grid-column:1/-1;margin-bottom:4px">
        <button class="tab ${S.subTabBolsines!=="entregar"?"active":""}" onclick="S.subTabBolsines='buzon';render()">📥 Al buzón (${alBuzonN})</button>
        <button class="tab ${S.subTabBolsines==="entregar"?"active":""}" onclick="S.subTabBolsines='entregar';render()">📤 Para entregar (${desdeBuzonN})</button>
      </div>`;
      })():""}
      ${list.length===0?`<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--muted)">${S.tabRep==="entregadas"?"Sin entregas registradas":"No hay nada acá"}</div>`:""}
      ${(()=>{ const _cardRepHtml = cardRepartidorHtml;
      if(S.tabRep!=="bolsines") return list.map(_cardRepHtml).join("");
      const alBuzon    = list.filter(r=>esDestinoBuzon(r.destino));
      const desdeBuzon = list.filter(r=>!esDestinoBuzon(r.destino));
      const activa = S.subTabBolsines==="entregar" ? desdeBuzon : alBuzon;
      if(!activa.length) return `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">${S.subTabBolsines==="entregar"?"No hay bolsines para entregar en sucursal":"No hay bolsines para llevar al buzón"}</div>`;
      return activa.map(_cardRepHtml).join("");
      })()}
    </div>
    `}
  </div>`;
}

// ── Detalle / Trazabilidad ────────────────────────────────
function renderDetalle(){
  const r=S.requests.find(x=>x.id===S.selId);
  if(!r) return "<p>No encontrado</p>";

  // Logística ve horas internas; el DNI de nadie se muestra en ningún lado
  // — el DNI solo sirve para firmar la acción, nunca para exhibirlo.
  const esLogistica   = S.user?.rol === "logistica";
  // Admin y Tesorería: ven la hora exacta de cuándo se TOMA y se ENTREGA
  // algo (les sirve para el seguimiento operativo), pero NO la hora en que
  // Logística aprobó — eso queda solo para Logística (ver paso 2 abajo).
  const verHoraTomaEntrega = esLogistica || ["admin","tesoreria"].includes(S.user?.rol);
  // Sucursal destino ve la hora de entrega (les corresponde saberla)
  const esDestinoView = !esLogistica && S.user?.area &&
    (r.destino||"").trim().toLowerCase() === (S.user.area||"").trim().toLowerCase();

  // Construir trazabilidad según el perfil
  const steps=[];

  // Paso 1: Creación
  const metaCreacion = `${fdt(r.createdAt)} · ${solicitanteLabel(r)}`;
  steps.push({dot:S_COLOR["Pendiente"], title:"Solicitud creada", meta:metaCreacion});

  // Paso 2: Acción de Logística (aprobación, rechazo, o marcado pasa por fábrica)
  // ── PASO 2: Acción de Logística ─────────────────────────
  if(r.dniLogistica || r.approvedAt || r.estado==="Rechazada" || r.estado==="Cancelada"){
    const esRechazada = r.estado==="Rechazada";
    const esCancelada  = r.estado==="Cancelada"; // la retiró quien la pidió, no Logística
    const esFabricaFlow2 = r.pasaPorFabrica===true||r.pasaPorFabrica==="true"||r.pasaPorFabrica==="si";
    const tituloLog = esCancelada ? "Cancelada por el solicitante"
                     : esRechazada ? "Rechazada por Logística"
                     : esFabricaFlow2 ? "Aprobada — pasa por fábrica"
                     : "Aprobada por Logística";
    const nombreLog = r.nombreLogistica || "Logística";
    const metaLog = esCancelada
      ? `${fdt(r.updatedAt)} · ${solicitanteLabel(r)}`
      : esLogistica
      // Logística: hora + quién aprobó + comentario (nunca DNI)
      ? `${fdt(r.approvedAt||r.updatedAt)} · ${nombreLog}${r.comentario?" · "+r.comentario:""}`
      // Repartidor: SOLO la instrucción específica para ellos, nada más
      : S.user?.rol==="repartidor"
        ? r.comentarioRepartidor || ""
        // Sucursal/Planificación: solo el comentario de logística para ellos
        : r.comentario || "";
    steps.push({dot:esRechazada?S_COLOR["Rechazada"]:esCancelada?S_COLOR["Cancelada"]:S_COLOR["Aprobada"], title:tituloLog, meta:metaLog});
  }


  // ── PASO 3: Recorridos (ingreso / egreso separados) ─────
  const esFabFlow = r.pasaPorFabrica===true||r.pasaPorFabrica==="true"||r.pasaPorFabrica==="si";
  if(r.recorrido && r.estado!=="Rechazada" && r.estado!=="Cancelada"){
    const titleRec = esFabFlow ? `Recorrido de ingreso: ${r.recorrido}` : `Asignada a recorrido ${r.recorrido}`;
    steps.push({dot:S_COLOR["Programada"], title:titleRec,
      meta:[r.scheduledAt?`Programado para ${fd(r.scheduledAt)}`:"", verHoraTomaEntrega?viajeResponsablesTxt(r):""].filter(Boolean).join(" · ")});
  }
  // Recorrido de EGRESO — se guarda cuando logística asigna el recorrido de salida desde fábrica
  if(esFabFlow && r.recorridoEgreso && r.estado!=="Rechazada" && r.estado!=="Cancelada"){
    steps.push({dot:S_COLOR["Programada"], title:`Recorrido de egreso: ${r.recorridoEgreso}`,
      meta:"Recorrido asignado para llevar al destino final"});
  }

  // ── PASO 3a: Recepción Fresco marcó preparado ───────────
  if(r.preparadoAt || r.nombrePreparoPor){
    const metaPrep = verHoraTomaEntrega
      ? `${r.preparadoAt?fdt(r.preparadoAt)+" · ":""}${r.nombrePreparoPor||"—"}`
      : r.nombrePreparoPor ? `Por ${r.nombrePreparoPor}` : "";
    steps.push({dot:"var(--amber)", title:"📝 Preparado", meta:metaPrep});
  }

  // ── PASO 3b: Sucursal origen confirmó que está lista ────
  if(r.listoAt || r.nombreListoPor || r.estado==="Lista para retirar"){
    const quienListo = r.nombreListoPor || "";
    const aclaracion = r.aclaracionListo ? ` · "${r.aclaracionListo}"` : "";
    const metaListo = esLogistica
      ? `${r.listoAt?fdt(r.listoAt)+" · ":""}${quienListo||"—"}${aclaracion}`
      // Repartidor ve el nombre para poder llamar
      : quienListo ? `${quienListo}${aclaracion}`
      : `Confirmada lista${aclaracion}`;
    steps.push({dot:"#34d399", title:"✅ Lista para retirar", meta:metaListo});
  }

  // ── PASO 4a: Primer levantamiento ───────────────────────
  // NO mostrar si no se levantó nunca (estado No levantada sin nombreQuienLevanto)
  const estadosActivos = ["En tránsito","En fábrica","Entregada","No entregada"];
  if(r.nombreQuienLevanto || estadosActivos.includes(r.estado)){
    const quien    = r.nombreQuienLevanto || "";
    const tsLev    = r.levantadoAt || "";
    const titleLev = esFabFlow ? "🚚 Levantado — viene a fábrica" : "🚚 Levantado — va al destino";
    const metaLev  = verHoraTomaEntrega
      ? `${tsLev?fdt(tsLev)+" · ":""}${quien||"—"}`
      : quien ? `Por ${quien}` : "En camino";
    steps.push({dot:S_COLOR["En tránsito"], title:titleLev, meta:metaLev});
  }

  // ── PASO 4b: Llegó a fábrica ────────────────────────────
  if(esFabFlow && (r.fabricaAt || r.estado==="En fábrica")){
    const ts      = r.fabricaAt || r.updatedAt;
    const quien   = r.nombreQuienLevanto || "";
    const metaFab = verHoraTomaEntrega
      ? `${fdt(ts)} · ${quien||"—"}`
      : quien || "";
    steps.push({dot:S_COLOR["En fábrica"], title:"🏭 Llegó a fábrica", meta:metaFab});
  }

  // ── PASO 4c: Salió de fábrica hacia destino ─────────────
  if(esFabFlow && r.nombreQuienEntrego){
    const tsSal   = r.salidaFabricaAt || "";
    const metaSal = verHoraTomaEntrega
      ? `${tsSal?fdt(tsSal)+" · ":""}${r.nombreQuienEntrego}`
      : `Por ${r.nombreQuienEntrego}`;
    steps.push({dot:S_COLOR["En tránsito"], title:"🚚 Salió de fábrica → destino final", meta:metaSal});
  }

  // ── PASO 5a: No levantada ───────────────────────────────
  if(r.estado==="No levantada"){
    const meta = esLogistica
      ? `${fdt(r.updatedAt)} · ${r.comentario||""}`
      : r.comentario || "El repartidor no pudo levantar la transferencia";
    steps.push({dot:"#ff6b35", title:"⚠️ No pudo levantarse", meta});
  }

  // ── PASO 5b: No entregada ───────────────────────────────
  if(r.estado==="No entregada"){
    const meta = esLogistica
      ? `${fdt(r.updatedAt)} · ${r.comentario||""}`
      : r.comentario || "No se pudo entregar";
    steps.push({dot:S_COLOR["No entregada"], title:"⚠️ No pudo entregarse", meta});
  }

  // ── PASO 5c: Dejada con sucursal cerrada (pendiente de confirmar) ──
  if(r.estado==="Entregada (sin confirmar)"){
    const esBuzonBound = r.tipoPedido==="bolsin" && esDestinoBuzon(r.destino);
    const quienDejo = r.nombreQuienEntrego || r.nombreQuienLevanto || "";
    const metaDejo = verHoraTomaEntrega
      ? `${fdt(r.deliveredAt)} · ${quienDejo||"—"}${r.aclaracionCerrado?" · "+r.aclaracionCerrado:""}`
      : `${quienDejo?"Por "+quienDejo:""}${r.aclaracionCerrado?" · "+r.aclaracionCerrado:""}`;
    steps.push({dot:S_COLOR["Entregada (sin confirmar)"], title:esBuzonBound?"📫 Dejado en el buzón":"🔒 Dejada — sucursal cerrada", meta:metaDejo});
  }

  // ── PASO 5c-bis: Bolsín dejado en el buzón (estado propio, distinto
  // de "Entregada (sin confirmar)" para no mezclarlo en filtros) ──
  if(r.estado==="En el buzón"){
    const quienDejo = r.nombreQuienEntrego || r.nombreQuienLevanto || "";
    const metaDejo = verHoraTomaEntrega
      ? `${fdt(r.deliveredAt)} · ${quienDejo||"—"}`
      : `${quienDejo?"Por "+quienDejo:""}`;
    steps.push({dot:S_COLOR["En el buzón"], title:"📫 Dejado en el buzón", meta:metaDejo});
  }

  // ── PASO 5d: Entregada ──────────────────────────────────
  if(r.estado==="Entregada"){
    const quienEntrego = r.nombreQuienEntrego || r.nombreQuienLevanto || "";
    // Si vino del flujo "sucursal cerrada", separamos en dos pasos: cuándo
    // la dejó el repartidor y cuándo la sucursal confirmó que la recibió.
    if(r.confirmadaSucursalAt){
      const esBuzonBound = r.tipoPedido==="bolsin" && esDestinoBuzon(r.destino);
      const metaDejo = verHoraTomaEntrega
        ? `${fdt(r.deliveredAt)} · ${quienEntrego||"—"}${r.aclaracionCerrado?" · "+r.aclaracionCerrado:""}`
        : `${quienEntrego?"Por "+quienEntrego:""}${r.aclaracionCerrado?" · "+r.aclaracionCerrado:""}`;
      steps.push({dot:"#c98a1f", title:esBuzonBound?"📫 Dejado en el buzón":"🔒 Dejada — sucursal cerrada", meta:metaDejo});
      const metaConf = verHoraTomaEntrega
        ? `${fdt(r.confirmadaSucursalAt)} · ${r.nombreQuienRecibio||"—"}`
        : `Confirmada${r.nombreQuienRecibio?" por "+r.nombreQuienRecibio:""}`;
      steps.push({dot:"#34d399", title:esBuzonBound?"✅ Retirado del buzón por Tesorería":"✅ Confirmada por la sucursal", meta:metaConf});
    } else {
      const metaEntr = verHoraTomaEntrega
        ? `${fdt(r.deliveredAt)} · ${quienEntrego||"—"}`
        : `Entregada${quienEntrego?" por "+quienEntrego:""}`;
      steps.push({dot:S_COLOR["Entregada"], title:"✅ Entregada en destino", meta:metaEntr});
      // Quién recibió (sucursal destino) — solo nombre
      if(r.nombreQuienRecibio){
        const metaRec = verHoraTomaEntrega
          ? r.nombreQuienRecibio
          : `Recibido por ${r.nombreQuienRecibio}`;
        steps.push({dot:"#a371f7", title:"🔑 Confirmado por la sucursal destino", meta:metaRec});
      }
      if(r.codigoEntrega && esLogistica){
        steps.push({dot:"#a371f7", title:"Código de recepción", meta:`Palabra: ${r.codigoEntrega}`});
      }
    }
  }

  // El botón "Confirmar entrega" aparece en el detalle para repartidores
  // cuando la solicitud está Aprobada o Programada (no solo En tránsito)
  const pasaFab2         = r.pasaPorFabrica===true||r.pasaPorFabrica==="true"||r.pasaPorFabrica==="si";
  const yaSegundaEtapa2  = pasaFab2 && !!r.fabricaAt;
  const puedeTomar2      = S.user?.rol==="repartidor" && ["Lista para retirar","En fábrica"].includes(r.estado);
  const puedeDejarFab2   = S.user?.rol==="repartidor" && r.estado==="En tránsito" && pasaFab2 && !r.fabricaAt;
  const puedeConfirmar   = S.user?.rol==="repartidor" && r.estado==="En tránsito" && (!pasaFab2 || yaSegundaEtapa2);
  // Dejar en sucursal cerrada: solo tiene sentido si el destino es una sucursal
  // real (con su propia app) que después va a poder entrar a confirmar.
  // Si el destino es "Otra dirección" no aplica (nadie va a entrar a confirmar).
  const puedeDejarCerrado = puedeConfirmar && !esOtraDireccion(r.destino);
  const yaReprogramada = S.requests.some(x=>x.reprogramadaDeId===r.id);
  const puedeReprogramar = esLogistica && r.estado==="No entregada" && !yaReprogramada;

  return `
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    ${estadoBadges(r)} ${badge(r.prioridad,P_COLOR[r.prioridad])} ${badge(r.id,"var(--blue)")}
    ${r.recorrido?badge(r.recorrido,"var(--teal)"):""}
  </div>
  ${esLogistica && !["Entregada","Rechazada","Cancelada"].includes(r.estado)?`
  <button class="btn btn-primary btn-md btn-full" style="margin-bottom:16px" onclick="openGestionar('${escH(r.id)}')">
    ✏️ Gestionar esta solicitud
  </button>`:""}
  ${drow("Origen",origenLabel(r))}
  ${drow("Solicitante",solicitanteLabel(r))}
  ${drow("Destino",r.destino)}
  ${(r.pasaPorFabrica===true||r.pasaPorFabrica==="true")?`
  <div style="background:#2de0c412;border-radius:6px;padding:8px 12px;margin:6px 0;font-size:13px;border-left:3px solid var(--teal)">
    🏭 Esta transferencia pasa por fábrica antes de llegar al destino.
    ${r.estado==="En fábrica"?" Actualmente en fábrica — esperando salida.":""}
  </div>`:""}
  ${drow("Descripción",r.descripcion)}
  ${drow("Cantidad",r.cantidad+" "+r.unidad,true)}
  ${r.detalleCajas?(()=>{
    let cajas=[]; try{ cajas=JSON.parse(r.detalleCajas); }catch(e){}
    if(!Array.isArray(cajas)||!cajas.length) return "";
    return `<div class="field">
      <label>Detalle por caja</label>
      <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px">
        ${cajas.map(c=>`<div style="display:flex;justify-content:space-between;background:var(--s2);border-radius:6px;padding:6px 10px;font-size:13px">
          <span>${escH(c.caja?`Caja ${c.caja}`:"Sin número")}</span><span><strong>${escH(String(c.cantidad))}</strong> bolsines</span>
        </div>`).join("")}
      </div>
    </div>`;
  })():""}
  ${drow("Fecha requerida",fd(r.fechaRequerida),true)}
  ${r.observaciones?drow("Observaciones",r.observaciones):""}
  ${r.adjuntoUrl?`<div class="field"><label>Adjunto</label><a href="${escH(r.adjuntoUrl)}" target="_blank" rel="noopener">
    <img src="${escH(r.adjuntoUrl)}" style="max-width:220px;border-radius:8px;margin-top:4px;display:block;cursor:zoom-in" onclick="event.preventDefault();verImagenAmpliada('${escH(r.adjuntoUrl)}')" onerror="this.style.display='none';this.nextSibling.style.display='inline'"/>
    <span style="display:none;color:var(--blue)">📎 Ver archivo adjunto</span>
  </a></div>`:""}
  ${r.comentario&&!esLogistica?`<div class="alert-info" style="margin-top:8px"><strong>💬 Logística:</strong> ${escH(r.comentario)}</div>`:""}
  ${divider("TRAZABILIDAD")}
  ${steps.map((s,i)=>`
    <div class="trace-step">
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="trace-dot" style="background:${s.dot}"></div>
        ${i<steps.length-1?`<div class="trace-line" style="height:30px"></div>`:""}
      </div>
      <div class="trace-body">
        <div class="trace-title">${escH(s.title)}</div>
        <div class="trace-meta">${escH(s.meta)}</div>
      </div>
    </div>`).join("")}
  ${puedeReprogramar?`
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn btn-warn btn-md btn-full" onclick="closeModal();openReprogramarCopia('${escH(r.id)}')">
        🔁 Crear copia reprogramada
      </button>
    </div>`:""}
  ${yaReprogramada?`
    <div class="alert-info" style="margin-top:16px">🔁 Ya se creó una copia reprogramada de esta solicitud.</div>`:""}
  ${puedeTomar2?`
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn btn-warn btn-md btn-full" onclick="closeModal();openTomarTransferencia('${escH(r.id)}')">
        🤲 ${r.estado==="En fábrica"?"Llevar a destino final":"Tomar transferencia"}
      </button>
    </div>`:""}
  ${puedeDejarFab2?`
    <div style="margin-top:8px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn btn-primary btn-md btn-full" onclick="closeModal();openDejarEnFabrica('${escH(r.id)}')">
        🏭 Dejar en fábrica
      </button>
    </div>`:""}
  ${puedeConfirmar?`
    <div style="margin-top:8px;padding-top:16px;border-top:1px solid var(--border)">
      <div style="display:flex;gap:8px">
        <button class="btn btn-teal btn-md" style="flex:2" onclick="closeModal();openConfirmarEntrega('${escH(r.id)}')">
          📦 Confirmar entrega
        </button>
        <button class="btn btn-danger btn-md" style="flex:1" onclick="closeModal();openNoEntrega('${escH(r.id)}')">
          ✕ No entregué
        </button>
      </div>
      ${puedeDejarCerrado?`
      <button class="btn btn-warn btn-md btn-full" style="margin-top:8px" onclick="closeModal();openDejarCerrado('${escH(r.id)}')">
        🔒 Sucursal cerrada — dejar igual
      </button>`:""}
    </div>`:""}`;
}

// ── Gestionar (Logística) ────────────────────────────────
function renderGestionar(){
  const r=S.requests.find(x=>x.id===S.selId);
  if(!r) return "";
  const a=S.action;
  const recOpts=S.recorridos.length?S.recorridos:["SUR","CENTRO","NORTE"];
  const showDate=a.estado==="Programada"||a.estado==="Reprogramada";

  return `
  <div style="background:var(--s2);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      ${estadoBadges(r)} ${badge(r.prioridad,P_COLOR[r.prioridad])}
    </div>
    <div style="line-height:1.8;color:var(--muted)">
      <strong style="color:var(--text)">${escH(origenLabel(r))}</strong> → ${escH(r.destino)}<br/>
      ${escH(r.descripcion)} · <span class="mono">${escH(String(r.cantidad))} ${escH(r.unidad)}</span><br/>
      ${escH(solicitanteLabel(r))}${r.fechaRequerida?` · F.req: <strong style="color:var(--amber)">${fd(r.fechaRequerida)}</strong>`:""}
    </div>
  </div>
  ${divider("ACCIONES RÁPIDAS")}
  <div class="action-row">
    ${[
    ["Aprobada",          "✓ Aprobar",         "btn-success"],
    ["Rechazada",         "✕ Rechazar",        "btn-danger"],
    ["Programada",        "📅 Programar",       "btn-purple"],
    ["Lista para retirar","🟢 Lista",           "btn-teal"],
    ["En tránsito",       "🚚 En tránsito",    "btn-warn"],
    ["Entregada",         "📦 Entregada",       "btn-teal"],
  ].map(([v,l,cls])=>`
      <button class="btn ${cls} btn-sm" style="opacity:${a.estado===v?1:.5}" onclick="S.action.estado='${v}';render()">${l}</button>`).join("")}
    <button class="btn btn-warn btn-sm" style="opacity:${a.reprogramando?1:.5}" onclick="S.action.reprogramando=!S.action.reprogramando;render()">🔁 Reprogramar</button>
  </div>
  ${a.reprogramando?`
  <div style="background:#f5a62318;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;border-left:3px solid var(--amber)">
    🔁 Esto NO cambia el estado — se mantiene <strong>${escH(a.estado||r.estado)}</strong>, solo se actualiza la fecha pedida y queda marcada como "Reprogramada" para que se sepa que no es la fecha original.
  </div>
  <div class="field">
    <label>Nueva fecha requerida <span class="req">*</span></label>
    <input type="date" class="inp" value="${escH(a.nuevaFechaRequerida)}" onchange="S.action.nuevaFechaRequerida=this.value"/>
  </div>`:""}
  <div class="field">
    <label>Estado manual</label>
    <select onchange="S.action.estado=this.value;render()">
      <option value="">— Sin cambio —</option>
      ${ESTADOS.map(s=>`<option ${a.estado===s?"selected":""}>${escH(s)}</option>`).join("")}
    </select>
  </div>
  <!-- Checkbox pasa por fábrica -->
  <div style="background:var(--s2);border-radius:8px;padding:12px 14px;margin-bottom:14px">
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px">
      <input type="checkbox" id="chk-fabrica"
        ${(a.pasaPorFabrica||r.pasaPorFabrica)?"checked":""}
        onchange="S.action.pasaPorFabrica=this.checked;render()"
        style="width:16px;height:16px;accent-color:var(--teal);cursor:pointer"/>
      <span>🏭 <strong>Pasa por fábrica</strong> — el repartidor la trae a fábrica antes de ir al destino</span>
    </label>
    ${(a.pasaPorFabrica||r.pasaPorFabrica)?`
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">
      ${r.estado==="En fábrica"
        ? "✅ Ya está en fábrica — asigná el recorrido de salida abajo"
        : r.fabricaAt
          ? "🏭 Llegó a fábrica: "+fdt(r.fabricaAt)+" — asigná el recorrido de salida"
          : "El repartidor verá el botón 'Dejar en fábrica' al llegar."}
    </div>`:""}
  </div>

  <!-- Recorrido: si pasa por fábrica y ya llegó, es el recorrido de salida -->
  <div class="field">
    <label>Prioridad</label>
    <select onchange="S.action.prioridad=this.value">
      ${PRIORIDADES.map(p=>`<option ${(S.action.prioridad||r.prioridad)===p?"selected":""}>${escH(p)}</option>`).join("")}
    </select>
  </div>

  <div class="field">
    <label>${(a.pasaPorFabrica||r.pasaPorFabrica)&&r.fabricaAt
      ? "Recorrido de salida (segunda etapa)"
      : "Asignar recorrido"}</label>
    <select onchange="S.action.recorrido=this.value">
      <option value="${escH(r.recorrido||"")}">— ${escH(r.recorrido||"Sin recorrido")} —</option>
      ${recOpts.filter(x=>x!==r.recorrido).map(x=>`<option value="${escH(x)}">${escH(x)}</option>`).join("")}
    </select>
  </div>
  ${showDate?`<div class="field"><label>Fecha programada</label><input type="date" class="inp" value="${escH(a.scheduledAt)}" onchange="S.action.scheduledAt=this.value"/></div>`:""}
  <div class="field">
    <label>Comentario para la sucursal</label>
    <textarea placeholder="Ej: Aprobado, sale el martes. / Rechazado por falta de stock." oninput="S.action.comentario=this.value">${escH(a.comentario)}</textarea>
  </div>
  <div class="field">
    <label>Instrucción para el repartidor <span style="color:var(--faint);font-size:12px">(opcional)</span></label>
    <textarea id="g-coment-rep" rows="2"
      placeholder="Ej: Llamar antes de llegar, entregar en portería..."
      oninput="S.action.comentarioRepartidor=this.value">${escH(a.comentarioRepartidor||"")}</textarea>
  </div>
  <div style="background:var(--s2);border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;border-left:3px solid var(--amber)">
    🔒 Al guardar se te pedirá tu <strong>DNI</strong> para registrar la aprobación.
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button class="btn btn-ghost btn-md" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-success btn-md" onclick="submitGestionar()" ${S.saving?"disabled":""}>
      ${S.saving?`<span class="spinner"></span> Guardando...`:"Guardar y firmar →"}
    </button>
  </div>`;
}

// ── Modal DNI confirmación ────────────────────────────────

  return `
  <p style="color:var(--muted);font-size:13px;margin-bottom:16px">${escH(d.title)}</p>

  ${d.nombreOk && d.loading ? `
    <div class="alert-ok" style="text-align:center;font-size:15px;padding:14px">
      ✅ <strong>${escH(d.nombreOk)}</strong><br/>
      <span style="font-size:12px;color:var(--muted)">Identidad verificada</span>
    </div>
  ` : `
    <div class="field">
      <label>Tu DNI (sin puntos) <span class="req">*</span></label>
      <input id="dni-inp" class="inp ${d.err?"err":""}"
        type="number" placeholder="Ej: 30123456"
        value="${escH(d.val)}"
        oninput="S.dniModal.val=this.value;S.dniModal.err='';S.dniModal.nombreOk=''"
        onkeydown="if(event.key==='Enter')submitDni()"/>
      ${d.err?`<span class="err-msg">${escH(d.err)}</span>`:""}
    </div>
    ${d.err?`<div class="alert-err">🔒 ${escH(d.err)}</div>`:""}
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
      <button class="btn btn-ghost btn-md" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success btn-md" onclick="submitDni()" ${d.loading?"disabled":""}>
        ${d.loading?`<span class="spinner"></span> Verificando...`:"Confirmar →"}
      </button>
    </div>
  `}`;
}

      ${badge(r.id,"var(--blue)")} ${badge(r.prioridad,P_COLOR[r.prioridad])}

    <strong>${escH(origenLabel(r))}</strong> → <strong>${escH(r.destino)}</strong><br/>

      <label>Tu DNI (sin puntos) <span class="req">*</span></label>
      <input id="cerrado-dni" class="inp ${d.err?"err":""}"

        value="${escH(d.dni)}"

      <label>Aclaración <span style="color:var(--faint);font-size:12px">(opcional, ej. "quedó en la puerta con el sereno")</span></label>
      <textarea id="cerrado-aclaracion" rows="2"
        oninput="S.cerradoModal.aclaracion=this.value">${escH(d.aclaracion||"")}</textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
      <button class="btn btn-ghost btn-md" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-warn btn-md" onclick="submitDejarCerrado()" ${d.loading?"disabled":""}>
        ${d.loading?`<span class="spinner"></span> Registrando...`:"🔒 Confirmar que la dejé"}
      </button>
    </div>
  `}`;
}

      ${badge(r.id,"var(--blue)")}
    </div>
    <strong>${escH(origenLabel(r))}</strong> → <strong>${escH(r.destino)}</strong><br/>
    <span style="color:var(--muted)">${escH(r.descripcion)} · ${escH(String(r.cantidad))} ${escH(r.unidad)}</span><br/>
    <span style="color:var(--muted)">Dejada por ${escH(r.nombreQuienEntrego||"—")} el ${fdt(r.deliveredAt)}${r.aclaracionListo?` · "${escH(r.aclaracionListo)}"`:""}</span>

  </div>
  ${d.nombreOk && d.loading ? `
    <div class="alert-ok" style="text-align:center;padding:14px">
      ✅ <strong>${escH(d.nombreOk)}</strong><br/>

function openEditar(id){
  const r = S.requests.find(x=>x.id===id);
  if(!r) return;
  let cajas = null;
  if(r.detalleCajas){
    try{ const arr = JSON.parse(r.detalleCajas); if(Array.isArray(arr)&&arr.length) cajas = arr; }catch(e){}
  }
  S.editarModal = {id, descripcion:r.descripcion||"", cantidad:r.cantidad||"", observaciones:r.observaciones||"", sucursal:r.sucursal||"", destino:r.destino||"", area:r.area||"", unidad:r.unidad||"", cajas, err:"", loading:false};
  S.modal = "editar";
  render();
}

async function submitEditar(){
  const d = S.editarModal;
  if(d.loading) return;
  const desc    = ($("ed-desc")?.value||"").trim();
  let   cant    = ($("ed-cant")?.value||"").trim();
  const fecha   = ($("ed-fecha")?.value||"").trim();
  const obs     = ($("ed-obs")?.value||"").trim();
  if(!desc){ S.editarModal.err="La descripción es obligatoria."; render(); return; }

  const changes = { descripcion:desc, fechaRequerida:fecha||null, observaciones:obs, updatedAt:now() };

  if(S.user?.rol==="admin" && Array.isArray(d.cajas)){
    const cajasValidas = d.cajas
      .map(c=>({caja:(c.caja||"").trim(), cantidad:+c.cantidad}))
      .filter(c=>c.cantidad>0);
    if(!cajasValidas.length){ S.editarModal.err="Cargá al menos una caja con cantidad."; render(); return; }
    changes.detalleCajas = JSON.stringify(cajasValidas);
    changes.cantidad = cajasValidas.reduce((s,c)=>s+c.cantidad,0);
  } else {
    if(!cant||isNaN(+cant)||+cant<=0){ S.editarModal.err="Cantidad inválida."; render(); return; }
    changes.cantidad = +cant;
  }

  if(S.user?.rol==="admin"){
    const sucursal = ($("ed-sucursal")?.value||"").trim();
    const destino  = ($("ed-destino")?.value||"").trim();
    const area     = ($("ed-area")?.value||"").trim();
    const unidad   = ($("ed-unidad")?.value||"").trim();
    if(!destino){ S.editarModal.err="El destino es obligatorio."; render(); return; }
    changes.sucursal = sucursal;
    changes.destino  = destino;
    changes.area     = area;
    if(unidad) changes.unidad = unidad;
  }
  S.editarModal.loading = true; renderNow();
  S.requests = S.requests.map(x=>x.id===d.id?{...x,...changes}:x);
  S.modal = null;
  toast("Solicitud actualizada");
  sheetsUpdate(d.id, changes);
}

async function cancelarSolicitud(id){
  if(!confirm("¿Cancelar esta solicitud? No se puede deshacer.")) return;
  const changes = { estado:"Cancelada", comentario:"Cancelada por el solicitante", updatedAt:now() };
  S.requests = S.requests.map(x=>x.id===id?{...x,...changes}:x);
  S.modal = null;
  toast("Solicitud cancelada");
  sheetsUpdate(id, changes);
}

async function ejecutarDejarBolsines(ids, dni, nombre){
  const nowTs = now();
  const changes = {estado:"En el buzón", nombreQuienEntrego:nombre, dniEntrega:dni, deliveredAt:nowTs, updatedAt:nowTs};
  const resultados = await Promise.all(
    ids.map(id => sb.from("solicitudes").update(toSnakeRow(changes)).eq("id",id))
  );
  const fallidas = resultados.filter(r=>r.error);
  if(fallidas.length===0){
    const idsSet = new Set(ids);
    S.requests = S.requests.map(x=>idsSet.has(x.id) ? {...x,...changes} : x);
    S.repSeleccion = new Set();
    S.modoSeleccionRep = false;
    S.modal = null;
    toast(`📫 ${nombre} dejó ${ids.length} bolsin${ids.length!==1?"es":""} en el buzón — falta que Tesorería los retire`);
  }
  return fallidas.length===0;
}

async function submitTomarVarias(){
  const d = S.tomarVariasModal;
  if(d.loading) return;
  let dni, nombre;
  if(S.miIdentidadRep){ dni=S.miIdentidadRep.dni; nombre=S.miIdentidadRep.nombre; }
  else{
    dni = String(d.dni||"").replace(/\D/g,"");
    if(!dni){ S.tomarVariasModal.err="Ingresá tu DNI."; render(); return; }
    const check = validarDNI(dni);
    if(!check.ok){ S.tomarVariasModal.err=check.msg; render(); return; }
    nombre = check.nombre;
  }

  d.loading = true; renderNow();

  try{
    // Postgres actualiza cada fila de forma segura aunque se disparen todas
    // juntas — a diferencia de Sheets, acá no hace falta un lock manual en
    // un backend intermedio. Cada solicitud puede estar en una etapa
    // distinta (recién sale de origen, o sale de fábrica en la segunda
    // etapa), así que se arma el cambio correcto para cada una.
    const nowTs = now();
    const cambios = d.ids.map(id=>{
      const x = S.requests.find(r=>r.id===id);
      const esSegundaEtapa = x && x.estado==="En fábrica";
      const changes = esSegundaEtapa
        ? {estado:"En tránsito", nombreQuienEntrego:nombre, dniEntrega:dni, salidaFabricaAt:nowTs, updatedAt:nowTs}
        : {estado:"En tránsito", nombreQuienLevanto:nombre, dniRepartidor:dni, levantadoAt:nowTs, updatedAt:nowTs};
      if(x && x.tipoPedido==="bolsin"){
        const inputCant = $(`tv-cant-${id}`);
        if(inputCant){
          const nuevaCant = +inputCant.value;
          if(!isNaN(nuevaCant) && nuevaCant>=0 && nuevaCant!==+x.cantidad){
            changes.cantidad = nuevaCant;
            const nota = `Cantidad corregida al tomar: ${nuevaCant} (cargado: ${x.cantidad})`;
            changes.comentario = x.comentario ? x.comentario+" · "+nota : nota;
          }
        }
      }
      return {id, changes};
    });
    const resultados = await Promise.all(
      cambios.map(c => sb.from("solicitudes").update(toSnakeRow(c.changes)).eq("id",c.id))
    );
    const fallidas = resultados.filter(r=>r.error);
    if(fallidas.length===0){
      const idsSet = new Set(d.ids);
      S.requests = S.requests.map(x=>{
        const c = cambios.find(c=>c.id===x.id);
        return c ? {...x, ...c.changes} : x;
      });
      S.repSeleccion = new Set();
      S.modoSeleccionRep = false;
      S.modal = null;
      toast(`🚚 ${nombre} tomó ${cambios.length} transferencias`);
    } else {
      S.tomarVariasModal.loading=false;
      S.tomarVariasModal.err = `No se pudieron tomar ${fallidas.length} de ${cambios.length}. Probá de nuevo.`;
    }
  } catch(e){
    S.tomarVariasModal.loading=false;
    S.tomarVariasModal.err = "No se pudo conectar — probá de nuevo.";
  }
  render();
}

  if(!dni){ S.reprogramarCopiaModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.reprogramarCopiaModal.err=check.msg; render(); return; }
  if(!d.fecha){ S.reprogramarCopiaModal.err="Elegí la nueva fecha."; render(); return; }

  d.loading = true; renderNow();

  const nowTs = now();
  const copia = {
    id:"tmp-"+Date.now(),
    sucursal: r.sucursal, area: r.area,
    solicitante: r.solicitante, dniSolicitante: r.dniSolicitante,
    destino: r.destino, descripcion: r.descripcion,
    cantidad: r.cantidad, unidad: r.unidad, prioridad: r.prioridad,
    fechaRequerida: d.fecha,
    observaciones: r.observaciones,
    estado: "Aprobada", // ya estaba aprobada antes, no hace falta repetir el paso
    comentario: `Reprogramada por ${check.nombre} a partir de ${r.id} (no se entregó el ${fd(r.fechaRequerida)})`,
    reprogramadaDeId: r.id,
    recorrido:"", createdAt: nowTs, approvedAt: nowTs, updatedAt: nowTs,
  };
  try{
    const creada = await sheetsAdd(copia);
    S.requests = [creada||copia, ...S.requests];
    // Dejar rastro en la original también
    const changesOriginal = {comentario: (r.comentario?r.comentario+" · ":"")+`Reprogramada como ${(creada||copia).id}`};
    S.requests = S.requests.map(x=>x.id===r.id?{...x,...changesOriginal}:x);
    sheetsUpdate(r.id, changesOriginal);
    S.modal = null;
    toast(`🔁 Copia ${(creada||copia).id} creada para el ${fd(d.fecha)}`);
  } catch(e){
    S.reprogramarCopiaModal.loading=false;
    S.reprogramarCopiaModal.err = "No se pudo crear la copia — probá de nuevo.";
  }
  render();
}

async function submitCambioEstadoMasivo(){
  const d = S.cambioEstadoMasivoModal;
  if(d.loading) return;
  const esLogistica = S.user?.rol==="logistica";
  let dni, nombre;
  if(esLogistica){
    dni = S.user.dni||""; nombre = S.user.nombre||"Logística";
  } else {
    dni = String(d.dni||"").replace(/\D/g,"");
    if(!dni){ S.cambioEstadoMasivoModal.err="Ingresá tu DNI."; render(); return; }
    const check = validarDNI(dni);
    if(!check.ok){ S.cambioEstadoMasivoModal.err=check.msg; render(); return; }
    nombre = check.nombre;
  }

  d.loading = true; renderNow();

  try{
    // Igual que con tomarVarias: cada fila puede tener un comentario previo
    // distinto, así que se actualiza una por una (Postgres lo hace seguro
    // aunque vayan todas juntas) para no perder el historial de cada una.
    const nowTs = now();
    const esAprobar = d.estado==="Aprobada";
    const cambios = d.ids.map(id=>{
      const x = S.requests.find(r=>r.id===id);
      const estadoRealmenteCambia = !!d.estado && (!x || x.estado!==d.estado);
      const changes = {updatedAt:nowTs, dniLogistica:dni, nombreLogistica:nombre};
      if(estadoRealmenteCambia){
        changes.estado = d.estado;
        const nota = esAprobar ? `Aprobada por ${nombre}` : `Cambio a "${d.estado}" por ${nombre}`;
        changes.comentario = x && x.comentario ? x.comentario+" · "+nota : nota;
        if(esAprobar && x && !x.approvedAt) changes.approvedAt = nowTs;
        if(esAprobar && x) crearNotificacion(x.sucursal||x.area||"", `✅ Tu solicitud ${id} fue aprobada — prepará y marcá "Lista para retirar"`, id);
        if(esAprobar && x && x.area && normNotif(x.area)!==normNotif(x.sucursal||x.area)){
          crearNotificacion(x.area, `✅ La solicitud ${id} que armaste (${x.sucursal||"—"} → ${x.destino||"—"}) fue aprobada`, id);
        }
        if(esAprobar && x && esPedidoPlanificacionFresco(x)) crearNotificacion("RECEPCION FRESCO", `🥬 Nuevo pedido para preparar: ${id} — ${x.descripcion||""}`, id);
      }
      if(d.recorrido) changes.recorrido = d.recorrido;
      return {id, changes};
    });
    const resultados = await Promise.all(
      cambios.map(c => sb.from("solicitudes").update(toSnakeRow(c.changes)).eq("id",c.id))
    );
    const fallidas = resultados.filter(r=>r.error);
    if(fallidas.length===0){
      S.requests = S.requests.map(x=>{
        const c = cambios.find(c=>c.id===x.id);
        return c ? {...x, ...c.changes} : x;
      });
      S.logSeleccion = new Set();
      S.modoSeleccion = false;
      S.modal = null;
      toast(esAprobar ? `✅ ${cambios.length} solicitudes aprobadas` : `✅ ${cambios.length} solicitudes cambiadas a "${d.estado}"`);
    } else {
      S.cambioEstadoMasivoModal.loading=false;
      S.cambioEstadoMasivoModal.err = `No se pudieron cambiar ${fallidas.length} de ${cambios.length}. Probá de nuevo.`;
    }
  } catch(e){
    S.cambioEstadoMasivoModal.loading=false;
    S.cambioEstadoMasivoModal.err = "No se pudo conectar — probá de nuevo.";
  }
  render();
}

  const changes = {
    estado:               "Entregada",
    nombreQuienRecibio:   check.nombre,
    dniQuienRecibio:      dni,
    confirmadaSucursalAt: now(),
    updatedAt:            now(),

  let comentarioFinal = comentario;
  if(r && r.tipoPedido==="bolsin"){

    if(!isNaN(cantidadRetirada) && cantidadRetirada!==+r.cantidad){

async function submitEnvioMasivoRRHH(){
  const d = S.envioMasivoModal;
  if(d.loading) return;
  const descripcion = ($("em-desc")?.value||d.descripcion||"").trim();
  const cantidad    = $("em-cant")?.value||d.cantidad||"";
  const unidad      = $("em-unit")?.value||d.unidad||"Unidades";
  const fechaRequerida = $("em-fecha")?.value||d.fechaRequerida||"";
  const observaciones  = ($("em-obs")?.value||d.observaciones||"").trim();

  const err={};
  if(!descripcion) err.desc="Describí qué se envía";
  if(!cantidad||isNaN(+cantidad)||+cantidad<=0) err.cant="Cantidad inválida";
  if(d.destinos.length===0) err.destinos="Marcá al menos una sucursal";
  if(Object.keys(err).length){ S.envioMasivoModal.err=err; render(); return; }

  // Se pide el DNI UNA sola vez (login compartido de RRHH) y con eso se
  // firman todas las solicitudes que se crean en el lote.
  S.dniModal = {
    title:`Ingresá tu DNI para registrar estas ${d.destinos.length} solicitudes`,
    field:"solicitante", val:"", err:"", loading:false, nombreOk:"",
    cb: async (dniVal, usuarioEncontrado)=>{
      const nombreSolicitante = usuarioEncontrado?.nombre || S.user.nombre || "RRHH";
      S.envioMasivoModal.loading = true; S.modal=null; renderNow();
      try{
        const creadas = [];
        for(const destino of d.destinos){
          const nueva = {
            id:"tmp-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
            sucursal:"Fábrica", area:S.user.area||"RRHH",
            solicitante:nombreSolicitante, dniSolicitante:dniVal,
            destino, descripcion, cantidad:+cantidad, unidad,
            prioridad:"Media", fechaRequerida: fechaRequerida||null,
            observaciones, estado:"Pendiente", comentario:"", recorrido:"",
            dniLogistica:"", dniRepartidor:"", nombreQuienLevanto:"", dniEntrega:"", nombreQuienEntrego:"", codigoEntrega:"", listoAt:"", dniListoPor:"", nombreListoPor:"",
            createdAt:now(), approvedAt:null, scheduledAt:null, deliveredAt:null, updatedAt:now(),
          };
          const creada = await sheetsAdd(nueva);
          creadas.push(creada||nueva);
        }
        S.requests = [...creadas, ...S.requests];
        toast(`📨 ${creadas.length} solicitudes creadas — una por sucursal`);
        creadas.forEach(c=>notificarNuevaSolicitud(c));
      }catch(e){
        toast("⚠️ Algo falló creando las solicitudes — revisá y volvé a intentar","warn");
      }
      S.envioMasivoModal.loading = false;
      render();
    }
  };
  S.modal = "dniConfirm"; render();
}

async function submitPedidoTesoreria(){
  const d = S.pedidoTesoreriaModal;
  if(d.loading) return;
  const dni = String(d.dni||"").replace(/\D/g,"");
  if(!dni){ S.pedidoTesoreriaModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.pedidoTesoreriaModal.err=check.msg; render(); return; }
  const esAprobar = d.accion==="aprobar";
  const motivo = ($("pt-motivo")?.value||d.motivo||"").trim();
  if(!esAprobar && !motivo){ S.pedidoTesoreriaModal.err="Ingresá el motivo del rechazo."; render(); return; }
  let cantidadFinal = null;
  if(esAprobar){
    cantidadFinal = +(($("pt-cant")?.value||"").trim());
    if(!cantidadFinal || cantidadFinal<=0){ S.pedidoTesoreriaModal.err="Ingresá una cantidad válida."; render(); return; }
  }

  d.loading = true; renderNow();
  await new Promise(r=>setTimeout(r,400));

  const original = S.requests.find(x=>x.id===d.id);
  const cambioCant = esAprobar && original && +original.cantidad!==cantidadFinal;
  const changes = esAprobar
    ? {estado:"Pendiente", cantidad:cantidadFinal,
       comentario:`Aprobado por Tesorería (${check.nombre})${cambioCant?` — cantidad ajustada de ${original.cantidad} a ${cantidadFinal}`:""}`,
       updatedAt:now()}
    : {estado:"Rechazada", comentario:`Rechazado por Tesorería (${check.nombre}): ${motivo}`, updatedAt:now()};
  S.requests = S.requests.map(x=>x.id===d.id ? {...x,...changes} : x);
  S.modal = null;
  toast(esAprobar?`✅ Pedido ${d.id} aprobado — pasa a logística`:`✕ Pedido ${d.id} rechazado`);
  sheetsUpdate(d.id, changes);
}
