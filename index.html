// ═══════════════════════════════════════════════════════════════════
//  DEVOLUCIONES DE SECOS — pickeo
//  Circuito:
//   1) El market arma la devolución escaneando (o buscando) cada producto,
//      con cantidad y motivo.
//   2) Si hay líneas de SOBRESTOCK, Logística/Admin evalúan qué vuelve
//      ("En evaluación"). Los demás motivos se aceptan solos.
//   3) El repartidor lo lleva a fábrica (lo que se aceptó).
//   4) Depósito lo levanta y CONTROLA pickeando que haya llegado lo declarado.
// ═══════════════════════════════════════════════════════════════════
const esSobrestock = m => normNotif(String(m||"").split(" — ")[0])==="sobrestock";
function puedeEvaluarSecos(){ const r=S.user?.rol; return r==="logistica"||r==="admin"; }
function puedeControlarSecos(){
  const u=S.user; if(!u) return false;
  return u.rol==="logistica"||u.rol==="admin"||esDeposito(u);
}
// Lo que realmente viaja a fábrica: lo aceptado (las devoluciones que no
// pasan por evaluación no tienen cantidadAceptada y viajan completas).
function lineasQueViajan(d){
  return productosDeDevolucion(d)
    .filter(p=>p.cantidadAceptada===undefined||p.cantidadAceptada===null||+p.cantidadAceptada>0)
    .map(p=>({...p, cantidad:(p.cantidadAceptada===undefined||p.cantidadAceptada===null)?p.cantidad:+p.cantidadAceptada}));
}

// ── Lector de códigos (se carga recién cuando se abre la cámara) ──
let _qrLibPromise=null, _qr=null, _ultimoScan={code:"",t:0};
function cargarLibQR(){
  if(window.Html5Qrcode) return Promise.resolve();
  if(_qrLibPromise) return _qrLibPromise;
  const cargar=url=>new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=url; s.onload=res;
    s.onerror=()=>{ s.remove(); rej(new Error("no cargó "+url)); };
    document.head.appendChild(s);
  });
  _qrLibPromise=cargar("https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js")
    .catch(()=>cargar("https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"))
    .catch(e=>{ _qrLibPromise=null; throw e; });
  return _qrLibPromise;
}
async function pickeoAbrirCamara(){
  const p=S.pickeo; if(!p) return;
  p.camara=true; p.errCamara=""; render();
  try{
    await cargarLibQR();
    await new Promise(r=>setTimeout(r,80));
    if(!S.pickeo || !S.pickeo.camara || !document.getElementById("pickeo-reader")) return;
    _qr=new Html5Qrcode("pickeo-reader");
    const F=window.Html5QrcodeSupportedFormats||{};
    const formatos=["EAN_13","EAN_8","UPC_A","UPC_E","CODE_128","CODE_39","QR_CODE"].map(k=>F[k]).filter(v=>v!==undefined);
    await _qr.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140},...(formatos.length?{formatsToSupport:formatos}:{})},
      code=>pickeoCodigoLeido(code,false), ()=>{});
  }catch(e){
    console.warn("Cámara:",e);
    await pickeoCerrarCamara(true);
    if(S.pickeo){ S.pickeo.errCamara="No se pudo abrir la cámara. Revisá el permiso del navegador o cargá el código a mano."; render(); }
  }
}
async function pickeoCerrarCamara(silencioso){
  const q=_qr; _qr=null;
  if(q){ try{ await q.stop(); }catch(e){} try{ q.clear(); }catch(e){} }
  if(S.pickeo) S.pickeo.camara=false;
  if(!silencioso) render();
}

// ── Búsqueda de productos por código ──
function variantesCodigo(code){
  const raw=String(code||"").trim(); if(!raw) return [];
  const set=new Set([raw]);
  if(/^\d+$/.test(raw)){
    const sin=raw.replace(/^0+/,""); if(sin) set.add(sin);
    [8,12,13,14].forEach(n=>{ if(raw.length<n) set.add(raw.padStart(n,"0")); });
    if(raw.length===14||raw.length===13) set.add(raw.replace(/^0/,""));
  }
  return [...set];
}
function mismosCodigos(a,b){
  const va=variantesCodigo(a), vb=new Set(variantesCodigo(b));
  return va.some(x=>vb.has(x));
}
async function buscarProductoPorCodigo(code){
  const vars=variantesCodigo(code); if(!vars.length) return null;
  for(const col of ["codigo_barras","codigo_interno"]){
    try{
      const { data, error } = await sb.from("productos").select("id,descripcion,codigo_interno,codigo_barras").in(col,vars).limit(1);
      if(error) throw error;
      if(data && data.length) return toCamelRows(data)[0];
    }catch(e){ console.warn("Buscar por código:",e); }
  }
  return null;
}

// ── Apertura de la ventana ──
function pickeoEstadoBase(extra){
  return {camara:false,errCamara:"",query:"",resultados:[],buscando:false,ultimo:null,err:"",loading:false,dni:"",...extra};
}
function abrirPickeoArmar(){
  S.pickeo=pickeoEstadoBase({modo:"armar",lineas:[],actual:null});
  S.vista="pickeo"; render();
  window.scrollTo({top:0,behavior:"instant"});
}
function abrirPickeoControl(id){
  const d=S.devoluciones.find(x=>String(x.id)===String(id)); if(!d) return;
  let guardado={}; try{ guardado=JSON.parse(localStorage.getItem("tl_ctrl_"+id)||"{}"); }catch(e){}
  // En el depósito se cuenta el PRODUCTO: si vino en dos líneas (por ejemplo una
  // rota y otra vencida) se controla como una sola fila con el total esperado.
  const grupos=new Map();
  lineasQueViajan(d).forEach(p=>{
    const k=String(p.productoId??p.descripcion);
    const g=grupos.get(k)||{k, productoId:p.productoId, descripcion:p.descripcion, codigoInterno:p.codigoInterno||"", codigoBarras:p.codigoBarras||"",
                            unidad:p.unidad||"Unidades", esperado:0, recibido:+(guardado[k]||0), motivos:[]};
    g.esperado+=+p.cantidad||0;
    const m=String(p.motivo||"").split(" — ")[0]; if(m && !g.motivos.includes(m)) g.motivos.push(m);
    grupos.set(k,g);
  });
  const lineas=[...grupos.values()].map(g=>({...g, motivo:g.motivos.join(" + ")}));
  S.pickeo=pickeoEstadoBase({modo:"controlar",devId:id,sucursal:d.sucursal,lineas});
  S.vista="pickeo"; render();
  window.scrollTo({top:0,behavior:"instant"});
}
// Salir del pickeo. Al armar, avisa si se perdería lo pickeado; al controlar, el
// avance queda guardado y se puede retomar.
async function salirPickeo(forzar){
  const p=S.pickeo;
  if(p && p.modo==="armar" && (p.lineas.length||p.actual) && !forzar && !confirm("¿Salir? Se pierde la orden que estabas armando.")) return;
  await pickeoCerrarCamara(true);
  S.pickeo=null; S.vista="devoluciones"; render();
}
function pickeoGuardarProgreso(){
  const p=S.pickeo; if(!p||p.modo!=="controlar") return;
  const m={}; p.lineas.forEach(l=>{ if(+l.recibido>0) m[l.k]=+l.recibido; });
  try{ localStorage.setItem("tl_ctrl_"+p.devId, JSON.stringify(m)); }catch(e){}
}

// ── Escaneo / ingreso de un código ──
async function pickeoCodigoLeido(code, manual){
  const p=S.pickeo; if(!p) return;
  code=String(code||"").trim(); if(!code) return;
  const ahora=Date.now();
  if(!manual && _ultimoScan.code===code && ahora-_ultimoScan.t<1800) return;   // la cámara lee varias veces el mismo código
  _ultimoScan={code,t:ahora};
  if(navigator.vibrate) navigator.vibrate(60);

  if(p.modo==="armar"){
    // Como en el armador: al leer un producto se apaga la cámara y se completa
    // su ficha (cantidad, unidad, motivo). Para el siguiente, se vuelve a escanear.
    if(p.actual){ p.ultimo={ok:false,txt:`Primero terminá con "${p.actual.producto.descripcion}": elegí el motivo y tocá Devolver (o Cancelar).`}; render(); return; }
    const prod=await buscarProductoPorCodigo(code);
    if(!S.pickeo) return;
    if(!prod){ p.ultimo={ok:false,txt:`El código ${code} no está en el catálogo. Probá buscarlo por nombre.`}; render(); return; }
    if(p.camara) await pickeoCerrarCamara(true);
    pickeoSeleccionarProducto(prod);
    return;
  }
  // control en fábrica: la cámara sigue abierta y cada lectura suma 1
  let idx=p.lineas.findIndex(l=>l.codigoBarras && mismosCodigos(code,l.codigoBarras));
  if(idx<0 && /^\d+$/.test(code)) idx=p.lineas.findIndex(l=>l.codigoInterno && String(l.codigoInterno)===code);
  let prod=null;
  if(idx<0){
    prod=await buscarProductoPorCodigo(code);
    if(!S.pickeo) return;
    if(prod) idx=p.lineas.findIndex(l=>String(l.productoId)===String(prod.id));
  }
  if(idx<0){
    p.ultimo={ok:false,txt: prod ? `${prod.descripcion} NO figura en esta devolución.` : `El código ${code} no figura en esta devolución.`};
    render(); return;
  }
  const l=p.lineas[idx];
  l.recibido=(+l.recibido||0)+1;
  p.ultimo = l.recibido>l.esperado ? {ok:false,txt:`${l.descripcion}: ya van ${l.recibido} y se esperaban ${l.esperado} (de más)`} : null;
  pickeoGuardarProgreso(); render();
}
function pickeoBuscarManual(){
  const el=$("pk-busqueda"); const v=(el?.value||S.pickeo?.query||"").trim();
  if(!v) return;
  if(/\d{6,}/.test(v) && /^[\dA-Za-z\-]+$/.test(v)){
    if(el) el.value=""; S.pickeo.query=""; S.pickeo.resultados=[];
    pickeoCodigoLeido(v,true);
  }
}

// ── Armar la orden: buscar por nombre ──
let _timerPickeoBusq=null;
function pickeoBuscar(q){
  const p=S.pickeo; if(!p) return;
  p.query=q;
  clearTimeout(_timerPickeoBusq);
  const t=q.trim();
  if(t.length<2){ p.resultados=[]; p.buscando=false; render(); return; }
  p.buscando=true; render();
  _timerPickeoBusq=setTimeout(async ()=>{
    try{
      const { data, error } = await sb.from("productos").select("id,descripcion,codigo_interno,codigo_barras")
        .or(`descripcion.ilike.%${t}%,codigo_interno.ilike.%${t}%,codigo_barras.ilike.%${t}%`).limit(12);
      if(error) throw error;
      if(S.pickeo) S.pickeo.resultados=toCamelRows(data||[]);
    }catch(e){ console.warn("Buscar:",e); if(S.pickeo) S.pickeo.resultados=[]; }
    if(S.pickeo){ S.pickeo.buscando=false; render(); }
  },280);
}
function pickeoElegirResultado(prod){ if(S.pickeo?.camara) pickeoCerrarCamara(true); pickeoSeleccionarProducto(prod); }

// La "ficha" del producto que se está pickeando ahora: cantidad, unidad y
// motivo. Al tocar Devolver pasa a la lista de abajo y la ficha desaparece.
function pickeoSeleccionarProducto(prod){
  const p=S.pickeo; if(!p) return;
  p.query=""; p.resultados=[]; p.err="";
  const el=$("pk-busqueda"); if(el) el.value="";
  if(p.actual){
    if(String(p.actual.producto.id)===String(prod.id)){ p.actual.cantidad=(+p.actual.cantidad||0)+1; p.ultimo=null; }
    else p.ultimo={ok:false,txt:`Primero terminá con "${p.actual.producto.descripcion}": elegí el motivo y tocá Devolver (o Cancelar).`};
    render(); return;
  }
  p.actual={producto:prod,cantidad:1,unidad:"Unidades",motivo:"",err:""};
  p.ultimo=null;
  render();
  setTimeout(()=>{ document.getElementById("pk-actual")?.scrollIntoView({behavior:"smooth",block:"center"}); },80);
}
function pickeoActualCant(delta){ const a=S.pickeo?.actual; if(a){ a.cantidad=Math.max(1,(+a.cantidad||0)+delta); a.err=""; render(); } }
function pickeoActualSet(campo,v){ const a=S.pickeo?.actual; if(a){ a[campo]=v; a.err=""; if(campo!=="cantidad") render(); } }
function pickeoCancelarActual(){
  const p=S.pickeo; if(!p||!p.actual) return;
  if(p.actual.volverA) p.lineas.unshift(p.actual.volverA);   // venía de "editar": vuelve a la lista como estaba
  p.actual=null; p.ultimo=null; render();
}
function pickeoDevolver(){
  const p=S.pickeo; if(!p||!p.actual) return;
  const a=p.actual;
  const c=$("pk-a-cant"); if(c) a.cantidad=c.value;
  if(!(+a.cantidad>0)){ a.err="Poné la cantidad (mínimo 1)."; render(); return; }
  if(!a.motivo){ a.err="Elegí el motivo de la devolución."; render(); return; }
  const cant=+a.cantidad;
  const ex=p.lineas.find(l=>String(l.producto.id)===String(a.producto.id)&&l.motivo===a.motivo&&l.unidad===a.unidad);
  if(ex) ex.cantidad=(+ex.cantidad||0)+cant;
  else p.lineas.unshift({producto:a.producto,cantidad:cant,unidad:a.unidad,motivo:a.motivo});
  p.ultimo=null;
  p.actual=null; p.err="";
  render();
}
function pickeoEditarLinea(i){
  const p=S.pickeo; if(!p) return;
  if(p.actual){ p.ultimo={ok:false,txt:`Primero terminá con "${p.actual.producto.descripcion}".`}; render(); return; }
  const l=p.lineas.splice(i,1)[0]; if(!l) return;
  p.actual={...l,err:"",volverA:l}; p.ultimo=null; render();
  setTimeout(()=>{ document.getElementById("pk-actual")?.scrollIntoView({behavior:"smooth",block:"center"}); },80);
}
function pickeoQuitar(i){ S.pickeo.lineas.splice(i,1); render(); }

// Control: sumar/restar/escribir lo recibido
function pickeoCtrlCambiar(i,delta){
  const l=S.pickeo.lineas[i]; if(!l) return;
  l.recibido=Math.max(0,(+l.recibido||0)+delta); pickeoGuardarProgreso(); render();
}
function pickeoCtrlSet(i,v){ const l=S.pickeo.lineas[i]; if(l){ l.recibido=Math.max(0,+v||0); pickeoGuardarProgreso(); render(); } }
function pickeoCtrlTodoOk(i){ const l=S.pickeo.lineas[i]; if(l){ l.recibido=l.esperado; pickeoGuardarProgreso(); render(); } }

// ── Firma: DNI de quien confirma (Logística/Admin ya están identificados) ──
function pickeoFirmante(){
  if(S.user?.rol==="logistica"||S.user?.rol==="admin") return {ok:true,nombre:S.user.nombre||S.user.area,dni:S.user.dni||""};
  const dni=String($("pk-dni")?.value||S.pickeo?.dni||"").replace(/\D/g,"");
  if(!dni) return {ok:false,msg:"Ingresá tu DNI."};
  const chk=validarDNI(dni);
  if(!chk.ok) return {ok:false,msg:chk.msg};
  return {ok:true,nombre:chk.nombre,dni};
}

// ── Confirmar: el DNI se pide recién acá, en una ventanita ──
function pickeoPedirConfirmacion(){
  const p=S.pickeo; if(!p||p.loading) return;
  if(p.modo==="armar"){
    if(p.actual){ p.err="Terminá el producto que tenés abierto (Devolver o Cancelar)."; render(); return; }
    if(!p.lineas.length){ p.err="Pickeá al menos un producto."; render(); return; }
  }
  p.err="";
  // Logística y Admin ya se identificaron al entrar
  if(S.user?.rol==="logistica"||S.user?.rol==="admin"){ p.modo==="armar" ? pickeoEnviar() : pickeoConfirmarControl(); return; }
  const n=p.lineas.length;
  const resumen = p.modo==="armar"
    ? `<strong>${n}</strong> producto${n!==1?"s":""} · <strong>${fmtNum(p.lineas.reduce((x,l)=>x+(+l.cantidad||0),0))}</strong> en total`
    : (()=>{ const dif=p.lineas.filter(l=>(+l.recibido||0)!==(+l.esperado||0)).length; return `<strong>${n-dif}</strong> de ${n} completos${dif?` · <span style="color:var(--amber);font-weight:700">${dif} con diferencia</span>`:""}`; })();
  S.pickeoDni={modo:p.modo,dni:"",err:"",loading:false,resumen,
    titulo:p.modo==="armar"?"Enviar la orden":"Confirmar el control",
    boton:p.modo==="armar"?"Enviar orden":"✅ Confirmar"};
  S.modal="pickeoDni"; render();
  setTimeout(()=>$("pk-dni")?.focus(),120);
}

async function pickeoConfirmarConDni(){
  const d=S.pickeoDni; if(!d||d.loading) return;

// ── Enviar la devolución armada ──
async function pickeoEnviar(firmaParam){
  const p=S.pickeo; if(!p||p.loading||p.modo!=="armar") return false;
  if(p.actual){ p.err="Terminá el producto que tenés abierto (Devolver o Cancelar) antes de enviar."; render(); return false; }
  if(!p.lineas.length){ p.err="Pickeá al menos un producto."; render(); return false; }
  const firma=firmaParam||pickeoFirmante();
  if(!firma.ok){ p.err=firma.msg; render(); return false; }

  p.loading=true; p.err=""; renderNow();
  const u=S.user;
  try{
    const productosJson=p.lineas.map(l=>{
      const sobre=esSobrestock(l.motivo);
      return {
        productoId:l.producto.id, descripcion:l.producto.descripcion,
        codigoInterno:l.producto.codigoInterno||"", codigoBarras:l.producto.codigoBarras||"",
        cantidad:+l.cantidad, unidad:l.unidad, motivo:l.motivo,
        // el sobrestock espera evaluación; el resto se acepta solo
        evaluacion: sobre?"pendiente":"aceptada",
        cantidadAceptada: sobre?null:+l.cantidad,
      };
    });
    const haySobre=productosJson.some(x=>x.evaluacion==="pendiente");
    const motivoResumen=productosJson.length===1?productosJson[0].motivo:`${productosJson.length} productos: `+productosJson.map(x=>x.descripcion).join(", ");
    const payload=toSnakeRow({
      sucursal:u.area||"", motivo:motivoResumen, fotoUrl:"",
      estado: haySobre?"En evaluación":"Pendiente",
      creadoPor:firma.nombre, productosJson:JSON.stringify(productosJson), tipoDevolucion:"Secos",
    });
    const { data, error } = await sb.from("devoluciones").insert(payload).select().single();
    if(error) throw error;
    const creada=toCamelRow(data);
    S.devoluciones=[creada,...S.devoluciones];
    await pickeoCerrarCamara(true);
    S.pickeo=null; S.vista="devoluciones";
    S.devolucionForm={tipo:"",items:[],loading:false,err:"",productoQuery:"",productoResultados:[],productoBuscando:false};
    window.scrollTo({top:0,behavior:"instant"});
    toast(haySobre?"📦 Devolución enviada — Logística evalúa el sobrestock":"📦 Devolución de Secos enviada");
    if(haySobre) crearNotificacion("LOGISTICA",`📦 Devolución de Secos con sobrestock para evaluar — ${u.area||""}`,null);
    render(); return true;
  }catch(e){
    console.warn("Enviar pickeo:",e);
    p.loading=false; p.err="No se pudo enviar — probá de nuevo.";
  }
  render(); return false;
}

// ── Confirmar el control en fábrica ──
async function pickeoConfirmarControl(firmaParam){
  const p=S.pickeo; if(!p||p.loading||p.modo!=="controlar") return false;
  const d=S.devoluciones.find(x=>String(x.id)===String(p.devId)); if(!d) return false;
  const firma=firmaParam||pickeoFirmante();
  if(!firma.ok){ p.err=firma.msg; render(); return false; }
  p.loading=true; p.err=""; renderNow();

  // Lo contado de cada producto se reparte entre sus líneas (en orden) hasta
  // cubrir lo esperado de cada una; lo que sobre queda en la última.
  const productosConfirmados=productosDeDevolucion(d).map(x=>({...x}));
  const esperadoDe=x=>(x.cantidadAceptada===undefined||x.cantidadAceptada===null)?(+x.cantidad||0):(+x.cantidadAceptada||0);
  p.lineas.forEach(l=>{
    const idxs=[]; productosConfirmados.forEach((x,i)=>{ if(String(x.productoId??x.descripcion)===l.k && esperadoDe(x)>0) idxs.push(i); });
    let resto=+l.recibido||0;
    idxs.forEach((ix,j)=>{
      const asignado = j===idxs.length-1 ? resto : Math.min(esperadoDe(productosConfirmados[ix]),resto);
      productosConfirmados[ix].cantidadRecibida=asignado; resto-=asignado;
    });
  });
  const difs=p.lineas.filter(l=>(+l.recibido||0)!==(+l.esperado||0));
  const nota=difs.length ? "⚠️ Diferencia en cantidad recibida vs. declarada: "+difs.map(l=>`${l.descripcion} (declarado ${fmtNum(l.esperado)}${l.unidad?" "+l.unidad:""}, recibido ${fmtNum(+l.recibido||0)}${l.unidad?" "+l.unidad:""})`).join("; ") : "";
  const changes={
    estado:"Confirmada",
    respuesta:(difs.length?"Controlada por pickeo, con diferencias.":"Controlada por pickeo: llegó todo lo declarado.")+(nota?" · "+nota:""),
    respondidoPor:firma.nombre, productosJson:JSON.stringify(productosConfirmados), updatedAt:now(),
  };
  try{
    const { error } = await sb.from("devoluciones").update(toSnakeRow(changes)).eq("id",d.id);
    if(error) throw error;
    S.devoluciones=S.devoluciones.map(x=>String(x.id)===String(d.id)?{...x,...changes}:x);
    try{ localStorage.removeItem("tl_ctrl_"+d.id); }catch(e){}
    await pickeoCerrarCamara(true);
    S.pickeo=null; S.vista="devoluciones";
    if(puedeClasificarSecos()) S.tabDevGestor="clasificar";   // lo que sigue es clasificarla
    window.scrollTo({top:0,behavior:"instant"});
    toast((difs.length?"✅ Confirmada con diferencias":"✅ Confirmada: llegó todo")+(puedeClasificarSecos()?" · ahora clasificala":""));
    render(); return true;
  }catch(e){
    console.warn("Confirmar control:",e);
    p.loading=false; p.err="No se pudo guardar — probá de nuevo.";
  }
  render(); return false;
}

// ── Evaluación del sobrestock (Logística / Admin) ──
function setDecisionEval(id,idx,v){ S.evalSecos=S.evalSecos||{}; const m=(S.evalSecos[id]=S.evalSecos[id]||{}); m[idx]={...(m[idx]||{}),decision:v}; render(); }
function setCantEval(id,idx,v){ S.evalSecos=S.evalSecos||{}; const m=(S.evalSecos[id]=S.evalSecos[id]||{}); m[idx]={...(m[idx]||{}),cantidad:v}; }
async function confirmarEvaluacionSecos(id){
  const d=S.devoluciones.find(x=>String(x.id)===String(id)); if(!d||!puedeEvaluarSecos()) return;
  const prods=productosDeDevolucion(d); const dec=(S.evalSecos||{})[id]||{};
  const ahora=now(), quien=S.user.nombre||S.user.area||"";
  const resumen=[]; let alguna=false;
  for(let i=0;i<prods.length;i++){
    const x=prods[i]; if(x.evaluacion!=="pendiente") continue;
    const e=dec[i]||{};
    if(!e.decision){ toast(`Decidí qué pasa con "${x.descripcion}"`,"warn"); return; }
    if(e.decision==="aceptar"){
      const cant=e.cantidad===undefined||e.cantidad===""?+x.cantidad:+e.cantidad;
      if(!(cant>0) || cant>+x.cantidad){ toast(`La cantidad de "${x.descripcion}" tiene que estar entre 1 y ${x.cantidad}`,"warn"); return; }
      prods[i]={...x,evaluacion:"aceptada",cantidadAceptada:cant,evaluadoPor:quien,evaluadoAt:ahora};
      resumen.push(`vuelve ${fmtNum(cant)} de ${fmtNum(x.cantidad)} ${x.unidad||""} de ${x.descripcion}`.replace(/\s+/g," ")); alguna=true;
    } else {
      prods[i]={...x,evaluacion:"rechazada",cantidadAceptada:0,evaluadoPor:quien,evaluadoAt:ahora};
      resumen.push(`NO vuelve ${x.descripcion}`);
    }
  }
  const viaja=prods.some(x=>x.cantidadAceptada===undefined||x.cantidadAceptada===null||+x.cantidadAceptada>0);
  const changes={
    estado: viaja?"Pendiente":"Rechazada",
    productosJson:JSON.stringify(prods),
    respuesta:`Evaluación de sobrestock: ${resumen.join("; ")}.`,
    respondidoPor:quien, updatedAt:ahora,
  };
  try{
    const { error } = await sb.from("devoluciones").update(toSnakeRow(changes)).eq("id",d.id);
    if(error) throw error;
    S.devoluciones=S.devoluciones.map(x=>String(x.id)===String(d.id)?{...x,...changes}:x);
    if(S.evalSecos) delete S.evalSecos[id];
    toast(viaja?"✅ Evaluada — queda lista para que el repartidor la lleve":"Evaluada — no vuelve nada, queda cerrada");
    crearNotificacion(String(d.sucursal||"").toUpperCase(), viaja?`✅ Evaluaron tu devolución de Secos: ${resumen.join("; ")}.`:`Tu devolución de Secos no fue aceptada (sobrestock): queda en la sucursal.`, null);
  }catch(e){ console.warn("Evaluar:",e); toast("⚠️ No se pudo guardar la evaluación","warn"); }
  render();
}

// ═══════════════════════════════════════════════════════════════════
//  CLASIFICACIÓN (después del control en fábrica)
//  Una vez confirmado que llegó lo declarado, Depósito decide el destino
//  de lo recibido, producto por producto:
//     🔁 Cambio  → tiene cambio con el proveedor
//     🍽️ Comedor → no tiene cambio: va al comedor
//     📦 Stock   → sobrestock aceptado: vuelve a stock
//  Se hace en una pestaña y pantalla aparte ("Para clasificar") para no
//  mezclarlo con lo que todavía está en camino o en control.
// ═══════════════════════════════════════════════════════════════════
const DESTINOS_SECOS=[
  {k:"cambio", label:"Cambio",  icon:"🔁", color:"#4f9eff"},
  {k:"comedor",label:"Comedor", icon:"🍽️", color:"#f5a623"},
  {k:"stock",  label:"Stock",   icon:"📦", color:"#2ecc7a"},
];
// Lo que sugiere el motivo declarado (Depósito lo confirma o lo cambia)
function destinoSugerido(motivo){
  const m=normNotif(String(motivo||"").split(" — ")[0]);
  if(m==="sobrestock") return "stock";
  if(m.includes("con cambio")) return "cambio";
  return "comedor";
}
function puedeClasificarSecos(){ return puedeControlarSecos(); }
function esSecosParaClasificar(d){ return d.tipoDevolucion==="Secos" && d.estado==="Confirmada" && puedeClasificarSecos(); }
// "Final" = ya no hay nada más que hacer. Un Secos controlado todavía espera
// su clasificación (solo para quien puede clasificarlo).
function devolucionFinal(d){
  if(["No confirmada","Rechazada","Clasificada"].includes(d.estado)) return true;
  if(d.estado==="Confirmada") return !(d.tipoDevolucion==="Secos" && puedeClasificarSecos());
  return false;
}
const clasifAsignado=l=>(+l.cambio||0)+(+l.comedor||0)+(+l.stock||0);
const clasifDif=l=>Math.round((l.recibido-clasifAsignado(l))*1000)/1000;

function abrirClasificar(id){
  const d=S.devoluciones.find(x=>String(x.id)===String(id)); if(!d||!puedeClasificarSecos()) return;
  const lineas=[];
  productosDeDevolucion(d).forEach((x,i)=>{
    const esp=(x.cantidadAceptada===undefined||x.cantidadAceptada===null)?(+x.cantidad||0):(+x.cantidadAceptada||0);
    if(esp<=0) return;                                                      // no viajó (rechazada en evaluación)
    const rec=(x.cantidadRecibida!==undefined&&x.cantidadRecibida!==null)?+x.cantidadRecibida:esp;
    if(rec<=0) return;                                                      // no llegó
    const sug=destinoSugerido(x.motivo), ya=x.clasificacion||null;
    const l={i, productoId:x.productoId, descripcion:x.descripcion, codigoInterno:x.codigoInterno||"", codigoBarras:x.codigoBarras||"",
             unidad:x.unidad||"Unidades", motivo:x.motivo||"", recibido:rec, sugerido:sug,

function clasifTodo(i,k){

function clasifSet(i,k,v){ const l=S.clasif.lineas[i]; if(l){ l[k]=Math.max(0,+v||0); S.clasif.err=""; } }
function clasifResumen(){

}

async function clasifGuardar(firmaParam){

  c.loading=true; c.err=""; renderNow();

    prods[l.i]={...prods[l.i],

  }catch(e){
    console.warn("Clasificar:",e);

// ═══════════════════════════════════════════════════════════════════
//  RECLAMO A PROVEEDOR
//  Lo que Depósito clasificó como "Cambio" se junta acá, agrupado por el
//  proveedor del producto (columna productos.proveedor), para saber qué
//  cantidad hay que reclamarle a cada uno. Al reclamarlo se marca, y deja
//  de figurar como pendiente.
// ═══════════════════════════════════════════════════════════════════
function puedeVerReclamos(){
  const u=S.user; if(!u) return false;
  if(u.rol==="logistica"||u.rol==="admin") return true;
  if(esDeposito(u)) return true;
  if(u.rol==="planificacion"){
    const t=String(u.tipoReal||"").toUpperCase(), a=normSinTildes(u.area||"");
    return t==="COMPRAS"||a==="compras";
  }
  return false;
}
const SIN_PROVEEDOR="Sin proveedor asignado";
function proveedorDe(x){
  const p=(S.provPorProducto||{})[String(x.productoId)];
  return (p&&String(p).trim())||"";
}
// Una fila por línea de devolución Clasificada con cantidad a cambio
function lineasReclamo(){
  const out=[];
  S.devoluciones.forEach(d=>{
    if(d.tipoDevolucion!=="Secos"||d.estado!=="Clasificada") return;
    productosDeDevolucion(d).forEach((x,idx)=>{
      const cant=+(x.clasificacion&&x.clasificacion.cambio)||0;
      if(cant<=0) return;
      out.push({devId:d.id,idx,sucursal:d.sucursal||"—",fecha:d.createdAt,productoId:x.productoId,
        codigoInterno:x.codigoInterno||"",codigoBarras:x.codigoBarras||"",descripcion:x.descripcion||"",
        unidad:x.unidad||"Unidades",motivo:String(x.motivo||"").split(" — ")[0],cantidad:cant,
        proveedor:proveedorDe(x),reclamo:x.reclamo||null});
    });
  });
  return out;
}
// Trae el proveedor de los productos que lo necesitan (una consulta por tandas)
async function cargarProveedoresReclamo(){
  if(S.provCargando) return;
  S.provPorProducto=S.provPorProducto||{};
  const ids=[...new Set(lineasReclamo().map(l=>l.productoId).filter(v=>v!==undefined&&v!==null&&v!==""))]
    .filter(id=>!(String(id) in S.provPorProducto));
  if(!ids.length) return;
  S.provCargando=true;
  try{
    for(let i=0;i<ids.length;i+=150){
      const chunk=ids.slice(i,i+150);
      const { data, error } = await sb.from("productos").select("id,proveedor").in("id",chunk);
      if(error) throw error;
      const vistos=new Set();
      (data||[]).forEach(r=>{ S.provPorProducto[String(r.id)]=r.proveedor||""; vistos.add(String(r.id)); });
      chunk.forEach(id=>{ if(!vistos.has(String(id))) S.provPorProducto[String(id)]=""; });
    }
    S.provFalta=false;
  }catch(e){
    console.warn("Proveedores:",e);
    if(/proveedor/i.test(String(e&&(e.message||e.details||"")))) S.provFalta=true;
    ids.forEach(id=>{ S.provPorProducto[String(id)]=""; });     // no reintentar en bucle
  }
  S.provCargando=false; render();
}
function reclamoRefrescarProveedores(){ S.provPorProducto={}; S.provFalta=false; cargarProveedoresReclamo(); render(); }

// Agrupa (proveedor → producto) aplicando los filtros de pantalla
function reclamoGrupos(){
  const vista=S.reclamoVista||"pendientes";
  let filas=lineasReclamo().filter(l=>vista==="pendientes"?!l.reclamo:!!l.reclamo);
  const total=filas.length;
  const q=normNotif(S.reclamoQuery||"");
  const provSel=S.reclamoProveedor||"";
  const conteoProv={};
  filas.forEach(l=>{ const k=l.proveedor||SIN_PROVEEDOR; conteoProv[k]=(conteoProv[k]||0)+1; });
  if(provSel) filas=filas.filter(l=>(l.proveedor||SIN_PROVEEDOR)===provSel);
  if(q) filas=filas.filter(l=>normNotif(l.descripcion).includes(q)||normNotif(l.codigoInterno).includes(q)||normNotif(l.codigoBarras).includes(q)||normNotif(l.proveedor).includes(q));
  const gm=new Map();
  filas.forEach(l=>{
    const nombre=l.proveedor||SIN_PROVEEDOR;
    const g=gm.get(nombre)||{nombre,sin:!l.proveedor,prods:new Map()};
    const pk=`${l.productoId??l.codigoInterno??l.descripcion}|${l.unidad}`;
    const p=g.prods.get(pk)||{k:pk,codigoInterno:l.codigoInterno,codigoBarras:l.codigoBarras,descripcion:l.descripcion,unidad:l.unidad,cantidad:0,refs:[],origenes:[],reclamo:l.reclamo};
    p.cantidad+=l.cantidad; p.refs.push({devId:l.devId,idx:l.idx});
    p.origenes.push({sucursal:l.sucursal,fecha:l.fecha,cantidad:l.cantidad,motivo:l.motivo,reclamo:l.reclamo});
    if(!p.codigoInterno&&l.codigoInterno) p.codigoInterno=l.codigoInterno;
    g.prods.set(pk,p); gm.set(nombre,g);
  });
  const grupos=[...gm.values()].map(g=>{
    const filasG=[...g.prods.values()].sort((a,b)=>String(a.descripcion).localeCompare(String(b.descripcion),"es"));
    const porUnidad={}; filasG.forEach(p=>{ porUnidad[p.unidad]=(porUnidad[p.unidad]||0)+p.cantidad; });
    return {nombre:g.nombre,sin:g.sin,filas:filasG,totalTxt:Object.entries(porUnidad).map(([u,n])=>`${fmtNum(Math.round(n*1000)/1000)} ${u}`).join(" · ")};
  }).sort((a,b)=> a.sin-b.sin || a.nombre.localeCompare(b.nombre,"es"));
  return {grupos,conteoProv,total,vista};
}
function reclamoToggle(k){ S.reclamoAbierto=S.reclamoAbierto||{}; S.reclamoAbierto[k]=!S.reclamoAbierto[k]; render(); }
function reclamoTexto(g){
  const hoy=new Date().toLocaleDateString("es-AR");
  return [`RECLAMO A PROVEEDOR${g.sin?"":` — ${g.nombre}`}`,`Fecha: ${hoy}`,"",
    ...g.filas.map(p=>`• ${p.codigoInterno?p.codigoInterno+" · ":""}${p.descripcion} — ${fmtNum(Math.round(p.cantidad*1000)/1000)} ${p.unidad}`),
    "",`Total: ${g.filas.length} producto${g.filas.length!==1?"s":""} (${g.totalTxt})`].join("\n");
}
function reclamoCsv(g){
  const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const filas=[["proveedor","codigo_interno","codigo_barras","descripcion","cantidad","unidad","sucursales"]];
  g.filas.forEach(p=>filas.push([g.sin?"":g.nombre,p.codigoInterno,p.codigoBarras,p.descripcion,Math.round(p.cantidad*1000)/1000,p.unidad,[...new Set(p.origenes.map(o=>o.sucursal))].join(" / ")]));
  return "\ufeff"+filas.map(f=>f.map(esc).join(",")).join("\r\n");
}
async function copiarTexto(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=t; ta.style.cssText="position:fixed;opacity:0;top:0;left:0";
    document.body.appendChild(ta); ta.select(); let ok=false;
    try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); return ok;
  }
}
async function reclamoCopiar(nombre){
  const g=reclamoGrupos().grupos.find(x=>x.nombre===nombre); if(!g) return;
  const ok=await copiarTexto(reclamoTexto(g));
  if(ok) toast("📋 Copiado: pegalo en el mail o WhatsApp del proveedor"); else toast("No se pudo copiar","warn");
}
function reclamoDescargar(nombre){
  const g=reclamoGrupos().grupos.find(x=>x.nombre===nombre); if(!g) return;
  const blob=new Blob([reclamoCsv(g)],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`reclamo_${(g.sin?"sin_proveedor":g.nombre).replace(/[^\w\-]+/g,"_")}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}
// Marcar / deshacer "reclamado" para todo lo visible de un proveedor
function reclamoMarcar(nombre,accion){
  const g=reclamoGrupos().grupos.find(x=>x.nombre===nombre); if(!g) return;
  const refs=[]; g.filas.forEach(p=>p.refs.forEach(r=>refs.push(r)));
  if(!refs.length) return;
  S.reclamoPend={proveedor:g.nombre,refs,accion,err:"",n:g.filas.length,totalTxt:g.totalTxt};
  if(S.user?.rol==="logistica"||S.user?.rol==="admin"){
    if(!confirm(accion==="marcar"?`¿Marcar como reclamado a ${g.nombre}? (${g.filas.length} productos)`:`¿Volver a "para reclamar" lo de ${g.nombre}?`)){ S.reclamoPend=null; return; }
    reclamoGuardar(); return;
  }
  S.pickeoDni={modo:"reclamar",dni:"",err:"",loading:false,
    titulo:accion==="marcar"?"Marcar como reclamado":"Deshacer el reclamo",
    boton:accion==="marcar"?"✅ Marcar reclamado":"↩ Deshacer",
    resumen:`<strong>${escH(g.nombre)}</strong> · ${g.filas.length} producto${g.filas.length!==1?"s":""} · ${escH(g.totalTxt)}`};
  S.modal="pickeoDni"; render();
  setTimeout(()=>$("pk-dni")?.focus(),120);
}
async function reclamoGuardar(firmaParam){
  const r=S.reclamoPend; if(!r) return false;
  const firma=firmaParam||pickeoFirmante();
  if(!firma.ok){ r.err=firma.msg; render(); return false; }
  const porDev={}; r.refs.forEach(({devId,idx})=>{ (porDev[devId]=porDev[devId]||[]).push(idx); });
  const ahora=now(), hechas={}; let fallos=0;
  await Promise.all(Object.entries(porDev).map(async([devId,idxs])=>{
    const d=S.devoluciones.find(x=>String(x.id)===String(devId)); if(!d){ fallos++; return; }
    const prods=productosDeDevolucion(d).map(x=>({...x}));
    idxs.forEach(i=>{
      if(!prods[i]) return;
      if(r.accion==="marcar") prods[i].reclamo={at:ahora,por:firma.nombre,proveedor:r.proveedor===SIN_PROVEEDOR?"":r.proveedor};
      else delete prods[i].reclamo;
    });
    const changes={productosJson:JSON.stringify(prods),updatedAt:ahora};
    try{
      const { error } = await sb.from("devoluciones").update(toSnakeRow(changes)).eq("id",d.id);
      if(error) throw error;
      hechas[String(devId)]=changes;
    }catch(e){ console.warn("Reclamo:",e); fallos++; }
  }));
  S.devoluciones=S.devoluciones.map(x=>hechas[String(x.id)]?{...x,...hechas[String(x.id)]}:x);
  if(fallos){ r.err=`No se pudo guardar en ${fallos} devolución${fallos!==1?"es":""} — probá de nuevo.`; render(); return false; }
  toast(r.accion==="marcar"?`✅ Marcado como reclamado: ${r.proveedor}`:`↩ Vuelve a "para reclamar": ${r.proveedor}`);
  S.reclamoPend=null; render(); return true;
}

function renderReclamoProveedor(){
  // Pide los proveedores que falten (una sola vez por producto)
  if(!S.provCargando){
    const faltan=lineasReclamo().some(l=>l.productoId!==undefined&&l.productoId!==null&&l.productoId!==""&&!((S.provPorProducto||{}).hasOwnProperty(String(l.productoId))));
    if(faltan) setTimeout(cargarProveedoresReclamo,0);

  const hayFiltro=!!(S.reclamoProveedor||S.reclamoQuery);
  const nProd=grupos.reduce((a,g)=>a+g.filas.length,0);
  return `
  ${S.provFalta?`<div class="alert-info" style="margin-bottom:14px;border-left-color:var(--amber)">⚠️ Todavía no está cargado el proveedor de los productos. Cuando lo cargues en Supabase (<code>productos.proveedor</code>), tocá ↻ para actualizar.</div>`:""}
  <div class="rc-barra">
    <div class="tabs rc-vista">
      <button class="tab ${vista==="pendientes"?"active":""}" onclick="S.reclamoVista='pendientes';render()">Para reclamar</button>

    </div>
    <select class="inp rc-sel" onchange="S.reclamoProveedor=this.value;render()">
      <option value="">Todos los proveedores</option>
      ${provs.map(p=>`<option value="${escH(p)}" ${S.reclamoProveedor===p?"selected":""}>${escH(p)} (${conteoProv[p]})</option>`).join("")}
    </select>
    <input class="inp rc-busq" type="text" placeholder="🔎 Producto o código interno" value="${escH(S.reclamoQuery||"")}" oninput="S.reclamoQuery=this.value;render()"/>
    <button class="btn btn-ghost btn-md" onclick="reclamoRefrescarProveedores()" title="Volver a leer los proveedores">↻</button>
    ${hayFiltro?`<button class="btn btn-ghost btn-md" onclick="S.reclamoProveedor='';S.reclamoQuery='';render()">✕ Limpiar</button>`:""}
  </div>
  ${grupos.length===0

    : `<div class="rc-resumen">${nProd} producto${nProd!==1?"s":""} · ${grupos.length} proveedor${grupos.length!==1?"es":""}</div>
    ${grupos.map(g=>`
    <div class="rc-grupo ${g.sin?"sin":""}">

            ? `<button class="btn btn-success btn-sm" onclick="reclamoMarcar('${escH(g.nombre).replace(/'/g,"&#39;")}','marcar')">✅ Marcar reclamado</button>`
            : `<button class="btn btn-ghost btn-sm" onclick="reclamoMarcar('${escH(g.nombre).replace(/'/g,"&#39;")}','deshacer')">↩ Deshacer</button>`)}

      <div class="rc-filas">
        ${g.filas.map(p=>{
          const abierto=!!(S.reclamoAbierto||{})[g.nombre+"|"+p.k];
          const suc=[...new Set(p.origenes.map(o=>o.sucursal))];
          return `
          <div class="rc-fila ${abierto?"abierta":""}" onclick="reclamoToggle('${escH(g.nombre+"|"+p.k).replace(/'/g,"&#39;")}')">

            <div class="rc-desc">

            </div>
            <div class="rc-cant"><strong>${fmtNum(Math.round(p.cantidad*1000)/1000)}</strong> ${escH(p.unidad)}</div>
          </div>
          ${abierto?`<div class="rc-detalle">${p.origenes.map(o=>`<div><span>${escH(o.sucursal)} · ${fd(o.fecha)}</span><span>${escH(o.motivo)}</span><strong>${fmtNum(o.cantidad)} ${escH(p.unidad)}</strong></div>`).join("")}</div>`:""}`;
        }).join("")}
      </div>
    </div>`).join("")}`}
  `;
}

// "Mal olor o color" y "Mal estado" eran lo mismo: quedó solo "Mal estado".
// Las devoluciones viejas todavía guardan el nombre anterior, así que se
// unifica al leerlas (y el SQL devoluciones_04 lo corrige en la base).
function unificarMotivoDevol(m){
  return String(m??"").replace(/mal\s+olor\s+o\s+color/gi,"Mal estado");
}
function productosDeDevolucion(d){
  if(d.productosJson){
    try{ const arr = JSON.parse(d.productosJson); if(Array.isArray(arr)) return arr.map(p=>({...p, motivo:unificarMotivoDevol(p.motivo)})); }catch(e){}
  }
  if(d.productoDescripcion) return [{descripcion:d.productoDescripcion, codigoInterno:d.productoCodigoInterno||"", motivo:unificarMotivoDevol(d.motivo||"")}];
  return [];
}
function renderDevoluciones(){
  const u = S.user;
  const esGestor = esGestorDevolucion();
  const esRepartidor = u.rol==="repartidor";
  let lista = S.devoluciones;
  if(esRepartidor){
    // Ve todas las pendientes/en curso — pero una vez que producción/logística
    // ya la confirmó (o la cerró como no confirmada), deja de ser relevante
    // para el repartidor y se saca de su vista para no ensuciarla.
    lista = S.devoluciones.filter(d => ["Pendiente","En camino"].includes(d.estado));
    if(S.devolucionFiltroSucursal) lista = lista.filter(d=>d.sucursal===S.devolucionFiltroSucursal);
    if(S.devolucionFiltroFecha)    lista = lista.filter(d=>d.createdAt && d.createdAt.slice(0,10)===S.devolucionFiltroFecha);
  } else if(!esGestor){
    const norm = s=>normNotif(s);
    lista = lista.filter(d => norm(d.sucursal)===norm(u.area));
  } else {
    lista = S.tabDevGestor==="historial" ? S.devoluciones.filter(devolucionFinal)
          : (S.tabDevGestor==="clasificar" && puedeClasificarSecos()) ? S.devoluciones.filter(esSecosParaClasificar)
          : S.devoluciones.filter(d=>!devolucionFinal(d) && !esSecosParaClasificar(d));
    // Calidad solo ve Fresco, Depósito solo ve Secos — es su alcance fijo,
    // no un filtro que puedan sacar. Logística/Admin ven todo, con un
    // filtro de categoría normal que sí pueden cambiar.
    const catFija = categoriaDevolucionFija();
    if(catFija) lista = lista.filter(d=>(d.tipoDevolucion||"Fresco")===catFija);
    else if(S.devolucionFiltroTipo) lista = lista.filter(d=>(d.tipoDevolucion||"Fresco")===S.devolucionFiltroTipo);
    if(S.devolucionFiltroSucursal) lista = lista.filter(d=>d.sucursal===S.devolucionFiltroSucursal);
    if(S.devolucionFiltroEstado)   lista = lista.filter(d=>d.estado===S.devolucionFiltroEstado);
    if(S.devolucionFiltroFecha)    lista = lista.filter(d=>d.createdAt && d.createdAt.slice(0,10)===S.devolucionFiltroFecha);
    if(S.devolucionFiltroProducto){
      const qp = normNotif(S.devolucionFiltroProducto);
      lista = lista.filter(d=>productosDeDevolucion(d).some(p=>normNotif(p.descripcion).includes(qp) || normNotif(p.codigoInterno).includes(qp) || normNotif(p.codigoBarras).includes(qp)));
    }
  }
  const enReclamo = esGestor && S.tabDevGestor==="reclamo" && puedeVerReclamos();
  const sucursalesUnicas = [...new Set(S.devoluciones.map(d=>d.sucursal).filter(Boolean))].sort();
  const colorEstado = e => e==="Clasificada" ? "var(--green)" : e==="Confirmada" ? "#1fa86a" : (e==="No confirmada"||e==="Rechazada") ? "var(--red)" : e==="En evaluación" ? "var(--purple)" : e==="En fábrica" ? "var(--teal)" : e==="En camino" ? "var(--blue)" : "var(--amber)";

  return `
  <div style="animation:fadeUp .3s ease">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin-bottom:2px">📦 Devoluciones</h2>
        <p style="color:var(--muted);font-size:13px">${esGestor?"Todas las sucursales":esRepartidor?"Para levantar y llevar a fábrica":escH(u.area||"")}</p>
      </div>
      <button class="btn btn-ghost btn-md" onclick="S.vista='main';render()">← Volver</button>
    </div>

    ${esGestor?`
    <div class="tabs" style="margin-bottom:16px">
      <button class="tab ${S.tabDevGestor==="activas"?"active":""}" onclick="S.tabDevGestor='activas';render()">📋 Activas</button>
      ${puedeClasificarSecos()?`<button class="tab ${S.tabDevGestor==="clasificar"?"active":""}" onclick="S.tabDevGestor='clasificar';render()">🗂️ Para clasificar<span class="tab-n">${S.devoluciones.filter(esSecosParaClasificar).length}</span></button>`:""}
      ${puedeVerReclamos()?`<button class="tab ${S.tabDevGestor==="reclamo"?"active":""}" onclick="S.tabDevGestor='reclamo';render()">🔁 Reclamo a proveedor</button>`:""}

    </div>`:""}

    ${!esGestor && !esRepartidor && DEVOLUCIONES_NUEVAS_HABILITADAS?`

      ${S.devolucionForm.tipo==="Secos" ? pickeoLauncherHtml() : `

              ${p.codigoInterno?`<div style="font-size:11px;color:var(--faint)">Cód. interno: ${escH(p.codigoInterno)}</div>`:""}
            </div>`).join("")}
        </div>`:""}
        ${S.devolucionForm.productoQuery && !S.devolucionForm.productoBuscando && (S.devolucionForm.productoResultados||[]).length===0?`<div style="font-size:12px;color:var(--muted);margin-top:6px">Sin resultados — probá con otra palabra o el código.</div>`:""}
      </div>

      ${S.devolucionForm.items.length>0?`
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
        ${S.devolucionForm.items.map((it,i)=>`
        <div class="card" style="padding:12px 14px;background:var(--s2)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <div style="font-weight:600;font-size:13px">${escH(it.producto.descripcion)}</div>
              ${it.producto.codigoInterno?`<div style="font-size:11px;color:var(--faint)">Cód. interno: ${escH(it.producto.codigoInterno)}</div>`:""}

            <button class="btn btn-ghost btn-sm" onclick="quitarItemDevolucion(${i})">✕</button>
          </div>
          <div class="g2" style="margin-top:10px">
            <div class="field" style="margin-bottom:0">
              <label>Cantidad <span class="req">*</span></label>
              <input id="devol-cantidad-${i}" type="number" min="0" step="0.01" class="inp" placeholder="Ej: 5"
                value="${escH(String(it.cantidad||""))}" oninput="S.devolucionForm.items[${i}].cantidad=this.value"/>
            </div>
            <div class="field" style="margin-bottom:0">
              <label>Unidad</label>
              <select id="devol-unidad-${i}" class="inp" onchange="S.devolucionForm.items[${i}].unidad=this.value">
                ${UNIDADES.map(un=>`<option ${it.unidad===un?"selected":""}>${un}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="field" style="margin-top:8px;margin-bottom:0">
            <label>Motivo <span class="req">*</span></label>
            <select id="devol-motivo-${i}" class="inp" onchange="S.devolucionForm.items[${i}].motivo=this.value;render()">
              <option value="">— Elegí un motivo —</option>
              ${(MOTIVOS_POR_TIPO_DEVOLUCION[S.devolucionForm.tipo]||[]).map(m=>`<option ${it.motivo===m?"selected":""}>${m}</option>`).join("")}
            </select>
          </div>
          ${it.motivo==="Otro"?`
          <div class="field" style="margin-top:8px;margin-bottom:0">
            <label>Detalle <span class="req">*</span></label>
            <textarea id="devol-detalle-${i}" rows="1" placeholder="Contanos más si hace falta..."
              oninput="S.devolucionForm.items[${i}].detalle=this.value">${escH(it.detalle||"")}</textarea>

        </div>`).join("")}
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="enfocarBuscadorProducto()">+ Agregar otro producto</button>
      `:`<p style="font-size:12px;color:var(--muted);margin-top:8px">Todavía no agregaste ningún producto.</p>`}

      ${S.devolucionForm.err?`<span class="err-msg" style="display:block;margin-top:10px">${escH(S.devolucionForm.err)}</span>`:""}
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
        <label style="display:block;font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px">Foto del ticket (una sola, para toda la devolución)</label>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

          </button>

      </div>
      `}

    <div class="card" style="margin-bottom:20px;border-left:3px solid var(--amber)">
      <h3 style="font-size:14px;font-weight:700;margin-bottom:6px">🛠️ Carga de devoluciones en mantenimiento</h3>
      <p style="font-size:13px;color:var(--muted)">Estamos mejorando este formulario (vas a poder buscar el producto por nombre o código). Volvé a intentar más tarde — las devoluciones que ya estaban cargadas siguen su curso normal.</p>
    </div>`:"")}

    ${esRepartidor && (S.devolSeleccionTomar.size>0 || S.devolSeleccion.size>0)?`
    <div class="card" style="margin-bottom:14px;padding:12px 16px;border-left:3px solid var(--blue);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      ${S.devolSeleccionTomar.size>0?`

      <button class="btn btn-ghost btn-sm" onclick="S.devolSeleccionTomar=new Set();render()">✕</button>`:""}
      ${S.devolSeleccion.size>0?`

      <button class="btn btn-teal btn-sm" onclick="openDejarDevolucionesFabrica()">📦 Dejar en fábrica (${S.devolSeleccion.size})</button>
      <button class="btn btn-ghost btn-sm" onclick="S.devolSeleccion=new Set();render()">✕</button>`:""}

    ${(esGestor||esRepartidor) && !enReclamo?`

      <select class="inp" style="width:200px" onchange="S.devolucionFiltroSucursal=this.value;render()">

        ${sucursalesUnicas.map(o=>`<option ${S.devolucionFiltroSucursal===o?"selected":""}>${escH(o)}</option>`).join("")}
      </select>
      <input type="date" class="inp" style="width:160px" value="${escH(S.devolucionFiltroFecha)}" onchange="S.devolucionFiltroFecha=this.value;render()"/>
      ${esGestor?`
      <select class="inp" style="width:180px" onchange="S.devolucionFiltroEstado=this.value;render()">
        <option value="">Todos los estados</option>
        <option ${S.devolucionFiltroEstado==="En evaluación"?"selected":""}>En evaluación</option>
        <option ${S.devolucionFiltroEstado==="Pendiente"?"selected":""}>Pendiente</option>
        <option ${S.devolucionFiltroEstado==="En camino"?"selected":""}>En camino</option>
        <option ${S.devolucionFiltroEstado==="En fábrica"?"selected":""}>En fábrica</option>
        <option ${S.devolucionFiltroEstado==="Confirmada"?"selected":""}>Confirmada</option>
        <option ${S.devolucionFiltroEstado==="No confirmada"?"selected":""}>No confirmada</option>
        <option ${S.devolucionFiltroEstado==="Rechazada"?"selected":""}>Rechazada</option>
        <option ${S.devolucionFiltroEstado==="Clasificada"?"selected":""}>Clasificada</option>
      </select>
      <input type="text" class="inp" style="width:200px" placeholder="🔎 Producto o código interno..." value="${escH(S.devolucionFiltroProducto)}" oninput="S.devolucionFiltroProducto=this.value;render()"/>
      ${(()=>{
        const catFija = categoriaDevolucionFija();
        if(catFija) return `<span class="btn btn-ghost btn-md" style="pointer-events:none;opacity:.8" title="Tu alcance es fijo">🔒 ${catFija}</span>`;

    ${enReclamo ? `<div class="vt-content">${renderReclamoProveedor()}</div>` : `

          <div style="margin-top:6px;display:flex;flex-direction:column;gap:3px">

// Para SUCURSAL: solo necesita el nombre de la sucursal como usuario, sin pass
function buscarUsuario(usuario, password){
  const lista = USE_SHEETS ? S.usuarios : DEMO_USUARIOS;
  // normNotif ya quita tildes/mayúsculas — así "guemes" o "Güemes" entran igual
  const u = normNotif(usuario);
  const p = (password||"").trim();

  // Buscar primero el usuario EXACTO cargado con ese login — así, si el
  // nombre coincide con una sucursal (ej: "Depósito", que también existe
  // como sucursal para elegir origen/destino) pero la persona en realidad
  // tiene un usuario de tipo Área con contraseña propia, se respeta ESE
  // tipo real en vez de asumir que es un login de sucursal sin contraseña.
  const foundUser = lista.find(x => normNotif(x.usuario) === u && x.activo !== "no");

  if(foundUser && foundUser.tipo === "SUCURSAL"){
    const nombreOficial = getSucursales().find(s => normNotif(s) === u) || foundUser.usuario;
    return {ok:true, tipo:"SUCURSAL", nombre:nombreOficial, area:nombreOficial, recorrido:"", dni:foundUser.dni||""};
  }

  if(!foundUser){
    // Sin usuario cargado — si igual el nombre es una sucursal conocida,
    // dar un aviso claro en vez de "usuario no encontrado" a secas.
    const esSucursal = getSucursales().find(s => normNotif(s) === u);
    if(esSucursal){
      if(USE_SHEETS) return {ok:false, msg:"Esta sucursal no está habilitada. Consultá con logística."};
      return {ok:true, tipo:"SUCURSAL", nombre:esSucursal, area:esSucursal, recorrido:"", dni:""};
    }
    return {ok:false, msg:"Usuario no encontrado."};
  }

  // Login normal (no-sucursal/repartidor) con contraseña.
  // OJO: si el campo password está vacío PERO el tipo sí requiere
  // contraseña (Logística, Admin, etc.), significa que esta cuenta ya
  // está migrada a Auth y el password se vació a propósito por
  // seguridad — este camino de respaldo NO la puede validar sin la
  // contraseña real, así que hay que RECHAZAR el acceso, nunca
  // abrirlo sin pedir nada.
  const necesitaPass = !["SUCURSAL","REPARTIDOR"].includes(foundUser.tipo);
  if(necesitaPass){
    if(!foundUser.password || String(foundUser.password).trim()===""){
      return {ok:false, msg:"No se pudo validar este usuario. Recargá la página e intentá de nuevo."};
    }
    if(foundUser.password !== p){
      return {ok:false, msg:"Contraseña incorrecta."};
    }
    if(!p){
      return {ok:false, msg:"Ingresá tu contraseña."};
    }
  }

  return {ok:true, tipo:foundUser.tipo, usuario:foundUser.usuario||"", nombre:foundUser.nombre||foundUser.usuario, area:foundUser.area||"", recorrido:foundUser.recorrido||"", dni:foundUser.dni||""};
}

// Crea una solicitud. A diferencia de Sheets, ACÁ ESPERAMOS la respuesta
// antes de mostrarla — Postgres genera el id solo (sin locks manuales) y
// la respuesta es rápida, así que no hace falta el truco de "mostrar
// optimista y corregir después" que usábamos con Apps Script.
async function sheetsAdd(row){
  if(!USE_SHEETS) return null;
  try{
    const payload = toSnakeRow(row);
    delete payload.id; // que lo genere Postgres, nunca lo mandamos nosotros
    const { data, error } = await sb.from("solicitudes").insert(payload).select().single();
    if(error) throw error;
    return toCamelRow(data);
  }catch(e){
    console.warn("Supabase add:",e);
    toast("⚠️ No se pudo guardar: "+(e?.message||e?.details||JSON.stringify(e)),"warn");
    return null;
  }
}

async function sheetsUpdate(id,data){
  if(!USE_SHEETS) return;
  try{
    const { error } = await sb.from("solicitudes").update(toSnakeRow(data)).eq("id",id);
    if(error) throw error;
  }
  catch(e){console.warn("Supabase update:",e);}
}

// ──────────────────────────────────────────────────────────
//  VALIDAR DNI
//  Busca el DNI en la hoja Usuarios de Sheets.
//  No filtra por tipo — cualquier persona registrada puede validar.
//  Devuelve el nombre para mostrarlo en pantalla.
//  En modo demo (sin Sheets) acepta cualquier DNI de 7-8 dígitos.
// ──────────────────────────────────────────────────────────
function validarDNI(dni){
  // Normalizar: solo dígitos, sin puntos ni espacios
  const dniLimpio = String(dni).replace(/\D/g,"");

  if(!dniLimpio || dniLimpio.length < 7 || dniLimpio.length > 8){
    return {ok:false, msg:"DNI inválido. Debe tener 7 u 8 dígitos (sin puntos)."};
  }

  // Modo demo: acepta cualquier DNI válido y devuelve nombre genérico
  if(!USE_SHEETS){
    return {ok:true, nombre:"Usuario demo", dni:dniLimpio};
  }

  // Buscar en la lista completa de usuarios (incluye sucursales, logística, etc.)
  const lista = S.usuarios;
  const found = lista.find(u => {
    const dniUsuario = String(u.dni||"").replace(/\D/g,"");
    return dniUsuario === dniLimpio;
  });

  if(!found){
    return {ok:false, msg:"DNI no encontrado. Pedile a logística que te registre en el sistema."};
  }

  if(found.activo === "no"){
    return {ok:false, msg:"Este DNI está deshabilitado. Consultá con logística."};
  }

  return {ok:true, nombre:found.nombre||"Sin nombre", dni:dniLimpio, usuario:found};
}

// ejemplo. Se sacó: quedaban visibles un instante al iniciar sesión,

// ══════════════════════════════════════════════════════════
//  RENDER PRINCIPAL
// ══════════════════════════════════════════════════════════
// Render con debounce para evitar reconstrucciones múltiples
// en la misma tarea del event loop
let _renderPending  = false;
let _operacionEnCurso = false; // previene doble submit global
let _ultimoHTML = "";      // último fondo (tabla/pantalla) pintado
let _ultimoHTMLModal = ""; // último modal+lightbox pintado

// Redibuja el DOM parchando SOLO lo que cambió (con morphdom) en vez de
// tirar y reconstruir todo el HTML de una — esto es lo que de verdad
// resuelve el titileo cuando SÍ hay un cambio real (ej. pasar una
// solicitud de Aprobada a Entregada): antes, aunque solo cambiara una
// fila de una tabla larga, se reemplazaba TODA la tabla entera, lo que
// se sentía como que "se borraba todo". Con morphdom, solo se tocan los
// nodos que realmente cambiaron — el resto de la pantalla ni se entera.
// Fondo y modal siguen en contenedores separados (ver fix anterior),
// así que un cambio en uno nunca repinta el otro.
function morphSeguro(el, html){
  // Nunca tocar el elemento donde el usuario está escribiendo ahora mismo
  // (evita perder foco/cursor si un cambio de fondo llega mientras tipea).
  morphdom(el, html, {
    onBeforeElUpdated: (fromEl, toEl) => {
      // El visor de la cámara (pickeo) lo maneja la librería del lector: si se
      // lo parchea se corta el video.
      if(fromEl.id==="pickeo-reader" && toEl.id==="pickeo-reader") return false;
      // Un <input type=file> ya elegido: si se lo parchea, el navegador borra la
      // foto elegida cada vez que la pantalla se redibuja (por ejemplo al
      // aparecer un error de validación).
      if(fromEl.tagName==="INPUT" && fromEl.type==="file" && toEl.tagName==="INPUT" && toEl.type==="file") return false;
      // Conservar la posición del indicador de pestañas para que se deslice
      // (si no, cada render lo borra y vuelve a empezar de cero)
      if(fromEl.classList && fromEl.classList.contains("vt-content") && fromEl.classList.contains("enter")) toEl.classList.add("enter");
      if(fromEl.classList && fromEl.classList.contains("tabs")){
        ["--ind-x","--ind-y","--ind-w","--ind-h"].forEach(k=>{ const v=fromEl.style.getPropertyValue(k); if(v) toEl.style.setProperty(k,v); });
        if(fromEl.hasAttribute("data-ind")) toEl.setAttribute("data-ind","1");
      }
      if(fromEl === document.activeElement &&
         (fromEl.tagName==="INPUT" || fromEl.tagName==="TEXTAREA" || fromEl.tagName==="SELECT")){
        return false;
      }
      return true;
    }
  });
}

// Transición de pantalla: cuando el usuario cambia de pestaña o de vista,
// el contenido nuevo entra deslizándose y el viejo se desvanece (View
// Transitions API; si el navegador no la soporta, cambia directo como
// antes). Solo se activa en navegación, no en cada actualización de datos
// ni en los botones que solo cambian un gráfico.
let _navAnim = false;   // false | "tab" | "page"
document.addEventListener("click", e=>{
  const el = e.target.closest("[onclick]"); if(!el) return;
  const oc = el.getAttribute("onclick")||"";
  if(/S\.vista\s*=|abrir(Quejas|Devoluciones|PickeoArmar|PickeoControl|Clasificar)\(|salirPickeo\(|salirClasificar\(/.test(oc)) _navAnim = "page";
  else if(/S\.(tab\w*|subTab\w*|adminTab)\s*=/.test(oc)) _navAnim = "tab";
}, true);
function aplicarRenderDOM(){
  const modo = _navAnim; _navAnim = false;
  const reducir = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Cambio de pantalla completa (Quejas, Devoluciones, Volver): desliza todo.
  if(modo==="page" && !reducir && typeof document.startViewTransition==="function"){
    try{ document.startViewTransition(()=>{ aplicarRenderDOMInterno(); animarEntradaContenido(); }); return; }catch(e){}
  }
  aplicarRenderDOMInterno();
  // Cambio de pestaña: los botones de arriba y las pestañas quedan FIJOS;
  // solo el contenido de abajo entra con movimiento.
  if(modo==="tab" && !reducir) animarEntradaContenido();
}
// Marca el contenido como "entrando": dispara las animaciones de entrada
// (tarjetas escalonadas, barras que crecen, línea que se dibuja…) y la
// quita sola al terminar. Se llama a propósito al entrar o cambiar de
// pestaña — no por cada actualización de datos.
function animarEntradaContenido(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".vt-content").forEach(el=>{
    clearTimeout(el._tEnter);
    el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
    el._tEnter = setTimeout(()=>el.classList.remove("enter"), 1800);
  });
}
function aplicarRenderDOMInterno(){
  const elBg = $("app");
  const elModal = $("app-modal");
  if(!elBg || !elModal) return;

  const htmlBg = S.view==="login" ? renderLogin() : renderApp();
  if(htmlBg !== _ultimoHTML){
    _ultimoHTML = htmlBg;
    morphSeguro(elBg, `<div id="app">${htmlBg}</div>`);
  }

  const _nb=document.querySelector(".navbar"); if(_nb) document.documentElement.style.setProperty("--nav-h", _nb.offsetHeight+"px");
  const htmlModal = (S.view==="login" && S.modal!=="identificarLogistica" && !(S.modal==="identidadRep" && S.identidadRepModal?.alIngresar)) ? "" : (renderModals() + renderLightbox());
  if(htmlModal !== _ultimoHTMLModal){
    _ultimoHTMLModal = htmlModal;
    morphSeguro(elModal, `<div id="app-modal">${htmlModal}</div>`);
  }  actualizarIndicadoresTabs();
  ajustarAnchoGraficos();
}

function render(){
  if(_renderPending) return;
  _renderPending = true;
  requestAnimationFrame(()=>{
    _renderPending = false;
    aplicarRenderDOM();
  });
}

// render inmediato — para casos donde necesitamos ver el cambio YA
// (ej: loading spinner antes de una operación async)
function renderNow(){
  _renderPending = false;
  aplicarRenderDOM();
}

// Se llama al salir del campo usuario (blur) o al presionar Ingresar
// Oculta el campo contraseña si es sucursal O si el usuario no tiene pass configurada
function checkIfSucursal(){
  const val     = ($("l-user")?.value||"").trim().toLowerCase();
  const esSuc   = getSucursales().find(s=>s.toLowerCase()===val);
  const passField = $("pass-field");
  const sucHint   = $("suc-hint");
  if(!passField||!sucHint) return;

  // Verificar si el usuario es de un tipo que entra SIN contraseña
  // (Sucursal y Repartidor). OJO: no mirar si el campo "password" está
  // vacío — ahora lo vaciamos a propósito para las cuentas migradas a
  // Auth (Logística, Admin, etc.), así que ese campo vacío ya NO
  // significa "no tiene contraseña", hay que decidirlo por el tipo real.
  const lista     = USE_SHEETS ? S.usuarios : DEMO_USUARIOS;
  const userMatch = lista.find(x=>x.usuario?.toLowerCase()===val&&x.activo!=="no");
  const sinPass   = userMatch && ["SUCURSAL","REPARTIDOR"].includes(userMatch.tipo);

  if(esSuc){
    passField.style.display = "none";
    sucHint.style.display   = "block";
    sucHint.innerHTML = `🏪 Entrás como <strong>${escH(esSuc)}</strong> — sin contraseña.<br/>Al crear una solicitud se te pedirá tu DNI.`;
  } else if(sinPass){
    passField.style.display = "none";
    sucHint.style.display   = "block";
    sucHint.innerHTML = `✅ Usuario <strong>${escH(userMatch.nombre||val)}</strong> — sin contraseña requerida.`;
  } else {
    passField.style.display = "block";
    sucHint.style.display   = "none";
  }
}

// ── PLANIFICACIÓN VIEW ───────────────────────────────────
function renderPlanificacion(){
  const verMetDev = S.tabSuc==="devmet" && puedeVerMetricasDevoluciones();
  const verReclamo = S.tabSuc==="reclamo" && puedeVerReclamos();
  const u     = S.user;
  // Ignora mayúsculas/minúsculas y tildes al comparar áreas (ej. "Compras" == "COMPRAS")
  const norm2 = s=>(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const areaN = norm2(u.area);

  // Filtrar: r.area coincide con el área del usuario (normalizado).
  // OJO: NO comparar por "tipo" (u.tipoReal) — el tipo es el permiso
  // compartido por todo el grupo (Compras, RRHH, Administración, etc.),
  // no identifica un área en particular. Si se usa como fallback, todas
  // las áreas del grupo terminan viendo las mismas solicitudes.
  // Solo el área real (usuario/área de Sheets) identifica a cada una.
  //
  // Además: si el nombre de esta "área" coincide con una sucursal real
  // (caso Depósito, que es un lugar físico además de un área que pide
  // cosas), también hay que sumar las solicitudes donde Depósito es
  // origen o destino físico — si no, se le escapan las transferencias
  // que pasan por ahí pero fueron pedidas por otra área (ej: Administración
  // pidiendo algo "Depósito → Independencia").
  const esTambienLugarFisico = getSucursales().some(s=>norm2(s)===areaN) || getDestinos().some(s=>norm2(s)===areaN);
  const mine = S.requests.filter(r=>{
    const rArea = norm2(r.area);
    if(rArea && areaN && rArea===areaN) return true;
    if(esTambienLugarFisico){
      if(norm2(r.sucursal)===areaN) return true;
      if(norm2(r.destino)===areaN) return true;
    }
    return false;
  });
  const open  = mine.filter(r=>!estaCerradaParaSucursal(r));
  const hist  = mine.filter(r=>estaCerradaParaSucursal(r));
  const list  = S.tabSuc==="historial" ? hist : open;
  const listF = S.fPlanFecha ? list.filter(r=>r.createdAt && r.createdAt.startsWith(S.fPlanFecha)) : list;

  return `
  <div style="animation:fadeUp .3s ease">
    <div id="flota-slot">${renderWidgetFlotaHoy()}</div>
    ${pageHead(escH(u.area||"Planificación"),"",`
        <button class="btn btn-success btn-md" onclick="openModal('nuevaSol')">+ Nueva solicitud</button>
        ${areaN==="rrhh"?`<button class="btn btn-teal btn-md" onclick="openEnvioMasivoRRHH()">📨 Enviar a varias sucursales</button>`:""}
        ${accesosRapidosHtml()}`)}
    ${(()=>{
      const pendQuiebre = mine.filter(r=>r.tipoPedido==="quiebreStock" && !r.planificadoAt);
      if(!pendQuiebre.length) return "";
      return `
      <div class="card" style="margin-bottom:20px;padding:14px 16px;border-left:3px solid var(--red)">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:10px">🚨 Quiebre de stock — pendientes de planificar</h3>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${pendQuiebre.map(r=>`
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--s2);border-radius:8px;padding:10px 12px">
              <span style="font-size:13px"><strong>${escH(r.destino)}</strong> pide ${escH(String(r.cantidad))} ${escH(r.unidad)} de ${escH(r.descripcion)}</span>
              <button class="btn btn-warn btn-sm" onclick="openPlanificarCantidad('${escH(r.id)}')">📋 Planificar cantidad</button>
            </div>`).join("")}
        </div>
      </div>`;
    })()}
    <div class="toolbar">
      <div class="tabs">
        <button class="tab ${S.tabSuc==="abiertas"?"active":""}" onclick="S.tabSuc='abiertas';render()">Abiertas<span class="tab-n">${open.length}</span></button>
        <button class="tab ${S.tabSuc==="historial"?"active":""}" onclick="S.tabSuc='historial';render()">Historial<span class="tab-n">${hist.length}</span></button>
        ${puedeVerMetricasDevoluciones()?`<button class="tab ${verMetDev?"active":""}" onclick="S.tabSuc='devmet';render()">📉 Métricas de devoluciones</button>`:""}
        ${puedeVerReclamos()?`<button class="tab ${verReclamo?"active":""}" onclick="S.tabSuc='reclamo';render()">🔁 Reclamos</button>`:""}
      </div>
      ${(verMetDev||verReclamo)?"":datePill(S.fPlanFecha,"fPlanFecha")}
    </div>
    ${verMetDev ? `<div class="vt-content">${renderMetricasDevoluciones()}</div>` : verReclamo ? `<div class="vt-content">${renderReclamoProveedor()}</div>` : solicitudesLista(listF,"plan-"+(S.tabSuc||"abiertas"),r=>{
      // Planificación/RRHH/etc puede confirmar recepción cuando destino es fábrica/depósito
      const esDestinoFab = ["fábrica","fabrica","depósito","deposito","deposito central"].includes((r.destino||"").trim().toLowerCase());
      const puedeRecibirFab = esDestinoFab && r.estado==="En tránsito";
      const botones = `
        ${["Pendiente","En revisión"].includes(r.estado)?`<button class="btn btn-primary btn-sm" onclick="openEditar('${escH(r.id)}')">✏️ Editar</button>`:""}
        ${puedeRecibirFab?`<button class="btn btn-teal btn-sm" onclick="openCodigoEntrega('${escH(r.id)}')">🔑 Confirmar en fábrica</button>`:""}
        ${["Aprobada","Programada"].includes(r.estado)?`<button class="btn btn-success btn-sm" onclick="openListo('${escH(r.id)}')">✅ Marcar lista</button>`:""}`.trim();
      return solicitudCard(r, `${escH(origenLabel(r))} <span style="color:var(--faint)">→</span> ${escH(r.destino)}`, botones);
    }, S.fPlanFecha?"No hay solicitudes en esa fecha":S.tabSuc==="abiertas"?"No hay solicitudes abiertas":"Sin historial")}
  </div>`;
}

// ── Gráficos de Calidad: grandes, con porcentajes y letra legible ──
const PALETA_CALIDAD = ["#4f9eff","#2de0c4","#f5a623","#9b8ff7","#f05252","#2ecc7a","#f472b6","#38bdf8"];
const COLOR_MOTIVO_CALIDAD = {
  "Mal estado":"#f05252","Pérdida de vacío":"#4f9eff","Vencido":"#f5a623","Roto":"#9b8ff7",
  "Pérdida de frío":"#38bdf8","Roto con cambio":"#f472b6","Vencido con cambio":"#2ecc7a","Vencido sin cambio":"#2de0c4","Roto sin cambio":"#c084fc","Sobrestock":"#fb7185",
};
function colorMotivoCalidad(m,i){ return COLOR_MOTIVO_CALIDAD[m] || PALETA_CALIDAD[i%PALETA_CALIDAD.length]; }
// Los colores de estado vienen como var(--x): para pintar SVG de forma
// confiable se pasan a su valor real.
function colorHex(c){
  if(c && String(c).startsWith("var(")){
    const n=String(c).slice(4,-1).split(",")[0].trim();
    const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v||"#4f9eff";
  }
  return c;
}
function pctTxt(v,total){ if(!total) return "0%"; const p=v/total*100; return (p>=10?Math.round(p):p.toFixed(1))+"%"; }
function fmtNum(v){ return Number.isInteger(v)?String(v):(Math.round(v*10)/10).toString(); }
function fechaCortaISO(iso){ const [y,m,d]=String(iso||"").split("-"); return d?`${d}/${m}/${y}`:""; }

function tituloGrafico(titulo, sub){

// ── Dona interactiva ──
// Pasar el mouse sobre una porción la resalta (y muestra su % en el
// centro); tocarla dispara onClickFn(label) para bajar al detalle de
// dónde sale ese porcentaje. Los resaltados se hacen tocando el DOM
// directo (sin re-render) para que sea instantáneo y no parpadee.
const _donutReg = {};
function donutPorcentajes(id, datos, size, centroTxt, sel, onClickFn){
  const total = datos.reduce((a,d)=>a+d.valor,0);
  if(!total) return "";
  _donutReg[id] = {datos, total, centroTxt, onClickFn};
  const grosor=48, cx=size/2, cy=size/2, r=size/2-grosor/2-12, circ=2*Math.PI*r;
  const haySel = !!sel;
  let acum=0, segs="", labs="";
  datos.forEach((d,i)=>{
    const frac=d.valor/total, largo=frac*circ, gap=datos.length>1?2.5:0;
    const esSel = haySel && d.label===sel;
    segs += `<circle class="dn-seg" data-i="${i}" data-w="${grosor}" data-sel="${esSel?1:""}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorHex(d.color)}"
      stroke-width="${grosor+(esSel?10:0)}" stroke-dasharray="${Math.max(largo-gap,0.5)} ${circ}" stroke-dashoffset="${-acum*circ}" transform="rotate(-90 ${cx} ${cy})"
      style="cursor:pointer;transition:stroke-width .15s,opacity .15s;opacity:${haySel?(esSel?1:.45):1}"
      onmouseenter="donutResaltar('${id}',${i})" onmouseleave="donutRestaurar('${id}')" onclick="donutClick('${id}',${i})"/>`;
    if(frac>=0.05){
      const ang=-Math.PI/2+2*Math.PI*(acum+frac/2);
      labs += `<text x="${cx+r*Math.cos(ang)}" y="${cy+r*Math.sin(ang)}" text-anchor="middle" dominant-baseline="central"
        style="pointer-events:none;font-size:${frac>=0.1?16:13}px;font-weight:800;fill:#0b1120">${Math.round(frac*100)}%</text>`;
    }
    acum+=frac;
  });
  return `<svg class="dn-anim" id="dn-${id}" data-sel="${haySel?1:""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;max-width:100%">
    ${segs}${labs}
    <text class="dn-c1" x="${cx}" y="${cy-2}" text-anchor="middle" style="pointer-events:none;font-size:42px;font-weight:800;fill:#e2e8f4">${fmtNum(total)}</text>
    <text class="dn-c2" x="${cx}" y="${cy+24}" text-anchor="middle" style="pointer-events:none;font-size:14px;fill:#a9b8d0">${escH(centroTxt)}</text>
  </svg>`;
}
function donutResaltar(id,i){
  const svg=document.getElementById("dn-"+id), reg=_donutReg[id]; if(!svg||!reg) return;
  svg.querySelectorAll(".dn-seg").forEach(el=>{
    const on=+el.dataset.i===i;
    el.setAttribute("stroke-width", +el.dataset.w+(on?14:0));
    el.style.opacity = on?1:.3;
  });
  const d=reg.datos[i]; if(!d) return;
  svg.querySelector(".dn-c1").textContent=pctTxt(d.valor,reg.total);
  const c2=svg.querySelector(".dn-c2");
  c2.textContent=d.label.length>18?d.label.slice(0,17)+"…":d.label;
  c2.style.fill=d.color; c2.style.fontWeight="700";
}
function donutRestaurar(id){
  const svg=document.getElementById("dn-"+id), reg=_donutReg[id]; if(!svg||!reg) return;
  const any=svg.dataset.sel==="1";
  svg.querySelectorAll(".dn-seg").forEach(el=>{
    const sel=el.dataset.sel==="1";
    el.setAttribute("stroke-width", +el.dataset.w+(sel?10:0));
    el.style.opacity = any?(sel?1:.45):1;
  });
  svg.querySelector(".dn-c1").textContent=fmtNum(reg.total);
  const c2=svg.querySelector(".dn-c2");
  c2.textContent=reg.centroTxt; c2.style.fill="#a9b8d0"; c2.style.fontWeight="400";
}
function donutClick(id,i){
  const reg=_donutReg[id]; if(!reg) return;
  const fn=window[reg.onClickFn]; if(fn) fn(reg.datos[i].label);
}
function leyendaPorcentajes(id, datos, sel){
  const total = datos.reduce((a,d)=>a+d.valor,0);
  return `<div style="flex:1;min-width:230px;display:flex;flex-direction:column;gap:6px">
    ${datos.map((d,i)=>`
      <div onmouseenter="donutResaltar('${id}',${i})" onmouseleave="donutRestaurar('${id}')" onclick="donutClick('${id}',${i})"
        style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;border:1px solid ${sel===d.label?d.color:"transparent"};background:${sel===d.label?"var(--s3)":"transparent"};transition:background .12s"
        onmouseover="this.style.background='var(--s3)'" onmouseout="this.style.background='${sel===d.label?"var(--s3)":"transparent"}'">
        <span style="width:16px;height:16px;border-radius:5px;background:${d.color};flex-shrink:0"></span>
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;font-weight:600;color:var(--text)">${escH(d.label)}</div>
          ${d.extra?`<div style="font-size:13px;color:#a9b8d0">${d.extra}</div>`:""}
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:17px;font-weight:700;color:var(--text)">${fmtNum(d.valor)}</div>
          <div style="font-size:13px;font-weight:700;color:${d.color}">${pctTxt(d.valor,total)}</div>
        </div>
      </div>`).join("")}
  </div>`;
}

// Barras horizontales: nombre a la izquierda, valor y % a la derecha
function barrasHorizontales(filas, color, total){
  if(!filas.length) return `<p style="color:#a9b8d0;font-size:14px;text-align:center;padding:20px">Sin datos.</p>`;
  const max=Math.max(...filas.map(f=>f.valor),1);
  return `<div style="display:flex;flex-direction:column;gap:14px">${filas.map(f=>{
    const w=Math.max(f.valor/max*100,2);
    const c=f.color||color||PALETA_CALIDAD[0];
