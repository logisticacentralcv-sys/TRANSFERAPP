async function submitNuevoLote(){
  if(S.saving) return;
  const d = S.nuevoLoteModal;
  const sucursales = getSucursales();
  // Leer las cantidades directo del DOM (por si no pasaron por oninput)
  const items = [];
  sucursales.forEach((s,i)=>{
    const v = ($(`lote-cant-${i}`)?.value ?? d.cantidades[s] ?? "").toString().trim();
    if(v && +v > 0) items.push({destino:s, cantidad:+v});
  });
  if(!items.length){ S.nuevoLoteModal.err = "Cargá al menos una cantidad."; render(); return; }

  const u = S.user;
  S.dniModal = {
    title:"Ingresá tu DNI para crear el lote",
    field:"tesoreria",
    val:"", err:"", loading:false, nombreOk:"",
    cb: async (dniVal, usuarioEncontrado)=>{
      if(S.saving) return;
      const nombre = usuarioEncontrado?.nombre || u.nombre || "Sin nombre";
      S.saving = true; S.modal = null; renderNow();
      // Un solo INSERT con todas las filas — Postgres lo trata como una
      // transacción: o entran todas, o si algo falla no queda ninguna a
      // medio camino (mismo espíritu que el lock que usábamos en Sheets,
      // pero acá es una garantía nativa de la base, no algo que armamos a mano).
      try{
        const hoy = new Date();
        const loteId = "LOTE-" + fechaCorta() + "-" + String(hoy.getHours()).padStart(2,"0") + String(hoy.getMinutes()).padStart(2,"0");
        const nowIso = now();
        const filas = items.map(it => toSnakeRow({
          sucursal: "Fábrica",
          area: "Tesorería",
          solicitante: nombre,
          dniSolicitante: dniVal,
          destino: it.destino,
          descripcion: "Bolsines",
          cantidad: it.cantidad,
          unidad: "Bolsines",
          prioridad: "Media",
          fechaRequerida: fechaISO(),
          estado: "Aprobada",
          comentario: `Lote diario — creado por Tesorería (${nombre})`,
          createdAt: nowIso,
          approvedAt: nowIso,
          updatedAt: nowIso,
          tipoPedido: "bolsin",
          loteId,
        }));
        const { data, error } = await sb.from("solicitudes").insert(filas).select();
        if(error) throw error;
        toast(`📦 Lote ${loteId} creado — ${data.length} sucursales`);
        S.requests = [...toCamelRows(data), ...S.requests];
      } catch(e){
        console.warn(e);
        toast("⚠️ No se pudo crear el lote — revisá la conexión", "warn");
      }
      S.saving = false;
      render();
    }
  };
  S.modal = "dniConfirm"; render();
}

async function submitLoteListo(){
  const d = S.loteListoModal;
  if(d.loading) return;
  const dni = String(d.dni||"").replace(/\D/g,"");
  if(!dni){ S.loteListoModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.loteListoModal.err=check.msg; render(); return; }

  d.loading = true; renderNow();

  // Una sola sentencia UPDATE en Postgres, filtrando por lote + estado —
  // atómica de por sí, no hace falta ningún lock manual ni backend
  // intermedio (antes esto era el punto que se "bugueaba" con Sheets).
  try{
    const nowTs = now();
    const { data, error } = await sb.from("solicitudes")
      .update(toSnakeRow({estado:"Lista para retirar", listoAt:nowTs, dniListoPor:dni, nombreListoPor:check.nombre, updatedAt:nowTs}))
      .eq("lote_id", d.loteId)
      .eq("estado","Aprobada")
      .select();
    if(error) throw error;
    S.requests = S.requests.map(x => (x.loteId===d.loteId && x.estado==="Aprobada")
      ? {...x, estado:"Lista para retirar", listoAt:nowTs, dniListoPor:dni, nombreListoPor:check.nombre, updatedAt:nowTs}
      : x);
    S.modal = null;
    toast(`✅ ${check.nombre} marcó ${data.length} solicitudes del lote ${d.loteId} como Listas`);
  } catch(e){
    S.loteListoModal.loading=false;
    S.loteListoModal.err = "No se pudo actualizar el lote — probá de nuevo.";
  }
  render();
}

async function submitLoteRecorrido(){
  const d = S.loteRecorridoModal;
  if(d.loading) return;
  const filas = S.requests.filter(r=>r.loteId===d.loteId);
  const updates = filas.map(r=>({
    id: r.id,
    recorrido: ($(`lr-${r.id}`)?.value ?? d.asignaciones[r.id] ?? "").trim(),
  })).filter(u=>u.recorrido);
  if(!updates.length){ S.loteRecorridoModal.err="Asigná al menos un recorrido."; render(); return; }

  d.loading = true; renderNow();

  try{
    // Cada sucursal puede llevar un recorrido distinto, así que va una
    // actualización por fila — Postgres las procesa de forma segura aunque
    // salgan todas juntas (no hace falta backend intermedio con lock).
    const nowTs = now();
    const resultados = await Promise.all(
      updates.map(u => sb.from("solicitudes").update(toSnakeRow({recorrido:u.recorrido, updatedAt:nowTs})).eq("id",u.id))
    );
    const fallidas = resultados.filter(r=>r.error);
    if(fallidas.length===0){
      S.requests = S.requests.map(x=>{
        const u = updates.find(u=>u.id===x.id);
        return u ? {...x, recorrido:u.recorrido, updatedAt:nowTs} : x;
      });
      S.modal = null;
      toast(`🚚 Recorridos asignados a ${updates.length} solicitudes del lote ${d.loteId}`);
    } else {
      S.loteRecorridoModal.loading=false;
      S.loteRecorridoModal.err = `No se pudieron asignar ${fallidas.length} de ${updates.length}. Probá de nuevo.`;
    }
  } catch(e){
    S.loteRecorridoModal.loading=false;
    S.loteRecorridoModal.err = "No se pudo conectar — probá de nuevo.";
  }
  render();
}

async function submitEntregarVarias(){
  const d = S.entregarVariasModal;
  if(d.loading) return;
  const ingresada = ($("ev-palabra")?.value||d.palabra||"").trim().toUpperCase();
  if(!ingresada){ S.entregarVariasModal.err="Ingresá la palabra de entrega."; render(); return; }

  d.loading = true; renderNow();

  try{
    // Traer el código real de cada una directo de la base (no de memoria)
    const { data, error } = await sb.from("solicitudes").select("id,codigo_entrega").in("id", d.ids);
    if(error) throw error;
    const codigos = {};
    (data||[]).forEach(row=>{ codigos[row.id] = (row.codigo_entrega||"").trim().toUpperCase(); });

    const coinciden = d.ids.filter(id=>codigos[id] && codigos[id]===ingresada);
    const noCoinciden = d.ids.filter(id=>!coinciden.includes(id));

    let fallaronGuardado = [];
    if(coinciden.length){
      const nowTs = now();
      const cambios = coinciden.map(id=>{
        const r = S.requests.find(x=>x.id===id);
        const changes = {
          estado:"Entregada", deliveredAt:nowTs,
          nombreQuienEntrego: r?.nombreQuienLevanto || S.user.nombre || "",
          dniEntrega: r?.dniRepartidor || "",
          codigoEntrega: ingresada, updatedAt: nowTs,
        };
        return {id, changes};
      });
      const resultados = await Promise.all(cambios.map(c=>sb.from("solicitudes").update(toSnakeRow(c.changes)).eq("id",c.id)));
      const cambiosOk = cambios.filter((c,i)=>!resultados[i].error);
      fallaronGuardado = cambios.filter((c,i)=>resultados[i].error).map(c=>c.id);
      S.requests = S.requests.map(x=>{
        const c = cambiosOk.find(c=>c.id===x.id);
        return c ? {...x,...c.changes} : x;
      });
      S.repSeleccion = new Set([...noCoinciden, ...fallaronGuardado]);
    }

    const entregadasOk = coinciden.length - fallaronGuardado.length;
    if(noCoinciden.length===0 && fallaronGuardado.length===0){
      S.modoSeleccionRep = false;
      S.modal = null;
      toast(`✅ ${entregadasOk} transferencias entregadas`);
    } else {
      S.entregarVariasModal.loading = false;
      S.entregarVariasModal.ids = [...noCoinciden, ...fallaronGuardado];
      const partes = [];
      if(entregadasOk>0) partes.push(`Se entregaron ${entregadasOk}`);
      if(noCoinciden.length) partes.push(`la palabra no coincidió en ${noCoinciden.length}`);
      if(fallaronGuardado.length) partes.push(`${fallaronGuardado.length} no se pudieron guardar (probá de nuevo)`);
      S.entregarVariasModal.err = partes.length ? partes.join(" — ")+"." : "No se pudo entregar ninguna. Verificá con la sucursal.";
    }
  }catch(e){
    S.entregarVariasModal.loading = false;
    S.entregarVariasModal.err = "No se pudo conectar — probá de nuevo.";
  }
  render();
}

// Repartidor envía la palabra — se valida contra la almacenada en la solicitud
async function submitPalabra(){
  const d = S.palabraModal;
  if(d.loading) return;

  // Leer del input directamente (más confiable que el estado)
  const ingresada = ($("inp-palabra")?.value||d.palabraIngresada||"").trim().toUpperCase();
  if(!ingresada){ S.palabraModal.err="Ingresá la palabra de entrega."; render(); return; }

  S.palabraModal.loading = true;
  renderNow();

  // Siempre buscar el código directo de la base para no depender de la memoria
  // local (el repartidor está en otro dispositivo que el de la sucursal)
  let esperada = "";
  if(USE_SHEETS){
    try{
      const { data, error } = await sb.from("solicitudes").select("codigo_entrega").eq("id",d.id).single();
      if(error) throw error;
      esperada = (data?.codigo_entrega||"").trim().toUpperCase();
    }catch(e){
      // fallback a memoria local si falla la conexión
      const rLocal = S.requests.find(x=>x.id===d.id);
      esperada = (rLocal?.codigoEntrega||"").trim().toUpperCase();
    }
  } else {
    // Modo demo: leer de memoria local
    const rLocal = S.requests.find(x=>x.id===d.id);
    esperada = (rLocal?.codigoEntrega||"").trim().toUpperCase();
  }

  if(!esperada){
    S.palabraModal.loading = false;
    S.palabraModal.err = "La sucursal destino todavía no generó el código. Pedile que abra la app.";
    render(); return;
  }
  if(ingresada !== esperada){
    S.palabraModal.loading = false;
    S.palabraModal.err = "Código incorrecto. Verificá con la sucursal.";
    render(); return;
  }

  // Código correcto — registrar entrega
  const r = S.requests.find(x=>x.id===d.id);
  const quienEntrego = r?.nombreQuienLevanto || S.user.nombre || "";
  const changes = {
    estado:             "Entregada",
    deliveredAt:        now(),
    nombreQuienEntrego: quienEntrego,
    dniEntrega:         r?.dniRepartidor || "",
    codigoEntrega:      ingresada,
    updatedAt:          now(),
  };
  // Guardar PRIMERO en la base y confirmar que salió bien — si falla (por
  // ejemplo, un problema de permisos), avisar en el momento en vez de
  // mostrar "entregado" y que después reaparezca como si nada.
  try{
    const { error } = await sb.from("solicitudes").update(toSnakeRow(changes)).eq("id", d.id);
    if(error) throw error;
  }catch(e){
    S.palabraModal.loading = false;
    S.palabraModal.err = "No se pudo guardar la entrega (" + (e.message||"error de conexión") + "). Probá de nuevo — si sigue fallando, avisá a Admin.";
    render();
    return;
  }
  S.requests = S.requests.map(x=>x.id===d.id?{...x,...changes}:x);
  S.modal = null;
  toast(`✅ Entrega confirmada — ${r?.destino||""}`);
}

// Fábrica y Tesorería son, a estos fines, "el mismo buzón" — un bolsín
// con cualquiera de esos dos como destino final SIEMPRE pasa por el
// buzón antes de poder confirmarse como entregado.
// Un bolsín que ya está en el buzón — sea con el estado nuevo "En el buzón" o
// con el viejo "Entregada (sin confirmar)" de los que todavía no se
// migraron — ya no es un pendiente de la sucursal que lo mandó: pasa a
// Historial y no cuenta como "Abierta".
const ESTADOS_CERRADOS_SUCURSAL = ["Entregada","Rechazada","Cancelada","No entregada","No levantada","En el buzón"];
function esBolsinEnBuzon(r){
  return r.tipoPedido==="bolsin" && esDestinoBuzon(r.destino) && ["En el buzón","Entregada (sin confirmar)"].includes(r.estado);
}
function estaCerradaParaSucursal(r){
  return ESTADOS_CERRADOS_SUCURSAL.includes(r.estado) || esBolsinEnBuzon(r);
}
// Para quien PIDIÓ/ENVIÓ algo, una entrega "sin confirmar" ya no es un pendiente
// suyo: la que tiene que confirmarla es la sucursal que recibe, y ahí aparece en
// "Me llegan". Del lado de origen pasa al historial.
function cerradaParaOrigen(r){
  return estaCerradaParaSucursal(r) || r.estado==="Entregada (sin confirmar)";
}

function esDestinoBuzon(destino){
  const n = normNotif(destino);
  return n==="tesoreria" || n==="fabrica";
}
function openConfirmarEntrega(id){
  const r = S.requests.find(x=>x.id===id);
  if(!r) return;
  if(r.tipoPedido==="bolsin" && esDestinoBuzon(r.destino)){
    // Bolsín QUE VA hacia Fábrica/Tesorería → siempre buzón, nunca entrega directa
    if(S.miIdentidadRep){
      ejecutarDejarBolsinUnico(id, S.miIdentidadRep.dni, S.miIdentidadRep.nombre);
      return;
    }
    S.dejarBolsinesModal = {ids:[id], dni:"", err:"", loading:false};
    S.modal = "dejarBolsines";
    render();
    return;
  }
  // Si el destino es "Otra dirección", no es una sucursal conocida, o es un
  // bolsín que VIENE de Fábrica/Tesorería hacia una sucursal → entrega directa
  if(esOtraDireccion(r.destino) || r.tipoPedido==="bolsin"){
    if(S.miIdentidadRep){
      ejecutarEntregaDirecta(id, S.miIdentidadRep.dni, S.miIdentidadRep.nombre);
      return;
    }
    // Sin código — confirmación directa
    S.delivModal={id,dni:"",err:"",loading:false};
    S.modal="entrega";
  } else {
    // Con código — el repartidor ingresa la palabra que le dio la sucursal
    openIngresarPalabra(id);
  }
  render();
}

// ── LOGIN ──────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════
//  LOGIN CON SUPABASE AUTH — en paralelo al de siempre.
//  Mientras AUTH_AVANZADO esté en false (o no tenga el parámetro
//  ?authtest=1 en la URL), esto NUNCA se ejecuta y la app funciona
//  exactamente igual que hasta ahora. Es la fase de prueba: activarlo
//  del todo es un cambio de UNA línea, el día que esté todo probado.
// ══════════════════════════════════════════════════════════
// AUTH_AVANZADO activo para todos por defecto. Las cuentas ya migradas
// (con auth_user_id) usan Supabase Auth de verdad; el resto (sucursales
// sin contraseña, o las que aún tienen contraseña corta) sigue
// funcionando con el sistema de siempre, automáticamente.
// Interruptor de emergencia: si algo llegara a fallar, entrar con
// ?authtest=0 vuelve TODO al sistema viejo al instante, sin redeploy.
const AUTH_AVANZADO = new URLSearchParams(location.search).get("authtest")!=="0";

function loginToEmailAuth(usuario){
  const limpio = normNotif(usuario).replace(/[^a-z0-9]+/g,"-");
  return `${limpio}@transferlog.internal`;
}

async function intentarLoginAuth(usuario, password){
  const email = loginToEmailAuth(usuario);
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    // Supabase no distingue "no existe" de "contraseña incorrecta" (por
    // seguridad) — para el usuario, el mensaje es el mismo en ambos casos.
    return {ok:false, msg:"Usuario o contraseña incorrectos."};
  }
  const { data: filas, error: errFila } = await sb.from("usuarios").select("*").eq("auth_user_id", data.user.id).limit(1);
  if(errFila || !filas || !filas.length){
    await sb.auth.signOut();
    return {ok:false, msg:"Tu cuenta no está vinculada correctamente todavía. Avisá al administrador."};
  }
  const fila = filas[0];
  if(fila.activo==="no"){
    await sb.auth.signOut();
    return {ok:false, msg:"Usuario inhabilitado."};
  }
  return {ok:true, tipo:fila.tipo, usuario:fila.usuario||"", nombre:fila.nombre||fila.usuario, area:fila.area||"", recorrido:fila.recorrido||"", dni:fila.dni||""};
}

async function doLogin(){
  S.loginErr = "";
  // Leemos siempre del DOM, nunca del estado — así no depende de oninput
  const usuario = ($("l-user")?.value||S.loginUser||"").trim();
  const pass    = ($("l-pass")?.value||"").trim();
  S.loginUser   = usuario; // guardamos para si hay error y se re-renderiza

  if(!usuario){ S.loginErr="Ingresá tu usuario o sucursal."; render(); return; }

  // FASE 1: cargar solo usuarios (rápido)
  S.loginLoading = true; renderNow();
  if(USE_SHEETS) await sheetsLoadUsuarios();
  S.loginLoading = false;

  let resultado;
  if(AUTH_AVANZADO){
    // Modo de prueba: si esta cuenta ya está migrada a Auth (tiene
    // auth_user_id cargado), probar el login nuevo. Si todavía no fue
    // migrada (sucursales sin contraseña, o las 2 con contraseña corta),
    // seguir con el sistema de siempre — así no se rompe nada para nadie
    // mientras se prueba de a poco.
    const filaCandidata = S.usuarios.find(u=>normNotif(u.usuario)===normNotif(usuario));
    if(filaCandidata && filaCandidata.authUserId){
      // Sucursales y repartidores no escriben contraseña — usamos la que
      // quedó guardada (generada al azar, invisible para ellos) al migrarlos.
      const sinPasswordVisible = filaCandidata.tipo==="SUCURSAL" || filaCandidata.tipo==="REPARTIDOR";
      const passwordAUsar = sinPasswordVisible ? (filaCandidata.password||"") : pass;
      resultado = await intentarLoginAuth(usuario, passwordAUsar);
    } else {
      resultado = buscarUsuario(usuario, pass);
    }
  } else {
    resultado = buscarUsuario(usuario, pass);
  }
  if(!resultado.ok){ S.loginErr = resultado.msg; render(); return; }

  const tipo = resultado.tipo;

  // Determinar usuario según tipo
  if(tipo === "SUCURSAL"){
    S.user = {rol:"sucursal", area:resultado.area, nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "LOGISTICA"){
    S.user = {rol:"logistica", area:"Logística", nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "REPARTIDOR"){
    S.user = {rol:"repartidor", area:"Reparto", nombre:resultado.nombre, dni:resultado.dni||"", recorrido:resultado.recorrido||""};
  } else if(tipo === "AREA"){
    S.user = {rol:"area", area:resultado.area||usuario, nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(["PLANIFICACION","ADMINISTRACION","RRHH","PRECIOS","COMPRAS","DEPOSITO"].includes(tipo)){
    // Estos son logins COMPARTIDOS por toda un área (ej: usuario "COMPRAS" lo
    // usan varias personas distintas, cada una se identifica por DNI al crear
    // la solicitud). Por eso el área que se guarda y se usa para filtrar tiene
    // que ser SIEMPRE el login (columna "usuario" de Sheets, ej. "COMPRAS"),
    // no el nombre de la persona ni la columna "area" — así todas las
    // solicitudes creadas desde ese login quedan agrupadas bajo la misma área,
    // sin importar quién la haya creado.
    const areaReal = resultado.usuario || resultado.area || tipo;
    S.user = {rol:"planificacion", area:areaReal, nombre:resultado.nombre, dni:resultado.dni||"", tipoReal:tipo};
  } else if(tipo === "RECEPCIONISTA"){
    S.user = {rol:"recepcionista", area:resultado.area||"Fábrica", nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "TESORERIA"){
    S.user = {rol:"tesoreria", area:"Tesorería", nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "CALIDAD"){
    S.user = {rol:"calidad", area:"Calidad", nombre:resultado.nombre, dni:resultado.dni||""};
  } else if(tipo === "ADMIN"){
    S.user = {rol:"admin", area:"Administrador", nombre:resultado.nombre, dni:resultado.dni||""};
  } else {
    S.loginErr = "Tipo de acceso no reconocido. Consultá con logística.";
    render(); return;
  }

  // Logística es un login compartido — antes de entrar, pedimos el DNI
  // de quién lo está usando hoy, así todo (aprobaciones, gestiones)
  // queda a nombre de esa persona real y no de quien configuró el
  // usuario originalmente.
  if(S.user.rol==="logistica"){
    S.identificarLogisticaModal = {dni:"", err:"", loading:false};
    S.modal = "identificarLogistica";
    render();
    return;
  }

  // Reparto: el login es compartido, así que en cada ingreso se pide el DNI
  // ANTES de mostrar nada — y no se puede entrar sin identificarse. Lo que
  // haya quedado guardado de una sesión anterior no se reutiliza.
  if(S.user.rol==="repartidor"){
    try{ localStorage.removeItem("tl_rep_identidad"); }catch(e){}
    S.miIdentidadRep = null;
    S.identidadRepModal = {dni:"", err:"", loading:false, obligatoria:true, alIngresar:true};
    S.modal = "identidadRep";
    render();
    return;
  }

  finalizarEntradaApp();
}

function finalizarEntradaApp(){
  // Entrar inmediatamente — FASE 2 carga datos en background
  S.view = "app";
  S.lastRefresh = Date.now();
  try{ localStorage.setItem("tl_sesion", JSON.stringify(S.user)); }catch(e){}
  if(["repartidor","recepcionista","tesoreria"].includes(S.user.rol)) cargarIdentidadRepartidor();
  aplicarQRPendiente();
  reiniciarTimerInactividad();
  render(); // mostrar app ya

  setTimeout(animarEntradaContenido, 120);

  // Cargar solicitudes, recorridos y destinos en background sin bloquear
  sheetsLoadDatos().then(()=>{ render(); });
  startAutoRefresh(); // iniciar auto-refresh en background
}

// Tiempo real: en vez de "preguntar cada 90 segundos si pasó algo nuevo",
// la app se suscribe a la tabla y Supabase le avisa apenas algo cambia —
// se termina el parpadeo del refresco periódico.
let _rtChannel = null;
function startAutoRefresh(){
  if(!USE_SHEETS) return;
  if(_rtChannel) return; // ya suscripto
  _rtChannel = sb.channel("solicitudes-rt")
    .on("postgres_changes", {event:"*", schema:"public", table:"solicitudes"}, (payload)=>{
      if(S.view!=="app") return;
      if(payload.eventType==="DELETE"){
        S.requests = S.requests.filter(r=>r.id!==payload.old.id);
      } else {
        const fila = toCamelRow(payload.new);
        const existe = S.requests.some(r=>r.id===fila.id);
        S.requests = existe
          ? S.requests.map(r=>r.id===fila.id?fila:r)
          : [fila, ...S.requests];
      }
      if(!S.modal) render(); // si hay un modal abierto, no interrumpir — se actualiza solo al cerrarlo
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"quejas"}, (payload)=>{
      if(S.view!=="app" || !S.quejasLoaded) return;
      if(payload.eventType==="DELETE"){
        S.quejas = S.quejas.filter(q=>q.id!==payload.old.id);
      } else {
        const fila = toCamelRow(payload.new);
        const existe = S.quejas.some(q=>q.id===fila.id);
        S.quejas = existe ? S.quejas.map(q=>q.id===fila.id?fila:q) : [fila, ...S.quejas];
      }
      if(!S.modal) render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"devoluciones"}, (payload)=>{
      if(S.view!=="app" || !S.devolucionesLoaded) return;
      if(payload.eventType==="DELETE"){
        S.devoluciones = S.devoluciones.filter(d=>d.id!==payload.old.id);
      } else {
        const fila = toCamelRow(payload.new);
        const existe = S.devoluciones.some(d=>d.id===fila.id);
        S.devoluciones = existe ? S.devoluciones.map(d=>d.id===fila.id?fila:d) : [fila, ...S.devoluciones];
      }
      if(!S.modal) render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"notificaciones"}, (payload)=>{
      if(S.view!=="app") return;
      if(payload.eventType==="DELETE"){
        S.notificaciones = S.notificaciones.filter(n=>n.id!==payload.old.id);
      } else {
        const fila = toCamelRow(payload.new);
        if(fila.leida){
          S.notificaciones = S.notificaciones.filter(n=>n.id!==fila.id);
        } else {
          const existe = S.notificaciones.some(n=>n.id===fila.id);
          S.notificaciones = existe ? S.notificaciones.map(n=>n.id===fila.id?fila:n) : [fila, ...S.notificaciones];
          if(!existe && notifEsMia(fila)) toast(fila.mensaje);
        }
      }
      if(!S.modal) render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"flota_viajes"}, ()=>{
      if(S.view!=="app") return;
      debounceRefrescarFlota();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"flota_registros_qr"}, ()=>{
      if(S.view!=="app") return;
      debounceRefrescarFlota();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"flota_carga_planificada"}, ()=>{
      if(S.view!=="app") return;
      debounceRefrescarFlota();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"flota_camiones"}, ()=>{
      if(S.view!=="app") return;
      debounceRefrescarFlota();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"flota_viz_verd"}, ()=>{
      if(S.view!=="app") return;
      debounceRefrescarFlota();
    })
    .subscribe();
}
let _timerRefrescarFlota = null;
function debounceRefrescarFlota(){
  // Varios escaneos pueden llegar casi juntos — esperamos un toque
  // para no disparar recargas pisándose una a la otra.
  if(_timerRefrescarFlota) clearTimeout(_timerRefrescarFlota);
  _timerRefrescarFlota = setTimeout(()=>{
    cargarEstadoFlotaHoy(); // widget "Recorridos de hoy"
    if(S.tabLog==="flotaDash") cargarDashboardFlota(); // solo si están mirando esa pestaña
  }, 1500);
}
function stopAutoRefresh(){
  if(_rtChannel){ sb.removeChannel(_rtChannel); _rtChannel=null; }
}

// ── ACTUALIZAR DATOS (sin cerrar sesión) ─────────────────
// Sin botón "Actualizar": los datos se mantienen al día solos por
// Realtime. Esto cubre el único caso donde puede fallar — el celular
// o la compu estuvo dormida/en segundo plano y se cortó la conexión —
// volviendo a traer todo apenas se vuelve a la pestaña.
let _ultimoResyncSilencioso = 0;
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState!=="visible") return;
  if(S.view!=="app" || S.refreshing || S.modal) return;
  if(Date.now()-_ultimoResyncSilencioso < 45000) return;
  _ultimoResyncSilencioso = Date.now();
  try{
    await sheetsLoadDatos();
    if(S.devolucionesLoaded) await cargarDevoluciones();
    S.lastRefresh = Date.now();
    render();
  }catch(e){ console.warn("Resync silencioso:", e); }
});

async function doRefresh(){
  if(S.refreshing) return; // evitar doble click
  S.refreshing = true;
  renderNow();
  if(USE_SHEETS){
    await Promise.all([sheetsLoadUsuarios(), sheetsLoadDatos()]);
  }
  S.lastRefresh = Date.now();
  S.refreshing  = false;
  toast("Datos actualizados ✓");
}

// ══════════════════════════════════════════════════════════
//  CIERRE AUTOMÁTICO POR INACTIVIDAD — solo Logística y Admin,
//  30 minutos sin tocar nada. El resto de los roles no tiene este
//  límite (lo pidieron puntualmente para estos dos, por manejar
//  datos más sensibles y por si se olvidan la sesión abierta).
// ══════════════════════════════════════════════════════════
const INACTIVIDAD_MS = 30*60*1000; // 30 minutos
let _inactividadTimer = null;
function reiniciarTimerInactividad(){
  if(_inactividadTimer){ clearTimeout(_inactividadTimer); _inactividadTimer=null; }
  if(!S.user || !["logistica","admin"].includes(S.user.rol)) return;
  _inactividadTimer = setTimeout(()=>{
    if(S.user && ["logistica","admin"].includes(S.user.rol)){
      doLogout();
      alert("Se cerró la sesión automáticamente por inactividad (30 minutos), por seguridad.");
    }
  }, INACTIVIDAD_MS);
}
["mousedown","keydown","touchstart","scroll"].forEach(ev=>{
  document.addEventListener(ev, reiniciarTimerInactividad, {passive:true});
});

function doLogout(){
  if(_inactividadTimer){ clearTimeout(_inactividadTimer); _inactividadTimer=null; }
  try{ localStorage.removeItem("tl_sesion"); }catch(e){}
  // Si alguien cierra sesión, lo más probable es que el celular esté por
  // cambiar de mano — no dejar la identidad de "quién soy en este
  // dispositivo" pegada para la próxima persona que entre.
  try{ localStorage.removeItem("tl_rep_identidad"); }catch(e){}
  try{ localStorage.removeItem("tl_fresco_identidad"); }catch(e){}
  try{ localStorage.removeItem("tl_tesoreria_identidad"); }catch(e){}
  S.miIdentidadRep = null;
  S.miIdentidadFresco = null;
  S.miIdentidadTesoreria = null;
  try{ sb.auth.signOut(); }catch(e){} // no rompe nada si no había sesión de Auth
  stopAutoRefresh(); S.modal=null; S.view="login"; S.user=null; S.loginErr=""; S.loginUser=""; S.loginLoading=false; render();
}

// ══════════════════════════════════════════════════════════
//  IDENTIDAD DEL REPARTIDOR EN ESTE CELULAR — el login de reparto
//  es compartido entre varias personas, así que la app no sabe quién
//  está mirando la pantalla salvo que se lo preguntemos una vez.
//  Con eso filtramos: lo no tomado lo ve cualquiera, lo ya tomado
//  solo lo sigue viendo quien lo tomó.
// ══════════════════════════════════════════════════════════
function cargarIdentidadRepartidor(){
  try{
    const guardada = localStorage.getItem("tl_rep_identidad");
    if(guardada) S.miIdentidadRep = JSON.parse(guardada);
  }catch(e){}
  try{
    const guardadaFresco = localStorage.getItem("tl_fresco_identidad");
    if(guardadaFresco) S.miIdentidadFresco = JSON.parse(guardadaFresco);
  }catch(e){}
  try{
    const guardadaTesoreria = localStorage.getItem("tl_tesoreria_identidad");
    if(guardadaTesoreria) S.miIdentidadTesoreria = JSON.parse(guardadaTesoreria);
  }catch(e){}
}
function abrirIdentificarRepartidor(){
  S.identidadRepModal = {dni:"", err:"", loading:false};
  S.modal = "identidadRep";
  render();
}
function renderIdentidadRepModal(){
  const d = S.identidadRepModal;
  return `
  ${d.obligatoria?`<div class="alert-info" style="margin-bottom:14px;font-size:13px">🔒 Para entrar tenés que identificarte con tu DNI.</div>`:""}
  <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Como el login de reparto lo usan varias personas, necesitamos saber quién sos en este celular — así solo te mostramos lo que vos tomaste (lo que nadie tomó todavía lo ven todos).</p>
  <div class="field">
    <label>Tu DNI (sin puntos) <span class="req">*</span></label>
    <input id="idrep-dni" class="inp ${d.err?"err":""}" type="number" placeholder="Ej: 30123456"
      value="${escH(d.dni)}"
      oninput="S.identidadRepModal.dni=this.value;S.identidadRepModal.err=''"
      onkeydown="if(event.key==='Enter')confirmarIdentidadRepartidor()"/>
    ${d.err?`<span class="err-msg">${escH(d.err)}</span>`:""}
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
    ${d.obligatoria?`<button class="btn btn-ghost btn-md" onclick="cancelarIdentidadRepartidor()">${d.alIngresar?"Salir":"Cancelar"}</button>`:""}
    <button class="btn btn-success btn-md" onclick="confirmarIdentidadRepartidor()" ${d.loading?"disabled":""}>
      ${d.loading?`<span class="spinner"></span> Verificando...`:"✅ Soy yo"}
    </button>
  </div>`;
}
function confirmarIdentidadRepartidor(){
  const d = S.identidadRepModal;
  const dni = String($("idrep-dni")?.value||d.dni||"").replace(/\D/g,"");
  if(!dni){ S.identidadRepModal.err="Ingresá tu DNI."; render(); return; }
  const check = validarDNI(dni);
  if(!check.ok){ S.identidadRepModal.err=check.msg; render(); return; }
  S.miIdentidadRep = {dni, nombre:check.nombre};
  try{ localStorage.setItem("tl_rep_identidad", JSON.stringify(S.miIdentidadRep)); }catch(e){}
  S.modal = null;
  toast(`👤 Listo, ${check.nombre}`);
  if(d.alIngresar){ finalizarEntradaApp(); return; }   // recién ahora entra a la app
  render();
}
// Reparto: quien no se identifica no entra. Si venía de un ingreso, vuelve al
// login; si estaba cambiando de persona, vuelve a quien estaba antes.
function cancelarIdentidadRepartidor(){
  const d = S.identidadRepModal;
  if(d.previa){
    S.miIdentidadRep = d.previa;
    try{ localStorage.setItem("tl_rep_identidad", JSON.stringify(d.previa)); }catch(e){}
    S.modal = null; render(); return;
  }
  doLogout();
}
function cambiarIdentidadRepartidor(){
  const previa = S.miIdentidadRep;
  try{ localStorage.removeItem("tl_rep_identidad"); }catch(e){}
  S.miIdentidadRep = null;
  S.identidadRepModal = {dni:"", err:"", loading:false, obligatoria:true, alIngresar:false, previa};
  S.modal = "identidadRep";
  render();
}
// Si ya identificamos a la persona en este celular, usamos eso directo
// (sin volver a pedir DNI en cada acción). Si no, cae al campo de DNI
// del modal correspondiente.
function resolverIdentidadAccion(inputId){
  if(S.miIdentidadRep) return {ok:true, dni:S.miIdentidadRep.dni, nombre:S.miIdentidadRep.nombre};
  const dni = String($(inputId)?.value||"").replace(/\D/g,"");
  if(!dni) return {ok:false, msg:"Ingresá tu DNI."};
  const check = validarDNI(dni);
  if(!check.ok) return {ok:false, msg:check.msg};
  return {ok:true, dni, nombre:check.nombre};
}

// ── NUEVA SOLICITUD ────────────────────────────────────────
async function submitNueva(){
  // Guard: evitar doble submit
  if(S.saving) return;

  // Leer valores del DOM directamente — no del estado S.form
  // Así evitamos que oninput cause re-renders mientras se escribe
  const destino     = ($("f-dest")?.value||"").trim();
  const descripcion = ($("f-desc")?.value||"").trim();
  const cantidad    = ($("f-cant")?.value||"").trim();
  const unidad      = $("f-unit")?.value || "Unidades";
  const prioridad   = "Media"; // eliminada del formulario
  const fechaReq    = $("f-fecha")?.value || "";
  const observ      = ($("f-obs")?.value||"").trim();

  // Validar
  const e={};
  if(!destino)                                         e.dest="Seleccioná un destino";
  if(!descripcion)                                     e.desc="Campo requerido";
  if(!cantidad||isNaN(+cantidad)||+cantidad<=0)        e.cant="Cantidad inválida";
  if(fechaReq && fechaReq < fechaISO())                e.fecha="La fecha requerida no puede ser anterior a hoy";
  // Si el origen o el destino es "Otra dirección", la dirección exacta
  // (en Observaciones) pasa a ser obligatoria — si no, nadie sabe adónde ir.
  const origenPrevio = ($("f-origen")?.value||"").trim();
  if((origenPrevio==="Otra dirección" || destino==="Otra dirección") && !observ){
    e.obs = "Ingresá la dirección exacta — es obligatorio para 'Otra dirección'";
  }
  if(Object.keys(e).length){ S.formErr=e; render(); return; }

  // Capturar el origen y el archivo AHORA — el DOM se destruye cuando se abre el modal DNI
  const origenElegido = ($("f-origen")?.value||"").trim();
  const archivoElegido = $("f-adjunto")?.files?.[0] || null;
  const esPlanSubmit  = S.user.rol==="planificacion";
  const esLogSubmit   = S.user.rol==="logistica";

  const crearConDatos = async (dniVal, nombreSolicitante) => {
    if(S.saving) return;
    S.saving=true; renderNow();
    const adjuntoUrl = await subirArchivo(archivoElegido, "solicitudes");
    const nowTs = now();
    const nueva={
      id:"tmp-"+Date.now(),
      sucursal: S.user.rol==="sucursal"       ? S.user.area
              : esLogSubmit                   ? origenElegido
              : esPlanSubmit                   ? origenElegido : "",
      area:     S.user.rol==="area"            ? S.user.area
              : esLogSubmit                   ? "Logística"
              : esPlanSubmit                   ? S.user.area : "",
      solicitante:  nombreSolicitante,
      dniSolicitante: dniVal,
      destino, descripcion, cantidad:+cantidad,
      unidad, prioridad,
      fechaRequerida: fechaReq||null,
      observaciones:  observ,
      adjuntoUrl,
      // Logística ya es quien aprueba — su propia solicitud nace aprobada,
      // sin tener que pasar por su propio panel de gestión después.
      estado: esLogSubmit ? "Aprobada" : "Pendiente",
      comentario:"", recorrido:"",
      dniLogistica: esLogSubmit ? dniVal : "",
      nombreLogistica: esLogSubmit ? nombreSolicitante : "",
      dniRepartidor:"", nombreQuienLevanto:"", dniEntrega:"", nombreQuienEntrego:"", codigoEntrega:"", listoAt:"", dniListoPor:"", nombreListoPor:"",
      createdAt:nowTs, approvedAt: esLogSubmit ? nowTs : null, scheduledAt:null, deliveredAt:null, updatedAt:nowTs,
    };
    const creada = await sheetsAdd(nueva);
    S.requests = [creada||nueva, ...S.requests];
    S.form     = emptyForm();
    S.saving   = false;
    S.modal    = null;
    toast(`${esLogSubmit?"Transferencia":"Solicitud"} ${(creada||nueva).id} creada${esLogSubmit?" y aprobada":""} — ${nombreSolicitante}`);
    render();
    notificarNuevaSolicitud(creada||nueva); // aviso a logística, en background
  };

  if(esLogSubmit){
    // Logística: login único, sin DNI de por medio — usa su propio nombre.
    await crearConDatos(S.user.dni||"", S.user.nombre||"Logística");
    return;
  }

  // Abrir modal DNI — el nombre del solicitante viene de Sheets
  S.dniModal={
    title:"Ingresá tu DNI para registrar la solicitud",
    field:"solicitante",
    val:"", err:"", loading:false, nombreOk:"",
    cb: async (dniVal, usuarioEncontrado)=>{
      const nombreSolicitante = usuarioEncontrado?.nombre || S.user.nombre || "Sin nombre";
      await crearConDatos(dniVal, nombreSolicitante);
    }
  };
  S.modal="dniConfirm"; render();
}

// ── GESTIONAR (LOGÍSTICA) ──────────────────────────────────
async function submitGestionar(){
  if(!S.action.estado){ toast("Seleccioná un estado","warn"); return; }

  // El login "logística" lo usa una sola persona — pedirle DNI en cada
  // acción es fricción sin sentido (a diferencia de repartidores/sucursales,
  // que sí son logins compartidos entre varias personas distintas).
  if(S.user?.rol==="logistica"){
    await aplicarGestionar(S.user.dni||"", {nombre:S.user.nombre});
    return;
  }

  S.dniModal={
    title:"Confirmá tu DNI para registrar esta acción",
    field:"logistica",
    val:"", err:"", loading:false,
    cb: async (dniVal, usuario)=> aplicarGestionar(dniVal, usuario)
  };
  S.modal="dniConfirm"; render();
}

async function aplicarGestionar(dniVal, usuario){
      // Obtener nombre del que firma — viene del objeto usuario encontrado por validarDNI
      const nombreFirmante = usuario?.nombre || S.user?.nombre || "Logística";
      S.saving=true; S.modal=null; renderNow();
      const a=S.action; const r=S.requests.find(x=>x.id===S.selId);
      const savedId = S.selId;
      // Leer comentario del repartidor del DOM (puede haber sido editado)
      const comentRepDom = ($("g-coment-rep")?.value ?? a.comentarioRepartidor ?? "").trim();
      const changes={
        estado:          a.estado,
        comentario:      a.comentario || "",
        comentarioRepartidor: comentRepDom,
        updatedAt:       now(),
        dniLogistica:    dniVal,
        nombreLogistica: nombreFirmante,
      };
      if(a.scheduledAt)   changes.scheduledAt   = a.scheduledAt;
      if(a.prioridad)     changes.prioridad     = a.prioridad;
      changes.pasaPorFabrica = a.pasaPorFabrica ? true : false;
      // Recorrido: si ya llegó a fábrica → es recorrido de egreso; si no → ingreso
      if(a.recorrido){
        if(r.fabricaAt || r.estado==="En fábrica"){
          changes.recorridoEgreso = a.recorrido;
        } else {
          changes.recorrido = a.recorrido;
        }
      }
      if(a.estado==="Aprobada"&&!r.approvedAt) changes.approvedAt=now();
      if(a.estado==="Entregada") changes.deliveredAt=now();
      if(r.estado==="En fábrica"&&a.estado!=="En fábrica"){
        changes.nombreQuienLevanto="";
        changes.dniRepartidor="";
      }
      // Reprogramar: NO toca el estado — solo actualiza la fecha pedida y
      // deja marcado que se reprogramó, para que convivan "Aprobada" +
      // "Reprogramada" en vez de perder el estado real de la solicitud.
      if(a.reprogramando && a.nuevaFechaRequerida){
        changes.fechaRequerida = a.nuevaFechaRequerida;
        changes.reprogramada = true;
      }
      S.requests = S.requests.map(x=>x.id===savedId?{...x,...changes}:x);
      S.saving=false; S.selId=null;
      toast(`Solicitud actualizada → ${a.estado}`);
      sheetsUpdate(savedId, changes);
      // Avisar por mail a quien la pidió, si logística la acaba de aprobar
      if(a.estado==="Aprobada" && r){
        const origenNombre = r.sucursal||r.area||"";
        // Si un área (ej: Planificación) coordinó la transferencia entre
        // dos puntos distintos, avisarle también a ella, no solo al origen físico.
        if(r.area && normNotif(r.area)!==normNotif(origenNombre)){
          crearNotificacion(r.area, `✅ La solicitud ${savedId} que armaste (${r.sucursal||"—"} → ${r.destino||"—"}) fue aprobada`, savedId);
        }
        crearNotificacion(origenNombre, `✅ Tu solicitud ${savedId} fue aprobada — prepará y marcá "Lista para retirar"`, savedId);
        if(esPedidoPlanificacionFresco(r)){
          crearNotificacion("RECEPCION FRESCO", `🥬 Nuevo pedido para preparar: ${savedId} — ${r.descripcion||""}`, savedId);
        }
        const email = buscarEmailOrigen(origenNombre);
        if(email){
          enviarMail(email,
            `✅ Transferencia ${savedId} aprobada — preparala y marcala "Lista para retirar"`,
            [
              `Logística aprobó tu solicitud de transferencia.`,"",
              `N° Solicitud : ${savedId}`,
              `Origen       : ${r.sucursal||r.area||"—"}`,
              `Destino      : ${r.destino||"—"}`,"",
              `Preparala y, cuando esté embalada, ingresá al sistema y marcala como "Lista para retirar".`,
            ].join("\n"));
        }
      }
}

// ── CONFIRMAR ENTREGA (REPARTIDOR) ─────────────────────────
// ── TOMAR TRANSFERENCIA (repartidor levanta) ───────────────
async function ejecutarTomarTransferencia(id, dni, nombre){
  const r = S.requests.find(x=>x.id===id);
  const esSegundaEtapa = r?.estado === "En fábrica";
  const tsAhora = now();
  const changes = {
    estado:     "En tránsito",
    updatedAt:  tsAhora,
  };
  if(esSegundaEtapa){
    // Segunda etapa: sale de fábrica → destino final
    changes.nombreQuienEntrego = nombre;
    changes.dniEntrega         = dni;
    changes.salidaFabricaAt    = tsAhora;  // timestamp salida de fábrica
    changes.pasaPorFabrica     = true;
  } else {
    // Primera etapa: levanta de sucursal
    changes.nombreQuienLevanto = nombre;
    changes.dniRepartidor      = dni;
    changes.levantadoAt        = tsAhora;  // timestamp levantamiento
  }
  // OPTIMISTIC UPDATE
  S.requests = S.requests.map(x => x.id===id ? {...x,...changes} : x);
  S.modal    = null;
  const msg  = esSegundaEtapa
    ? `🚚 ${nombre} lleva la ${id} al destino final`
    : `🚚 ${nombre} tomó la ${id}`;
  toast(msg);
  render();
  sheetsUpdate(id, changes);
}
async function submitTomar(){
  const d   = S.tomarModal;
  const dni = String(d.dni||"").replace(/\D/g,"");

  if(!dni){ S.tomarModal.err="Ingresá tu DNI."; render(); return; }

  const check = validarDNI(dni);
  if(!check.ok){ S.tomarModal.err=check.msg; render(); return; }

  // Mostrar nombre verificado brevemente
  S.tomarModal.loading  = true;
  S.tomarModal.nombreOk = check.nombre;
  renderNow();
  await new Promise(r=>setTimeout(r,500));

  await ejecutarTomarTransferencia(d.id, dni, check.nombre);
}

async function ejecutarEntregaDirecta(id, dni, nombre){
  const changes = {
    estado:              "Entregada",
    deliveredAt:         now(),
    dniEntrega:          dni,
    nombreQuienEntrego:  nombre,
    updatedAt:           now(),
  };
  S.requests = S.requests.map(x=>x.id===id?{...x,...changes}:x);
  S.modal    = null;
  toast(`Entrega confirmada — ${nombre} ✓`);
  render();
  sheetsUpdate(id, changes);
}
async function submitEntrega(){
  const d      = S.delivModal;
  const dni    = String(d.dni||"").replace(/\D/g,"");

  if(!dni){ S.delivModal.err="Ingresá tu DNI."; render(); return; }

  const check = validarDNI(dni);
  if(!check.ok){ S.delivModal.err=check.msg; render(); return; }

  S.delivModal.loading = true; renderNow();
  await ejecutarEntregaDirecta(d.id, dni, check.nombre);
}

// ── VALIDAR DNI en modal ───────────────────────────────────
// Busca el DNI, muestra el nombre encontrado para que el usuario
// confirme que es correcto antes de ejecutar la acción.
async function submitDni(){
  const d = S.dniModal;
  // Guard: evitar doble ejecución
  if(d.loading) return;

  const val = String(d.val||"").replace(/\D/g,"");
  if(!val){ S.dniModal.err="Ingresá tu DNI."; render(); return; }

  const check = validarDNI(val);
  if(!check.ok){ S.dniModal.err=check.msg; render(); return; }

  // Guardar callback antes de que el render lo pueda pisar
  const cb = d.cb;

  // Mostrar nombre brevemente
  S.dniModal.loading  = true;
  S.dniModal.nombreOk = check.nombre;
  S.dniModal.cb       = null; // limpiar para evitar doble disparo
  render();

  await new Promise(r=>setTimeout(r,450));
  await cb(val, check.usuario);
  S.modal = null;
  render();
}
