<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TransferLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1120;--s1:#111827;--s2:#1a2338;--s3:#1f2d44;
  --border:#263348;--border2:#2f4060;
  --text:#e2e8f4;--muted:#7a90b0;--faint:#3d5070;
  --blue:#4f9eff;--green:#2ecc7a;--amber:#f5a623;
  --red:#f05252;--purple:#9b8ff7;--teal:#2de0c4;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--rsm:6px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:16px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* LAYOUT */
.navbar{background:var(--s1);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;min-height:52px;position:sticky;top:0;z-index:200;flex-wrap:wrap;gap:8px 12px}
@media(max-width:600px){
  .navbar{padding:8px 12px;justify-content:flex-start}
  .navbar-brand{flex:1 0 100%;justify-content:space-between;display:flex}
}
.navbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.ntag{padding:2px 9px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.8px;border:1px solid}
.ntag-log{background:#2ecc7a18;color:var(--green);border-color:#2ecc7a30}
.ntag-suc{background:#4f9eff18;color:var(--blue);border-color:#4f9eff30}
.ntag-rep{background:#f5a62318;color:var(--amber);border-color:#f5a62330}
.ntag-adm{background:#9b8ff718;color:var(--purple);border-color:#9b8ff730}
main{flex:1;padding:24px 24px;max-width:1800px;width:100%;margin:0 auto}
footer{border-top:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-family:var(--mono)}
#app{min-height:100vh;display:flex;flex-direction:column}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-flush{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}

/* FORMS */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.req{color:var(--red);margin-left:2px}
.inp,select,textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 13px;color:var(--text);font-size:15px;font-family:var(--font);outline:none;transition:border-color .15s}
.inp:focus,select:focus,textarea:focus{border-color:var(--blue)}
.inp.err{border-color:var(--red)!important;background:#f0525210}
textarea{resize:vertical;min-height:76px}
select{cursor:pointer}
select option{background:#1a2338}
.err-msg{font-size:11px;color:var(--red);margin-top:3px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:var(--rsm);font-weight:600;cursor:pointer;font-family:var(--font);transition:filter .15s;white-space:nowrap;border:1px solid}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-md{padding:10px 22px;font-size:14px}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-full{width:100%;justify-content:center}
.btn-primary{background:#4f9eff1a;border-color:#4f9eff50;color:var(--blue)}
.btn-success{background:#2ecc7a1a;border-color:#2ecc7a50;color:var(--green)}
.btn-danger{background:#f0525218;border-color:#f0525250;color:var(--red)}
.btn-purple{background:#9b8ff71a;border-color:#9b8ff750;color:var(--purple)}
.btn-warn{background:#f5a6231a;border-color:#f5a62350;color:var(--amber)}
.btn-teal{background:#2de0c41a;border-color:#2de0c450;color:var(--teal)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.chk-round{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--s2);cursor:pointer;display:inline-block;vertical-align:middle;position:relative;transition:.15s;flex-shrink:0}
.chk-round:checked{background:var(--blue);border-color:var(--blue)}
.chk-round:checked::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.spinner{width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}

/* BADGES */
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.3px;font-family:var(--mono);white-space:nowrap;border:1px solid}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--s2);border-radius:8px;padding:4px;width:fit-content;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-family:var(--font);font-weight:600;font-size:13px;transition:all .2s;background:transparent;color:var(--muted)}
.tab.active{background:var(--s3);color:var(--text)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start}
.stat-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;margin-bottom:6px}
.stat-val{font-size:30px;font-weight:700;font-family:var(--mono);line-height:1}
.stat-icon{font-size:22px;opacity:.6}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:11px 14px;text-align:left;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.5px;white-space:nowrap;background:var(--s2)}
td{padding:11px 14px;border-top:1px solid var(--border)}
tr:nth-child(even) td{background:rgba(255,255,255,.015)}
tr:hover td{background:var(--s2)}
.id-cell{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted-cell{color:var(--muted)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.mono{font-family:var(--mono)}
.empty-row td{text-align:center;padding:48px;color:var(--muted)}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;animation:fadeUp .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--s1);z-index:1}
.modal-head h3{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px}
.modal-body{padding:20px}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:440px}
.login-brand{text-align:center;margin-bottom:28px}
.login-brand .ico{font-size:42px;margin-bottom:8px}
.login-brand h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.login-brand p{color:var(--muted);font-size:14px;margin-top:4px}
/* role-grid removed — login unificado */
.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
.hint-box{background:var(--s2);border-radius:8px;padding:12px 15px;font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.hint-box strong{color:var(--text)}
.alert-err{background:#f0525210;border:1px solid #f0525230;border-radius:var(--rsm);padding:11px 15px;font-size:14px;color:var(--red);margin-bottom:12px}
.alert-ok{background:#2ecc7a10;border:1px solid #2ecc7a30;border-radius:var(--rsm);padding:11px 15px;font-size:14px;color:var(--green);margin-bottom:12px}
.alert-info{background:var(--s2);border-radius:8px;padding:13px 15px;margin-bottom:16px;font-size:14px;border-left:3px solid var(--blue)}

/* DIVIDER */
.div-label{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.div-label span{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--faint);white-space:nowrap}
.div-line{flex:1;height:1px;background:var(--border)}

/* ACTION BUTTONS ROW */
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* DETAIL ROWS */
.drow{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
.drow-label{font-size:13px;color:var(--muted);min-width:140px}
.drow-val{font-size:14px;font-weight:500;text-align:right;max-width:300px}

/* METRIC BARS */
.bar-wrap{margin-bottom:10px}
.bar-head{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px}
.bar-track{background:var(--s2);border-radius:3px;height:5px}
.bar-fill{height:5px;border-radius:3px;transition:width .5s ease}

/* TRAZABILIDAD */
.trace-step{display:flex;gap:12px;margin-bottom:16px}
.trace-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.trace-line{width:2px;background:var(--border);margin:14px auto 0;flex-shrink:0}
.trace-body{flex:1}
.trace-title{font-size:14px;font-weight:600;margin-bottom:3px}
.trace-meta{font-size:13px;color:var(--muted)}

/* DELIVERY CARDS */
.del-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.del-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .2s}
.del-card:hover{border-color:var(--border2)}
.del-stripe{height:4px}
.del-body{padding:20px 18px}

/* DNI MODAL */
.dni-modal{max-width:400px}
.dni-big{font-size:32px;text-align:center;margin:8px 0 4px;font-family:var(--mono);color:var(--blue)}

/* FILTERS */
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 16px;align-items:end}
.filter-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--s2);border-radius:var(--r);padding:12px 18px;min-width:260px;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:fadeUp .25s ease;display:flex;align-items:center;gap:10px;font-size:13px}

/* LOADING */
.loading-center{display:flex;align-items:center;justify-content:center;padding:80px;flex-direction:column;gap:14px;color:var(--muted)}
.spin-circle{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.kpi-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi-mini{text-align:center;padding:10px 0;background:var(--s2);border-radius:8px}
.kpi-mini-val{font-size:24px;font-weight:700;font-family:var(--mono);line-height:1}
.kpi-mini-lbl{font-size:11px;color:var(--muted);margin-top:3px}

@media(max-width:640px){
  .g2,.g3{grid-template-columns:1fr}
  .filter-grid{grid-template-columns:1fr 1fr}
  main{padding:16px 12px}
  .stat-val{font-size:24px}
  th{padding:9px 10px;font-size:12px}
  td{padding:10px 10px;font-size:14px}
  .role-grid{grid-template-columns:1fr 1fr}
  .inp,select,textarea{font-size:16px} /* evita zoom en iOS */
  .btn-md{font-size:15px;padding:12px 20px;min-height:44px}
  .btn-sm{font-size:13px;padding:10px 14px;min-height:40px}
  .btn{min-height:40px}
  /* Scroll más cómodo en cualquier contenedor con scroll interno
     (listas largas, tablas, paneles) — evita que el gesto se sienta
     "trabado" en celular */
  [style*="overflow-y:auto"],[style*="overflow-x:auto"],.table-wrap{-webkit-overflow-scrolling:touch}
}
@media(max-width:380px){
  .filter-grid,.role-grid{grid-template-columns:1fr}
}

/* ══ Fluidez: movimiento y respuesta al tocar, en toda la app ══ */
html{scroll-behavior:smooth}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drawLine{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes dotIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes donutIn{from{opacity:0;transform:rotate(-25deg) scale(.88)}to{opacity:1;transform:none}}
@keyframes vtOut{to{opacity:0;transform:translateY(-8px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(18px)}}

/* Botones: se levantan al pasar, se hunden al apretar */
.btn{transition:filter .15s,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background-color .2s,border-color .2s,color .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97);box-shadow:none;transition-duration:.06s}
.tab{transition:background-color .25s ease,color .2s ease,transform .15s}
.tab:hover:not(.active){background:#1f2d4488;color:var(--text)}
.tab:active{transform:scale(.95)}
.inp,select,textarea{transition:border-color .15s,box-shadow .2s,background-color .2s}
.inp:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px #4f9eff26}

/* Tarjetas y filas: reaccionan al mouse */
.card,.card-flush,.stat-card{transition:border-color .2s,box-shadow .25s,transform .22s cubic-bezier(.2,.8,.2,1)}
.stat-card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.card[onclick]{cursor:pointer}
.card[onclick]:hover{border-color:var(--border2);box-shadow:0 10px 26px rgba(0,0,0,.32);transform:translateY(-2px)}
.card[onclick]:active{transform:scale(.99)}
.del-card{transition:border-color .2s,transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.del-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.38)}
.del-card:active{transform:translateY(-1px) scale(.99)}
td{transition:background-color .15s}
tr[onclick]:active td{background:var(--s3)}

/* Entrada: lo que aparece nuevo entra con suavidad (fill "backwards" para
   no pisar los efectos de hover una vez terminada la animación) */
.modal-bg{animation:fadeIn .22s ease}
.modal-box{animation:popIn .3s cubic-bezier(.2,.9,.25,1.05)}
.toast{animation:toastIn .38s cubic-bezier(.2,.9,.25,1.1)}

/* Gráficos */
.hbar-row{border-radius:10px;padding:7px 9px;margin:-7px -9px;transition:background-color .15s}
.hbar-row[onclick]:hover{background:var(--s2)}
.hbar-fill{transform-origin:left center;transition:width .5s ease,filter .15s}
.hbar-row:hover .hbar-fill{filter:brightness(1.18)}
.ev-line{stroke-dasharray:1}
.ev-dot{transform-box:fill-box;transform-origin:center}

/* Cambio de pestaña/vista (View Transitions): la barra de arriba queda
   quieta y el contenido se desliza */
.navbar{view-transition-name:navbar}
::view-transition-old(root){animation:vtOut .16s ease both}
::view-transition-new(root){animation:vtIn .34s cubic-bezier(.2,.8,.2,1) both}
::view-transition-group(navbar){animation-duration:0s}


/* ══ Interfaz moderna: barra superior, encabezados, pestañas y tarjetas ══ */
.nav-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-actions .btn,.nav-user{min-height:38px;border-radius:10px}
.nav-actions .btn{padding:7px 14px;position:relative}
.nav-lbl{display:none}
@media(min-width:560px){.nav-lbl{display:inline}}
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;font-family:var(--mono);animation:dotIn .35s cubic-bezier(.2,1.2,.4,1) backwards}
.nav-user{display:inline-flex;align-items:center;gap:8px;padding:0 14px;background:var(--s2);border:1px solid var(--border);font-size:13px;color:var(--text);font-weight:600}

.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.page-sub{font-size:14px;color:#a9b8d0;margin-top:4px}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap}
.actions-bar .btn{min-height:42px;border-radius:10px}

.tab{padding:9px 16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.toolbar .tabs{margin-bottom:0}
.datepill{display:inline-flex;align-items:center;gap:8px;padding:0 12px;min-height:42px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;transition:border-color .15s,box-shadow .2s}
.datepill:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #4f9eff26}
.datepill input{background:transparent;border:0;color:var(--text);font-family:var(--font);font-size:14px;outline:none;color-scheme:dark;min-width:130px}
.datepill button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:6px;transition:color .15s,background .15s}
.datepill button:hover{color:var(--text);background:var(--s3)}

.sol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.sol-card{display:flex;flex-direction:column;position:relative;background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px 18px 16px 22px;cursor:pointer;overflow:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .2s}
.sol-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--border2))}
.sol-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.38);border-color:var(--border2)}
.sol-card:active{transform:translateY(-1px) scale(.99)}
.sol-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sol-id{font-family:var(--mono);font-size:12px;color:#8ea2c4}
.sol-route{font-size:19px;font-weight:700;line-height:1.25;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sol-route small{font-size:12px;font-weight:700;color:#a9b8d0;text-transform:uppercase;letter-spacing:.07em}
.sol-desc{margin-top:6px;font-size:14.5px;color:var(--text);opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sol-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--border);font-size:12.5px;color:#c3cfe2;font-weight:600}
.sol-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.sol-meta{margin-bottom:14px}
.sol-card>.sol-meta:last-child{margin-bottom:0}
.sol-actions .btn{flex:1 1 auto;justify-content:center;font-size:14px;min-height:40px}
.sol-empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#a9b8d0;font-size:15px}
.sol-empty .ico{font-size:34px;margin-bottom:8px;opacity:.8}
.sol-more{grid-column:1/-1;display:flex;justify-content:center;margin-top:4px}
@media(max-width:640px){
  .page-title{font-size:22px}
  .sol-grid{grid-template-columns:1fr}

/* ── Pestañas con indicador deslizante ── */
.tabs{position:relative;border:1px solid var(--border);border-radius:12px;gap:2px}
.tabs::before{content:"";position:absolute;left:0;top:0;width:var(--ind-w,0px);height:var(--ind-h,0px);transform:translate(var(--ind-x,0px),var(--ind-y,0px));background:var(--s3);border:1px solid var(--border2);border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.32);opacity:0;pointer-events:none;
  transition:transform var(--ind-dur,.42s) cubic-bezier(.2,.9,.25,1.05),width var(--ind-dur,.42s) cubic-bezier(.2,.9,.25,1.05),height var(--ind-dur,.42s) ease,opacity .25s}
.tabs[data-ind]::before{opacity:1}
.tab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:0}
.tabs[data-ind] .tab.active{background:transparent}
.tab.active{color:var(--text)}
.tab-n{display:inline-block;margin-left:8px;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--s3);color:var(--muted);font-size:11.5px;font-weight:700;font-family:var(--mono);text-align:center;transition:background-color .25s,color .25s,transform .25s}
.tab:hover .tab-n{transform:scale(1.08)}
.tab.active .tab-n{background:#4f9eff2e;color:var(--blue)}

/* ── Marca de la barra superior, a tono con el resto ── */

  background:linear-gradient(135deg,#4f9eff33,#2de0c433);border:1px solid #4f9eff55;box-shadow:0 6px 18px #4f9eff2b,inset 0 1px 0 #ffffff14;

/* Entrada de contenido: SOLO cuando se entra a una pantalla o se cambia de
   pestaña (JS agrega .enter a propósito). Antes se disparaba sola cada vez
   que el navegador movía o recreaba un elemento — por ejemplo al aparecer
   una barra arriba de una lista — y todo parecía "recargarse". */
.enter .del-card,.enter .sol-card,.enter .stat-card{animation:cardIn .4s cubic-bezier(.2,.8,.2,1) backwards}
.enter .del-card:nth-child(2),.enter .sol-card:nth-child(2),.enter .stat-card:nth-child(2){animation-delay:.04s}
.enter .del-card:nth-child(3),.enter .sol-card:nth-child(3),.enter .stat-card:nth-child(3){animation-delay:.08s}
.enter .del-card:nth-child(4),.enter .sol-card:nth-child(4),.enter .stat-card:nth-child(4){animation-delay:.12s}
.enter .del-card:nth-child(5),.enter .sol-card:nth-child(5),.enter .stat-card:nth-child(5){animation-delay:.16s}
.enter .del-card:nth-child(6),.enter .sol-card:nth-child(6){animation-delay:.2s}
.enter .del-card:nth-child(n+7),.enter .sol-card:nth-child(n+7){animation-delay:.24s}
.enter .hbar-fill{animation:growX .75s cubic-bezier(.2,.8,.2,1) backwards}
.enter .ev-line{animation:drawLine 1.1s ease-out backwards}
.enter .ev-area{animation:fadeIn .9s ease .25s backwards}
.enter .ev-dot{animation:dotIn .35s cubic-bezier(.2,1.2,.4,1) backwards}
.enter .dn-anim{animation:donutIn .7s cubic-bezier(.2,.9,.25,1) backwards}

function normNotif(s){ return (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function notifEsMia(n){
  const u = S.user;
  if(!u || !n) return false;
  const dest = normNotif(n.destinatario);
  if(dest==="logistica") return u.rol==="logistica";
  if(dest==="admin") return u.rol==="admin";
  if(dest==="recepcion fresco" || dest==="recepcionfresco") return u.rol==="recepcionista" && normNotif(u.area).includes("fresco");
  return dest === normNotif(u.area);
}
async function crearNotificacion(destinatario, mensaje, solicitudId){
  if(!USE_SHEETS) return;
  try{
    await sb.from("notificaciones").insert(toSnakeRow({destinatario, mensaje, solicitudId: solicitudId||null, leida:false}));
  }catch(e){ console.warn("No se pudo crear notificación (¿corriste el SQL de la tabla 'notificaciones'?):", e); }
  // Push real (llega aunque tengan la página cerrada) — no bloquea nada si falla
  try{
    fetch("/api/send-push", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({destinatario, mensaje, solicitudId})});
  }catch(e){}
}

//  ALERTAS PUSH — llegan aunque el navegador esté cerrado.
//  Cada dispositivo/navegador que activa esto queda anotado con el
//  "grupo" al que pertenece según quién esté logueado en ese momento.
// ══════════════════════════════════════════════════════════
function grupoNotifActual(){
  const u = S.user;
  if(!u) return "";
  if(u.rol==="logistica") return "LOGISTICA";
  if(u.rol==="admin") return "ADMIN";
  if(esRecepcionFresco()) return "RECEPCION FRESCO";
  return u.area || "";
}
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,"+").replace(/_/g,"/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}
async function pushEstaActivo(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  const reg = await navigator.serviceWorker.getRegistration();
  if(!reg) return false;
  const sub = await reg.pushManager.getSubscription();
  return !!sub;
}
async function activarAlertasPush(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)){
    toast("Este navegador no soporta notificaciones push","warn");
    return;
  }
  const grupo = grupoNotifActual();
  if(!grupo){ toast("No pudimos identificar tu perfil — probá recargar la página","warn"); return; }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso!=="granted"){ toast("No diste permiso — no vamos a poder mandarte alertas","warn"); render(); return; }
    const reg = await navigator.serviceWorker.register("/sw.js");
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    const subJson = sub.toJSON();
    await sb.from("push_subscriptions").upsert({
      endpoint: subJson.endpoint, keys: subJson.keys, grupo, user_agent: navigator.userAgent,
    }, {onConflict:"endpoint"});
    toast("🔔 Alertas activadas en este dispositivo");
  }catch(e){
    console.error(e);
    toast("No se pudo activar — probá de nuevo","warn");
  }
  render();
}
async function desactivarAlertasPush(){
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){
      await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
      await sub.unsubscribe();
    }
    toast("🔕 Alertas desactivadas en este dispositivo");
  }catch(e){}
  render();
}

    S.notificaciones = toCamelRows(data);

function buscarEmailOrigen(origen){
  const norm = s=>normNotif(s);
  const u = (S.usuarios||[]).find(x => norm(x.usuario)===norm(origen) || norm(x.area)===norm(origen));
  return u?.email || (S.sucursalesInfo?.[norm(origen)]?.email) || "";

// Para agregar o quitar una sucursal: editás la hoja en Sheets, sin tocar este código.
// Este array es el fallback que se usa solo en modo demo (sin Sheets).
const SUCURSALES_DEFAULT = [
  "Paso","Güemes","Edison","Feria","Paunero","Independencia",
  "Arenales","Alsina","Rioja","Castelli","San Martín","Patagones",
  "Constitución","Peña","Belgrano","Alberti","Libertad","San Juan","Administración",
];
// En el código siempre usamos getSucursales() en lugar del array directo
function getSucursales(){ return S.sucursales.length ? S.sucursales : SUCURSALES_DEFAULT; }
// Destinos extra que no son sucursales (se suman a la lista de destinos en el formulario)
// Para agregar o quitar: editá la hoja "Destinos" en Sheets (columna: nombre | activo)
// o editá este array directamente si no usás Sheets.
const DESTINOS_EXTRA_DEFAULT = [
  "Depósito Central",
  "Casa Central",
  "Compras",
  "RRHH",
];
function getDestinos(){
  // Si Sheets cargó destinos, los usa. Si no, combina sucursales + extras sin duplicados.
  if(S.destinos && S.destinos.length) return S.destinos;
  const todos = [...getSucursales(), ...DESTINOS_EXTRA_DEFAULT];
  // Eliminar duplicados manteniendo el orden
  return todos.filter((v,i,a)=>a.indexOf(v)===i);
}
// Código de entrega: 4 letras al azar
// Solo consonantes para que no se formen palabras accidentalmente
const LETRAS = "BCDFGHJKLMNPQRSTVWXYZ";
function generarPalabra(){
  let codigo = "";
  for(let i=0;i<4;i++){
    codigo += LETRAS[Math.floor(Math.random()*LETRAS.length)];
  }
  return codigo; // Ej: BKTR, GMVX, DJWN
}

// Mostrar solicitante completo: "PLANIFICACIÓN (Tomás Bandiera)" o solo "Ana Gómez"
function solicitanteLabel(r){
  const nombre = r.solicitante || "";
  const area   = r.area        || "";
  if(!area) return nombre; // sucursal normal → solo nombre
  // Si el área es diferente del nombre → "ÁREA (Nombre)"
  if(area.trim().toLowerCase() !== nombre.trim().toLowerCase()){
    return `${area.toUpperCase()} (${nombre})`;
  }
  return nombre;
}

// Solo fábrica (sin depósito) — para el recepcionista genérico, que no
// tiene que ver lo que entra/sale de depósito, solo de fábrica.
const _soloFabNames = ["fábrica","fabrica","fábrica central","fabrica central"];
function esOrigenSoloFabrica(r){
  const suc = (r.sucursal||r.area||"").trim().toLowerCase();
  return _soloFabNames.includes(suc);
}
function esDestinoSoloFabrica(r){
  const dest = (r.destino||"").trim().toLowerCase();

}
function esFabricaDestino(s){ return _fabNames.includes((s||"").trim().toLowerCase()); }

function esOrigenFabrica(r){
  const suc = (r.sucursal||r.area||"").trim().toLowerCase();

}

// Perfil especial de recepcionista: prepara lo que pide Planificación /
// Planificador Fresco (login compartido "RECEPCIONISTA" con área que
// contenga "fresco", ej: "RECEPCION FRESCO").
function esRecepcionFresco(){
  const u = S.user;
  return !!u && u.rol==="recepcionista" && normNotif(u.area).includes("fresco");
}
// Un pedido "de Planificación/Fresco" es el que viene de alguna de las
// áreas que Admin configuró para Recepción Fresco (por defecto:
// Planificación, Planificador Fresco y Logística — NO incluye RRHH ni
// Administración, esos los sigue preparando el recepcionista genérico).
function areasRecepcionFresco(){
  const guardado = S.config.areasRecepcionFresco;
  if(guardado){
    try{ const arr = JSON.parse(guardado); if(Array.isArray(arr)&&arr.length) return arr; }catch(e){}
  }
  return ["Planificación","Planificador Fresco"];
}
function esPedidoPlanificacionFresco(r){
  const a = normNotif(r.area);
  const esDeAreaCorrespondiente = areasRecepcionFresco().some(area=>normNotif(area)===a);
  // Además del área que lo pidió, tiene que salir físicamente de
  // fábrica — si Planificación arma una transferencia entre dos
  // sucursales (no desde fábrica), eso no lo prepara Recepción Fresco.
  return esDeAreaCorrespondiente && esOrigenFabrica(r);
}

// Detectar si el DESTINO es fábrica/depósito
function esDestinoFabrica(r){

}

  const suc  = (r.sucursal||"").trim();

  if(!suc && !area) return "—";
  // Si hay sucursal física, mostrar solo esa

  // Si no hay sucursal (pedido de área sin origen físico elegido)
  return area;
}

  const conocidos = [...getSucursales(), ...getDestinos()];
  return !conocidos.some(c=>(c||"").trim().toLowerCase()===d);
}

// ID formato: TRF-ddmmyyyyN
// Ej: TRF-100720261 (primer pedido del 10/07/2026)
//     TRF-100720262 (segundo pedido del mismo día)
// El contador diario se guarda en sessionStorage para no reiniciar si se recarga.
function fechaCorta(){
  const hoy = new Date();
  const dd   = String(hoy.getDate()).padStart(2,"0");
  const mm   = String(hoy.getMonth()+1).padStart(2,"0");
  const yyyy = hoy.getFullYear();
  return dd+mm+yyyy;
}

function fechaISO(){ return new Date().toISOString().slice(0,10); }

function genId(){
  const hoy = new Date();
  const dd   = String(hoy.getDate()).padStart(2,"0");
  const mm   = String(hoy.getMonth()+1).padStart(2,"0");
  const yyyy = hoy.getFullYear();
  const fecha = dd+mm+yyyy;

  // Leer el último contador del día desde sessionStorage
  const storageKey = "trf_counter_" + fecha;
  let n = 1;
  try{
    const stored = sessionStorage.getItem(storageKey);
    if(stored) n = parseInt(stored) + 1;
    // También chequeamos el máximo existente en S.requests para no duplicar
    const existingToday = S.requests.filter(r=>r.id&&r.id.includes(fecha));
    if(existingToday.length >= n) n = existingToday.length + 1;
    sessionStorage.setItem(storageKey, String(n));
  }catch(e){}
  return "TRF-" + fecha + n;
}
function now(){ return new Date().toISOString(); }
function fdt(iso){ return iso ? new Date(iso).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—"; }
function horaSolo(iso){ return iso ? new Date(iso).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}) : "—"; }
function fd(iso){
  if(!iso) return "—";
  // Fechas SIN hora (ej: "2026-09-05", como fechaRequerida) no deben pasar
  // por Date() — Date las toma como medianoche UTC y, al mostrarlas en
  // hora de Argentina (UTC-3), se corren un día para atrás. Las partimos
  // a mano en vez de dejar que el navegador las reinterprete.
  const soloFecha = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(soloFecha) return `${soloFecha[3]}/${soloFecha[2]}/${soloFecha[1]}`;
  return new Date(iso).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function dh(a,b){ return (a&&b)?Math.round((new Date(b)-new Date(a))/3600000):null; }

// ── Gráfico de dona (SVG puro, sin librerías) — recibe [{label,valor,color}] ──
function donutChart(datos, size=140){
  const total = datos.reduce((a,d)=>a+d.valor,0);
  if(!total) return `<div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;flex-shrink:0">Sin datos</div>`;
  const r = size/2 - 10, cx = size/2, cy = size/2, grosor = 18;
  const circ = 2*Math.PI*r;
  let acumulado = 0;
  const segmentos = datos.map(d=>{
    const frac = d.valor/total;
    const largo = frac*circ;
    const offset = -acumulado*circ;
    acumulado += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${grosor}"
      stroke-dasharray="${largo} ${circ-largo}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    ${segmentos}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--white,#e2e8f4)">${total}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="var(--faint,#3d5070)">total</text>
  </svg>`;
}

// ── Gráfico de barras verticales (SVG puro) — recibe [{label,valor}] ──
function barChart(datos, color){
  if(!datos.length) return `<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Sin datos.</p>`;
  const max = Math.max(...datos.map(d=>d.valor));
  const w = 60, gap = 14, alturaMax = 140, padLabel = 46;
  const anchoTotal = datos.length*(w+gap);
  const barras = datos.map((d,i)=>{
    const h = max? (d.valor/max)*alturaMax : 0;
    const x = i*(w+gap);
    const y = alturaMax - h;
    return `
      <text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--white,#e2e8f4)">${d.valor}</text>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${color}"/>
      <text x="${x+w/2}" y="${alturaMax+16}" text-anchor="middle" font-size="10" fill="var(--muted,#7a90b0)">${escH((d.label||"").slice(0,10))}</text>
    `;
  }).join("");
  return `<div style="overflow-x:auto"><svg width="${anchoTotal}" height="${alturaMax+padLabel}" viewBox="0 0 ${anchoTotal} ${alturaMax+padLabel}">${barras}</svg></div>`;
}

//  SUPABASE — capa de datos
//  Mantiene los mismos nombres de función que usaba Sheets
//  (sheetsLoadUsuarios, sheetsAdd, sheetsUpdate, etc.) para que el
//  resto del código — que ya sabe pensar en "sucursal", "dniEntrega",
//  etc. — no tenga que cambiar una sola línea. Solo cambia CÓMO se
//  guarda y se lee, no el resto de la lógica de la app.
// ══════════════════════════════════════════════════════════

// Convierte entre camelCase (como piensa toda la app) y snake_case
// (como se llaman las columnas en Postgres). Es genérico — no hace
// falta mantener una lista de campos a mano.
function camelToSnake(s){ return s.replace(/[A-Z]/g, m => "_"+m.toLowerCase()); }
function snakeToCamel(s){ return s.replace(/_([a-z0-9])/g, (_,c) => c.toUpperCase()); }
// Columnas de fecha/hora (timestamptz o date) — Postgres acepta NULL ahí,
// pero rechaza "" (string vacío) con un error. Varias partes del código
// arman objetos con valores tipo "" por comodidad (mismo patrón que se
// usaba con Sheets, donde "" no rompía nada) — acá se corrige siempre,
// en un solo lugar, para no tener que cazarlo campo por campo.
const COLUMNAS_FECHA = new Set([
  "created_at","updated_at","approved_at","scheduled_at","delivered_at",
  "fabrica_at","listo_at","levantado_at","salida_fabrica_at",
  "confirmada_sucursal_at","fecha_requerida","preparado_at","planificado_at",
]);
function toSnakeRow(obj){
  const out={};
  Object.keys(obj||{}).forEach(k=>{
    if(obj[k]===undefined) return;
    const col = camelToSnake(k);
    let val = obj[k];
    if(val==="" && COLUMNAS_FECHA.has(col)) val = null;
    out[col]=val;
  });
  return out;
}
function toCamelRow(row){
  if(!row) return row;
  const out={};
  Object.keys(row).forEach(k=>{ out[snakeToCamel(k)]=row[k]; });
  return out;
}
function toCamelRows(rows){ return (rows||[]).map(toCamelRow); }

    if(!cfg.error && cfg.data){

    }

    const info = {};

      info[(r.nombre||"").trim().toLowerCase()] = {

    });

}

// Trae TODAS las filas de una tabla, en tandas de 1000 — PostgREST
// corta en 1000 filas por defecto si no se pagina explícitamente, y
// con más de 1000 solicitudes los contadores/métricas quedaban
// atascados justo en ese número.
async function fetchTodasLasFilas(tabla, query){
  const TANDA = 1000;
  let desde = 0;
  let todas = [];
  while(true){
    let q = sb.from(tabla).select("*").range(desde, desde+TANDA-1);
    if(query) q = query(q);
    const { data, error } = await q;
    if(error) throw error;
    todas = todas.concat(data||[]);
    if(!data || data.length < TANDA) break; // última tanda
    desde += TANDA;
  }
  return todas;
}

// FASE 2: cargar el resto en background una vez que ya entraste
async function sheetsLoadDatos(){
  if(!USE_SHEETS) return;
  try{
    const [rsData,recs,dests]=await Promise.all([
      fetchTodasLasFilas("solicitudes", q=>q.order("created_at",{ascending:false})),
      sb.from("recorridos").select("*"),
      sb.from("destinos").select("*"),
    ]);
    if(recs.error) throw recs.error;
    if(dests.error) throw dests.error;
    S.requests   = toCamelRows(rsData).filter(r=>r.id);
    S.recorridos = toCamelRows(recs.data).filter(r=>r.nombre).map(r=>r.nombre);
    S.destinos   = toCamelRows(dests.data).filter(r=>r.nombre&&r.activo!=="no").map(r=>r.nombre);
  }catch(e){console.warn("Supabase load datos:",e);}
  cargarNotificaciones(); // no bloquea — si falla (tabla no creada aún), no rompe nada
  cargarEstadoFlotaHoy(); // idem — cross-proyecto con Flota, nunca debe romper TransferApp
  // Calidad aterriza directo en el dashboard de devoluciones — a
  // diferencia de otros roles, que las cargan recién al abrir esa
  // vista desde el ícono de arriba, acá hace falta tenerlas desde el
  // arranque.
  // Lo mismo para repartidor (su pestaña "Devoluciones" muestra un
  // contador desde el arranque), Logística y Depósito.
  const cargaDevolucionesAlEntrar = S.user?.rol==="calidad" || S.user?.rol==="repartidor" || S.user?.rol==="logistica"

}

// ══════════════════════════════════════════════════════════
//  FLOTA — visibilidad cruzada (mismo Supabase, tablas flota_*)
//  Si Flota todavía no está armada o falla, esto NUNCA debe romper
//  TransferApp — por eso todo va en un try/catch bien amplio.

// Fecha de "hoy" en horario LOCAL (no UTC) — toISOString() sola convierte
// a UTC, y como Argentina está 3hs atrás, cerca de la medianoche podía
// devolver la fecha de mañana. Esto se usa para cruzar datos con Flota.
function hoyLocalISO(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
async function cargarEstadoFlotaHoy(){
  S.flotaEstadoHoyLoading = true;
  try{
    const hoy = hoyLocalISO();
    const [viajesRes, regsRes, tviajeRes, testRes, matrizRes, direccionesRes] = await Promise.all([
      sb.from("flota_viajes").select("*").eq("fecha", hoy),
      sb.from("flota_registros_qr").select("*").gte("ts", hoy+"T00:00:00-03:00").order("ts",{ascending:true}),
      sb.from("flota_tiempos_viaje").select("*"),
      sb.from("flota_tiempos_estimados").select("*"),
      sb.from("flota_matriz_tiempos").select("*"),
      sb.from("flota_direcciones").select("*"),
    ]);
    if(viajesRes.error || regsRes.error) throw (viajesRes.error||regsRes.error);
    const registros = regsRes.data||[];
    S.flotaViajesHoy = viajesRes.data||[]; // crudo, para el buscador de ETA
    S.flotaRegistrosHoy = registros;       // crudo, idem
    S.flotaTiemposViaje = tviajeRes.error ? [] : (tviajeRes.data||[]); // orden de paradas de cada recorrido
    S.flotaTiemposEstimados = testRes.error ? [] : (testRes.data||[]); // tiempo de descarga por parada
    S.flotaMatrizTiempos = matrizRes.error ? [] : (matrizRes.data||[]); // tiempo de viaje entre cualquier par de puntos
    S.flotaDirecciones = direccionesRes.error ? [] : (direccionesRes.data||[]); // direcciones reales de cada punto
    S.flotaHoy = (viajesRes.data||[]).map(v=>{
      const paradas = registros.filter(r=>r.id_viaje===v.id && r.sucursal!=="FABRICA" && String(r.evento||"").toUpperCase()==="LLEGADA");
      const ultima = paradas[paradas.length-1] || null;
      return {
        id: v.id,
        recorrido: v.recorrido,
        repartidor: [v.nombre_rep1, v.nombre_rep2].filter(Boolean).join(" / "),
        estado: v.estado, // ACTIVO | FINALIZADO
        horaSalida: v.hora_salida,
        horaLlegada: v.hora_llegada,
        ultimaParada: ultima ? {sucursal: ultima.sucursal, ts: ultima.ts} : null,
        paradasHechas: paradas.map(p=>p.sucursal),
      };
    });
  }catch(e){
    S.flotaHoy = []; S.flotaViajesHoy = []; S.flotaRegistrosHoy = []; S.flotaTiemposViaje = []; S.flotaTiemposEstimados = []; S.flotaMatrizTiempos = []; S.flotaDirecciones = [];
    // Flota no disponible todavía — TransferApp sigue funcionando igual
  }
  S.flotaEstadoHoyLoading = false;
  render();
}

// Busca el tiempo de viaje entre dos puntos en la matriz general
// (fábrica + sucursales) — no depende de ningún recorrido puntual.
function minutosEntre(origen, destino){
  // Tesorería queda físicamente en Fábrica — para cualquier cálculo de
  // ruta son el mismo punto.
  const aliasFabrica = s => ["tesoreria","tesorería"].includes(normNotif(s)) ? "fabrica" : normNotif(s);
  const o = aliasFabrica(origen), d = aliasFabrica(destino);
  if(o===d) return 0;
  const fila = (S.flotaMatrizTiempos||[]).find(m=>aliasFabrica(m.origen)===o && aliasFabrica(m.destino)===d);
  return fila ? Number(fila.minutos)||0 : null; // null = no hay dato cargado para ese tramo
}

// Cuántos bultos van REALMENTE hoy a esa sucursal por ese recorrido —
// sumando las solicitudes que salen de Fábrica con esa fecha requerida
// y ese destino (no cuenta bolsines que vuelven hacia el buzón, esos
// son un viaje distinto).
function bultosRealesHoy(recorrido, sucursal){
  const hoy = hoyLocalISO();
  return (S.requests||[]).filter(r=>
    esOrigenFabrica(r) &&
    normNotif(r.recorrido)===normNotif(recorrido) &&
    normNotif(r.destino)===normNotif(sucursal) &&
    r.fechaRequerida===hoy &&
    !["Rechazada","Cancelada","No entregada"].includes(r.estado)
  ).reduce((a,r)=>a+(Number(r.cantidad)||0),0);
}

function tiempoDescarga(recorrido, sucursal){
  const est = (S.flotaTiemposEstimados||[]).find(t=>normNotif(t.recorrido)===normNotif(recorrido) && normNotif(t.sucursal)===normNotif(sucursal));
  if(!est) return 0;
  const bultosRef = Number(est.bultos_ref)||0;
  const tiempoRefSeg = Number(est.tiempo_est_seg)||0;
  if(bultosRef<=0) return tiempoRefSeg/60; // sin referencia de cuántos bultos representa ese tiempo — usar el fijo tal cual
  const segPorBulto = tiempoRefSeg/bultosRef;
  const bultosHoy = bultosRealesHoy(recorrido, sucursal);
  if(bultosHoy<=0) return tiempoRefSeg/60; // no se encontró carga real de hoy para esa parada — usar el de referencia como respaldo
  return (segPorBulto*bultosHoy)/60;
}

// Arma, parada por parada, la hora estimada de llegada — y a medida que
// hay llegadas REALES escaneadas, recalcula la estimación de las
// siguientes a partir de esa hora real (no de la salida original). La
// última "parada" siempre es la vuelta a Fábrica.
function calcularParadasConEta(v, hojaDeRuta){
  const secuencia = [...hojaDeRuta.map(p=>p.sucursal), "__FABRICA_VUELTA__"];
  let horaConocida = v.horaSalida ? new Date(v.horaSalida) : null; // última hora REAL conocida (salida, o última llegada real)
  let anteriorNombre = "FABRICA";
  const resultado = [];

  for(const nombreParada of secuencia){
    const esVuelta = nombreParada === "__FABRICA_VUELTA__";
    const nombreReal = esVuelta ? "FABRICA" : nombreParada;
    const tramo = minutosEntre(anteriorNombre, nombreReal);
    const eta = (horaConocida && tramo!=null) ? new Date(horaConocida.getTime()+tramo*60000) : null;

    const horaReal = esVuelta
      ? (v.horaLlegada ? new Date(v.horaLlegada) : null)
      : (()=>{ const r=(S.flotaRegistrosHoy||[]).find(r=>r.id_viaje===v.id && normNotif(r.sucursal)===normNotif(nombreParada) && String(r.evento||"").toUpperCase()==="LLEGADA"); return r?new Date(r.ts):null; })();

    resultado.push({sucursal: esVuelta?"Fábrica (vuelta)":nombreParada, eta, horaReal, esVuelta});

    // Base para la siguiente: si ya hay llegada real, partir de ahí +
    // descarga real; si no, seguir la cadena estimada.
    const baseHora = horaReal || eta;
    if(baseHora && !esVuelta){
      horaConocida = new Date(baseHora.getTime() + tiempoDescarga(v.recorrido, nombreParada)*60000);
    } else {
      horaConocida = baseHora;
    }
    anteriorNombre = nombreReal;
  }
  return resultado;
}
function formatoDiferencia(eta, horaReal){
  if(!eta || !horaReal) return "";
  const diffMin = Math.round((horaReal-eta)/60000);
  if(Math.abs(diffMin)<2) return " (a horario)";
  return diffMin>0 ? ` (${diffMin} min tarde)` : ` (${Math.abs(diffMin)} min antes)`;
}

// ══════════════════════════════════════════════════════════
//  MOTOR DE ETA — reutilizable desde cualquier pantalla. Dado el
//  nombre de una sucursal, busca si algún recorrido de hoy va hacia
//  ahí y devuelve su estado: ya llegó (hora real) o todavía no (hora
//  estimada, calculada con hora de salida real + tiempo de viaje
//  entre paradas [buscado en la matriz general] + tiempo de descarga
//  en cada una, acumulado hasta la sucursal buscada).
// ══════════════════════════════════════════════════════════
function buscarEstadoSucursal(sucursalQuery){
  const q = normNotif(sucursalQuery);
  if(!q) return null;

  // ¿Qué recorridos de hoy tienen esta sucursal en su hoja de ruta?
  const paradasDeEsaSucursal = (S.flotaTiemposViaje||[]).filter(p=>normNotif(p.sucursal)===q);
  if(!paradasDeEsaSucursal.length){
    return {ok:false, msg:"Todavía no hay una hoja de ruta cargada para esa sucursal (falta cargar el orden de paradas del recorrido)."};
  }

  const resultados = [];
  for(const parada of paradasDeEsaSucursal){
    const viaje = (S.flotaViajesHoy||[]).find(v=>normNotif(v.recorrido)===normNotif(parada.recorrido));
    if(!viaje) continue; // ese recorrido no salió hoy

    // ¿Ya escaneraron la llegada a esta sucursal en este viaje?
    const yaLlego = (S.flotaRegistrosHoy||[]).find(r=>r.id_viaje===viaje.id && normNotif(r.sucursal)===q && String(r.evento||"").toUpperCase()==="LLEGADA");
    if(yaLlego){
      resultados.push({recorrido:parada.recorrido, yaLlego:true, hora:yaLlego.ts, repartidor:[viaje.nombre_rep1,viaje.nombre_rep2].filter(Boolean).join(" / ")});
      continue;
    }
    if(!viaje.hora_salida){ continue; } // todavía no salió de fábrica

    // Calcular ETA: sumar, tramo por tramo (buscando cada uno en la
    // matriz general), el tiempo de viaje + descarga de cada parada
    // anterior, hasta llegar a la buscada (inclusive).
    const hojaDeRuta = (S.flotaTiemposViaje||[])
      .filter(p=>normNotif(p.recorrido)===normNotif(parada.recorrido))
      .sort((a,b)=>a.orden_parada-b.orden_parada);
    let minutosAcumulados = 0;
    let anterior = "Fábrica";
    let faltaDato = false;
    for(const p of hojaDeRuta){
      const tramo = minutosEntre(anterior, p.sucursal);
      if(tramo===null){ faltaDato = true; break; }
      minutosAcumulados += tramo;
      anterior = p.sucursal;
      if(normNotif(p.sucursal)===q) break; // llegamos a la parada buscada — no sumar su descarga, es la ETA de LLEGADA
      const est = (S.flotaTiemposEstimados||[]).find(t=>normNotif(t.recorrido)===normNotif(parada.recorrido) && normNotif(t.sucursal)===normNotif(p.sucursal));
      minutosAcumulados += est ? (Number(est.tiempo_est_seg)||0)/60 : 0;
    }
    if(faltaDato){
      resultados.push({recorrido:parada.recorrido, yaLlego:false, sinDato:true, repartidor:[viaje.nombre_rep1,viaje.nombre_rep2].filter(Boolean).join(" / ")});
      continue;
    }
    const horaEta = new Date(new Date(viaje.hora_salida).getTime() + minutosAcumulados*60000);
    resultados.push({recorrido:parada.recorrido, yaLlego:false, eta:horaEta, repartidor:[viaje.nombre_rep1,viaje.nombre_rep2].filter(Boolean).join(" / ")});
  }

  if(!resultados.length) return {ok:false, msg:"Ningún recorrido con destino a esa sucursal salió hoy todavía."};
  return {ok:true, resultados};
}

// Widget compacto para pantallas principales (sucursal, planificación, logística)
function renderWidgetFlotaHoy(){
  // Por ahora, mientras se termina de cargar y calibrar la matriz de
  // tiempos de viaje, este widget (con el buscador de ETA) solo se
  // muestra a Logística. Cuando esté probado, sacamos esta restricción
  // para que lo vean también sucursales/planificación.
  if(S.user?.rol!=="logistica") return "";
  const horaCorta = iso => iso ? new Date(iso).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}) : "—";
  const listaRecorridos = (!S.flotaHoy || !S.flotaHoy.length) ? "" : `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      ${S.flotaHoy.map(v=>{
        const activo = v.estado==="ACTIVO";
        const color = activo ? "var(--amber)" : "#1fa86a";
        // Hoja de ruta planificada (armada en Flota) para este recorrido —
        // si todavía no la cargaron, cae al resumen simple de antes.
        const hojaDeRuta = (S.flotaTiemposViaje||[])
          .filter(p=>normNotif(p.recorrido)===normNotif(v.recorrido))
          .sort((a,b)=>a.orden_parada-b.orden_parada);
        const paradasConEta = !hojaDeRuta.length ? [] : calcularParadasConEta(v, hojaDeRuta);
        // Índice de la última parada ya hecha (con llegada real), para
        // saber dónde poner el camioncito (va hacia la próxima).
        const idxUltimaHecha = paradasConEta.reduce((acc,p,i)=>p.horaReal?i:acc, -1);
        const listaParadas = !paradasConEta.length ? "" : `
          <div style="display:flex;flex-direction:column;margin-top:10px">
            ${paradasConEta.map((p,i)=>{
              const hecha = !!p.horaReal;
              const esProxima = activo && i===idxUltimaHecha+1;
              const esUltima = i===paradasConEta.length-1;
              const diffMin = (p.eta && p.horaReal) ? Math.round((p.horaReal-p.eta)/60000) : null;
              // Verde si llegó a horario o antes, naranja si llegó tarde,
              // ámbar para la próxima parada (donde va el camión ahora),
              // gris para las que todavía faltan.
              const colorTexto = hecha ? (diffMin!==null && diffMin>=2 ? "#fb923c" : "#4ade80") : (esProxima ? "var(--amber)" : "var(--faint)");
              const colorPunto = hecha ? (diffMin!==null && diffMin>=2 ? "#fb923c" : "#1fa86a") : "var(--border)";
              const horaTxt = hecha
                ? `Llegó ${horaCorta(p.horaReal)}${formatoDiferencia(p.eta,p.horaReal)}`
                : (p.eta ? `Llegada estimada ${horaCorta(p.eta)}` : `Llegada estimada —`);
              return `
              <div style="display:flex;align-items:flex-start;gap:10px">
                <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
                  <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
                    background:${hecha?colorPunto:"transparent"};border:2px solid ${colorPunto}">
                    ${hecha?'<span style="color:#fff;font-size:13px;font-weight:700">✓</span>':""}
                  </div>
                  ${!esUltima?`<div style="width:2px;flex:1;min-height:18px;background:${hecha?colorPunto:"var(--border)"}"></div>`:""}
                </div>
                <div style="padding-bottom:14px">
                  <div style="font-size:15px;font-weight:${esProxima||hecha?"700":"500"};color:${colorTexto}">
                    ${esProxima?"🚚 ":""}${escH(p.sucursal)}
                  </div>
                  <div style="font-size:13px;color:${hecha?"var(--text)":"var(--muted)"};margin-top:1px">${horaTxt}</div>
                </div>
              </div>`;
            }).join("")}
          </div>`;
        const estadoTxt = activo
          ? (v.ultimaParada ? `Última parada: ${escH(v.ultimaParada.sucursal)} (${horaCorta(v.ultimaParada.ts)})` : `Salió ${horaCorta(v.horaSalida)} — en camino`)
          : `Finalizado ${horaCorta(v.horaLlegada)}`;
        return `<div style="background:var(--s2);border-radius:10px;padding:14px 16px;border-left:4px solid ${color};min-width:250px">
          <div style="font-weight:800;font-size:16px">${escH(v.recorrido)} ${activo?"🟡":"✅"}</div>
          <div style="font-size:13px;color:var(--muted);font-weight:600;margin-top:2px">👤 ${escH(v.repartidor||"—")}</div>
          <div style="font-size:13px;margin-top:4px;color:var(--text)">${estadoTxt}</div>
          ${listaParadas}
        </div>`;
      }).join("")}
    </div>`;

  if(!listaRecorridos) return "";

  return `
  <div id="flota-widget" class="card" style="margin-bottom:16px;padding:14px 18px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:13px;font-weight:700;color:var(--muted)">🚚 RECORRIDOS DE HOY</span>
    </div>
    ${listaRecorridos || `<p style="font-size:13px;color:var(--muted);margin-bottom:12px">Todavía no salió ningún recorrido hoy.</p>`}
  </div>`;
}

// Sube un archivo al bucket "adjuntos" (carpeta según de dónde venga) y
// Comprime una imagen antes de subirla (redimensiona a máx. 1200px de
// ancho y la pasa a JPG calidad 70%) — así el 1GB gratis de Supabase
// Storage rinde muchísimo más (una foto de celular sin comprimir pesa
// 2-4MB; comprimida queda en 150-300KB). Si no es una imagen (ej. PDF)
// o algo falla, sube el archivo original tal cual.
function comprimirImagen(file, maxAncho=1200, calidad=0.7){
  return new Promise((resolve)=>{
    if(!file || !file.type || !file.type.startsWith("image/")){ resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxAncho){ h = Math.round(h*maxAncho/w); w = maxAncho; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob((blob)=>{
          if(!blob){ resolve(file); return; }
          const nombre = file.name.replace(/\.[^.]+$/,"") + ".jpg";
          resolve(new File([blob], nombre, {type:"image/jpeg"}));
        }, "image/jpeg", calidad);
      };
      img.onerror = ()=>resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = ()=>resolve(file);
    reader.readAsDataURL(file);
  });
}

// Sube un archivo al bucket "adjuntos" (carpeta según de dónde venga) y
// devuelve su URL pública (o null si falla). Genérica: la usan las
// quejas, devoluciones y los adjuntos de una solicitud nueva.
async function subirArchivo(file, carpeta){
  if(!file) return null;
  try{
    const comprimido = await comprimirImagen(file);
    const path = `${carpeta}/${Date.now()}_${comprimido.name.replace(/[^a-zA-Z0-9.]/g,"_")}`;
    const { error } = await sb.storage.from("adjuntos").upload(path, comprimido);
    if(error) throw error;
    const { data } = sb.storage.from("adjuntos").getPublicUrl(path);
    return data?.publicUrl || null;
  }catch(e){ console.warn("Subir archivo:",e); return null; }
}
async function subirFotoQueja(file){ return subirArchivo(file, "quejas"); }

async function submitQueja(){
  const areaDestino = ($("queja-area")?.value||S.quejaForm.area||"").trim();

  if(!motivo){ S.quejaForm.err="Elegí un motivo."; render(); return; }
  const detalle = ($("queja-texto")?.value||S.quejaForm.texto||"").trim();
  if((motivo==="Otra"||motivo==="Otro") && !detalle){ S.quejaForm.err="Contá el detalle — elegiste 'Otra/Otro'."; render(); return; }
  // Leer el archivo ANTES de redibujar — el spinner de "loading" redibuja
  // la pantalla y eso resetea el <input type="file">, perdiendo la foto.
  const fotoFile = $("queja-foto")?.files?.[0] || null;

    texto, fotoUrl, areaDestino,
    estado: "Pendiente",
    creadoPor: quienFirmaSesion(),
  });
  try{
    const { data, error } = await sb.from("quejas").insert(payload).select().single();
    if(error) throw error;
    S.quejas = [toCamelRow(data), ...S.quejas];
    S.quejaForm = {texto:"", area:"", motivo:"", loading:false, err:""};
    toast("💬 Queja enviada");

async function marcarQuejaResuelta(id){
  const respuesta = ($("queja-respuesta")?.value||S.quejaRespuestaTexto||"").trim();
  const nowTs = now();
  const changes = toSnakeRow({estado:"Resuelta", respuesta, respondidoPor: S.user.nombre||S.user.area||"", updatedAt:nowTs});
  try{
    const { error } = await sb.from("quejas").update(changes).eq("id",id);
    if(error) throw error;
    S.quejas = S.quejas.map(q=>q.id===id?{...q, estado:"Resuelta", respuesta, respondidoPor:S.user.nombre||S.user.area||"", updatedAt:nowTs}:q);
    S.quejaResponderId = "";
    toast("✅ Queja marcada como resuelta");
  }catch(e){ toast("⚠️ No se pudo actualizar","warn"); }
  render();
}

// ══════════════════════════════════════════════════════════
//  DEVOLUCIONES — sucursal devuelve algo a fábrica/depósito
// ══════════════════════════════════════════════════════════
function normSinTildes(s){
  return (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
// Depósito puede entrar como usuario de tipo DEPOSITO (rol planificación) o como
// una sucursal/área llamada "Depósito": en cualquiera de los dos casos es Depósito.
function esDeposito(u){
  u = u || S.user; if(!u) return false;
  if(u.rol==="planificacion" && u.tipoReal==="DEPOSITO") return true;
  return ["sucursal","area","planificacion"].includes(u.rol) && /^deposito\b/.test(normSinTildes(u.area));
}
// Gestiona devoluciones: Logística, Planificación, Producción o Calidad.
function esGestorDevolucion(){
  const u = S.user;
  if(!u || u.rol==="recepcionista") return false;
  if(u.rol==="admin") return true;
  if(u.rol==="logistica") return true;
  if(u.rol==="calidad") return true;
  if(esDeposito(u)) return true;
  const area = normSinTildes(u.area);
  return ["planificacion","produccion","calidad"].includes(area);
}
// Calidad y Depósito tienen una sola categoría fija de devoluciones
// que les corresponde ver — no es un filtro que puedan cambiar, es
// su alcance. Logística y Admin ven todas, separadas por categoría
// con un filtro normal.
// Métricas de devoluciones (el panel que arrancó en Calidad): lo ven
// Calidad (solo Fresco), Logística y Admin (todo), y Planificación y
// Compras (todo, con filtro de categoría).
function puedeVerMetricasDevoluciones(){
  const u=S.user; if(!u) return false;
  if(["calidad","logistica","admin"].includes(u.rol)) return true;
  if(u.rol==="planificacion"){
    const t=String(u.tipoReal||"").toUpperCase(), a=normSinTildes(u.area||"");
    return ["PLANIFICACION","COMPRAS"].includes(t) || ["planificacion","compras"].includes(a);
  }
  return false;
}
function categoriaDevolucionFija(){
  const u = S.user;
  if(u?.rol==="calidad") return "Fresco";
  if(esDeposito(u)) return "Secos";
  return null;
}
function puedeVerDevoluciones(){
  const u = S.user;
  if(!u) return false;
  return u.rol==="sucursal" || u.rol==="repartidor" || esGestorDevolucion();
}
// Apagado a propósito mientras se reconstruye el formulario con
// catálogo de productos (búsqueda por nombre/código) — las devoluciones
// que ya estaban cargadas siguen su curso normal (tomar, confirmar, etc).
const DEVOLUCIONES_NUEVAS_HABILITADAS = true;
// Las sucursales "Market" manejan los 3 tipos; las "Granja" solo
// Fresco y Congelado (no reciben/devuelven Secos).
const TIPOS_DEVOLUCION_MARKET = ["Fresco","Secos","Congelado"];
const TIPOS_DEVOLUCION_GRANJA = ["Fresco","Congelado"];
const MOTIVOS_POR_TIPO_DEVOLUCION = {
  Fresco:    ["Mal estado","Pérdida de vacío","Vencido","Roto"],
  Secos:     ["Roto con cambio","Vencido con cambio","Vencido sin cambio","Roto sin cambio","Sobrestock"],
  Congelado: ["Vencido","Roto","Pérdida de frío"],
};
function tiposDevolucionDisponibles(sucursal){
  return esSucursalMarket(sucursal) ? TIPOS_DEVOLUCION_MARKET : TIPOS_DEVOLUCION_GRANJA;
}

async function abrirDevoluciones(){
  S.vista = "devoluciones";
  render();
  if(!S.devolucionesLoaded) await cargarDevoluciones();
  render();
}

async function cargarDevoluciones(){
  if(!USE_SHEETS) return;
  try{
    const data = await fetchTodasLasFilas("devoluciones", q=>q.order("created_at",{ascending:false}));
    S.devoluciones = toCamelRows(data);
    S.devolucionesLoaded = true;
  }catch(e){ console.warn("Cargar devoluciones:",e); }
}

let _timerBusquedaProducto = null;
function buscarProductosDevolucion(query){
  S.devolucionForm.productoQuery = query;
  if(_timerBusquedaProducto) clearTimeout(_timerBusquedaProducto);
  const q = query.trim();
  if(q.length < 2){ S.devolucionForm.productoResultados = []; S.devolucionForm.productoBuscando=false; render(); return; }
  S.devolucionForm.productoBuscando = true;
  render();
  _timerBusquedaProducto = setTimeout(async ()=>{
    try{
      const { data, error } = await sb.from("productos")
        .select("id,descripcion,codigo_interno,codigo_barras")
        .or(`descripcion.ilike.%${q}%,codigo_interno.ilike.%${q}%,codigo_barras.ilike.%${q}%`)
        .limit(15);
      if(error) throw error;
      S.devolucionForm.productoResultados = toCamelRows(data||[]);
    }catch(e){
      console.warn("Buscar productos:", e);
      S.devolucionForm.productoResultados = [];
    }
    S.devolucionForm.productoBuscando = false;
    render();
  }, 300);
}
// Elegir del desplegable agrega DIRECTO a la lista (arriba de todo,
// el último cargado siempre primero), ya editable ahí mismo — sin
// paso de confirmación de por medio.
function elegirProductoDevolucion(p){
  if(S.devolucionForm.items.some(it=>it.producto.id===p.id)){
    toast("Ese producto ya está agregado","warn");
  } else {
    S.devolucionForm.items.unshift({producto:p, cantidad:"", unidad:"Kg", motivo:"", detalle:""});
  }
  S.devolucionForm.productoQuery = "";
  S.devolucionForm.productoResultados = [];
  render();
}
function quitarItemDevolucion(idx){
  S.devolucionForm.items.splice(idx,1);
  render();
}
// Enfoca el buscador para sumar otro producto (por si quedó fuera de
// vista en el celular, con varios productos ya cargados arriba)
function enfocarBuscadorProducto(){
  const el = $("devol-producto-query");
  if(el){ el.scrollIntoView({behavior:"smooth", block:"center"}); el.focus(); }
}

async function submitDevolucion(){
  const items = S.devolucionForm.items;
  if(!S.devolucionForm.tipo){ S.devolucionForm.err="Elegí el tipo de devolución (Fresco, Secos o Congelado)."; render(); return; }
  if(!items.length){ S.devolucionForm.err="Agregá al menos un producto."; render(); return; }
  for(let i=0;i<items.length;i++){
    const it = items[i];
    const cantEl = $(`devol-cantidad-${i}`);
    it.cantidad = cantEl ? cantEl.value : it.cantidad;
    const unidadEl = $(`devol-unidad-${i}`);
    it.unidad = unidadEl ? unidadEl.value : it.unidad;
    const motivoEl = $(`devol-motivo-${i}`);
    it.motivo = motivoEl ? motivoEl.value : it.motivo;
    const detalleEl = $(`devol-detalle-${i}`);
    it.detalle = detalleEl ? detalleEl.value.trim() : it.detalle;
    if(!it.cantidad || isNaN(+it.cantidad) || +it.cantidad<=0){ S.devolucionForm.err=`Ingresá la cantidad de "${it.producto.descripcion}".`; render(); return; }
    if(!it.motivo){ S.devolucionForm.err=`Elegí el motivo para "${it.producto.descripcion}".`; render(); return; }
    if(it.motivo==="Otro" && !it.detalle){ S.devolucionForm.err=`Contá el detalle de "${it.producto.descripcion}" — elegiste 'Otro'.`; render(); return; }
  }
  const fotoFile = $("devol-foto")?.files?.[0] || null;
  if(!fotoFile){ S.devolucionForm.err="La foto del ticket es obligatoria."; render(); return; }

  S.devolucionForm.loading = true; S.devolucionForm.err=""; renderNow();

  const fotoUrl = await subirArchivo(fotoFile, "devoluciones");
  const u = S.user;
  const productosJson = items.map(it=>({
    productoId: it.producto.id,
    descripcion: it.producto.descripcion,
    codigoInterno: it.producto.codigoInterno||"",
    codigoBarras: it.producto.codigoBarras||"",
    cantidad: +it.cantidad,
    unidad: it.unidad,
    motivo: it.detalle ? `${it.motivo} — ${it.detalle}` : it.motivo,
  }));
  // Motivo/resumen general de la devolución (para vistas viejas que
  // todavía muestran un solo texto de motivo)
  const motivoResumen = productosJson.length===1
    ? productosJson[0].motivo
    : `${productosJson.length} productos: `+productosJson.map(p=>p.descripcion).join(", ");
  const payload = toSnakeRow({
    sucursal: u.area||"",
    motivo: motivoResumen, fotoUrl,
    estado: "Pendiente",
    creadoPor: quienFirmaSesion(),
    productosJson: JSON.stringify(productosJson),
    tipoDevolucion: S.devolucionForm.tipo,
  });
  try{
    const { data, error } = await sb.from("devoluciones").insert(payload).select().single();
    if(error) throw error;
    S.devoluciones = [toCamelRow(data), ...S.devoluciones];
    S.devolucionForm = {tipo:"", items:[], loading:false, err:"", productoQuery:"", productoResultados:[], productoBuscando:false};
    toast("📦 Devolución enviada");
  }catch(e){
    S.devolucionForm.loading = false;
    S.devolucionForm.err = "No se pudo enviar — probá de nuevo.";
  }
  render();
}

function abrirAccionDevolucion(id, tipo){
  S.devolucionAccionId = id;
  S.devolucionAccionTipo = tipo; // "confirmar" | "noConfirmar"
  S.devolucionAccionTexto = "";
  if(tipo==="confirmar"){
    const d = S.devoluciones.find(x=>x.id===id);
    S.devolucionAccionCantidades = productosDeDevolucion(d||{}).map(p=>({...p, cantidadRecibida: p.cantidad}));
  } else {
    S.devolucionAccionCantidades = [];
  }
  render();
}
function cancelarAccionDevolucion(){
  S.devolucionAccionId = "";
  S.devolucionAccionTipo = "";
  S.devolucionAccionCantidades = [];
  render();
}

async function confirmarAccionDevolucion(){
  const id = S.devolucionAccionId;
  const esConfirmar = S.devolucionAccionTipo==="confirmar";
  const texto = ($("devol-accion-texto")?.value||S.devolucionAccionTexto||"").trim();
  if(!esConfirmar && !texto){ toast("Contá qué faltó para poder cerrarla","warn"); return; }

  const nowTs = now();
  const changes = {
    estado: esConfirmar?"Confirmada":"No confirmada",
    respuesta: texto || (esConfirmar?"Confirmada, todo en orden.":""),
    respondidoPor: S.user.nombre||S.user.area||"",
    updatedAt: nowTs,
  };

  let huboDiferencia = false;
  if(esConfirmar && S.devolucionAccionCantidades && S.devolucionAccionCantidades.length){
    const productosConfirmados = S.devolucionAccionCantidades.map((p,i)=>{
      const el = $(`devol-cant-recibida-${i}`);
      const cantidadRecibida = el ? +el.value : p.cantidadRecibida;
      if(+cantidadRecibida !== +p.cantidad) huboDiferencia = true;
      return {...p, cantidadRecibida:+cantidadRecibida};
    });
    changes.productosJson = JSON.stringify(productosConfirmados);
    if(huboDiferencia){
      const nota = "⚠️ Diferencia en cantidad recibida vs. declarada: "+productosConfirmados
        .filter(p=>+p.cantidadRecibida!==+p.cantidad)
        .map(p=>`${p.descripcion} (declarado ${p.cantidad}${p.unidad||""}, recibido ${p.cantidadRecibida}${p.unidad||""})`)
        .join("; ");
      changes.respuesta = changes.respuesta ? changes.respuesta+" · "+nota : nota;
    }
  }

  try{
    const { error } = await sb.from("devoluciones").update(toSnakeRow(changes)).eq("id",id);
    if(error) throw error;
    S.devoluciones = S.devoluciones.map(d=>d.id===id?{...d,...changes}:d);
    S.devolucionAccionId = ""; S.devolucionAccionTipo = ""; S.devolucionAccionCantidades = [];
    toast(esConfirmar?(huboDiferencia?"✅ Confirmada — quedó marcada la diferencia de cantidad":"✅ Devolución confirmada, todo coincide"):"⚠️ Devolución cerrada como no confirmada");
  }catch(e){ toast("⚠️ No se pudo actualizar","warn"); }
  render();
}

// ── Repartidor: seleccionar varias devoluciones y dejarlas en fábrica ──
// ── Editar devolución (solo Admin, para corregir errores de carga) ──
function openEditarDevolucion(id){
  const d = S.devoluciones.find(x=>String(x.id)===String(id));
  if(!d) return;
  const vacio=v=>(v===undefined||v===null)?"":v;
  // Solo se editan las cantidades si la devolución guarda sus productos (las muy viejas, de un solo producto, no tienen cantidad)
  const lineas = d.productosJson ? productosDeDevolucion(d).map(x=>({
    descripcion:x.descripcion||"", codigoInterno:x.codigoInterno||"", motivo:String(x.motivo||"").split(" — ")[0],
    cantidad:vacio(x.cantidad), unidad:x.unidad||"Unidades",
    aceptada:vacio(x.cantidadAceptada), recibida:vacio(x.cantidadRecibida),

async function submitEditarDevolucion(){
  const d = S.editarDevolucionModal;
  if(d.loading) return;
  const sucursal = $("ed-dev-sucursal")?.value || d.sucursal;
  const motivo   = ($("ed-dev-motivo")?.value ?? d.motivo ?? "").trim();
  const estado   = $("ed-dev-estado")?.value || d.estado;
  if(!motivo){ S.editarDevolucionModal.err="El motivo no puede quedar vacío."; render(); return; }

  // ── Productos: validar y armar lo que se guarda ──
  const dev = S.devoluciones.find(x=>String(x.id)===String(d.id));
  const num = v => (v===""||v===null||v===undefined) ? NaN : +v;
  const tol = 0.0005, err = m => { S.editarDevolucionModal.err=m; render(); };
  let productosJson = null;
  if((d.lineas||[]).length && dev){
    const base = productosDeDevolucion(dev);
    const nuevos = [];
    for(let i=0;i<d.lineas.length;i++){
      const l=d.lineas[i], x=base[i], nom=l.descripcion||`producto ${i+1}`;
      const cant=num(l.cantidad);
      if(!(cant>0)) return err(`"${nom}": la cantidad tiene que ser mayor a 0.`);
      const y={...x, cantidad:cant, unidad:l.unidad};
      let tocada = cant!==+x.cantidad || l.unidad!==(x.unidad||"Unidades");
      if(cant!==+x.cantidad) y.cantidadOriginal = (x.cantidadOriginal!==undefined ? x.cantidadOriginal : x.cantidad);
      if(l.aceptada!==""){
        let ac=num(l.aceptada);
        // lo que se aceptó entero acompaña a la cantidad corregida
        if(+l.orig.aceptada===+l.orig.cantidad && ac===+l.orig.aceptada && cant!==+l.orig.cantidad) ac=cant;
        if(!(ac>=0) || ac>cant+tol) return err(`"${nom}": lo aceptado (${l.aceptada}) no puede ser más que la cantidad (${cant}).`);
        if(ac!==+x.cantidadAceptada) tocada=true;
        y.cantidadAceptada=ac;
      }
      if(l.recibida!==""){
        const rc=num(l.recibida);
        if(!(rc>=0)) return err(`"${nom}": revisá la cantidad recibida.`);
        if(rc!==+x.cantidadRecibida) tocada=true;
        y.cantidadRecibida=rc;
      }
      if(l.cl){
        const sum=(+l.cl.cambio||0)+(+l.cl.comedor||0)+(+l.cl.stock||0);
        const ref = y.cantidadRecibida!==undefined ? y.cantidadRecibida : (y.cantidadAceptada!==undefined ? y.cantidadAceptada : cant);
        if(Math.abs(sum-ref)>tol) return err(`"${nom}": la clasificación suma ${fmtNum(sum)} pero lo recibido es ${fmtNum(ref)}. Corregí los destinos para que coincidan.`);
        const o=x.clasificacion||{};
        if((+l.cl.cambio||0)!==(+o.cambio||0)||(+l.cl.comedor||0)!==(+o.comedor||0)||(+l.cl.stock||0)!==(+o.stock||0)) tocada=true;
        y.clasificacion={cambio:+l.cl.cambio||0,comedor:+l.cl.comedor||0,stock:+l.cl.stock||0};
      }
      if(tocada){ y.editadoPor=S.user.nombre||"Admin"; y.editadoAt=now(); }
      nuevos.push(y);
    }
    productosJson = JSON.stringify(nuevos);
  }

  d.loading = true; renderNow();
  const changes = {sucursal, motivo, estado, ...(productosJson?{productosJson}:{}), updatedAt:now()};
  try{
    const { error } = await sb.from("devoluciones").update(toSnakeRow(changes)).eq("id", d.id);
    if(error) throw error;
    S.devoluciones = S.devoluciones.map(x=>String(x.id)===String(d.id)?{...x,...changes}:x);
    S.modal = null;
    toast("Devolución actualizada");
  }catch(e){
    S.editarDevolucionModal.loading = false;
    S.editarDevolucionModal.err = "No se pudo guardar — probá de nuevo.";
  }
  render();
}
